<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>日课 DAILY LESSON · 英语学习看板</title>
  <meta name="description" content="日课 DAILY LESSON 是教室一体机使用的英语学习看板：每日常规记录听写、背诵、作业与课堂纪律，监控背记过关、规范行为习惯；高考备考指导按题型梳理考查要点与应对策略；信息公告发布学习任务、活动、成绩、答案与计划，并展示优秀作业与学习标兵；资源共享汇集学习笔记、重难点梳理与范文素材。" />
  <meta name="theme-color" content="#0D141D" />
  <meta name="color-scheme" content="dark" />
  <!-- 一体机上「打开的是不是最新文件」靠 app-build 核对：页脚、控制台、console 都显示同一个值 -->
  <meta name="app-build" content="2026-11-04.2" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <style>
/* =========================================================
   英语作业常规看板 · 样式表
   设计目标：教室一体机（大屏 / 触屏）优先，高对比、大点击区、少滚动
   ========================================================= */

/* ---------- 1. 设计变量 ---------- */
/* v5 配色：深海石板（冷灰蓝）+ 冷靛主色 + 冷青辅色。
   要点：
   1) 全面深色基调，去掉暖宣纸与黄铜，改用冷灰蓝面 + 冷色点缀；
   2) 中性灰分 5 级（surface → surface-3 → line），层级靠明度差拉开，不用阴影堆叠；
   3) 文字对比度按 WCAG AA 以上配置：
      --ink  在 --surface 上 ≈ 12.9:1，--ink-2 ≈ 7.6:1，--ink-3 ≈ 4.7:1；
   4) 语义色全部收进冷色域：完成=冷绿、未完成=深石板、危险=冷玫红、提示=冷靛。 */
:root {
  /* 底层与面 */
  --bg: #0D141D;
  --bg-2: #111A25;
  --surface: #16212E;
  --surface-2: #1B2837;
  --surface-3: #22303F;
  --ink: #E9F1F8;
  --ink-2: #AEBFD1;
  --ink-3: #7E90A5;
  --line: #232F3D;
  --line-strong: #344456;

  /* 主色：冷靛 */
  --brand: #4C7CF0;
  --brand-2: #6E9BFA;
  --brand-soft: #16243B;
  --brand-ink: #C3D8FF;

  /* 辅助色：冷银（替代原黄铜位，用于分隔线、印章、强调描边） */
  --brass: #7FA6C8;
  --brass-2: #A6C6DF;
  --brass-soft: #172635;
  --night: #070C13;

  /* 语义色（冷色域） */
  --teal: #35A8A2;
  --teal-2: #5FCBC4;
  --teal-soft: #102A2C;
  --violet: #8B7BF0;
  --violet-2: #A99CF7;
  --violet-soft: #1D1A33;
  --danger: #DC5C74;
  --danger-2: #F08CA0;
  --danger-soft: #2A1620;
  --ok: #2FA36B;
  --ok-2: #57C08C;
  --ok-soft: #10261C;

  /* 状态色由 JS 注入（管理端可改）；此处为默认值 */
  --done: #26784F;
  --undone: #2A3A4C;
  --done-ink: #F1FAF5;
  --undone-ink: #C6D4E3;
  --seat-font: 1;

  --radius-xl: 20px;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;

  --shadow-sm: 0 1px 2px rgba(3, 7, 13, .28);
  --shadow-md: 0 1px 2px rgba(3, 7, 13, .30), 0 14px 30px -18px rgba(3, 7, 13, .72);
  --shadow-lg: 0 30px 64px -32px rgba(3, 7, 13, .82);

  --topbar-h: 72px;
  --gap-group: clamp(10px, 1.4vw, 26px);
  --gap-row: clamp(8px, 1vw, 14px);

  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system,
          "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, "Times New Roman", serif;
}

/* ---------- 2. 基础 ---------- */
*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(1200px 620px at 8% -14%, rgba(76, 124, 240, .10) 0%, rgba(76, 124, 240, 0) 62%),
    radial-gradient(980px 520px at 98% -6%, rgba(53, 168, 162, .08) 0%, rgba(53, 168, 162, 0) 60%),
    linear-gradient(180deg, #0D141D 0%, #0B1119 100%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: rgba(76, 124, 240, .35); color: #FFFFFF; }

h1, h2, h3, h4, p, ol, ul { margin: 0; }
button { font-family: inherit; }
input, textarea, select { font-family: inherit; font-size: 14px; color: inherit; }

:focus-visible {
  outline: 3px solid rgba(76, 124, 240, 0.55);
  outline-offset: 2px;
  border-radius: 8px;
}

.app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.view { flex: 1; min-height: 0; overflow: auto; padding: 22px clamp(16px, 3vw, 40px) 36px; }

/* ---------- 3. 顶栏 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: var(--topbar-h);
  padding: 10px clamp(16px, 3vw, 40px);
  background: rgba(27, 42, 51, 0.88);
  backdrop-filter: blur(16px) saturate(1.2);
  -webkit-backdrop-filter: blur(16px) saturate(1.2);
  border-bottom: 1px solid var(--line);
}

.topbar__left { flex: 0 0 auto; }
.topbar__mid { flex: 1 1 auto; display: flex; justify-content: center; }
.topbar__right { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; }

.brand { display: flex; align-items: center; gap: 12px; }

.brand__mark {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 11px;
  background: linear-gradient(150deg, #C3D8FF 0%, #C3D8FF 100%);
  color: #20323C;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: .06em;
  box-shadow: 0 10px 20px -14px rgba(195, 216, 255, 0.9), inset 0 0 0 1px rgba(94, 140, 149, 0.45);
}

.brand__text { display: flex; flex-direction: column; line-height: 1.25; }
.brand__text strong { font-family: var(--serif); font-size: 18px; font-weight: 700; letter-spacing: .02em; }
.brand__text span { font-size: 9.5px; color: var(--ink-3); letter-spacing: .2em; margin-top: 2px; }

.datebar {
  display: flex; align-items: center; gap: 6px;
  padding: 5px;
  background: #16212E;
  border: 1px solid var(--line);
  border-radius: 999px;
  box-shadow: var(--shadow-sm);
}
.datebar input[type="date"] {
  border: none; background: transparent;
  font-size: 15px; font-weight: 700;
  color: var(--ink);
  padding: 4px 2px;
  min-width: 132px;
  text-align: center;
}
.datebar input[type="date"]::-webkit-calendar-picker-indicator { opacity: .45; cursor: pointer; }

.icon-btn {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border: none; border-radius: 999px;
  background: transparent;
  color: var(--ink-2);
  font-size: 19px; line-height: 1;
  cursor: pointer;
  transition: background .16s, color .16s;
}
.icon-btn:hover { background: #182741; color: var(--ink); }

.chip {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: 12.5px; font-weight: 650;
  padding: 7px 13px;
  border-radius: 999px;
  cursor: pointer;
  transition: .16s;
}
.chip:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }

.save-status { font-size: 12px; color: var(--ink-3); white-space: nowrap; }

.auth-area { display: flex; align-items: center; gap: 8px; }

.role-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 13px;
  border-radius: 999px;
  font-size: 12.5px; font-weight: 700;
  border: 1px solid transparent;
}
.role-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.role-chip--main { background: #182741; color: var(--brand-ink); border-color: #1C2D4A; }
.role-chip--deputy { background: #12291F; color: #A9E6C9; border-color: #17352A; }
.role-chip--guest { background: #182741; color: #6E9BFA; border-color: #1C2D4A; }
.role-chip--leader { background: #2A2114; color: #F0C084; border-color: #4A3A22; }

/* ---------- 4. 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 17px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: #16212E;
  color: var(--ink);
  font-size: 14px; font-weight: 650;
  cursor: pointer;
  white-space: nowrap;
  touch-action: manipulation;   /* 触屏一体机：去掉双击缩放带来的点击延迟 */
  transition: transform .12s, background .16s, border-color .16s, color .16s, box-shadow .16s;
}
.btn:active { transform: translateY(1px) scale(.995); }
.btn--sm { padding: 8px 13px; font-size: 13px; border-radius: 10px; }
.btn--lg { padding: 13px 22px; font-size: 15px; border-radius: 14px; }

.btn--primary {
  background: linear-gradient(180deg, #C3D8FF 0%, #C3D8FF 100%);
  color: #1B2A33;
  box-shadow: 0 12px 24px -16px rgba(195, 216, 255, 0.95), inset 0 0 0 1px rgba(94, 140, 149, 0.3);
}
.btn--primary:hover { filter: brightness(1.1); }

.btn--outline { border-color: var(--line-strong); color: var(--ink); background: transparent; }
.btn--outline:hover { border-color: var(--ink); color: var(--ink); background: var(--surface-2); }

.btn--ghost { background: transparent; color: var(--ink-2); }
.btn--ghost:hover { background: var(--surface-2); color: var(--ink); }

.btn--danger { background: #E07385; color: #16212E; }
.btn--danger:hover { background: #E07385; }

.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- 5. 卡片 / 通用 ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 20px 22px;
}

.card__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.card__title { font-size: 15px; font-weight: 750; letter-spacing: -.01em; }
.card__hint { font-size: 12.5px; color: var(--ink-3); }

.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12.5px; font-weight: 700;
  letter-spacing: .08em;
  color: var(--brand-ink);
  text-transform: uppercase;
}

/* ---------- 6. 首页 Hero ---------- */
.home { display: flex; flex-direction: column; gap: 20px; max-width: 1440px; margin: 0 auto; }

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  gap: 20px;
  align-items: stretch;
}

.hero__main {
  position: relative;
  padding: clamp(22px, 2.6vw, 34px);
  border-radius: var(--radius-xl);
  border: 1px solid #1C2D4A;
  background:
    radial-gradient(600px 260px at 100% 0%, #182741 0%, rgba(24, 39, 65, 0) 70%),
    linear-gradient(180deg, #16212E, #182741);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}
.hero__main::after {
  content: "";
  position: absolute; right: -70px; bottom: -90px;
  width: 260px; height: 260px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(76, 124, 240, 0.16), rgba(76, 124, 240, 0) 70%);
  pointer-events: none;
}

.hero h1 {
  font-size: clamp(26px, 3.1vw, 42px);
  font-weight: 800;
  letter-spacing: -.03em;
  line-height: 1.12;
  margin: 12px 0 10px;
}
.hero h1 em { font-style: normal; color: var(--brand); }

.hero__desc {
  font-size: clamp(13.5px, 1.05vw, 15px);
  line-height: 1.75;
  color: var(--ink-2);
  max-width: 56ch;
}

.stat-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }

.stat {
  display: flex; flex-direction: column; gap: 2px;
  padding: 9px 16px;
  background: #16212E;
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-sm);
  min-width: 104px;
}
.stat__label { font-size: 11.5px; color: var(--ink-3); font-weight: 650; letter-spacing: .04em; }
.stat__value { font-size: 20px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat__value small { font-size: 12px; font-weight: 650; color: var(--ink-3); margin-left: 2px; }

/* ---------- 7. 首页规则卡 ---------- */
.rules-card { display: flex; flex-direction: column; gap: 12px; }
.rules-list { list-style: none; counter-reset: r; display: flex; flex-direction: column; gap: 9px; padding: 0; }
.rules-list li {
  counter-increment: r;
  position: relative;
  padding-left: 30px;
  font-size: 13px;
  line-height: 1.62;
  color: var(--ink-2);
}
.rules-list li::before {
  content: counter(r);
  position: absolute; left: 0; top: 1px;
  width: 20px; height: 20px;
  display: grid; place-items: center;
  border-radius: 7px;
  background: var(--brand-soft);
  color: var(--brand-ink);
  font-size: 11.5px; font-weight: 800;
}

/* ---------- 8. 模块卡 ---------- */
.module-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}
.module-grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.module-card {
  --accent: var(--brand);
  --accent-2: var(--brand-2);
  --accent-soft: var(--brand-soft);
  position: relative;
  display: grid;
  grid-template-columns: 66px minmax(0, 1fr);
  grid-template-rows: auto auto;
  gap: 4px 18px;
  padding: 24px;
  border-radius: var(--radius-xl);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-md);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s;
  overflow: hidden;
  cursor: pointer;
}
.module-card::before {
  content: "";
  position: absolute; inset: 0 auto 0 0;
  width: 4px;
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
}
.module-card:hover { transform: translateY(-3px); box-shadow: 0 4px 8px rgba(195, 216, 255, 0.05), 0 26px 50px -26px rgba(195, 216, 255, 0.35); border-color: #1C2D4A; }
.module-card--dictation { --accent: #4C7CF0; --accent-2: #4C7CF0; --accent-soft: #182741; }
.module-card--homework { --accent: #C3D8FF; --accent-2: #6E9BFA; --accent-soft: #12291F; }
.module-card--dcopy { --accent: #8FD3D3; --accent-2: #3FB3B0; --accent-soft: #1B2A33; }
.module-card--recite { --accent: #4C7CF0; --accent-2: #4C7CF0; --accent-soft: #182741; }
.module-card--rcopy { --accent: #A093F2; --accent-2: #7F73E0; --accent-soft: #221E3B; }
@media (max-width: 1100px) { .module-grid--3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.module-card__icon {
  grid-row: 1 / span 2;
  width: 66px; height: 66px;
  display: grid; place-items: center;
  border-radius: 19px;
  background: linear-gradient(155deg, var(--accent-2), var(--accent));
  color: #16212E;
  font-size: 27px;
  font-weight: 700;
  box-shadow: 0 14px 26px -16px var(--accent);
}

.module-card h2 { font-size: 20px; font-weight: 780; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }

.module-card__task {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 650;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 3px 10px;
  border-radius: 999px;
  max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.module-card__foot {
  grid-column: 2;
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  margin-top: 16px;
}
.module-card__nums { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); font-weight: 650; }
.module-card__nums b { font-size: 15px; font-variant-numeric: tabular-nums; }
.module-card__nums .is-done b { color: var(--done); }
.module-card__nums .is-undone b { color: #8FD3D3; }

.progress { height: 9px; border-radius: 999px; background: #182741; overflow: hidden; margin-top: 12px; }
.progress__bar {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  transition: width .35s cubic-bezier(.22, .8, .3, 1);
}

.module-card__go {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13.5px; font-weight: 750;
  color: #16212E;
  background: var(--accent);
  border: none;
  padding: 10px 16px;
  border-radius: 12px;
  cursor: pointer;
  transition: .16s;
  box-shadow: 0 12px 22px -14px var(--accent);
}
.module-card__go:hover { filter: brightness(1.07); }

/* ---------- 9. 首页说明 / 示例 ---------- */
.guide-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }

.demo-seat-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 4px; }
.demo-seat {
  min-width: 92px;
  padding: 10px 12px;
  border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 14px; font-weight: 750;
  background: var(--undone); color: var(--undone-ink);
}
.demo-seat.is-done { background: var(--done); color: var(--done-ink); }
.demo-seat span { font-size: 10px; font-weight: 650; opacity: .72; }

.kv { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--ink-2); }
.kv__row { display: flex; gap: 10px; align-items: flex-start; }
.kv__row b { flex: 0 0 74px; color: var(--ink); font-weight: 700; }

.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th, .table td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
.table th { font-size: 11.5px; color: var(--ink-3); font-weight: 700; letter-spacing: .04em; }
.table td { color: var(--ink-2); }
.table tr:last-child td { border-bottom: none; }
.table td strong { color: var(--ink); }

/* ---------- 10. 模块录入页 ---------- */
.module-view {
  display: flex; flex-direction: column; gap: 16px;
  height: 100%;
  min-height: 620px;
  max-width: 1680px;
  margin: 0 auto;
}

.module-head {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 14px 18px;
  background: #16212E;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}

.module-head__title { display: flex; align-items: center; gap: 12px; min-width: 0; }
.module-head__title h1 { font-size: clamp(19px, 1.7vw, 24px); font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }

.tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 650;
  color: var(--ink-2);
  background: var(--surface-2);
  border: 1px solid var(--line);
  padding: 5px 11px;
  border-radius: 999px;
  max-width: 340px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tag--accent { color: var(--brand-ink); background: var(--brand-soft); border-color: #1C2D4A; }

.mini-pencil {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  border-radius: 6px; border: none;
  background: transparent; color: var(--ink-3);
  cursor: pointer; font-size: 12px;
}
.mini-pencil:hover { background: #182741; color: var(--brand); }

/* 听写任务选择器 */
.task-select {
  max-width: 300px;
  padding: 6px 30px 6px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface-2) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2364748B' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 12px center;
  -webkit-appearance: none; appearance: none;
  font: inherit; font-size: 12.5px; font-weight: 650; color: var(--ink-1);
  cursor: pointer;
  overflow: hidden; text-overflow: ellipsis;
}
.task-select:hover { border-color: #27406B; }
.task-select:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }

.module-head__stats { display: flex; align-items: center; gap: 18px; margin-left: auto; }
.mstat { display: flex; flex-direction: column; line-height: 1.2; }
.mstat b { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
.mstat span { font-size: 11.5px; color: var(--ink-3); font-weight: 650; }
.mstat--done b { color: var(--done); }
.mstat--undone b { color: #8FD3D3; }

.module-head__actions { display: flex; align-items: center; gap: 8px; }

.badge-count {
  display: inline-grid; place-items: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 999px;
  background: var(--brand-soft); color: var(--brand-ink);
  font-size: 11px; font-weight: 800;
}

.banner {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  border-radius: 14px;
  font-size: 13px;
  background: #1B2A33;
  border: 1px solid #20323C;
  color: #8FD3D3;
}
.banner--edit { background: #182741; border-color: #1C2D4A; color: var(--brand-ink); }

.module-body {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 306px;
  gap: 16px;
}

.stage {
  display: flex; flex-direction: column; gap: 12px;
  min-height: 0;
  padding: 16px;
  background: #16212E;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: auto;
}

.podium {
  display: grid; place-items: center;
  height: 38px;
  border-radius: 12px;
  background: linear-gradient(90deg, #182741, #182741 50%, #182741);
  border: 1px dashed var(--line-strong);
  color: var(--ink-3);
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: .5em;
  text-indent: .5em;
}

.seat-stage {
  flex: 1;
  min-height: 0;
  display: flex;
  gap: var(--gap-group);
  align-items: stretch;
}

.seat-group { flex: 1 1 0; min-width: 96px; display: flex; flex-direction: column; gap: 8px; }
.seat-group__label {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-3);
  letter-spacing: .06em;
}

.seat-column {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-auto-rows: minmax(46px, 1fr);
  gap: var(--gap-row);
}

/* 学生座位按钮 —— 核心交互元素 */
.seat {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px;
  padding: 6px 6px;
  border: none;
  border-radius: 14px;
  background: var(--undone);
  color: var(--undone-ink);
  font-family: inherit;
  font-weight: 750;
  font-size: calc(clamp(14px, 1.05vw, 19px) * var(--seat-font));
  line-height: 1.1;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.55), 0 1px 2px rgba(195, 216, 255, 0.08);
  transition: background-color .18s ease, color .18s ease, transform .1s ease, box-shadow .18s ease;
}
.seat__name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat__status {
  font-size: calc(9.5px * var(--seat-font));
  font-weight: 650;
  letter-spacing: .06em;
  opacity: .68;
}
.seat:hover { box-shadow: inset 0 0 0 1.5px rgba(22, 33, 46, 0.75), 0 6px 16px -10px rgba(195, 216, 255, 0.55); }
.seat:active { transform: scale(.965); }
.seat.is-done {
  background: var(--done);
  color: var(--done-ink);
  box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.28), 0 8px 18px -12px rgba(195, 216, 255, 0.6);
}
.seat.is-done .seat__status { opacity: .82; }
.seat.is-done::after {
  content: "";
  position: absolute; top: 5px; right: 5px;
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor;
  opacity: .55;
}
.seat--empty {
  /* 没有人的格子只保留占位（保证每个人的座位与教室位置对得上），
     不画框、不写字：座次表上只看得到有姓名的区块。 */
  background: transparent !important;
  border: 0;
  box-shadow: none !important;
  color: transparent;
  font-size: 0;
  pointer-events: none;
}
.seat--empty::after { display: none; }

/* 嵌在座位表里的讲台位（如第 1 排中间） */
.seat--podium {
  background: linear-gradient(160deg, #C3D8FF, #C3D8FF) !important;
  color: #182741;
  font-size: calc(clamp(12px, .9vw, 16px) * var(--seat-font));
  letter-spacing: .35em;
  text-indent: .35em;
  cursor: default;
  box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.12), 0 10px 22px -14px rgba(195, 216, 255, 0.9);
}
.seat--podium::after { display: none; }

/* 抄写模块：听写已完成 → 无需罚抄（不可点击） */
.seat--na {
  background: repeating-linear-gradient(45deg, #182741, #182741 8px, #1C2D4A 8px, #1C2D4A 16px) !important;
  color: #4C7CF0 !important;
  box-shadow: none !important;
  cursor: default;
  opacity: .82;
}
.seat--na .seat__status { color: #4C7CF0 !important; }
.seat--na::after { display: none; }


/* 大组之间的过道 */
.seat-group.aisle-after { margin-left: clamp(18px, 2.4vw, 46px); }

body.is-edit-names .seat { outline: 2px dashed rgba(76, 124, 240, 0.45); outline-offset: -4px; }

/* 右侧信息栏 */
.rail { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow: auto; }
.rail .card { padding: 16px 18px; }
.rail .rules-list li { font-size: 12.2px; line-height: 1.58; padding-left: 27px; }
.rail .rules-list li::before { width: 18px; height: 18px; font-size: 10.5px; border-radius: 6px; }

.legend { display: flex; flex-direction: column; gap: 10px; }
.legend__row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-2); }
.legend__swatch { width: 26px; height: 22px; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(195, 216, 255, 0.06); }
.legend__row b { margin-left: auto; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--ink-3); }

.action-stack { display: flex; flex-direction: column; gap: 8px; }
.action-stack .btn { width: 100%; justify-content: flex-start; }

/* ---------- 11. 弹层 ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 90;
  display: grid; place-items: center;
  padding: 20px;
  background: rgba(195, 216, 255, 0.42);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  animation: fade .16s ease;
}
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.985) } to { opacity: 1; transform: none } }

.modal {
  width: min(var(--w, 520px), 96vw);
  max-height: 92vh;    /* 旧内核（教室一体机常见）不认 dvh，用 vh 兜底，避免弹层超出屏幕 */
  max-height: 92dvh;
  overflow: auto;
  background: #16212E;
  border-radius: var(--radius-xl);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  padding: clamp(20px, 2.4vw, 30px);
  animation: pop .2s cubic-bezier(.22, .8, .3, 1);
}
.modal h2 { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.modal__desc { font-size: 13px; line-height: 1.7; color: var(--ink-2); margin-top: 8px; }
.modal__actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
.modal__actions--split { justify-content: space-between; }

/* ---------- 12. 表单 ---------- */
.field { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; }
.field > span { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.field input[type="text"],
.field input[type="password"],
.field input[type="number"],
.field input[type="date"],
.field select,
.field textarea,
.input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: #16212E;
  font-size: 14px;
  transition: border-color .16s, box-shadow .16s;
}
.field input:focus, .field select:focus, .field textarea:focus, .input:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(76, 124, 240, 0.14);
  outline: none;
}
.field textarea { resize: vertical; min-height: 108px; line-height: 1.65; }
.field__hint { font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }

.row-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.row-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

.switch { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-2); }
.switch input { margin-top: 2px; width: 17px; height: 17px; accent-color: var(--brand); }
.switch__text { font-size: 13px; line-height: 1.55; }
.switch__text b { display: block; font-weight: 700; margin-bottom: 2px; }
.switch__text span { color: var(--ink-3); font-size: 12px; }

.color-pair { display: flex; align-items: center; gap: 10px; }
.color-pair input[type="color"] {
  width: 46px; height: 38px; padding: 0;
  border: 1px solid var(--line-strong); border-radius: 10px;
  background: #16212E; cursor: pointer;
}
.color-pair .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--ink-2); text-transform: uppercase; }
.presets { display: flex; gap: 7px; margin-top: 8px; flex-wrap: wrap; }
.preset { width: 24px; height: 24px; border-radius: 8px; border: 1px solid rgba(195, 216, 255, 0.12); cursor: pointer; padding: 0; }
.preset:hover { transform: scale(1.12); }

.range-row { display: flex; align-items: center; gap: 12px; }
.range-row input[type="range"] { flex: 1; accent-color: var(--brand); }
.range-row output { font-size: 12.5px; font-weight: 700; color: var(--ink-2); min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- 13. 管理员控制台 ---------- */
.overlay--admin { padding: 0; }
.admin {
  display: grid;
  grid-template-columns: 214px minmax(0, 1fr);
  width: min(1120px, 100vw);
  height: min(800px, 100dvh);
  background: #16212E;
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  animation: pop .2s cubic-bezier(.22, .8, .3, 1);
  margin: auto;
}
@media (min-width: 1180px) and (min-height: 860px) { .admin { border-radius: 28px; } }

.admin__nav {
  display: flex; flex-direction: column; gap: 3px;
  padding: 20px 12px;
  background: linear-gradient(180deg, #182741, #182741);
  border-right: 1px solid var(--line);
}
.admin__brand {
  font-size: 12px; font-weight: 800; letter-spacing: .12em;
  color: var(--ink-3);
  padding: 2px 12px 14px;
  text-transform: uppercase;
}
.admin__tab {
  text-align: left;
  padding: 10px 13px;
  border: none; border-radius: 11px;
  background: transparent;
  font-size: 13.5px; font-weight: 650;
  color: var(--ink-2);
  cursor: pointer;
  transition: .14s;
}
.admin__tab:hover { background: #182741; color: var(--ink); }
.admin__tab.is-active { background: #16212E; color: var(--brand-ink); box-shadow: var(--shadow-sm); border: 1px solid var(--line); font-weight: 750; }
.admin__nav-foot { margin-top: auto; padding: 12px 4px 0; }

.admin__body { display: flex; flex-direction: column; min-height: 0; }
.admin__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 24px;
  border-bottom: 1px solid var(--line);
}
.admin__head h2 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.admin__content { padding: 20px 24px 28px; overflow: auto; flex: 1; }

.admin-section { padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px dashed var(--line); }
.admin-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.admin-section > h3 { font-size: 13.5px; font-weight: 750; margin-bottom: 4px; }
.admin-section > p.hint { font-size: 12px; color: var(--ink-3); line-height: 1.6; margin-bottom: 6px; }

.btn-row { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 12px; }

/* 座位表编辑器 */
.seat-editor {
  display: grid;
  grid-template-columns: 46px repeat(var(--g, 6), minmax(0, 1fr));
  gap: 6px;
  margin-top: 14px;
}
.seat-editor__corner, .seat-editor__col, .seat-editor__row {
  font-size: 10.5px; font-weight: 700; color: var(--ink-3);
  display: grid; place-items: center;
}
.seat-editor input {
  width: 100%;
  padding: 7px 6px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 12.5px;
  text-align: center;
  background: #16212E;
}
.seat-editor input:focus { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(76, 124, 240, 0.12); outline: none; }
.seat-editor input.is-empty { background: #182741; }

/* 副管理员列表 */
.deputy-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.deputy-row {
  display: grid;
  grid-template-columns: 22px minmax(0, 1.1fr) minmax(0, .8fr) 34px;
  gap: 10px; align-items: center;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface-2);
}
.deputy-row__idx { font-size: 11.5px; font-weight: 800; color: var(--ink-3); text-align: center; }
.deputy-row input {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--line-strong); border-radius: 8px; background: #16212E; font-size: 13px;
}
.deputy-row .del {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line-strong);
  background: #16212E; color: #E07385; cursor: pointer; font-size: 15px; line-height: 1;
}
.deputy-row .del:hover { background: #2E1A21; border-color: #3A2029; }

.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
.stepper button { width: 34px; height: 36px; border: none; background: #16212E; color: var(--ink-2); font-size: 16px; cursor: pointer; }
.stepper button:hover { background: #182741; }
.stepper input { width: 52px; height: 36px; border: none; border-left: 1px solid var(--line); border-right: 1px solid var(--line); text-align: center; font-weight: 700; font-size: 14px; }

/* ---------- 14. 提示条 ---------- */
.toast-root {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
  z-index: 120;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none;
}
.toast {
  padding: 10px 18px;
  border-radius: 12px;
  background: rgba(195, 216, 255, 0.93);
  color: #16212E;
  font-size: 13px; font-weight: 600;
  box-shadow: 0 18px 40px -18px rgba(195, 216, 255, 0.8);
  animation: pop .18s ease;
  max-width: 88vw;
  text-align: center;
}
.toast--ok { background: #C3D8FF; }
.toast--warn { background: #8FD3D3; }
.toast--err { background: #E07385; }
.toast.is-out { opacity: 0; transition: opacity .25s; }

/* ---------- 14b. 连接状态说明条 ---------- */
.mode-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 10px clamp(16px, 3vw, 40px);
  font-size: 12.5px;
  line-height: 1.65;
  color: #C6EDEA;
  background: #1B2A33;
  border-bottom: 1px solid #2A4750;
}
.mode-banner[hidden] { display: none; }
.mode-banner b { font-weight: 800; }
.mode-banner span { flex: 1 1 340px; min-width: 0; }
.mode-banner code {
  font-size: 11.5px;
  padding: 1px 5px;
  border-radius: 5px;
  background: rgba(198, 237, 234, 0.1);
}
.mode-banner .btn { margin-left: auto; }

/* ---------- 14c. 早读常规 ---------- */
.morning {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: clamp(16px, 2vw, 24px) clamp(18px, 2.4vw, 30px);
  border-radius: var(--radius-xl);
  background: var(--read-bg, linear-gradient(135deg, #20323C 0%, #2A4750 46%, #262246 100%));
  color: var(--read-ink, #C6EDEA);
  box-shadow: 0 26px 54px -34px rgba(195, 216, 255, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.35);
}
.morning::after {
  content: "";
  position: absolute;
  right: -70px; top: -90px;
  width: 280px; height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 68%);
  pointer-events: none;
  z-index: 0;
}
/* 内容压在装饰光斑之上，避免状态标签被冲淡 */
.morning > * { position: relative; z-index: 1; }
.morning--hero { padding: clamp(20px, 2.6vw, 34px) clamp(22px, 3vw, 40px); gap: 16px; }

.morning__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.morning__badge { font-size: 12.5px; font-weight: 800; letter-spacing: .07em; opacity: .82; }
.morning__status {
  font-size: 12px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 999px;
  color: inherit;
  background: rgba(255, 255, 255, 0.55);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  white-space: nowrap;
}
.morning__status.is-doing { background: rgba(22, 33, 46, 0.78); }

.morning__body {
  display: grid;
  grid-template-columns: minmax(0, auto) minmax(0, 1fr);
  gap: clamp(14px, 3vw, 40px);
  align-items: center;
}
.morning__time { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px; }
.morning__time b {
  font-size: clamp(36px, 5.2vw, 72px);
  font-weight: 850;
  letter-spacing: -.045em;
  line-height: .98;
  font-variant-numeric: tabular-nums;
}
.morning__time i { font-style: normal; font-size: clamp(20px, 2.2vw, 32px); opacity: .5; }
.morning__time span { flex-basis: 100%; margin-top: 6px; font-size: 12.5px; font-weight: 650; opacity: .62; }
.morning__task { min-width: 0; padding-left: clamp(14px, 2vw, 26px); border-left: 2px solid var(--read-soft, rgba(3, 7, 13, 0.162)); }
.morning__label { font-size: 12px; font-weight: 750; letter-spacing: .08em; opacity: .6; }
.morning__content {
  margin-top: 6px;
  font-size: clamp(17px, 1.85vw, 26px);
  font-weight: 780;
  line-height: 1.46;
  letter-spacing: -.01em;
  word-break: break-word;
}
.morning__meta { margin-top: 8px; font-size: 12px; opacity: .6; }

.morning__slogan-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.morning__slogan { font-size: 13.5px; font-weight: 700; line-height: 1.6; opacity: .84; transition: opacity .2s; }
.morning__slogan.is-fading { opacity: 0; }
.morning__refresh {
  border: none;
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 11.5px;
  font-weight: 700;
  color: inherit;
  background: rgba(255, 255, 255, 0.52);
  cursor: pointer;
  opacity: .85;
  white-space: nowrap;
}
.morning__refresh:hover { opacity: 1; background: rgba(22, 33, 46, 0.82); }

.morning__foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.morning__go {
  margin-left: auto;
  color: inherit;
  background: rgba(22, 33, 46, 0.74);
  border-color: transparent;
}
.morning__go:hover { background: #16212E; }

.morning--empty .morning__empty h2 { font-size: clamp(17px, 1.7vw, 23px); font-weight: 800; letter-spacing: -.01em; }
.morning--empty .morning__empty p { margin-top: 6px; font-size: 13px; line-height: 1.7; opacity: .78; }
.morning--empty .btn-row { margin-top: 14px; }

/* 背景选择 */
.bg-picker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bg-picker__label { font-size: 11.5px; font-weight: 750; letter-spacing: .06em; opacity: .58; }
.bg-dot {
  width: 34px; height: 24px;
  padding: 0;
  border: 2px solid rgba(22, 33, 46, 0.72);
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 0 3px 9px -5px rgba(195, 216, 255, 0.55);
  transition: transform .14s, box-shadow .14s;
}
.bg-dot span { display: none; }
.bg-dot:hover { transform: translateY(-1px) scale(1.05); }
.bg-dot.is-active { box-shadow: 0 0 0 2px rgba(195, 216, 255, 0.42); }
.bg-picker--large { gap: 10px; }
.bg-picker--large .bg-dot {
  width: auto;
  min-width: 92px;
  height: 46px;
  padding: 0 12px;
  border-radius: 12px;
  border-color: rgba(195, 216, 255, 0.08);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.bg-picker--large .bg-dot span {
  display: block;
  font-size: 12px;
  font-weight: 750;
  color: #C3D8FF;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
}
.bg-picker--large .bg-dot--dark span { color: #1C2D4A; text-shadow: none; }
.bg-picker--large .bg-dot.is-active { box-shadow: 0 0 0 2px var(--brand), 0 8px 18px -10px rgba(195, 216, 255, 0.6); }

/* 首页模块卡：早读 */
.module-card--reading { --accent: #3FB3B0; --accent-2: #5E8C95; --accent-soft: #1B2A33; }
.read-chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.read-chip {
  font-size: 11.5px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 999px;
  background: #182741;
  color: var(--ink-2);
}
.read-chip--doing { background: #12291F; color: #A9E6C9; }
.read-chip--before { background: #20323C; color: #8FD3D3; }
.read-chip--after { background: #182741; color: #6E9BFA; }
.read-chip--none { background: #2E1A21; color: #E07385; }
.read-chip--bg { box-shadow: inset 0 0 0 1px rgba(195, 216, 255, 0.07); }

/* 早读页 */
.banner--read { background: #1B2A33; border-color: #2A4750; color: #FFB3C0; }
.reading-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 336px;
  gap: 16px;
  align-items: start;
}
.reading-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.read-timeline { display: flex; flex-direction: column; gap: 8px; }
.read-slot {
  display: grid;
  grid-template-columns: 108px minmax(0, 1fr) 28px;
  gap: 12px;
  align-items: center;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface-2);
}
.read-slot.is-current { border-color: #2A4750; background: #1B2A33; }
.read-slot__time { font-size: 13.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
.read-slot__time i { font-style: normal; opacity: .45; margin: 0 2px; }
.read-slot__content { font-size: 12.8px; color: var(--ink-2); line-height: 1.5; overflow: hidden; text-overflow: ellipsis; }
.read-slot__del {
  width: 26px; height: 26px;
  border-radius: 8px;
  border: 1px solid var(--line-strong);
  background: #16212E;
  color: #E07385;
  line-height: 1;
  cursor: pointer;
}
.read-slot__del:hover { background: #2E1A21; border-color: #3A2029; }

.read-history { display: flex; flex-direction: column; gap: 9px; }
.read-history__row {
  display: grid;
  grid-template-columns: 82px 92px minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  font-size: 11.8px;
  color: var(--ink-3);
}
.read-history__row b { color: var(--ink-2); font-variant-numeric: tabular-nums; font-weight: 700; }
.read-history__row span:last-of-type {
  color: var(--ink-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.read-history--admin .read-history__row { grid-template-columns: 72px 108px minmax(0, 1fr) 26px; }
.read-history .del {
  width: 24px; height: 24px;
  border-radius: 7px;
  border: 1px solid var(--line-strong);
  background: #16212E;
  color: #E07385;
  cursor: pointer;
  line-height: 1;
}
.read-history .del:hover { background: #2E1A21; border-color: #3A2029; }

/* 早读发布表单 */
.field input[type="time"] {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: #16212E;
  font-size: 14px;
}
.field input[type="time"]:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(76, 124, 240, 0.14);
  outline: none;
}
.time-range { display: flex; align-items: center; gap: 8px; }
.time-range span { font-size: 12px; color: var(--ink-3); }
.quick-times { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ---------- 15. 响应式 ---------- */
@media (max-width: 1240px) {
  .module-body { grid-template-columns: minmax(0, 1fr); }
  .rail { flex-direction: row; flex-wrap: wrap; overflow: visible; }
  .rail > .card { flex: 1 1 260px; }
  .guide-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 1024px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .module-grid { grid-template-columns: minmax(0, 1fr); }
  .guide-grid { grid-template-columns: minmax(0, 1fr); }
  .topbar { flex-wrap: wrap; row-gap: 8px; }
  .topbar__mid { order: 3; flex-basis: 100%; justify-content: flex-start; }
  .save-status { display: none; }
  .module-view { height: auto; min-height: 0; }
  .module-head__stats { margin-left: 0; }
  .module-head__actions { margin-left: auto; }
}

@media (max-width: 720px) {
  .view { padding: 14px 12px 28px; }
  .hero__main { padding: 20px; }
  .stat { min-width: 92px; padding: 8px 12px; }
  .module-card { grid-template-columns: 52px minmax(0, 1fr); gap: 4px 14px; padding: 18px; }
  .module-card__icon { width: 52px; height: 52px; border-radius: 15px; font-size: 22px; }
  .module-card__foot { flex-direction: column; align-items: flex-start; }
  .seat-stage { overflow-x: auto; padding-bottom: 6px; }
  .seat-group { min-width: 88px; }
  .seat-column { grid-template-rows: repeat(var(--rows, 8), minmax(44px, 1fr)); }
  .row-2, .row-3 { grid-template-columns: minmax(0, 1fr); }
  .admin { grid-template-columns: minmax(0, 1fr); height: 100dvh; }
  .admin__nav { flex-direction: row; overflow-x: auto; padding: 10px; border-right: none; border-bottom: 1px solid var(--line); }
  .admin__brand, .admin__nav-foot { display: none; }
  .admin__tab { white-space: nowrap; }
  .deputy-row { grid-template-columns: 20px minmax(0, 1fr) minmax(0, .8fr) 30px; }
  .module-head { gap: 10px; padding: 12px 14px; }
  .module-head__actions { width: 100%; }
  .module-head__actions .btn { flex: 1; }
}

/* 矮屏（如 1366×768 一体机）压缩留白，保证 8 排座位一屏放下 */
@media (max-height: 820px) {
  :root { --gap-row: 7px; --gap-group: 12px; }
  .podium { height: 28px; font-size: 11.5px; }
  .module-head { padding: 10px 14px; }
  .module-view { min-height: 520px; }
  .stage { padding: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ---------- 16. 打印 ---------- */
@media print {
  .topbar, .rail, .module-head__actions, .toast-root { display: none !important; }
  body { background: #16212E; }
  .module-body { grid-template-columns: minmax(0, 1fr); }
  .stage { box-shadow: none; border: none; }
  .seat { box-shadow: none; border: 1px solid #5A7089; }
}

/* ---------- 17. 早读常规 · 响应式补充 ---------- */
@media (max-width: 1180px) {
  .reading-body { grid-template-columns: minmax(0, 1fr); }
  .reading-body .rail { flex-direction: row; flex-wrap: wrap; }
}

@media (max-width: 860px) {
  .morning__body { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .morning__task {
    padding-left: 0;
    padding-top: 12px;
    border-left: none;
    border-top: 2px solid var(--read-soft, rgba(3, 7, 13, 0.135));
  }
  .morning__time b { font-size: clamp(32px, 9vw, 52px); }
  .morning__content { font-size: clamp(16px, 4.4vw, 22px); }
  .read-slot { grid-template-columns: 92px minmax(0, 1fr) 26px; }
}

@media (max-width: 720px) {
  .morning { border-radius: var(--radius-lg); }
  .morning__go { margin-left: 0; width: 100%; }
  .morning__status { font-size: 11px; padding: 4px 10px; }
  .bg-picker--large .bg-dot { min-width: 78px; height: 42px; }
  .read-history__row, .read-history--admin .read-history__row {
    grid-template-columns: 70px 84px minmax(0, 1fr) 24px;
  }
  #linkRetry { display: none; }
  .mode-banner { padding: 9px 14px; font-size: 12px; }
  .mode-banner .btn { margin-left: 0; }
}

@media print {
  .morning { box-shadow: none; }
  .bg-picker, .morning__refresh, .mode-banner { display: none !important; }
}

/* ---------- 18. 早读常规（整页大字 · 多任务 · 多时段） ---------- */
.read-switch {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 2px 2px 6px;
  scrollbar-width: thin;
}
.read-switch__item {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
  padding: 9px 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: #16212E;
  cursor: pointer;
  transition: border-color .16s, background .16s, box-shadow .16s;
}
.read-switch__item b { font-size: 13.5px; font-weight: 800; color: var(--ink); }
.read-switch__item span { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.read-switch__item:hover { border-color: #2A4750; }
.read-switch__item.is-active {
  border-color: #5E8C95;
  background: #1B2A33;
  box-shadow: 0 0 0 2px rgba(94, 140, 149, 0.2);
}
.read-switch__item.is-active b { color: #E07385; }

.reading-view { max-width: 1680px; }
.read-stage {
  position: relative;
  overflow: hidden;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: clamp(14px, 2vw, 26px);
  padding: clamp(20px, 2.6vw, 40px);
  border-radius: var(--radius-xl);
  background: var(--read-bg, linear-gradient(135deg, #20323C 0%, #2A4750 46%, #262246 100%));
  color: var(--read-ink, #C6EDEA);
  box-shadow: 0 30px 60px -40px rgba(195, 216, 255, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.35);
}
.read-stage::after {
  content: "";
  position: absolute;
  right: -80px; top: -110px;
  width: 340px; height: 340px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 68%);
  pointer-events: none;
  z-index: 0;
}
.read-stage > * { position: relative; z-index: 1; }
.read-stage__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.read-stage__date { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.read-stage__datetext { font-size: clamp(15px, 1.4vw, 20px); font-weight: 820; letter-spacing: .01em; }
.read-stage__clock { font-size: clamp(13px, 1.15vw, 16px); font-weight: 700; opacity: .62; font-variant-numeric: tabular-nums; }
.read-stage__main {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1.02fr) minmax(0, 1fr);
  gap: clamp(18px, 3vw, 48px);
  align-items: center;
}
.read-stage__left { display: flex; flex-direction: column; gap: clamp(10px, 1.4vw, 18px); min-width: 0; }
.read-stage__name {
  font-size: clamp(25px, 3.2vw, 44px);
  font-weight: 860;
  letter-spacing: -.03em;
  line-height: 1.12;
  word-break: break-word;
}
.read-stage__segs { display: flex; flex-direction: column; gap: 10px; }
.read-seg {
  display: flex;
  align-items: baseline;
  gap: clamp(10px, 1.5vw, 20px);
  padding: clamp(8px, 1vw, 14px) clamp(12px, 1.5vw, 22px);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.46);
  border: 1px solid var(--read-soft, rgba(3, 7, 13, 0.135));
  transition: background .2s, box-shadow .2s, opacity .2s;
}
.read-seg.is-doing {
  background: rgba(22, 33, 46, 0.84);
  box-shadow: 0 0 0 2px rgba(22, 33, 46, 0.85), 0 18px 32px -24px rgba(195, 216, 255, 0.55);
}
.read-seg.is-after { opacity: .6; }
.read-seg__idx { flex: 0 0 auto; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; opacity: .6; }
.read-seg__time { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.read-seg__time b {
  font-size: clamp(28px, 3.6vw, 54px);
  font-weight: 860;
  letter-spacing: -.045em;
  line-height: .98;
}
.read-seg__time i { font-style: normal; font-size: clamp(15px, 1.6vw, 24px); opacity: .45; }
.read-seg__dur { margin-left: auto; font-size: 12.5px; font-weight: 700; opacity: .6; white-space: nowrap; }
.read-stage__content-wrap {
  min-width: 0;
  padding-left: clamp(0px, 2vw, 28px);
  border-left: 2px solid var(--read-soft, rgba(3, 7, 13, 0.162));
}
.read-stage__content {
  margin-top: 8px;
  font-size: clamp(18px, 2vw, 30px);
  font-weight: 780;
  line-height: 1.46;
  letter-spacing: -.01em;
  word-break: break-word;
}
.read-stage__meta { margin-top: 12px; font-size: 12.5px; opacity: .62; line-height: 1.7; }
.read-stage__foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.read-stage__foot .btn { margin-left: auto; }
.read-stage__hint { font-size: 11.5px; font-weight: 650; opacity: .55; }
.read-stage__empty { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.read-stage__empty h2 { font-size: clamp(20px, 2.4vw, 32px); font-weight: 840; letter-spacing: -.02em; }
.read-stage__empty p { font-size: clamp(13px, 1.2vw, 16px); line-height: 1.75; opacity: .76; max-width: 46em; }
.read-stage__empty .btn-row { margin-top: 10px; }
.read-stage--empty { justify-content: flex-start; }

/* 首页早读卡：状态文字与进度条 */
.module-card__nums .read-state { color: var(--accent); font-weight: 750; }
.module-card__nums .read-state.is-doing { color: #A9E6C9; }
.module-card__nums .read-state.is-before { color: #8FD3D3; }
.module-card__nums .read-state.is-after { color: #6E9BFA; }
.module-card__nums .read-state.is-none { color: #E07385; }

/* 发布弹层：多时间段编辑器 */
.seg-editor { display: flex; flex-direction: column; gap: 8px; }
.seg-row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) 34px; gap: 8px; align-items: center; }
.seg-row input[type="time"] {

  font-size: 14px;
}
.seg-row input[type="time"]:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(76, 124, 240, 0.14);
  outline: none;
}
.seg-row > span { font-size: 12px; color: var(--ink-3); }
.seg-row__del {
  width: 32px; height: 32px;
  border-radius: 9px;
  border: 1px solid var(--line-strong);
  background: #16212E;
  color: #E07385;
  line-height: 1;
  cursor: pointer;
}
.seg-row__del:hover { background: #2E1A21; border-color: #3A2029; }
.seg-editor__foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
.seg-editor__foot .field__hint { margin: 0; }

@media (max-width: 1040px) {
  .read-stage__main { grid-template-columns: minmax(0, 1fr); }
  .read-stage__content-wrap {
    padding-left: 0;
    padding-top: 16px;
    border-left: none;
    border-top: 2px solid var(--read-soft, rgba(3, 7, 13, 0.162));
  }
}

@media (max-width: 720px) {
  .read-stage { padding: 18px 16px; border-radius: var(--radius-lg); }
  .read-stage__name { font-size: clamp(21px, 6.6vw, 30px); }
  .read-seg { flex-wrap: wrap; gap: 6px 12px; padding: 10px 12px; }
  .read-seg__time b { font-size: clamp(26px, 8.6vw, 40px); }
  .read-seg__dur { margin-left: 0; }
  .read-stage__content { font-size: clamp(16px, 4.5vw, 21px); }
  .read-stage__foot .btn { margin-left: 0; }
  .seg-row { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) 30px; }
}

@media print {
  .read-switch, .read-stage__foot { display: none !important; }
  .read-stage { box-shadow: none; }
}

/* 早读页隐藏「录入日期」切换（该页日期以网络实时为准，见 app.js renderReading） */
body.is-reading .datebar { display: none; }

/* =========================================================
   19. v3 视觉改版 · 首页
   ========================================================= */

/* ---------- 顶部标语 ---------- */
.motto {
  position: relative;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 18px clamp(20px, 2.4vw, 34px);
  border-radius: 22px;
  overflow: hidden;
  color: #16212E;
  background:
    radial-gradient(620px 220px at 88% -20%, rgba(39, 64, 107, 0.55), transparent 70%),
    linear-gradient(112deg, #C3D8FF 0%, #C3D8FF 42%, #4C7CF0 78%, #4C7CF0 100%);

}

  content: "";

  inset: 0;

}
.motto__text { position: relative; min-width: 0; }
.motto__en {

  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 10px;
  font-size: 9px;
  letter-spacing: .22em;
  color: rgba(22, 33, 46, 0.68);
}
.motto__seal i { font-style: normal; }

/* ---------- Hero 调整 ---------- */
.hero { align-items: stretch; }
.hero__side { display: flex; }
.hero__side .card { flex: 1; }
.hero__actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

/* ---------- 模块卡 v3 ---------- */
.module-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 20px 22px;
  border-radius: 20px;
  grid-template-columns: none;
  grid-template-rows: none;
}
.module-card__top { display: flex; align-items: center; gap: 13px; }

  grid-row: auto;

.module-card__title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.module-card__tag {

.module-card__task { align-self: flex-start; font-size: 12px; }

.module-card__go {

.module-card--extend { --accent: #4C7CF0; --accent-2: #4C7CF0; --accent-soft: #182741; }

/* ---------- 首页 · 学习标兵 / 优秀作业 ---------- */
.showcase { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.showcase__card { display: flex; flex-direction: column; gap: 4px; }
.showcase__list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.showcase__list li {
  display: grid;
  grid-template-columns: 82px minmax(0, 1fr);
  gap: 4px 12px;
  align-items: baseline;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);

/* =========================================================

   ========================================================= */

.read-seg__dur { font-size: 11.5px; font-weight: 700; opacity: .55; }

/* =========================================================
   21. 控制台 v3
   ========================================================= */

}

}
.btn--xs { padding: 5px 10px; font-size: 11.5px; border-radius: 8px; }

/* 任务列表 */

}

/* 时间段编辑器 v3 */
.seg-editor { display: flex; flex-direction: column; gap: 7px; }
.seg-row {

}

/* 开关行 */

}

/* 大屏设置 */

/* 海报列表 */
.poster-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }

/* =========================================================
   22. 大屏展示
   ========================================================= */
body.is-screen { overflow: hidden; background: #C3D8FF; }

body.is-screen .mode-banner { display: none; }

.screen {

    radial-gradient(1000px 620px at 12% -12%, #C3D8FF 0%, rgba(195, 216, 255, 0) 62%),

.screen__btn {
  min-width: 34px; height: 34px;

}

.screen__stage { position: relative; z-index: 2; flex: 1; min-height: 0; padding: clamp(14px, 2vw, 28px) clamp(16px, 2.4vw, 34px); display: flex; }
.screen__foot {
  position: relative;
  z-index: 2;

  align-items: center;
  gap: 18px;
  padding: 10px clamp(16px, 2.4vw, 34px) 16px;
  flex-wrap: wrap;
}
.screen__dots { display: flex; gap: 6px; flex-wrap: wrap; }
.screen__dot {
  width: 22px; height: 4px;
  border: none; border-radius: 999px;
  background: rgba(255, 255, 255, 0.18);
  cursor: pointer;
  padding: 0;
  transition: .2s;
}
.screen__dot.is-active { background: linear-gradient(90deg, #27406B, #4C7CF0); width: 34px; }
.screen__hint { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: #4C7CF0; }
.screen__progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, 0.105); z-index: 3; }
.screen__progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #27406B, #4C7CF0); }
@keyframes screenBar { from { width: 0 } to { width: 100% } }

.slide-wrap { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; animation: slideIn .45s cubic-bezier(.22, .8, .3, 1) both; }
@keyframes slideIn { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
.slide {

  justify-content: center;
  gap: clamp(12px, 1.5vw, 22px);
}

  padding: clamp(14px, 1.7vw, 26px);

  box-shadow: 0 30px 60px -44px #4C7CF0;
}

.slide-seg__time { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.slide-seg__idx { font-size: 10.5px; font-weight: 850; letter-spacing: .16em; color: #27406B; }
.slide-seg__time b { font-size: clamp(28px, 3.6vw, 56px); font-weight: 860; letter-spacing: -.045em; line-height: 1; color: #16212E; }
.slide-seg__time i { font-style: normal; font-size: clamp(14px, 1.5vw, 22px); color: rgba(255, 255, 255, 0.38); }
.slide-seg__content { font-size: clamp(15px, 1.7vw, 26px); font-weight: 750; line-height: 1.45; color: #182741; }
.slide__meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: clamp(11.5px, 1vw, 15px); color: #4C7CF0; }
.slide__pill { padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: .92em; background: rgba(255, 255, 255, 0.1); }
.slide__pill.is-doing { background: rgba(79, 177, 131, 0.18); color: #2E8B62; }
.slide__pill.is-after { background: rgba(76, 124, 240, 0.18); color: #27406B; }
.slide__note { padding-left: 12px; border-left: 2px solid rgba(255, 255, 255, 0.14); color: #27406B; }

.slide--poster {

  position: relative;

}
.slide--photo { position: relative; display: block; padding: 0; }
.slide-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slide-photo__mask { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(195, 216, 255, 0.2), rgba(195, 216, 255, 0.82)); }

.slide--quote { align-items: center; text-align: center; justify-content: center; position: relative; }
.slide-quote__mark {
  position: absolute;
  top: -.06em;
  font-family: Georgia, serif;
  font-size: clamp(90px, 13vw, 200px);
  color: rgba(255, 255, 255, 0.105);

  pointer-events: none;
}
.slide-quote--big {
  position: relative;
  font-size: clamp(26px, 4vw, 58px);

.slide--list { justify-content: flex-start; gap: clamp(10px, 1.2vw, 18px); }
.slide__list-title { font-size: clamp(19px, 2.4vw, 36px); font-weight: 860; letter-spacing: -.02em; color: #16212E; }
.slide-list { display: flex; flex-direction: column; gap: 10px; overflow: hidden; max-height: 58vh; }
.slide-list.is-scroll { animation: slScroll var(--scroll-dur, 18s) ease-in-out infinite alternate; }
@keyframes slScroll { from { transform: translateY(0) } to { transform: translateY(calc(-100% + 52vh)) } }
.slide-list__row {
  display: grid;
  grid-template-columns: 48px minmax(80px, .7fr) minmax(0, 1.6fr) minmax(0, 1.3fr) 90px;
  gap: 12px;

  border-radius: 14px;

  border: 1px solid rgba(255, 255, 255, 0.09);

}
.slide-list__rank { font-weight: 860; color: #27406B; font-variant-numeric: tabular-nums; }
.slide-list__name { font-weight: 800; color: #16212E; }
.slide-list__main { color: #1C2D4A; }
.slide-list__note { color: #4C7CF0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slide-list__date { color: #4C7CF0; font-size: .86em; text-align: right; font-variant-numeric: tabular-nums; }
.slide-pager { text-align: right; font-size: 11px; color: #4C7CF0; font-variant-numeric: tabular-nums; }
.slide--empty { align-items: center; justify-content: center; color: #4C7CF0; font-size: 15px; text-align: center; }

/* =========================================================
   23. 拓展阅读
   ========================================================= */
.extend-view { max-width: 1400px; }
.ex-cats { display: flex; flex-wrap: wrap; gap: 8px; }
.ex-cats .chip { cursor: pointer; font-size: 12.5px; padding: 7px 14px; }
.ex-cats .chip i { font-style: normal; margin-left: 6px; font-size: 10.5px; opacity: .55; }
.ex-cats .chip.is-active { background: var(--brand); border-color: var(--brand); color: #16212E; }
.ex-cats .chip.is-active i { opacity: .8; }

/* v3.11 题型信息条：题量 / 分值 / 建议用时 + 一句话定位 */
.ex-cat-note {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
  margin: 12px 0 2px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--brand);
  border-radius: 10px;
  background: var(--surface-2);
  font-size: 12.5px;
  line-height: 1.8;
  color: var(--ink-2);
}
.ex-cat-note b { font-family: var(--serif); font-size: 14.5px; letter-spacing: .02em; color: var(--ink); }
.ex-cat-note span { font-variant-numeric: tabular-nums; letter-spacing: .02em; color: var(--brass); }
.ex-cat-note i { font-style: normal; color: var(--ink-3); }

.ex-feature {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 200px;
  gap: 24px;
  padding: clamp(20px, 2.4vw, 34px);
  border-radius: 24px;
  cursor: pointer;
  color: #16212E;
  background:
    radial-gradient(520px 200px at 92% -10%, rgba(39, 64, 107, 0.55), transparent 70%),
    linear-gradient(118deg, #C3D8FF 0%, #C3D8FF 48%, #4C7CF0 100%);
  box-shadow: 0 30px 60px -44px rgba(110, 155, 250, 0.9);
  transition: transform .18s, box-shadow .18s;
}
.ex-feature:hover { transform: translateY(-2px); box-shadow: 0 36px 70px -40px rgba(110, 155, 250, 0.95); }
.ex-feature__cat { font-size: 10.5px; font-weight: 850; letter-spacing: .18em; color: #27406B; }
.ex-feature h2 { margin: 8px 0 6px; font-size: clamp(20px, 2.3vw, 32px); font-weight: 860; letter-spacing: -.025em; line-height: 1.25; }
.ex-feature__en { font-family: Georgia, serif; font-style: italic; font-size: 13px; color: rgba(22, 33, 46, 0.68); }
.ex-feature__desc { margin-top: 12px; font-size: 13px; line-height: 1.85; color: rgba(22, 33, 46, 0.82); max-width: 62ch; }
.ex-feature__go { display: inline-block; margin-top: 16px; font-size: 12.5px; font-weight: 800; color: #1C2D4A; }
.ex-feature__side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  border-left: 1px solid rgba(255, 255, 255, 0.14);
  padding-left: 20px;
}
.ex-feature__num { font-size: clamp(38px, 5vw, 68px); font-weight: 860; letter-spacing: -.05em; line-height: 1; color: rgba(22, 33, 46, 0.92); }
.ex-feature__hint { font-size: 11px; letter-spacing: .14em; color: rgba(22, 33, 46, 0.6); margin-top: 4px; }

.ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(276px, 1fr)); gap: 16px; }
.ex-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 20px;
  border-radius: 18px;
  background: #16212E;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .18s, box-shadow .18s, border-color .18s;
}
.ex-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: #1C2D4A; }
.ex-card__top { display: flex; align-items: center; justify-content: space-between; }
.ex-card__cat { font-size: 10.5px; font-weight: 850; padding: 3px 9px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-ink); }
.ex-card__min { font-size: 11px; color: var(--ink-3); }
.ex-card h3 { font-size: 15px; font-weight: 800; letter-spacing: -.01em; line-height: 1.45; }
.ex-card__en { font-family: Georgia, serif; font-style: italic; font-size: 11.5px; color: var(--ink-3); }
.ex-card__desc {
  font-size: 12.5px;
  line-height: 1.72;
  color: var(--ink-2);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.ex-card__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
  font-size: 11px;
  color: var(--ink-3);
}
.ex-card__go { font-weight: 800; color: var(--brand); }

/* 文章弹层 */
.modal--art { --w: 760px; }
.art__cat { display: inline-block; font-size: 10.5px; font-weight: 850; letter-spacing: .12em; padding: 3px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-ink); }
.art__title { margin: 10px 0 6px; font-size: 22px; font-weight: 860; letter-spacing: -.02em; line-height: 1.32; }
.art__en { font-family: Georgia, serif; font-style: italic; font-size: 13px; color: var(--ink-3); }
.art__meta { margin-top: 8px; font-size: 11.5px; color: var(--ink-3); }
.art__body { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.art__h { font-size: 14.5px; font-weight: 850; letter-spacing: -.01em; margin-top: 6px; color: var(--ink); }
.art__p { font-size: 13.5px; line-height: 1.92; color: var(--ink-2); }
.art__ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 7px; font-size: 13px; line-height: 1.88; color: var(--ink-2); }
.art__ul li::marker { color: var(--brand); }
.art__tip {
  font-size: 12.5px;
  line-height: 1.85;
  padding: 11px 14px;
  border-radius: 12px;
  background: #1B2A33;
  border-left: 3px solid #3FB3B0;
  color: #FFB3C0;
}
.art__tip span { font-size: 10px; font-weight: 900; letter-spacing: .16em; margin-right: 9px; color: #8FD3D3; }

/* =========================================================
   24. v3 响应式
   ========================================================= */
@media (max-width: 1180px) {
  .showcase { grid-template-columns: minmax(0, 1fr); }
  .ex-feature { grid-template-columns: minmax(0, 1fr); }
  .ex-feature__side { align-items: flex-start; border-left: none; border-top: 1px solid rgba(255, 255, 255, 0.14); padding: 14px 0 0; flex-direction: row; gap: 10px; align-items: baseline; }
  .ex-feature__num { font-size: 34px; }
}

@media (max-width: 1000px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .read-seg { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .read-seg__clock b { font-size: clamp(26px, 6vw, 38px); }
}

@media (max-width: 860px) {
  .motto { flex-wrap: wrap; gap: 10px; padding: 16px 18px; }
  .motto__mark { display: none; }
  .motto__seal { display: none; }
  .motto__cn { letter-spacing: .18em; }
  .module-grid--3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .screen__bar { flex-wrap: wrap; gap: 10px; }
  .screen__now { margin-left: 0; text-align: left; }
  .screen__ctrl { margin-left: auto; }
  .slide-list__row { grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1.2fr); }
  .slide-list__note, .slide-list__date, .slide-list__thumb { display: none; }
  .mini-row--star, .mini-row--work { grid-template-columns: 56px minmax(0, 1fr) 28px; align-items: start; }
  .mini-row--star .mini-thumb-wrap, .mini-row--work .mini-thumb-wrap { grid-row: 1 / span 2; }
  .mini-row--star input:nth-child(n+4), .mini-row--work input:nth-child(n+4) { grid-column: 1 / -1; }
}

@media (max-width: 720px) {
  .module-grid--3 { grid-template-columns: minmax(0, 1fr); }
  .module-card { padding: 18px; }
  .task-row { flex-direction: column; }
  .task-row__ops { justify-content: flex-start; }
  .seg-row { grid-template-columns: 18px minmax(0, 1fr) 10px minmax(0, 1fr) 30px; }
  .seg-row__content { grid-column: 1 / -1; }
  .poster-row { grid-template-columns: minmax(0, 1fr); }
  .poster-row__art { min-height: 110px; }
  .poster-row__foot { grid-template-columns: 88px minmax(0, 1fr); }
  .mini-add { grid-template-columns: minmax(0, 1fr) auto auto; }
  .screen__hint { display: none; }
  .slide-list { max-height: 62vh; }
}

@media print {
  .motto, .foot, .screen { display: none !important; }
}

/* =========================================================
   25. v4 版式与视觉升级
   —— 顶栏日期块 / 报头 + 每日一题 / 左「每日常规」右「风采展示」
      / 独立书架区（拓展阅读）/ 投影页 / 出题表单
   ========================================================= */

/* ---------- 25.1 顶栏：日期块 + 天气 + 日期下拉 ---------- */
.topbar { gap: 18px; }
.topbar__mid { position: relative; display: flex; align-items: center; justify-content: center; gap: 16px; min-width: 0; }

.today {
  display: grid;
  grid-template-columns: auto auto;
  grid-template-rows: auto auto;
  align-items: center;
  column-gap: 7px;
  padding-left: 13px;
  border-left: 2px solid var(--brass);
  flex: 0 0 auto;
}
.today__day {
  grid-row: 1 / 3;
  grid-column: 1;
  font-family: var(--serif);
  font-size: 31px;
  font-weight: 600;
  line-height: .95;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.today__month {
  grid-row: 1;
  grid-column: 2;
  align-self: end;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .2em;
  color: var(--brass);
}
.today__wday {
  grid-row: 2;
  grid-column: 2;
  align-self: start;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .2em;
  color: var(--ink-3);
}
.today.is-other-day { opacity: .72; }

.today__side { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.today__line {
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: .04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.weather {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  color: var(--ink-2);
  white-space: nowrap;
}
.weather__icon { display: inline-flex; width: 16px; height: 16px; color: var(--brass); }
.weather__icon svg { width: 16px; height: 16px; }
.weather__temp { font-size: 13px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; color: var(--ink); }
.weather__text { color: var(--ink-2); }
.weather__city { color: var(--ink-3); font-size: 10.5px; }
.weather.is-off { opacity: .55; }
.weather.is-off .weather__icon { color: var(--ink-3); }
.weather[hidden] { display: none; }

.date-toggle {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--ink-3);
  font-size: 11.5px;
  cursor: pointer;
  transition: color .16s, border-color .16s, background .16s;
}
.date-toggle:hover { color: var(--ink); border-color: var(--line-strong); background: var(--surface); }
.date-toggle[aria-expanded="true"] { color: var(--ink); border-color: var(--ink); background: var(--surface); }

.datebar {
  position: absolute;
  top: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 60;
  display: flex; align-items: center; gap: 6px;
  padding: 7px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
}
.datebar[hidden] { display: none; }

/* ---------- 25.2 报头 ---------- */
.masthead {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(300px, .92fr);
  gap: clamp(18px, 2.4vw, 40px);
  padding: clamp(22px, 2.8vw, 42px) clamp(20px, 2.6vw, 46px) clamp(20px, 2.4vw, 34px);
  background: linear-gradient(180deg, #1B2A33 0%, #1B2A33 100%);
  border: 1px solid var(--line);
  border-top: 3px solid var(--ink);
  border-radius: 3px 3px 18px 18px;
  overflow: hidden;
}
.masthead::after {
  content: "";
  position: absolute;
  right: -120px; top: -160px;
  width: 420px; height: 420px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, rgba(94, 140, 149, 0.18), rgba(94, 140, 149, 0) 68%);
  pointer-events: none;
}
.masthead__intro { position: relative; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.masthead__kicker {
  display: flex; align-items: center; gap: 10px;
  font-size: 10px; font-weight: 800;
  letter-spacing: .26em;
  color: var(--ink-3);
  text-transform: uppercase;
}
.masthead__kicker span { color: var(--brass); }
.masthead__kicker::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.masthead__title {
  font-family: var(--serif);
  font-size: clamp(32px, 4.2vw, 56px);
  font-weight: 600;
  line-height: 1.04;
  letter-spacing: -.02em;
  color: var(--ink);
}
.masthead__title em {
  font-style: normal;
  color: var(--brass);
  position: relative;
}
.masthead__title em::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -.04em;
  height: 2px;
  background: var(--brass-2);
  opacity: .55;
}

.masthead__lede {
  font-size: clamp(13.5px, 1.05vw, 15px);
  line-height: 1.95;
  color: var(--ink-2);
  max-width: 44em;
}
.masthead__lede b { color: var(--ink); font-weight: 750; }

.masthead__points {
  list-style: none;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px 18px;
  margin-top: 2px;
}
.masthead__points li {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding-left: 11px;
  border-left: 1px solid var(--line-strong);
}
.masthead__points b { font-size: 12.5px; font-weight: 800; letter-spacing: .01em; }
.masthead__points span { font-size: 11.5px; line-height: 1.6; color: var(--ink-3); }

.masthead__actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

.masthead__motto {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px;
  margin-top: 6px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.masthead__motto-en {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(12.5px, 1.05vw, 14.5px);
  color: var(--ink-2);
}
.masthead__motto-cn {
  font-size: 11.5px;
  letter-spacing: .26em;
  color: var(--brass);
}
.masthead__quiz { position: relative; display: flex; }

/* ---------- 每日一题卡（试卷质感） ---------- */
.quizcard {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 20px 22px 16px;
  background: #1B2A33;
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  box-shadow: 0 24px 44px -36px rgba(3, 7, 13, 0.92);
  background-image: repeating-linear-gradient(180deg, transparent 0 31px, rgba(195, 216, 255, 0.04) 31px 32px);
}
.quizcard__head { display: flex; flex-direction: column; gap: 4px; }
.quizcard__ribbon {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 9px; font-weight: 800;
  letter-spacing: .24em;
  color: var(--brass);
}
.quizcard__ribbon::after { content: ""; width: 26px; height: 1px; background: var(--brass-2); }
.quizcard__meta { font-size: 11.5px; color: var(--ink-3); letter-spacing: .02em; }

.quizcard__stem {
  font-family: var(--serif);
  font-size: clamp(15px, 1.35vw, 18px);
  line-height: 1.8;
  color: var(--ink);
  letter-spacing: .005em;
}

.quizcard__opts { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; }
.quizcard__opts li { display: flex; align-items: baseline; gap: 7px; font-size: 13.5px; color: var(--ink-2); }
.quizcard__opts b {
  flex: 0 0 auto;
  width: 19px; height: 19px;
  display: grid; place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  font-size: 10.5px;
  font-weight: 800;
  color: var(--ink-2);
  background: var(--surface);
}

.quizcard__foot { display: flex; align-items: center; gap: 12px; margin-top: auto; padding-top: 4px; }
.quizcard__reveal {
  padding: 0;
  background: none; border: none;
  border-bottom: 1px solid var(--brass);
  color: var(--brass);
  font-size: 11.5px; font-weight: 750;
  letter-spacing: .06em;
  cursor: pointer;
}
.quizcard__more { margin-left: auto; font-size: 11px; color: var(--ink-3); text-decoration: none; letter-spacing: .04em; }
.quizcard__more:hover { color: var(--ink); }

.quizcard__ans {
  display: none;
  padding: 11px 13px;
  border-left: 2px solid var(--brass);
  background: var(--brass-soft);
  border-radius: 0 8px 8px 0;
}
.quizcard__ans-key {
  display: inline-block;
  font-size: 11px; font-weight: 850;
  letter-spacing: .1em;
  color: #8FD3D3;
  margin-bottom: 4px;
}
.quizcard__ans p { font-size: 12px; line-height: 1.85; color: var(--ink-2); }
.quizcard.is-revealed .quizcard__ans { display: block; }

.quizcard--empty { justify-content: center; align-items: flex-start; gap: 8px; background-image: none; }
.quizcard__none { font-family: var(--serif); font-size: 18px; color: var(--ink); }
.quizcard__none-sub { font-size: 12px; line-height: 1.8; color: var(--ink-3); }

/* ---------- 25.3 主区：左每日常规 / 右风采展示 ---------- */
.board {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(280px, .92fr);
  gap: clamp(14px, 1.8vw, 24px);
  align-items: stretch;
}
.board__col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.sec-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--line);
}
.sec-head__en { font-size: 9.5px; font-weight: 800; letter-spacing: .26em; color: var(--brass); }
.sec-head__title { font-family: var(--serif); font-size: 21px; font-weight: 600; letter-spacing: .01em; }
.sec-head__desc { font-size: 11.5px; color: var(--ink-3); margin-left: auto; }

.entries { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }

.entry {
  display: flex;
  align-items: center;
  gap: 11px;
  min-height: 62px;
  padding: 10px 13px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 11px;
  color: inherit;
  text-decoration: none;
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.entry:hover {
  transform: translateY(-1px);
  border-color: var(--line-strong);
  box-shadow: 0 16px 26px -24px rgba(3, 7, 13, 0.92);
}
.entry:active { transform: none; }

.entry__icon {
  flex: 0 0 32px;
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink-2);
}
.entry__icon svg { width: 17px; height: 17px; }

.entry__body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.entry__title { font-size: 13px; font-weight: 780; letter-spacing: -.005em; }
.entry__meta {
  font-size: 11px;
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
