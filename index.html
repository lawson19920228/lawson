/* ---------------- 8b. 每日统计（只读汇总页） ---------------- */
/* 每次渲染都重新算一遍：数据来自 dTasks / rTasks 的 records 与 copy，
   所以「听写抄写统计」「背诵抄写统计」里任何一次点击，都会让本页立刻变化。 */
let statRefreshedAt = '';

function statSeatHTML(s, info) {
  if (!info || !info.need) {
    return `<div class="seat seat--na" title="听写与背诵都已完成，无需抄写">
      <span class="seat__name">${esc(s.name)}</span>
      <span class="seat__status">无需抄写</span>
    </div>`;
  }
  if (!info.pending.length) {
    return `<div class="seat is-done seat--static" title="需要抄写的项目都已标记完成">
      <span class="seat__name">${esc(s.name)}</span>
      <span class="seat__status">已抄完 ${info.copied}/${info.need}</span>
    </div>`;
  }
  const flags = info.pending.map((it) => `<i data-tone="${it.sc.tone}">${esc(it.sc.short)}</i>`).join('');
  return `<button class="seat seat--stat-todo" data-action="stat-student" data-sid="${s.id}"

/* 某位学生的全部待办（过关 + 抄写），覆盖全部任务与全部轮次 */
function openStatStudent(sid) {
  const snap = statSnapshot();
  const info = snap.bySid.get(sid);
  const st = (info && info.s) || state.students.find((x) => x.id === sid);
  if (!st) return;
  const pass = info ? info.pass : [];
  const pending = info ? info.pending : [];
  if (!pass.length && !pending.length) {
    toast(`${st.name} 没有待完成项目`, 'ok');
    return;
  }
  const rows = pass.map((it) => Object.assign({ kind: 'pass' }, it))
    .concat(pending.map((it) => Object.assign({ kind: 'copy' }, it)));

  /* 跳转按钮去重：同一个任务（或同一轮抄写）只给一个入口 */
  const jumps = [];
  const seenJump = new Set();
  rows.forEach((it) => {
    const mod = it.kind === 'pass' ? it.sc.mod : it.sc.copyMod;
    const key = `${mod}:${it.task.id}`;
    if (seenJump.has(key)) return;
    seenJump.add(key);
    jumps.push({ mod, id: it.task.id, label: it.kind === 'pass' ? `去${it.sc.short}过关` : `去${it.sc.label}` });
  });

  openModal(`
    <h2>${esc(st.name)} <span class="stat-detail__seat">第 ${st.row} 排 · 第 ${st.group} 组</span></h2>
    <p class="modal__desc">
      共 <b>${rows.length}</b> 项待完成（待过关 ${pass.length} 项 · 待抄写 ${pending.length} 项），
      来自<b>全部已发布任务与全部抄写轮次</b>；标记完成后这里和统计页会立刻更新。
    </p>
    <ul class="stat-detail">
      ${rows.map((it, i) => `
        <li class="stat-detail__row">
          <span class="stat-tag" data-tone="${it.sc.tone}">${it.kind === 'pass' ? `${esc(it.sc.short)}过关` : `${esc(it.sc.short)}抄写`}</span>
          <span class="stat-detail__body">
            ${lvCrumbsHTML(it.task, 'lv-crumbs--detail')}
            <span class="stat-detail__meta">${esc(it.task.date)} 发布${it.kind === 'copy' ? ` · ${esc(it.round ? it.round.label : '抄写')}` : ''}
              · ${it.kind === 'copy' ? '还没抄写' : '还没过关'}</span>
          </span>
          <span class="stat-detail__no">${i + 1}</span>
        </li>`).join('')}
    </ul>
    <div class="modal__actions">
      ${can.entry ? jumps.map((j) => `<button class="btn btn--outline btn--sm" data-action="stat-go"
          data-mod="${j.mod}" data-id="${esc(j.id)}">${esc(j.label)}</button>`).join('') : ''}
      <button class="btn btn--primary" data-action="close-modal">知道了</button>
    </div>`, { width: '620px' });
}

/* 从明细直接跳到对应抄写页，并切到那条任务 */
function goCopyTask(mod, taskId) {

/* ---------------- 8b-2. 个人查询：某位同学的每日常规全部待完成项目 ---------------- */
/* 覆盖范围 = 全部已发布任务的「未过关」+ 全部抄写轮次里「未完成」的项，
   与「每日统计」页同一套口径（records / copyRounds），随机表扬按待完成数量分档。 */
const PQUERY_PRAISE = {
  zero: [
    '全部过关、零待办！这份踏实就是最好的学习方法，继续保持！',
    '所有项目已完成清零，自律又高效，给你点一个大大的赞！',
    '不欠账的感觉真好！全清状态的你，是全班同学的好榜样！'
  ],
  one: [
    '只剩最后 1 项啦！趁热打铁，今天就去把它解决掉！',
    '胜利就在眼前——完成这最后一项，你就是「全清达人」！',
    '只差一步就轻松了，找老师把这项过掉，海阔天空！'
  ],
  few: [
    '只剩 {n} 项了，利用课间各个击破，马上就能轻松！',
    '待办不多了，{n} 项按顺序一个个来，这周清零完全没问题！',
    '{n} 项小目标，每完成一项都是在前进，冲呀！'
  ],
  many: [
    '待完成的有 {n} 项？别慌，先从最有把握的开始，每清一项都是进步！',
    '项目有点多，但办法总比困难多：每天清掉一两项，很快就能追上来，加油！',
    '把 {n} 项拆成每天的小任务，日拱一卒，功不唐捐，老师和你一起加油！'
  ]
};

function pqueryPopulation() {
  const pop = [];
  const seen = new Set();
  const push = (s) => {
    if (s && s.id && s.name && s.name.trim() && !seen.has(s.id)) { seen.add(s.id); pop.push(s); }
  };
  state.students.forEach(push);
  ['dTasks', 'rTasks'].forEach((store) => {
    taskListOf(store).forEach((t) => taskStudents(t).forEach(push));
  });
  return pop;
}

function pqueryItems(sid) {
  const items = [];
  SYS_LIST.forEach((key) => {
    const cfg = SYS_CFG[key];
    sysTasksAll(cfg).forEach((t) => {
      if (!taskStudents(t).some((s) => s.id === sid)) return;
      const title = taskPathText(t);
      if (!(t.records && t.records[sid])) {
        items.push({ tone: cfg.tone, tag: cfg.kind, title, detail: '还没有过关，待完成' });
      }
      sysRounds(t).forEach((r) => {
        if (r.sids.indexOf(sid) < 0) return;
        if (r.done && r.done[sid]) return;
        items.push({ tone: cfg.tone, tag: cfg.kind, title, detail: `${r.label} · 待完成` });
      });
    });
  });
  return items;
}

function pqueryPraise(n) {
  let pool;
  if (n === 0) pool = PQUERY_PRAISE.zero;
  else if (n === 1) pool = PQUERY_PRAISE.one;
  else if (n <= 3) pool = PQUERY_PRAISE.few;
  else pool = PQUERY_PRAISE.many;
  return pool[Math.floor(Math.random() * pool.length)].replace('{n}', String(n));
}

function openPquery() {
  const uniq = Array.from(new Set(pqueryPopulation().map((s) => s.name.trim())))
    .sort((a, b) => a.localeCompare(b, 'zh'));
  openModal(`
    <h2>🔍 个人待办查询</h2>
    <p class="modal__desc">当前班级：<b>${esc(currentClassName())}</b> · 输入姓名，查看这位同学「每日常规」的全部待完成项目：听写 / 背诵未过关 + 未完成的抄写。</p>
    <form data-form="pquery-search">
      <label class="field"><span>学员姓名</span>
        <input type="text" name="kw" list="pquery-names" placeholder="请输入姓名，如：张三" autocomplete="off" required />
        <datalist id="pquery-names">${uniq.map((n) => `<option value="${esc(n)}"></option>`).join('')}</datalist>
      </label>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" data-action="close-modal">关闭</button>
        <button type="submit" class="btn btn--primary">查询</button>
      </div>
    </form>
    <div id="pqueryResult"></div>
  `, { width: '580px' });
}

function pqueryCardHTML(s) {
  const items = pqueryItems(s.id);
  const n = items.length;
  const listHTML = n ? `<ul class="stat-detail">${items.map((it, i) => `
    <li class="stat-detail__row">
      <span class="stat-tag" data-tone="${it.tone}">${esc(it.tag)}</span>
      <span class="stat-detail__body">
        <b>${esc(it.title)}</b>
        <span class="stat-detail__meta">${esc(it.detail)}</span>
      </span>
      <span class="stat-detail__no">${i + 1}</span>
    </li>`).join('')}</ul>`
    : '<p class="card__hint">没有任何待完成项目，全部过关、全部抄完！</p>';
  const notice = n ? `<div class="banner">📌 提示：以上待完成项目，老师会<b>再次统一过关检查</b>，请提前做好准备；也可以利用课间、自习课主动找老师完成过关。</div>` : '';
  return `<div class="pquery-card">

      <span class="pquery-card__count" ${n ? '' : 'data-zero="1"'}>${n ? `待完成 ${n} 项` : '零待办'}</span>
    </div>
    <p class="pquery-card__praise">💬 ${esc(pqueryPraise(n))}</p>
    ${listHTML}
    ${notice}
  </div>`;
}

function pqueryRun(kw) {
  const box = $('#pqueryResult');
  if (!box) return;
  const q = String(kw || '').replace(/\s+/g, '').trim();
  if (!q) { box.innerHTML = ''; return; }
  const pop = pqueryPopulation();
  const exact = pop.filter((s) => s.name.trim() === q);
  const like = pop.filter((s) => s.name.trim().indexOf(q) >= 0 && s.name.trim() !== q);
  if (!exact.length && like.length) {
    box.innerHTML = `<p class="card__hint">没有完全同名的同学，找到 ${like.length} 位姓名相近的，请点击选择：</p>
      <div class="btn-row">${like.map((s) => `<button class="btn btn--outline btn--sm" data-action="pquery-pick" data-sid="${esc(s.id)}">${esc(s.name)}</button>`).join('')}</div>`;
    return;
  }
  if (!exact.length) {
    box.innerHTML = `<div class="banner">没有找到姓名包含「${esc(q)}」的同学，请确认姓名后重试。</div>`;
    return;
  }
  box.innerHTML = exact.map((s) => pqueryCardHTML(s)).join('');
}

function pqueryPick(sid) {
  const st = pqueryPopulation().find((s) => s.id === sid);
  const box = $('#pqueryResult');
  if (st && box) box.innerHTML = pqueryCardHTML(st);
}


/* ---------------- 8c. 录入学员（座次表库：多份备用 · 命名 · 编辑 · 删除） ---------------- */
/* v4.1：这里管理的是「座次表库」（state.charts）。逐格编辑只写入当前所选的座次表，
   不会自动改动英语常规里的任何页面；发布听写 / 背诵任务时再手动选取一份并固化成任务快照。
   作业 / 早读等旧页仍读「当前名单」（state.students），需要时用「设为当前名单」手动同步。 */
let enrollChartId = '';
let enrollImportNames = [];   // 导入名单弹窗最近一次解析出的姓名

/* ---- 撤销 / 保存（v3.9）----
   每份座次表各有一条撤销栈，只存「改动前的快照」（students + layout）。
   同一格连续打字 4 秒内合并成一步，撤销时不会一个字一个字往回退。
   最大 40 步；撤销后可继续撤销，直到栈空。 */
const ENROLL_UNDO_MAX = 40;
const enrollUndoStacks = new Map();
let enrollSavedAt = 0;
let enrollPending = false;
let enrollSaveTimer = null;

function enrollHistory(chartId) {
  if (!enrollUndoStacks.has(chartId)) enrollUndoStacks.set(chartId, []);
  return enrollUndoStacks.get(chartId);
}

function enrollUndoDepth() {
  const cur = enrollChart();
  return cur ? enrollHistory(cur.id).length : 0;
}

/* 改动之前先拍快照。key 相同且间隔 < 4 秒的连续改动合并成同一步 */
function enrollSnapshot(label, key) {
  const chart = enrollChart();
  if (!chart) return;
  const stack = enrollHistory(chart.id);
  const now = Date.now();
  const top = stack[stack.length - 1];
  if (top && key && top.key === key && now - top.at < 4000) { top.at = now; return; }
  stack.push({
    label,
    key: key || '',
    at: now,
    students: JSON.parse(JSON.stringify(chart.students || [])),
    layout: JSON.parse(JSON.stringify(chart.layout || {}))
  });
  if (stack.length > ENROLL_UNDO_MAX) stack.shift();
  updateEnrollTools();
}

/* 「保存中…」→ 700ms 后显示保存时间：saveState 已把改动提交给服务端 */
function enrollMarkPending() {
  enrollPending = true;
  renderEnrollSaveState();
  clearTimeout(enrollSaveTimer);
  enrollSaveTimer = setTimeout(() => {
    enrollPending = false;
    enrollSavedAt = Date.now();
    renderEnrollSaveState();
  }, 700);
}

function renderEnrollSaveState() {
  const el = $('#enrollSaveState');
  if (!el) return;
  if (enrollPending) {
    el.dataset.state = 'pending';
    el.textContent = '● 保存中…';
    return;
  }
  el.dataset.state = 'saved';
  if (!enrollSavedAt) { el.textContent = '✓ 已同步'; return; }
  const d = new Date(enrollSavedAt);
  const local = link.mode !== 'server';
  el.textContent = `✓ ${local ? '已存本机' : '已保存'} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}

/* 撤销按钮的可用状态与步数 */
function updateEnrollTools() {
  const btn = $('#enrollUndo');
  if (!btn) return;
  const n = enrollUndoDepth();
  btn.disabled = n === 0;
  btn.innerHTML = n ? `↶ 撤销 <i>${n}</i>` : '↶ 撤销';
  btn.title = n ? `撤销上一步（还有 ${n} 步可撤）` : '还没有可撤销的操作';
}

/* 撤销上一步：把快照写回当前座次表，并立即保存 */
function enrollUndo() {
  if (!can.admin) { toast('只有管理员可以修改座次表', 'warn'); return; }
  const chart = enrollChart();
  if (!chart) return;
  const stack = enrollHistory(chart.id);
  if (!stack.length) { toast('没有可撤销的操作了', 'warn'); return; }
  const step = stack.pop();
  chart.students = JSON.parse(JSON.stringify(step.students));
  chart.layout = JSON.parse(JSON.stringify(step.layout));
  chart.updatedAt = new Date().toISOString();
  saveState();
  clearTimeout(enrollSaveTimer);
  enrollPending = false;
  enrollSavedAt = Date.now();
  renderView();
  toast(`已撤销「${step.label}」`, 'ok', 2600);
}

/* 保存：把正在输入的格子先落库，然后立即提交并给出明确反馈 */
function enrollSaveNow() {
  const chart = enrollChart();
  if (!chart) { toast('请先新建一份座次表', 'warn'); return; }
  const el = document.activeElement;
  if (el && el.dataset && el.dataset.enroll !== undefined) applyEnrollInput(el);
  chart.updatedAt = new Date().toISOString();
  saveState();
  clearTimeout(enrollSaveTimer);
  enrollPending = false;
  enrollSavedAt = Date.now();
  renderEnrollSaveState();
  updateEnrollTools();
  const local = link.mode !== 'server';
  toast(`已保存「${chart.name}」· ${chart.students.length} 人${local ? '（本机，联网后自动同步）' : ''}`, local ? 'warn' : 'ok', 2800);
}

function enrollChart() {
  const charts = Array.isArray(state.charts) ? state.charts : [];
  /* 没有本机选中记录时默认打开「主座次表」（与班级同名的那份）——
     它同时是班级人数的统计口径，保证学员录入里看到的名单和班级按钮上的人数永远同源 */
  return charts.find((c) => c.id === enrollChartId)
    || primaryChart({ name: currentClassName(), charts })
    || charts[0]
    || null;
}

function enrollNameAt(r, g) {
  const chart = enrollChart();
  const list = chart ? chart.students : [];
  const s = list.find((x) => x.row === r && x.group === g);
  return s ? s.name : '';
}

function enrollSetName(r, g, raw) {
  const chart = enrollChart();
  if (!chart) return;
  const v = String(raw == null ? '' : raw).replace(/\s+/g, ' ').trim().slice(0, 12);
  const found = chart.students.find((s) => s.row === r && s.group === g);
  if (v === (found ? found.name : '')) return;      /* 没改动：不记历史、不重复提交 */
  enrollSnapshot(`第 ${r} 排第 ${g} 组`, `cell:${r}-${g}`);
  if (found) {
    if (v) found.name = v;
    else chart.students = chart.students.filter((s) => s !== found);
  } else if (v) {
    chart.students.push({ id: uid('s'), name: v, group: g, row: r });
  }
  /* 填到网格外沿时自动扩大这份座次表的范围（列 = 组数，行 = 排数）。只扩不缩。 */
  if (v) {
    const L = chart.layout || (chart.layout = {});
    if (g > (Number(L.groups) || 0)) L.groups = Math.min(ENROLL_SIZE, g);
    if (r > (Number(L.rows) || 0)) L.rows = Math.min(ENROLL_SIZE, r);
  }
  chart.updatedAt = new Date().toISOString();
  saveState(true);
  enrollMarkPending();
}

function enrollMeta() {
  const chart = enrollChart();
  const list = chart ? chart.students : [];
  const layout = (chart && chart.layout) || {};
  const podium = layout.podium;
  const podiumCell = podium && podium.row <= ENROLL_SIZE && podium.group <= ENROLL_SIZE;
  const cells = ENROLL_SIZE * ENROLL_SIZE - (podiumCell ? 1 : 0);
  let maxRow = 1;
  let maxG = 1;
  list.forEach((s) => {
    maxRow = Math.max(maxRow, Number(s.row) || 1);
    maxG = Math.max(maxG, Number(s.group) || 1);
  });
  return { count: list.length, cells, blank: Math.max(0, cells - list.length), maxRow, maxG };
}

/* ---- 180° 翻转：整张座次表以中心为轴旋转 180°（行、列同时反向）
   姓名不跟着倒过来写：旋转只改变「谁坐在哪个格」，文字仍按正向排版，
   所以翻完每个名字依然正着读。讲台与过道位置一起旋转。 ---- */
function enrollChartRotate180() {
  if (!can.admin) return;
  const cur = enrollChart();
  if (!cur) return;
  const list = Array.isArray(cur.students) ? cur.students : [];
  if (!list.length) { toast('这份座次表还没有姓名，无需翻转', 'warn'); return; }
  const L = cur.layout || (cur.layout = {});
  let maxRow = Number(L.rows) || 1;
  let maxG = Number(L.groups) || 1;
  list.forEach((s) => {
    maxRow = Math.max(maxRow, Number(s.row) || 1);
    maxG = Math.max(maxG, Number(s.group) || 1);
  });
  maxRow = Math.min(ENROLL_SIZE, maxRow);
  maxG = Math.min(ENROLL_SIZE, maxG);

  openConfirm({
    title: `把「${cur.name}」旋转 180°？`,
    message: `整张表以中心为轴旋转 180°：第 1 排 ↔ 第 ${maxRow} 排、第 1 组 ↔ 第 ${maxG} 组，
      讲台与过道位置同步旋转。姓名只换座位、不跟着倒写，旋转后仍然正向可读。`,
    confirmText: '旋转 180°',
    onConfirm: () => {
      enrollSnapshot('180° 旋转', 'rot180');
      cur.students = list.map((s) => Object.assign({}, s, {
        row: maxRow + 1 - Math.min(maxRow, Math.max(1, Number(s.row) || 1)),
        group: maxG + 1 - Math.min(maxG, Math.max(1, Number(s.group) || 1))
      }));
      /* 讲台：在表内就跟着镜像；画在表外的（行列超出已用范围）保持原位 */
      if (L.podium && Number(L.podium.row) >= 1 && Number(L.podium.group) >= 1) {
        const pr = Number(L.podium.row);
        const pg = Number(L.podium.group);
        L.podium = {
          row: pr <= maxRow ? maxRow + 1 - pr : pr,
          group: pg <= maxG ? maxG + 1 - pg : pg
        };
      }
      /* 过道：第 k 组之后的过道，旋转后落在第 (G-k) 组之后 */
      const aisles = (Array.isArray(L.aisleAfter) ? L.aisleAfter : [])
        .map((k) => maxG - Number(k))
        .filter((k) => k >= 1 && k < maxG);
      L.aisleAfter = Array.from(new Set(aisles)).sort((a, b) => a - b);
      L.rows = Math.max(Number(L.rows) || 0, maxRow);
      L.groups = Math.max(Number(L.groups) || 0, maxG);
      cur.updatedAt = new Date().toISOString();
      saveState();
      enrollMarkPending();
      closeModal();
      renderView();
      toast('已把这份座次表旋转 180°（可点「撤销」还原）', 'ok', 3000);
    }
  });
}

/* ---- 上下翻转：第 1 排 ↔ 最后一排整体对调，左右（组）不变
   讲台的行一起翻，过道位置（按组计算）不动；姓名不跟着倒写，仍然正向可读。
   与 180° 旋转的区别：只翻上下，不换左右。 ---- */

  if (!can.admin) return;
  const cur = enrollChart();
  if (!cur) return;
  const list = Array.isArray(cur.students) ? cur.students : [];
  if (!list.length) { toast('这份座次表还没有姓名，无需翻转', 'warn'); return; }
  const L = cur.layout || (cur.layout = {});
  let maxRow = Math.max(1, Number(L.rows) || 1);
  list.forEach((s) => { maxRow = Math.max(maxRow, Number(s.row) || 1); });
  maxRow = Math.min(ENROLL_SIZE, maxRow);
  if (maxRow < 2) { toast('这份座次表只有一排，不需要上下翻转', 'warn'); return; }

  openConfirm({
    title: `把「${cur.name}」上下翻转？`,
    message: `第 1 排与第 ${maxRow} 排整体对调，左右（组）保持不变；讲台位置一起上下翻，
      姓名只换座位、不跟着倒写，翻转后仍然正向可读。翻错了可以点「撤销」还原。`,
    confirmText: '上下翻转',
    onConfirm: () => {
      enrollSnapshot('上下翻转', 'flip-v');
      cur.students = list.map((s) => Object.assign({}, s, {
        row: maxRow + 1 - Math.min(maxRow, Math.max(1, Number(s.row) || 1))
      }));
      /* 讲台：只翻行；列不动 */
      if (L.podium && Number(L.podium.row) >= 1 && Number(L.podium.row) <= maxRow) {
        L.podium = { row: maxRow + 1 - Number(L.podium.row), group: Number(L.podium.group) || L.podium.group };
      }
      L.rows = Math.max(Number(L.rows) || 0, maxRow);
      cur.updatedAt = new Date().toISOString();
      saveState();
      enrollMarkPending();
      closeModal();
      renderView();
      toast('已上下翻转（可点「撤销」还原）', 'ok', 3000);
    }
  });
}

/* ---- 名单导入：Excel / Word / 文本走服务端解析，图片走浏览器 OCR ---- */
function splitNamesClient(text) {
  return String(text || '')
    .replace(/[\u200B-\u200D\uFEFF]/g, ' ')
    .split(/[\s,，、;；/|]+/)
    .map((s) => s.trim().slice(0, 12))
    .filter(Boolean);
}

/* 智能读文本：UTF-8 出现乱码时按 GBK 再解一次（Excel 导出的 csv 常是 GBK） */
async function readTextSmart(file) {
  const buf = await file.arrayBuffer();
  const utf8 = new TextDecoder('utf-8').decode(buf);
  if (utf8.indexOf('\uFFFD') === -1) return utf8;
  try { return new TextDecoder('gbk').decode(buf); } catch (err) { return utf8; }
}

/* OCR 文本 → 姓名粗切：中文字符以外的当分隔符；超过 4 字的连续段按 3 字一个姓名切开（可在预览里改） */
function ocrLineNames(line) {
  const cleaned = String(line || '')
    .replace(/[\s\u3000]+/g, '')
    .replace(/[^\u4e00-\u9fa5A-Za-z·]/g, ' ')
    .trim();
  if (!cleaned) return [];
  const out = [];
  cleaned.split(/\s+/).forEach((chunk) => {
    if (!chunk) return;
    if (chunk.length <= 4) { out.push(chunk); return; }
    for (let i = 0; i < chunk.length; i += 3) {
      const piece = chunk.slice(i, i + 3);
      if (piece.length >= 2) out.push(piece);
    }
  });
  return out;
}

function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('OCR 组件加载失败（扫描图片识别需要联网）'));
    document.head.appendChild(s);
  });
}

function setImportStatus(text, busy) {
  const el = $('#importStatus');
  if (el) el.textContent = text;
  const btn = $('#importApplyBtn');
  if (btn) btn.disabled = !!busy;
}

async function ocrImportFile(file) {
  setImportStatus('正在加载 OCR 组件（首次使用需联网）…', true);
  await loadTesseract();
  setImportStatus('正在识别图片文字，请稍候…', true);
  const res = await window.Tesseract.recognize(file, 'chi_sim+eng');
  const text = String((res && res.data && res.data.text) || '');
  const names = [];
  text.split(/\r?\n/).forEach((line) => names.push(...ocrLineNames(line)));
  if (!names.length) throw new Error('图片里没有识别到文字，请换更清晰的照片再试');
  enrollImportNames = names;
  const ta = $('#importPreview');
  if (ta) ta.value = names.join('\n');
  setImportStatus(`已识别出 ${names.length} 个姓名，请在预览里核对修改后点「导入」`, false);
}

async function handleImportFile(fileInput) {
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;
  const name = String(file.name || '').toLowerCase();
  try {
    if (/\.(png|jpe?g|webp)$/.test(name)) {
      await ocrImportFile(file);
      return;
    }
    if (/\.(txt|csv)$/.test(name)) {
      /* 纯文本在浏览器本地就能解，不依赖服务端 */
      setImportStatus('正在解析文本…', true);
      const text = await readTextSmart(file);
      const names = [];
      text.split(/\r?\n/).forEach((line) => { if (line.trim()) names.push(...splitNamesClient(line)); });
      if (!names.length) throw new Error('文件里没有读到姓名');
      enrollImportNames = names;
      const ta = $('#importPreview');
      if (ta) ta.value = names.join('\n');
      setImportStatus(`已解析出 ${names.length} 个姓名，可修改后点「导入」`, false);
      return;
    }
    if (/\.(xlsx|docx)$/.test(name)) {
      setImportStatus('正在上传解析…', true);
      const r = await fetch('/api/parse-names', {
        method: 'POST',
        headers: { 'x-filename': encodeURIComponent(file.name), 'x-token': link.token || '' },
        body: file
      });
      const data = await r.json().catch(() => null);
      if (!data || !data.ok) throw new Error((data && data.msg) || '解析失败');
      enrollImportNames = data.names || [];
      const ta = $('#importPreview');
      if (ta) ta.value = enrollImportNames.join('\n');
      setImportStatus(`已解析出 ${enrollImportNames.length} 个姓名，可修改后点「导入」`, false);
      return;
    }
    throw new Error('暂不支持该格式：请用 xlsx / docx / txt / csv，或扫描图片');
  } catch (err) {
    const msg = (err && err.message) || '解析失败';
    setImportStatus(msg, false);
    toast(msg, 'err', 4200);
  }
}

function applyEnrollImport() {

  const colsEl = $('#importCols');
  const modeEl = $('#importMode');
  const cols = Math.max(1, Math.min(ENROLL_SIZE, Number(colsEl && colsEl.value) || 9));
  const mode = modeEl ? String(modeEl.value) : 'cover';
  const names = [];
  String(ta ? ta.value : '').split(/\r?\n/).forEach((line) => {
    if (line.trim()) names.push(...splitNamesClient(line));
  });
  if (!names.length) { toast('没有可导入的姓名，请先解析文件或直接粘贴', 'warn'); return; }

  enrollSnapshot('导入名单', 'import');
  const base = mode === 'append' ? cur.students.length : 0;
  if (mode !== 'append') cur.students = [];
  const L = cur.layout || (cur.layout = {});
  let filled = 0;
  names.forEach((name, i) => {
    const pos = base + i;
    const r = Math.floor(pos / cols) + 1;
    const g = (pos % cols) + 1;
    if (r > ENROLL_SIZE) return;
    const found = cur.students.find((s) => s.row === r && s.group === g);
    if (found) found.name = name;
    else cur.students.push({ id: uid('s'), name, group: g, row: r });
    filled += 1;
  });
  L.groups = Math.min(ENROLL_SIZE, Math.max(Number(L.groups) || 0, cols));
  L.rows = Math.min(ENROLL_SIZE, Math.max(Number(L.rows) || 0, Math.ceil((base + filled) / cols)));
  cur.updatedAt = new Date().toISOString();
  saveState();
  enrollMarkPending();
  closeModal();
  renderView();
  toast(`已导入 ${filled} 个姓名到「${cur.name}」（可用「撤销」还原）`, 'ok', 3200);
}

/* 只刷新数字，不重画输入框：录入过程中会被调用很多次 */
function syncEnrollMeta() {
  const meta = enrollMeta();

  put('#enrollCount', String(meta.count));
  put('#enrollBlank', String(meta.blank));
  put('#enrollSpan', `${meta.maxRow} 排 · ${meta.maxG} 组`);
  updateEnrollTools();
  const cur = enrollChart();
  if (cur) $$('[data-chart-num]').forEach((el) => {
    const c = (state.charts || []).find((x) => x.id === el.dataset.chartNum);
    if (c) el.textContent = `${c.students.length} 人`;
  });
}

/* 正在某个格子里打字：此时收到别人的更新只同步其他格子，避免输入框失焦、光标跳走 */
function isEnrollEditing() {
  if ((location.hash || '').indexOf('#/module/enroll') !== 0) return false;
  const el = document.activeElement;
  return !!(el && el.matches && el.matches('input[data-enroll]'));
}

function patchEnrollCells() {
  $$('input[data-enroll]').forEach((el) => {
    if (el === document.activeElement) return;
    const [r, g] = String(el.dataset.enroll).split('-').map(Number);
    const v = enrollNameAt(r, g);
    if (el.value !== v) el.value = v;
    el.classList.toggle('is-filled', !!v);
    const cell = el.closest('.enroll-cell');
    if (cell) cell.classList.toggle('is-filled', !!v);
  });
  syncEnrollMeta();
}

function applyEnrollInput(el) {
  const [r, g] = String(el.dataset.enroll).split('-').map(Number);
  enrollSetName(r, g, el.value);
  const filled = !!String(el.value).trim();
  el.classList.toggle('is-filled', filled);
  const cell = el.closest('.enroll-cell');
  if (cell) cell.classList.toggle('is-filled', filled);
  syncEnrollMeta();
}

/* 中文输入法：组合期间先记着，组合结束再一次性写入（否则会把拼音当成姓名） */
document.addEventListener('compositionstart', (e) => {
  const t = e.target;
  if (t && t.dataset && t.dataset.enroll !== undefined) t.dataset.composing = '1';
});
document.addEventListener('compositionend', (e) => {
  const t = e.target;
  if (!t || !t.dataset || t.dataset.enroll === undefined) return;
  t.dataset.composing = '';
  applyEnrollInput(t);
});

/* Enter / Shift+Enter：在同一组内上下跳格，连续录入一列时不用动鼠标 */
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (!t || !t.dataset || t.dataset.enroll === undefined) return;
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const [r, g] = String(t.dataset.enroll).split('-').map(Number);
  const next = document.querySelector(`input[data-enroll="${e.shiftKey ? r - 1 : r + 1}-${g}"]`);
  if (next) { next.focus(); next.select(); }
});

function route() {
  /* 每次切换页面先停掉早读页的实时时钟，渲染完由对应页面重新启动 */
  clearInterval(readClockTimer);
  const hash = location.hash || '#/home';

  if (hash === '#/screen') {
    document.body.classList.add('is-screen');
    document.body.classList.remove('is-reading');
    renderScreen();
    return;
  }
  stopScreen();
  document.body.classList.remove('is-screen');

  const m = hash.match(/^#\/module\/(dictation|homework|dcopy|recite|rcopy|dstat|reading|extend|quiz|enroll|wlib|hwcheck|discipline|regstat)/);
  /* 早读页按网络实时日期展示，隐藏顶栏的「录入日期」切换，避免两个日期混淆 */
  document.body.classList.toggle('is-reading', !!(m && m[1] === 'reading'));
  document.body.classList.toggle('is-quiz', !!(m && m[1] === 'quiz'));
  document.body.classList.toggle('is-stat', !!(m && m[1] === 'dstat'));
  document.body.classList.toggle('is-enroll', !!(m && m[1] === 'enroll'));
  document.body.classList.toggle('is-reg', !!(m && (m[1] === 'hwcheck' || m[1] === 'discipline' || m[1] === 'regstat')));
  if (m) {
    if (m[1] === 'reading') renderReading();
    else if (m[1] === 'extend') renderExtend();
    else if (m[1] === 'wlib') renderWlib();
    else if (m[1] === 'quiz') renderQuizPage();
    else if (m[1] === 'dstat') renderDailyStats();
    else if (m[1] === 'enroll') renderEnroll();
    else if (m[1] === 'hwcheck') renderReg('hwcheck');
    else if (m[1] === 'discipline') renderReg('discipline');
    else if (m[1] === 'regstat') renderRegStat();
    else {
      currentModule = m[1];
      renderModule();
    }
  } else {
    renderHome();
  }
  const view = $('#view');
  if (view) view.scrollTop = 0;
  syncSeatBig();
}

function renderView() {
  /* 录入学员页：某个格子正在输入时只同步其他格子，不整页重画（否则会打断输入） */
  if (isEnrollEditing()) { patchEnrollCells(); return; }
  route();
  applyTheme();
  applyRoleAttrs();
}

/* ---------------- 10. 录入交互 ---------------- */
function pushLog(entry) {
  state.log.push(entry);
  if (state.log.length > 400) state.log = state.log.slice(-400);
}

function toggleSeat(sid, opts = {}) {
  if (!can.entry) {
    toast('请先用「管理员登录」进入录入状态', 'warn');
    openLogin('main');
    return;
  }
  let rec;
  let date = viewDate;
  const extra = {};
  const task = currentTask();

  if (isTaskMod(currentModule)) {
    if (!task) { toast(`请先由管理员发布${esc(TASK_KIND_NAME[currentModule])}任务`, 'warn'); return; }
    extra.taskId = task.id;
    date = task.date;
    if (isCopyMod(currentModule)) {
      if (task.records[sid]) {
        toast(`该同学${esc(TASK_KIND_NAME[currentModule])}已完成，无需罚抄`, 'warn');
        return;
      }
      rec = copyDoneOf(task);   // 兜底：任务型模块的座位点击已由 sysSeatClick 接管
    } else {
      rec = task.records;
    }
  } else {
    rec = recFor(viewDate, 'homework');
  }

  const from = !!rec[sid];
  const to = !from;
  if (to) rec[sid] = true;
  else delete rec[sid];

  if (!opts.silentLog) {
    pushLog(Object.assign({ t: Date.now(), date, module: currentModule, sid, from, to, by: actorName() }, extra));
  }
  saveState(true);
  updateSeat(sid);
  updateModuleStats();
  updateUndoUI();
}

function updateSeat(sid) {
  const btn = $(`.seat[data-sid="${sid}"]`);
  if (!btn) return;
  const done = !!recForModule(currentModule)[sid];
  btn.classList.toggle('is-done', done);
  btn.setAttribute('aria-pressed', done ? 'true' : 'false');
  const st = btn.querySelector('.seat__status');
  if (st) {
    st.textContent = isCopyMod(currentModule)
      ? (done ? '罚抄完成' : '待罚抄')
      : (done ? state.theme.doneLabel : state.theme.undoneLabel);
  }
}

function updateModuleStats() {
  const st = moduleStats(currentModule);
  const a = $('#statDone');
  const b = $('#statUndone');
  const c = $('#statRate');
  if (a) a.textContent = st.done;
  if (b) b.textContent = st.undone;
  if (c) c.textContent = `${st.rate}%`;
}

function updateUndoUI() {
  const badge = $('#undoCount');
  if (badge) badge.textContent = String(undoList().length);
  const la = $('#lastAction');
  if (la) la.textContent = lastActionText();
}

function undo() {
  const list = undoList();
  const last = list[list.length - 1];
  if (!last) {
    toast('当前模块 / 任务没有可撤销的操作');
    return;
  }
  if (!can.entry) {
    toast('需要登录后才能撤销', 'warn');
    return;
  }
  let rec;
  if (isTaskMod(last.module)) {
    const task = taskListOf(TASK_STORE[last.module]).find((t) => t.id === last.taskId);
    if (!task) { toast('任务已不存在，无法撤销'); return; }
    rec = isCopyMod(last.module) ? copyDoneOf(task) : task.records;
  } else {
    rec = recFor(viewDate, last.module);
  }
  if (last.from) rec[last.sid] = true;
  else delete rec[last.sid];

  state.log = state.log.filter((e) => e !== last);
  saveState(true);
  updateSeat(last.sid);
  updateModuleStats();
  updateUndoUI();

  const st2 = state.students.find((s) => s.id === last.sid);
  const toLabel = isCopyMod(last.module)
    ? (last.from ? '罚抄完成' : '待罚抄')
    : (last.from ? state.theme.doneLabel : state.theme.undoneLabel);
  toast(`已撤销：${st2 ? st2.name : '该学生'} → ${toLabel}`, 'ok');
}

function resetDay() {
  if (!can.admin) return;
  const taskMod = isTaskMod(currentModule);
  const task = taskMod ? currentTask() : null;
  const target = taskMod
    ? (task ? `任务「${esc(task.name)}」` : '当前任务')
    : `${MODULES[currentModule].title} · ${esc(viewDate)}`;
  const tail = isCopyMod(currentModule) ? '恢复为「待罚抄」' : `恢复为「${esc(state.theme.undoneLabel)}」`;
  openConfirm({
    title: taskMod ? '重置当前任务的数据？' : '重置当前日期的数据？',
    message: `将把<b>${target}</b>的全部学生${tail}。<br>此操作不可通过撤销恢复。`,
    confirmText: '确认重置',
    danger: true,
    onConfirm: () => {
      if (taskMod) {
        if (!task) return;
        if (isCopyMod(currentModule)) (task.copyRounds || []).forEach((r) => { r.done = {}; });
        else task.records = {};
        state.log = state.log.filter((e) => !(e.module === currentModule && e.taskId === task.id));
      } else {
        state.records[viewDate] = state.records[viewDate] || {};
        state.records[viewDate][currentModule] = {};
        state.log = state.log.filter((e) => !(e.date === viewDate && e.module === currentModule));
      }
      saveState();
      closeModal();
      renderView();
      toast('已重置', 'ok');
    }
  });
}

/* ---------------- 10b. 任务发布 / 层级编辑（仅管理员，听写 / 背诵通用） ---------------- */
/* 任务按层级组织：必修 › 必修一 › Unit 1。每一层都能单独改名、删除，也能再加一层；
   levels 是事实源，name 由 levels 拼出来，用于下拉框、导出和旧代码兼容。 */
let taskEditId = '';        // '' = 发布新任务；否则是正在改层级的任务 id
let taskDraft = null;       // { levels: [], date: 'YYYY-MM-DD' }

const LV_PLACEHOLDER = ['必修', '必修一', 'Unit 1', '单词表', 'P45'];

function openPublishTask() { openTaskEditor(''); }

function openTaskEditor(taskId) {
  if (!can.admin) {
    toast('只有管理员可以发布或修改任务', 'warn');
    return;
  }
  const store = TASK_STORE[currentModule] || 'dTasks';
  const editing = taskId ? taskListOf(store).find((t) => t.id === taskId) : null;
  const kind = TASK_KIND_NAME[currentModule] || '听写';

  taskEditId = editing ? editing.id : '';
  /* 新建时用「上一条任务的层级」当草稿，通常只需要改最后一层；编辑时原样载入 */
  const seed = editing
    ? taskLevels(editing)
    : (taskLevels(latestTaskOf(store)).length
      ? taskLevels(latestTaskOf(store))
      : (kind === '背诵' ? ['必修', '必修一', 'Unit 1 课文'] : ['必修', '必修一', 'Unit 1 单词']));
  const levels = seed.slice(0, TASK_MAX_LEVELS);

function renderTaskEditor(kind, editing) {
  const lv = taskDraft.levels;

    <p class="modal__desc">

      每一层都能<b>单独改名</b>、<b>删掉</b>，也可以再<b>加一层</b>。
      ${editing ? '<br>改层级<b>不会</b>影响已经录入的完成情况。' : '<br>发布后会生成一份<b>全新座次表</b>（全部未完成）与对应的罚抄座次表。'}

          <span class="lv-row__no">${i + 1}</span>

            value="${esc(v)}" placeholder="${esc(LV_PLACEHOLDER[i] || `第 ${i + 1} 层`)}"
            aria-label="第 ${i + 1} 层内容" />
          <button class="lv-row__del" data-action="task-lv-del" data-i="${i}"
            ${lv.length <= 1 ? 'disabled' : ''} title="删除这一层" aria-label="删除第 ${i + 1} 层">✕</button>
        </div>`).join('')}
    </div>

    <div class="lv-tools">
      <button class="btn btn--ghost btn--sm" data-action="task-lv-add"
        ${lv.length >= TASK_MAX_LEVELS ? 'disabled' : ''}>＋ 增加一层</button>
      <span class="field__hint">最多 ${TASK_MAX_LEVELS} 层；空格会自动去掉，空层保存时忽略。</span>
    </div>

    <div class="lv-preview">
      <span class="lv-preview__label">显示效果</span>
      <span class="lv-preview__box" id="lvPreview">${preview}</span>

    <label class="field" style="margin-top:14px">

      <input type="date" data-task-date value="${esc(taskDraft.date)}" />
    </label>

    <div class="modal__actions">
      <button class="btn btn--ghost" data-action="close-modal">取消</button>
      <button class="btn btn--primary" data-action="task-save">${editing ? '保存修改' : '发布任务'}</button>
    </div>`, { width: '560px' });
}

/* 增删层级后重画表单，并把焦点放回合适的位置 */
function rerenderTaskEditor(focusIndex) {
  const kind = TASK_KIND_NAME[currentModule] || '听写';
  renderTaskEditor(kind, !!taskEditId);
  const input = focusIndex == null ? null : $(`.lv-row__input[data-lv="${focusIndex}"]`);
  if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}

function addTaskLevel() {
  if (!taskDraft || taskDraft.levels.length >= TASK_MAX_LEVELS) return;
  taskDraft.levels.push('');
  rerenderTaskEditor(taskDraft.levels.length - 1);
}

function removeTaskLevel(i) {
  if (!taskDraft || taskDraft.levels.length <= 1) {
    toast('至少要保留一层', 'warn');
    return;
  }
  taskDraft.levels.splice(i, 1);
  rerenderTaskEditor(Math.min(i, taskDraft.levels.length - 1));
}

function saveTaskEditor() {
  if (!taskDraft) return;
  const levels = taskDraft.levels
    .map((x) => String(x || '').replace(/\s+/g, ' ').trim())
    .filter(Boolean)
    .slice(0, TASK_MAX_LEVELS);
  if (!levels.length) { toast('请至少填写一层内容', 'warn'); return; }

  const store = TASK_STORE[currentModule] || 'dTasks';
  const kind = mainModOf(currentModule);
  const name = levelsToName(levels);
  const date = taskDraft.date || todayStr();

  if (taskEditId) {
    const t = taskListOf(store).find((x) => x.id === taskEditId);
    if (!t) { toast('任务已不存在，请刷新页面', 'err'); return; }
    t.levels = levels;
    t.name = name;
    t.date = date;
    taskEditId = '';
    taskDraft = null;
    saveState();
    closeModal();
    renderView();
    toast(`任务层级已更新为「${name}」`, 'ok', 3000);
    return;
  }

  const task = newTask(null, actorName(), kind, levels);
  task.date = date;
  if (!Array.isArray(state[store])) state[store] = [];
  state[store].push(task);
  currentTaskId[store] = task.id;
  taskEditId = '';
  taskDraft = null;
  saveState();
  closeModal();
  renderView();
  toast(`已发布任务「${name}」，已生成新座次表`, 'ok', 3200);
}

/* ---------------- 11. 弹层基础 ---------------- */
let promptHandler = null;
let confirmHandler = null;

/* 弹层挂载点：正常情况就是页面里的 #modalRoot。
   一体机上出现过「点了登录没反应」的情况，根因之一是弹层容器缺失 / 被挪走，
   这里做自愈：找不到就建一个并挂到 body 末尾，保证任何环境下弹层都弹得出来。 */
function modalRootEl() {
  let root = document.getElementById('modalRoot');
  if (!root) {
    root = document.createElement('div');
    root.id = 'modalRoot';
    root.className = 'modal-root';
    document.body.appendChild(root);
  } else if (root.parentNode !== document.body) {
    /* 祖先元素上的 transform / filter 会把 position:fixed 变成相对定位，
       弹层就会跑到屏幕外 —— 统一挂回 body 直接子级最稳。 */
    document.body.appendChild(root);
  }
  return root;
}

function openModal(html, opts = {}) {
  const root = modalRootEl();
  root.innerHTML = `<div class="overlay" data-overlay>
      <div class="modal ${opts.cls || ''}" role="dialog" aria-modal="true" style="--w:${opts.width || '520px'}">${html}</div>
    </div>`;
  const overlay = root.querySelector('.overlay');
  if (!overlay) return;
  /* 兜底内联样式：万一外部样式没加载 / 被扩展改写，弹层仍然盖在页面上 */
  overlay.style.position = 'fixed';
  overlay.style.inset = '0';
  overlay.style.zIndex = '9990';
  overlay.style.display = 'grid';
  overlay.style.placeItems = 'center';
  overlay.addEventListener('mousedown', (e) => {
    if (e.target === overlay && opts.dismissible !== false) closeModal();
  });
  /* 触屏一体机：聚焦必须在点击手势内同步完成，晚一步（setTimeout）软键盘不会弹出，
     表现就是「弹是弹出来了，但打不了字」。这里先同步聚焦，再补一次延迟兜底。
     优先落在密码框 / 输入框上：登录弹层里有「组长登录 / 管理员登录」按钮，
     若按 DOM 顺序取第一个可聚焦元素就会落在按钮上，软键盘照样不弹。 */
  const focusable = root.querySelector('input[type="password"]')
    || root.querySelector('input:not([type="hidden"]), textarea, select')
    || root.querySelector('button');
  if (focusable) {
    const doFocus = (el) => {
      if (!el || typeof el.focus !== 'function') return;
      try { el.focus({ preventScroll: true }); } catch (err) { try { el.focus(); } catch (e) { /* ignore */ } }
    };
    doFocus(focusable);
    setTimeout(() => {
      const active = document.activeElement;
      if (active && root.contains(active)) return;   // 用户已经点到别处，不抢焦点
      doFocus(focusable);
    }, 80);
  }
}

function closeModal() {
  const root = document.getElementById('modalRoot');
  if (!root) return;
  const had = root.innerHTML.trim().length > 0;
  root.innerHTML = '';
  document.body.classList.remove('is-zoom');
  promptHandler = null;
  confirmHandler = null;
  if (had) renderView();
}

function openConfirm({ title, message, confirmText = '确定', cancelText = '取消', danger = false, onConfirm }) {
  confirmHandler = onConfirm;
  openModal(`
    <h2>${esc(title)}</h2>
    <p class="modal__desc">${message}</p>
    <div class="modal__actions">
      <button class="btn btn--ghost" data-action="close-modal">${esc(cancelText)}</button>
      <button class="btn ${danger ? 'btn--danger' : 'btn--primary'}" data-action="confirm-ok">${esc(confirmText)}</button>
    </div>`, { width: '480px' });
}

function openPrompt({ title, desc, value, multiline = false, placeholder = '', onSave }) {
  promptHandler = onSave;
  openModal(`
    <h2>${esc(title)}</h2>
    ${desc ? `<p class="modal__desc">${desc}</p>` : ''}
    <form data-form="prompt">
      <label class="field">
        <span>内容</span>
        ${multiline
          ? `<textarea name="value" placeholder="${esc(placeholder)}">${esc(value || '')}</textarea>`
          : `<input type="text" name="value" value="${esc(value || '')}" placeholder="${esc(placeholder)}" />`}
      </label>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" data-action="close-modal">取消</button>
        <button type="submit" class="btn btn--primary">保存</button>
      </div>
    </form>`, { width: multiline ? '600px' : '480px' });
}

function toast(msg, type = '', duration = 2400) {
  const root = $('#toastRoot');
  if (!root) return;
  const el = document.createElement('div');
  el.className = `toast ${type ? `toast--${type}` : ''}`;
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => {
    el.classList.add('is-out');
    setTimeout(() => el.remove(), 300);
  }, duration);
}

/* ---------------- 11b. 页面级错误提示条 ----------------
   一体机上「点了没反应」最难查：没有控制台、报错一闪就没了。
   任何未捕获的脚本错误 / 操作异常都写进这条提示，可一键复制给老师排查。
   只在真出错时出现，平时完全不占版面。 */
let fatalTipText = '';
function copyFatalTip() {
  const text = fatalTipText || '';
  const done = () => toast('已复制错误信息', 'ok', 1600);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (err) { toast('复制失败，请手动截图', 'warn', 2400); }
        ta.remove();
      });
      return;
    }
  } catch (err) { /* 继续走兜底 */ }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (err) { toast('复制失败，请手动截图', 'warn', 2400); }
  ta.remove();
}

function showFatalTip(text, err) {
  try {
    let bar = document.getElementById('fatalTip');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'fatalTip';
      bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;display:flex;gap:10px;'
        + 'align-items:flex-start;padding:10px 14px;border-radius:12px;background:#2A1418;'
        + 'border:1px solid #7A2E3A;color:#FFD5DB;font-size:12.5px;line-height:1.6;'
        + 'box-shadow:0 10px 30px rgba(0,0,0,.35)';
      bar.innerHTML = '<b style="flex:0 0 auto;font-weight:800">页面出错了</b>'
        + '<span id="fatalTipMsg" style="flex:1 1 auto;min-width:0;word-break:break-all"></span>'
        + '<button type="button" data-fatal="copy" style="flex:0 0 auto;padding:2px 10px;border-radius:8px;'
        + 'border:1px solid #7A2E3A;background:#3A1C22;color:#FFD5DB;font-size:12px;cursor:pointer">复制</button>'
        + '<button type="button" data-fatal="close" style="flex:0 0 auto;padding:2px 10px;border-radius:8px;'
        + 'border:1px solid #7A2E3A;background:transparent;color:#FFD5DB;font-size:12px;cursor:pointer">关闭</button>';
      document.body.appendChild(bar);
      bar.addEventListener('click', (e) => {
        const k = e.target && e.target.dataset ? e.target.dataset.fatal : '';
        if (k === 'close') bar.remove();
        else if (k === 'copy') copyFatalTip();
      });
    }
    const where = location.hash || '#/home';
    fatalTipText = `日课 ${APP_BUILD} · ${where}\n${text}`
      + (err && err.stack ? `\n${String(err.stack).split('\n').slice(0, 6).join('\n')}` : '');
    const span = document.getElementById('fatalTipMsg');
    if (span) span.textContent = String(text || '未知错误').split('\n')[0].slice(0, 220);
  } catch (e) { /* 提示条本身出错不能再抛 */ }
}

/* 未捕获的错误也留痕（异步回调、定时器里的错误走不到点击委托的 try/catch） */
window.addEventListener('error', (e) => {
  if (e && e.target && e.target !== window && e.target.tagName) return;   // 忽略图片等资源加载失败
  showFatalTip(`脚本错误：${(e && e.message) || '未知'} · ${(e && e.filename) || ''}:${(e && e.lineno) || 0}`, e && e.error);
});
window.addEventListener('unhandledrejection', (e) => {
  const r = e && e.reason;
  showFatalTip(`未处理的异步错误：${(r && (r.message || r)) || '未知'}`, r);
});

/* 弹层里切换「组长 / 管理员」 */
function switchAuthMode(mode) {
  const form = document.querySelector('form[data-form="reg-login"]');
  if (!form) return;
  const m = mode === 'main' ? 'main' : 'leader';
  form.dataset.mode = m;
  const pick = document.querySelector('[data-authpick]');
  if (pick) {
    pick.querySelectorAll('button').forEach((b) => {
      b.classList.toggle('is-on', b.dataset.mode === m);

  const label = form.querySelector('[data-auth-label]');
  if (label) label.textContent = m === 'main' ? '管理员密码' : '组长密码';
  const hint = form.querySelector('[data-auth-hint]');
  if (hint) {
    hint.textContent = m === 'main'
      ? '管理员密码：初始 8888，可在「控制台 → 基础信息」修改。'
      : (leaderPassReady()
        ? ''
        : `本班（${currentClassName()}）还没有组长密码：请管理员先到「录入学员」页设置。`);
  }
  const input = form.querySelector('[name="pwd"]');
  if (input) { input.value = ''; input.focus(); }
}

/* 保存本班组长密码（设置 / 修改共用） */
function saveLeaderPass(raw) {
  const cls = currentClass();
  const v = normPass(raw).replace(/\s+/g, '');
  if (v.length < 4 || v.length > 12) {
    toast('组长密码请设 4–12 位字母或数字', 'warn', 3000);
    return;
  }
  if (!/^[0-9A-Za-z]+$/.test(v)) {
    toast('组长密码只能用字母和数字', 'warn', 3000);
    return;
  }

/* 密码归一化：与 server.js 的 normPass 一致。
   中文输入法下很容易打出全角数字（８８８８），肉眼与 8888 无差别，
   但字符串不相等，这是「密码明明是对的却登录失败」最常见的原因。 */
function normPass(v) {
  return String(v == null ? '' : v)
    .replace(/[\u200B-\u200D\uFEFF]/g, '')
    .replace(/[\uFF01-\uFF5E]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/\u3000/g, ' ')
    .trim();
}

function doLoginMain(pwd) {
  const pass = normPass(pwd);
  if (!pass) { toast('请先输入管理员密码', 'warn', 2200); return; }
  sendLogin({ role: 'main', pass });
}

/* 草稿只活在这次控制台会话里；点「发布公告」才写进 state.notices */

}

/* 附件上传：文件不压缩（答案 PDF / 成绩表要保原样），单个上限 20MB，由服务端校验 */
async function uploadNoticeFile(file) {
  if (!file) throw new Error('没有选择文件');
  if (file.size > 20 * 1024 * 1024) throw new Error(`${file.name} 超过 20MB，请压缩后再上传`);
  const r = await fetch('/api/upload-file', {
    method: 'POST',
    headers: {
      'content-type': file.type || 'application/octet-stream',
      'x-token': link.token || '',
      'x-filename': encodeURIComponent(file.name || 'file')
    },
    body: file
  });
  const data = await r.json().catch(() => null);
  if (!r.ok || !data || !data.ok) throw new Error((data && data.msg) || '上传失败，请稍后重试');
  return {
    id: uid('fl'),
    name: String(data.name || file.name || '附件').slice(0, 80),
    url: data.url,
    size: Number(data.bytes) || file.size || 0
  };
}

/* 当前正在往哪儿传附件：新建草稿 / 某一条已发布的公告 */
let noticePick = { mode: '', id: '' };

function pickNoticeFile(mode, id) {
  if (!can.admin) return;
  noticePick = { mode, id: id || '' };
  const input = $('#noticeFile');
  if (input) input.click();
  else toast('当前浏览器不支持选择文件', 'err');
}

async function handleNoticeFile(input) {
  const files = Array.from(input.files || []);
  input.value = '';
  const target = noticePick;
  noticePick = { mode: '', id: '' };
  if (!files.length || !target.mode) return;
  try {
    for (let i = 0; i < files.length; i += 1) {
      const f = files[i];
      toast(files.length > 1 ? `正在上传 ${i + 1}/${files.length}：${f.name}…` : `正在上传 ${f.name}…`, 'ok', 1800);
      /* eslint-disable no-await-in-loop */
      const meta = await uploadNoticeFile(f);
      if (target.mode === 'draft') {
        noticeDraft.files = noticeDraft.files.concat([meta]).slice(0, 12);
      } else {
        const n = noticeList().find((x) => x.id === target.id);
        if (!n) { toast('这条公告已经被删除了', 'warn'); break; }
        n.files = (Array.isArray(n.files) ? n.files : []).concat([meta]).slice(0, 12);
        n.updatedAt = new Date().toISOString();
        saveState();
      }
    }
    renderAdmin();
    renderView();
    toast('附件已上传', 'ok', 2200);
  } catch (err) {
    toast((err && err.message) || '上传失败', 'err', 3800);
  }
}

let quizDraft = null;
let quizEditId = '';
let quizFocusId = '';

function openQuizEditor(id) {
  if (!can.admin) return;
  adminTab = 'quiz';
  if (!id || id === 'new') {
    quizEditId = 'new';
    quizDraft = newQuiz({ date: todayStr(), published: false });
  } else {
    const q = quizById(id);
    if (!q) return;
    quizEditId = id;
    quizDraft = JSON.parse(JSON.stringify(q));
  }
  renderAdmin();
}

function closeQuizEditor() {
  quizEditId = '';
  quizDraft = null;
  renderAdmin();
}

/* 每道题的必填校验：提示语随题型变化，避免「请填写题干」这种对不上的说法 */
const QUIZ_REQUIRED_MSG = {
  choice: { stem: '请填写选择题的题干', answer: '请先填好正确答案对应的选项' },
  blank: { stem: '请填写带空的句子', answer: '请填写参考答案' },
  translation: { stem: '请填写要翻译的原句', answer: '请填写标准译文' },
  word: { stem: '请填写英文单词', answer: '请填写中文释义' }
};

/* 题型切换：每种题型已经录好的内容先存进 stash，切回来不丢；
   答案字段按题型重置（选择题回落到 A，其余清空待填）。 */
function switchQuizType(next) {
  if (!quizDraft) return;
  const from = normQuizType(quizDraft.type);
  const to = normQuizType(next);
  if (from === to) return;
  if (!quizDraft.stash || typeof quizDraft.stash !== 'object') quizDraft.stash = {};
  quizDraft.stash[from] = {
    stem: String(quizDraft.stem || ''),
    answer: String(quizDraft.answer || ''),
    options: JSON.parse(JSON.stringify(quizDraft.options || []))
  };
  const keep = quizDraft.stash[to];
  quizDraft.type = to;
  if (keep) {
    quizDraft.stem = keep.stem || '';
    quizDraft.answer = keep.answer || '';
    if (Array.isArray(keep.options) && keep.options.length) {
      quizDraft.options = JSON.parse(JSON.stringify(keep.options));
    }
  } else {
    /* 题干留着（多半还能用），答案按题型重置 */
    quizDraft.answer = to === 'choice' ? 'A' : '';
  }
  renderAdmin();
}

  return `<div class="qtype-picker" role="radiogroup" aria-label="题型">

function saveQuiz(publish) {
  if (!can.admin || !quizDraft) return;
  const type = normQuizType(quizDraft.type);
  const need = QUIZ_REQUIRED_MSG[type] || QUIZ_REQUIRED_MSG.choice;
  const stem = String(quizDraft.stem || '').trim();
  const rawAnswer = String(quizDraft.answer || '').trim();
  const options = QUIZ_KEYS.map((k) => {
    const hit = (quizDraft.options || []).find((o) => o && o.k === k);
    return { k, t: String((hit && hit.t) || '').trim() };
  });

  if (!stem) { toast(need.stem, 'warn', 2800); return; }

  if (type === 'choice') {
    const filled = options.filter((o) => o.t);
    if (filled.length < 2) { toast('至少填写两个选项，学生才有得选', 'warn', 2800); return; }
    const key = QUIZ_KEYS.indexOf(rawAnswer.toUpperCase()) >= 0 ? rawAnswer.toUpperCase() : 'A';
    const hit = options.find((o) => o.k === key);
    if (!hit || !hit.t) {
      toast(`正确答案是 ${key}，但选项 ${key} 还是空的 —— 先填上它，或改选别的字母`, 'warn', 3600);
      return;
    }
  } else if (!rawAnswer) {
    toast(need.answer, 'warn', 2800);
    return;
  }

  /* 只有语法填空需要「句子里真的有一个空」；其余题型不适用这条规则 */
  if (type === 'blank' && !hasQuizBlank(stem)) {
    toast('句子里还没有空：请用 3 个以上下划线（___）标出要填的位置', 'warn', 3600);
    return;
  }
  if (type === 'word' && !/[A-Za-z]/.test(stem)) {
    toast('「英文单词」里要有英文字母，比如 generous', 'warn', 3000);
    return;
  }

  const q = newQuiz({
    type,
    date: quizDraft.date || todayStr(),
    point: quizDraft.point,
    stem,
    options,
    answer: rawAnswer,
    analysis: quizDraft.analysis,
    published: publish,
    by: actorName()
  });

  let savedId = q.id;
  if (quizEditId === 'new' || !quizDraft.id) {
    state.quizzes = quizList().concat(q);
  } else {
    savedId = quizDraft.id;
    q.id = savedId;
    state.quizzes = quizList().map((x) => (x.id === savedId ? q : x));
  }
  saveState();
  closeQuizEditor();
  renderView();
  toast(publish ? `已发布${quizTypeMeta(type).short}题，首页「每日一题」即刻可见` : '已存为草稿，仅控制台可见', 'ok', 3200);
}

function toggleQuizPublish(id) {
  if (!can.admin) return;
  const q = quizById(id);
  if (!q) return;
  const next = q.published === false;
  state.quizzes = quizList().map((x) => (x.id === id ? Object.assign({}, x, { published: next }) : x));
  saveState();
  renderAdmin();
  renderView();
  toast(next ? '已发布该题' : '已撤回该题', 'ok', 2600);
}

function removeQuiz(id) {
  if (!can.admin) return;
  const q = quizById(id);
  if (!q) return;
  openConfirm({
    title: '删除这道题？',
    message: `将删除 <b>${esc(q.date)} · ${esc(q.point || '知识点')}</b> 的每日一题，此操作不可撤销。`,
    confirmText: '确认删除',

    onConfirm: () => {
      state.quizzes = quizList().filter((x) => x.id !== id);

      saveState();
      closeModal();
      renderAdmin();
      renderView();
      toast('已删除该题', 'ok', 2400);
    }
  });
}

          支持四种题型：<b>选择题 / 单句语法填空 / 翻译题 / 问词释义</b>，出题时先选题型，录入框与校验规则会跟着换。

/* 题型策略库：材料库（内置 + 自编）统一在控制台查看 / 编辑 / 下架 */

/* 正文文本 ← blocks：与 parseArticleBody 互逆，编辑时把已存内容回填到文本框 */
function articleToText(a) {
  return (a && Array.isArray(a.blocks) ? a.blocks : []).map((b) => {
    if (!b || !b.x) return '';
    if (b.t === 'h') return `## ${b.x}`;
    if (b.t === 'tip') return `! ${b.x}`;
    if (b.t === 'ul') return (Array.isArray(b.x) ? b.x : [b.x]).map((x) => `- ${x}`).join('\n');
    return String(b.x);
  }).filter(Boolean).join('\n');
}

/* ---------- 写作素材库：正文文本 ↔ blocks ---------- */
/* 除题型策略库的三种标记，多两种：
   > 原题 / 情境引用      ~ 英文范文段落（连续多行 = 多个英文段落） */
function parseWriteBody(text) {
  const blocks = [];
  String(text || '').split(/\r?\n/).forEach((raw) => {
    const line = raw.trim();
    if (!line) return;
    if (/^#{1,3}\s+/.test(line)) { blocks.push({ t: 'h', x: line.replace(/^#{1,3}\s+/, '') }); return; }
    if (/^[-*•]\s+/.test(line)) {
      const item = line.replace(/^[-*•]\s+/, '');
      const last = blocks[blocks.length - 1];
      if (last && last.t === 'ul') last.x.push(item);
      else blocks.push({ t: 'ul', x: [item] });
      return;
    }
    if (/^[!！]\s*/.test(line)) { blocks.push({ t: 'tip', x: line.replace(/^[!！]\s*/, '') }); return; }
    if (/^[>＞]\s*/.test(line)) { blocks.push({ t: 'q', x: line.replace(/^[>＞]\s*/, '') }); return; }
    if (/^[~～]\s*/.test(line)) {
      const para = line.replace(/^[~～]\s*/, '');
      const last = blocks[blocks.length - 1];
      if (last && last.t === 'en' && last.__open) last.x += `\n\n${para}`;
      else blocks.push({ t: 'en', x: para, __open: true });
      return;
    }
    blocks.push({ t: 'p', x: line });
  });
  blocks.forEach((b) => { delete b.__open; });
  return blocks;
}

function writeItemToText(a) {
  return (a && Array.isArray(a.blocks) ? a.blocks : []).map((b) => {
    if (!b || !b.x) return '';
    if (b.t === 'h') return `## ${b.x}`;
    if (b.t === 'tip') return `! ${b.x}`;
    if (b.t === 'q') return `> ${b.x}`;
    if (b.t === 'en') return String(b.x).split(/\n{2,}/).map((p) => `~ ${p}`).join('\n');
    if (b.t === 'ul') return (Array.isArray(b.x) ? b.x : [b.x]).map((x) => `- ${x}`).join('\n');
    return String(b.x);
  }).filter(Boolean).join('\n');
}

/* ---------------- 15. 数据导入导出 ---------------- */
function stamp() {
  const d = new Date();
  return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}`;
}

function download(filename, content, mime) {
  const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(url);
    a.remove();
  }, 0);
}

function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function exportCSV(all) {
  const rows = [['日期 / 任务', '模块', '排', '组', '姓名', '状态', '备注']];
  const sorted = state.students
    .filter((s) => s.name.trim())
    .sort((a, b) => (a.row - b.row) || (a.group - b.group));

  /* 作业常规：按日期 */
  const dates = all ? Object.keys(state.records).sort() : [viewDate];
  dates.forEach((date) => {
    const rec = (state.records[date] || {}).homework;
    if (!rec) return;
    sorted.forEach((s) => {
      rows.push([date, '作业常规', s.row, s.group, s.name,
        rec[s.id] ? state.theme.doneLabel : state.theme.undoneLabel, state.tasks.homework || '']);
    });
  });

  /* 任务型模块（听写 / 背诵）及其罚抄：按任务（all=false 只导当前任务） */
  [
    ['dTasks', '听写常规', '听写抄写统计', 'dictation'],
    ['rTasks', '背诵常规', '背诵抄写统计', 'recite']
  ].forEach(([store, mainName, copyName, kind]) => {
    const cur = currentTaskFor(kind);
    const tasks = all ? taskListOf(store).slice() : (cur ? [cur] : []);
    tasks.slice().reverse().forEach((task) => {
      /* 名单按任务固化的座次表快照（老任务 = 全班名单），按座位排序 */
      const tSorted = taskStudents(task)
        .filter((s) => s.name && s.name.trim())
        .sort((a, b) => (a.row - b.row) || (a.group - b.group));
      tSorted.forEach((s) => {
        rows.push([task.date, mainName, s.row, s.group, s.name,
          task.records[s.id] ? state.theme.doneLabel : state.theme.undoneLabel, task.name]);
      });
      sysRounds(task).forEach((r) => {
        tSorted.forEach((s) => {
          if (r.sids.indexOf(s.id) < 0) return;
          rows.push([task.date, copyName, s.row, s.group, s.name,
            (r.done && r.done[s.id]) ? '已抄写' : '待抄写', `${r.name || task.name}（第 ${r.no} 轮）`]);
        });
      });
    });
  });

  const csv = `\ufeff${rows.map((r) => r.map(csvCell).join(',')).join('\r\n')}`;
  const scope = all ? '全部记录' : (isTaskMod(currentModule) ? (currentTask() ? currentTask().name : viewDate) : viewDate);
  download(`英语常规_${scope}_${stamp()}.csv`.replace(/[\\/:*?"<>|]/g, '_'), csv, 'text/csv;charset=utf-8');
  toast('CSV 已导出', 'ok');
}

function exportJSON() {
  download(`英语常规_备份_${stamp()}.json`, JSON.stringify(state, null, 2), 'application/json');

/* 导入整份 JSON 备份（控制台「导入 JSON 备份」与离线提示条的「导入最新数据」共用）
   注意：这里原来与「录入学员 → 导入名单」的 handleImportFile 重名，
   同名函数后定义者生效，名单导入因此一直是坏的 —— 改名后两条路各走各的。 */
function handleStateImport(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed = null;
    try { parsed = JSON.parse(String(reader.result)); } catch (err) { parsed = null; }
    if (!parsed || typeof parsed !== 'object') {
      toast('读取失败：不是有效的 JSON 文件', 'err', 3600);
      return;
    }
    const classes = Array.isArray(parsed.classes) ? parsed.classes.filter((c) => c && typeof c === 'object') : [];
    if (!classes.length && !Array.isArray(parsed.students)) {
      toast('文件格式不正确，请选择本网站导出的 JSON 备份', 'err', 3600);
      return;
    }
    const people = classes.length
      ? classes.reduce((n, c) => n + (Array.isArray(c.students)
        ? c.students.filter((s) => s && String(s.name || '').trim()).length : 0), 0)
      : parsed.students.filter((s) => s && String(s.name || '').trim()).length;
    const fileTs = Date.parse(parsed.updatedAt || '');
    const tsText = fileTs
      ? `备份文件里的数据更新于 ${pad2(new Date(fileTs).getMonth() + 1)}-${pad2(new Date(fileTs).getDate())} ${pad2(new Date(fileTs).getHours())}:${pad2(new Date(fileTs).getMinutes())}。`
      : '';
    openConfirm({
      title: '导入备份并覆盖当前数据？',
      message: `将用备份文件中的 <b>${classes.length || 1}</b> 个班级、<b>${people}</b> 名学生与全部记录覆盖本机现有数据。${tsText}<br>覆盖前会自动把当前数据存一份快照，可在首页「数据备份」里找回。`,
      confirmText: '确认导入',
      danger: true,
      onConfirm: () => {
        try { backupPush(JSON.stringify(state), '导入前自动备份'); } catch (err) { /* ignore */ }
        applyDoc(parsed, 'local');
        if (!state.updatedAt) state.updatedAt = new Date().toISOString();
        resetClassSelections();
        writeLocalState();
        if (link.mode === 'server') commitToServer();
        closeModal();
        renderModeBanner();
        renderAuth();
        renderView();
        updateSaveStatus();
        toast('备份已导入', 'ok', 3000);
      }
    });
  };
  reader.readAsText(file);
}

/* 根据「滚动播放设置」生成轮播序列：早读任务 → 学习标兵 → 优秀作业 → 激励海报 → 鼓励语 */
function buildScreenSlides() {
  const cfg = screenCfg();
  const out = [];
  const today = todayStr();
  if (cfg.showTask) {
    const ordered = publishedReadingList().slice().sort((a, b) => {
      const ta = a.date === today ? 0 : 1;
      const tb = b.date === today ? 0 : 1;
      if (ta !== tb) return ta - tb;
      return (a.date + a.segments[0].start).localeCompare(b.date + b.segments[0].start);
    });
    ordered.slice(0, 6).forEach((t) => out.push({ type: 'task', key: `task:${t.id}`, task: t }));
  }
  if (cfg.showStar && starList().length) {
    out.push({ type: 'star', key: 'star', items: starList().slice(-12) });
  }
  if (cfg.showWork && workList().length) {
    out.push({ type: 'work', key: 'work', items: workList().slice(-12) });
  }
  if (cfg.showPoster) {
    posterList().filter((p) => p.on !== false).forEach((p) => out.push({ type: 'poster', key: `poster:${p.id}`, poster: p }));
  }
  if (cfg.showQuote) {
    sloganList().slice(0, 8).forEach((s, i) => out.push({ type: 'quote', key: `quote:${i}`, text: s, idx: i }));
  }
  return out;
}

function posterArtHTML(art) {

            <span class="slide-seg__idx">${segs.length > 1 ? `第 ${i + 1} 段` : '时间段'}</span>

      <span>${esc(dateLabel(task.date))}</span>

function slidePosterHTML(p) {

    return `<div class="slide slide--poster slide--photo" style="--poster-tone:${posterTone(p.art)}">

function slideQuoteHTML(text, idx) {
  return `<div class="slide slide--quote">
    <span class="slide-quote__mark" aria-hidden="true">“</span>
    <p class="slide-quote slide-quote--big">${esc(text)}</p>
    <p class="slide-quote__from">早读寄语 · ${String(idx + 1).padStart(2, '0')}</p>

}

function slideListHTML(slide) {
  const isStar = slide.type === 'star';
  const items = slide.items || [];
  const anyImg = items.some((it) => it.img);
  return `<div class="slide slide--list slide--${slide.type}">
    <div class="slide__kicker"><span class="dot"></span>${isStar ? '学习标兵' : '优秀作业'}</div>
    <h2 class="slide__list-title">${isStar ? '今天，向这些同学看齐' : '这些作业，值得抄一遍'}</h2>
    <div class="slide-list${items.length > 6 ? ' is-scroll' : ''}" style="--scroll-dur:${Math.max(12, items.length * 3)}s">
      ${items.map((it, i) => `
        <div class="slide-list__row${it.img ? ' has-thumb' : ''}">
          <span class="slide-list__rank">${String(i + 1).padStart(2, '0')}</span>
          ${it.img ? `<span class="slide-list__thumb"><img src="${esc(it.img)}" alt="${esc(it.name || '')}" /></span>` : ''}
          <span class="slide-list__name">${esc(it.name || '—')}</span>
          <span class="slide-list__main">${esc(isStar ? (it.title || '学习标兵') : (it.item || '优秀作业'))}</span>
          <span class="slide-list__note">${esc(it.note || '')}</span>
          <span class="slide-list__date">${esc(it.date || '')}</span>
        </div>`).join('')}
    </div>
  </div>`;
}

function slideHTML(slide, i, total) {
  if (!slide) return '<div class="slide slide--empty"><p>还没有可播放的内容，请在控制台「大屏与展示」中开启展示项。</p></div>';
  const body = slide.type === 'task' ? slideTaskHTML(slide.task)
    : slide.type === 'poster' ? slidePosterHTML(slide.poster)
      : slide.type === 'quote' ? slideQuoteHTML(slide.text, slide.idx)
        : slideListHTML(slide);
  return `<div class="slide-wrap" data-slide="${i}">
    ${body}
    <div class="slide-pager">${i + 1} / ${total}</div>
  </div>`;
}

function renderSlide(i) {
  if (!screenList.length) {
    const stage = $('#screenStage');
    if (stage) stage.innerHTML = slideHTML(null, 0, 0);
    return;
  }
  screenIdx = ((i % screenList.length) + screenList.length) % screenList.length;
  const stage = $('#screenStage');
  if (stage) stage.innerHTML = slideHTML(screenList[screenIdx], screenIdx, screenList.length);
  renderDots();
  restartProgress();
}

function renderDots() {
  const el = $('#screenDots');
  if (!el) return;
  el.innerHTML = screenList.map((s, i) => `
    <button class="screen__dot${i === screenIdx ? ' is-active' : ''}" data-action="screen-go" data-idx="${i}"
      aria-label="第 ${i + 1} 张：${esc(s.type)}"></button>`).join('');
}

function restartProgress() {
  const bar = $('#screenBar');
  if (!bar) return;
  const cfg = screenCfg();
  bar.style.animation = 'none';
  // 强制回流后重新播放进度条动画
  void bar.offsetWidth;
  bar.style.animation = `screenBar ${cfg.interval}s linear forwards`;
  bar.style.animationPlayState = screenPaused ? 'paused' : 'running';
}

function nextSlide(step = 1) {
  if (!screenList.length) return;
  renderSlide(screenIdx + step);
}

function startScreenTimer() {
  clearInterval(screenTimer);
  const cfg = screenCfg();
  if (!cfg.rotate || screenPaused || screenList.length < 2) return;
  screenTimer = setInterval(() => nextSlide(1), cfg.interval * 1000);
}

function toggleScreenPause() {
  screenPaused = !screenPaused;
  const btn = $('#screenToggle');
  if (btn) { btn.textContent = screenPaused ? '▶' : '⏸'; btn.title = screenPaused ? '继续播放' : '暂停播放'; }
  const bar = $('#screenBar');
  if (bar) bar.style.animationPlayState = screenPaused ? 'paused' : 'running';
  startScreenTimer();
}

function startScreenClock() {
  clearInterval(screenClockTimer);
  screenClockTimer = setInterval(() => {
    const c = $('#screenClock');
    if (c) c.textContent = hhmmss();
    const d = $('#screenDate');
    if (d) d.textContent = dateLabel(todayStr());
  }, 1000);
}

function stopScreen() {
  clearInterval(screenTimer);
  clearInterval(screenClockTimer);
  screenTimer = null;
  screenClockTimer = null;
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    } else if (document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
  } catch (err) { /* 部分环境不支持全屏，忽略 */ }
}

function openScreen(id) {
  if (id) readSaveSelected(id);
  if (location.hash === '#/screen') { screenList = buildScreenSlides(); renderSlide(0); startScreenTimer(); return; }
  location.hash = '#/screen';
}

function renderScreen() {
  stopScreen();
  document.body.classList.add('is-screen');

  screenIdx = 0;
  screenPaused = false;
  const cfg = screenCfg();
  $('#view').innerHTML = `
  <div class="screen">
    <div class="screen__glow" aria-hidden="true"></div>

        <button class="screen__btn" data-action="screen-next" title="下一张" aria-label="下一张">›</button>
        <button class="screen__btn" data-action="screen-full" title="全屏" aria-label="全屏">⛶</button>

      <div class="screen__dots" id="screenDots"></div>

        <span>← → 切换</span><span>空格暂停</span><span>Esc 退出</span>

      </div>
    </footer>
    <div class="screen__progress"><i id="screenBar"></i></div>
  </div>`;
  renderSlide(0);

/* ---------------- 16c. 题型策略库 ---------------- */
let exCat = '全部';
let exDraftOpen = false;

/* 材料库 = 内置精选 + 本班自编 + 对内置的修订（同 id 的修订覆盖内置原文），
   已被管理员下架的内置篇目（state.extendHidden）不参与展示。 */
function isBuiltinArticle(id) {
  return EXTEND_ARTICLES.some((a) => a.id === id);
}

function extendHiddenIds() {
  return Array.isArray(state.extendHidden) ? state.extendHidden : [];
}

function allArticles() {
  const custom = Array.isArray(state.extendArticles) ? state.extendArticles : [];
  const hidden = new Set(extendHiddenIds());
  const overrides = new Map(custom.map((a) => [a.id, a]));
  const out = [];

/* 把纯文本解析成文章块：## 小标题 / - 列表 / ! 提示 / 其余段落 */
function parseArticleBody(text) {
  const blocks = [];
  String(text || '').split(/\r?\n/).forEach((raw) => {
    const line = raw.trim();
    if (!line) return;
    if (/^#{1,3}\s+/.test(line)) { blocks.push({ t: 'h', x: line.replace(/^#{1,3}\s+/, '') }); return; }
    if (/^[-*•]\s+/.test(line)) {
      const item = line.replace(/^[-*•]\s+/, '');
      const last = blocks[blocks.length - 1];
      if (last && last.t === 'ul') last.x.push(item);
      else blocks.push({ t: 'ul', x: [item] });
      return;
    }
    if (/^[!！]\s*/.test(line)) { blocks.push({ t: 'tip', x: line.replace(/^[!！]\s*/, '') }); return; }
    blocks.push({ t: 'p', x: line });
  });
  return blocks;
}

/* ---------------- 17. 事件绑定 ---------------- */
document.addEventListener('click', (e) => {
  /* 长按拖动刚松手的那一下不算点击，避免顺带打开任务 / 收起目录 */
  if (Date.now() - sortDrag.guard < 400) {
    e.preventDefault();
    e.stopPropagation();
    return;
  }
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    location.hash = nav.dataset.nav;
    return;
  }

  const tabBtn = e.target.closest('[data-admin-tab]');
  if (tabBtn) {
    adminTab = tabBtn.dataset.adminTab;
    adminEditId = '';
    readDraft = null;
    renderAdmin();
    return;
  }

  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  /* 任何一步抛错都不该表现为「点了没反应」：统一接住并给出可见提示 */
  try {
  switch (action) {
    /* --- 基础 --- */
    case 'dstat-rule-tab': setDstatRuleTab(el.dataset.tab); break;
    case 'close-modal': closeModal(); break;
    case 'confirm-ok': {
      const fn = confirmHandler;
      confirmHandler = null;
      if (typeof fn === 'function') fn();
      else closeModal();
      break;
    }
    case 'login-main': openLogin('main'); break;
    case 'logout': logout(); break;
    case 'open-admin': openAdmin(el.dataset.tab); break;
    case 'retry-link': retryLink(); break;

    /* --- 班级切换（两套独立的每日常规） --- */
    case 'class-switch': switchClass(el.dataset.id); break;
    case 'class-rename': renameClass(el.dataset.id); break;

    /* --- 早读常规 --- */
    case 'delete-reading': removeReadingTask(el.dataset.id); break;
    case 'read-bg': setReadBg(el.dataset.bg); break;
    case 'read-select': selectReadingTask(el.dataset.id); break;

    /* --- 日期 --- */
    case 'date-prev': setViewDate(shiftDate(viewDate, -1)); break;
    case 'date-next': setViewDate(shiftDate(viewDate, 1)); break;
    case 'date-today': setViewDate(todayStr()); break;

    /* --- 录入 --- */
    case 'seat': {
      const sid = el.dataset.sid;
      if (editNamesMode && can.admin) openSeatEditor(sid);
      else if (isTaskMod(currentModule)) sysSeatClick(sid);   // 双系统：先改草稿，点「保存」才生效
      else toggleSeat(sid);
      break;
    }

    /* --- 双系统：目录 / 任务 / 抄写轮次 / 保存 --- */
    case 'sys-bulk': sysBulkPass(el.dataset.val); break;
    case 'sys-seat': sysSeatClick(el.dataset.sid); break;    case 'sys-save': sysSave(); break;
    case 'sys-discard': sysDiscard(); break;
    case 'sys-fold': {
      const id = el.dataset.id;
      sysFold[id] = sysFold[id] === false;
      renderView();
      break;
    }
    case 'sys-task-open': {
      const cfg = sysOfMod(currentModule);
      sysSelectTask(cfg, el.dataset.id);
      renderView();
      break;
    }
    case 'sys-task-new': sysPublishTask(el.dataset.id); break;
    case 'sys-chart-pick-confirm': sysConfirmChartPick(); break;
    case 'sys-task-rename': sysRenameTask(el.dataset.id); break;
    case 'sys-task-del': sysDeleteTask(el.dataset.id); break;
    case 'sys-node-new': sysAddNode(el.dataset.id || ''); break;
    case 'sys-node-rename': sysRenameNode(el.dataset.id); break;
    case 'sys-node-del': sysDeleteNode(el.dataset.id); break;
    case 'sys-round-open': {
      const cfg = sysOfMod(currentModule);
      sysRoundSel[cfg.store] = el.dataset.id;

/* 表单提交 */
document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;

  /* 提交链路同样不能「静默失败」：登录密码框万一被扩展/旧样式弄丢，
     也要给出可见提示，而不是按下登录毫无反应。 */
  try {
    const pwdInput = form.querySelector('[name="pwd"]');
    if (kind === 'login-main') {
      if (!pwdInput) { showFatalTip('登录框异常：找不到密码输入框，请刷新页面重试'); return; }
      doLoginMain(pwdInput.value);
      return;
    }
    if (kind === 'reg-login') {
      if (!pwdInput) { showFatalTip('登录框异常：找不到密码输入框，请刷新页面重试'); return; }
      const pwd = pwdInput.value;
      if (form.dataset.mode === 'main') doLoginMain(pwd);
      else leaderLogin(pwd);
      return;
    }
    if (kind === 'leader-pass') {
      saveLeaderPass(form.querySelector('[name="pass"]').value);
      return;
    }
    if (kind === 'pquery-search') {
      pqueryRun(form.querySelector('[name="kw"]').value);
      return;
    }
    if (kind === 'seat-edit') {
      renameStudent(form.dataset.sid, form.querySelector('[name="name"]').value);
      return;
    }
    if (kind === 'prompt') {
      const v = form.querySelector('[name="value"]') ? form.querySelector('[name="value"]').value : '';
      if (typeof promptHandler === 'function') promptHandler(v);
    }
  } catch (err) {
    try { console.error('[日课] 提交失败', kind, err); } catch (e2) { /* ignore */ }
    showFatalTip(`提交失败（${kind}）：${(err && err.message) || err}`, err);
  }
});

/* 管理端表单实时保存 */
document.addEventListener('input', (e) => {
  const t = e.target;

  /* 公告草稿：先记到草稿对象里，这样上传附件后重绘控制台也不会丢已输入的字 */
  if (t.dataset && t.dataset.noticeField) {
    noticeDraft[t.dataset.noticeField] = t.type === 'checkbox' ? t.checked : t.value;
    return;
  }

  /* 录入学员：逐格即时保存。中文输入法组合期间先不落库，
     否则「zhangsan」这样的拼音会被当成姓名写进座次表。 */
  if (t.dataset && t.dataset.enroll !== undefined) {
    if (e.isComposing || t.dataset.composing === '1') return;
    applyEnrollInput(t);
    return;
  }

  /* 分层任务：层级输入框只更新草稿与预览，不重画表单，避免光标丢失 */
  if (t.dataset && t.dataset.lv !== undefined && taskDraft) {
    const i = Number(t.dataset.lv);
    if (i >= 0) taskDraft.levels[i] = t.value;
    const box = $('#lvPreview');
    if (box) {
      const lv = taskDraft.levels.map((x) => String(x || '').trim()).filter(Boolean);
      box.innerHTML = lv.length
        ? lvCrumbsHTML({ levels: lv }, 'lv-crumbs--preview')
        : '<span class="lv-crumbs__empty">（至少填一层）</span>';
    }
    return;
  }

  if (t.dataset && t.dataset.taskDate !== undefined && taskDraft) {
    taskDraft.date = t.value;
    return;
  }

  if (t.dataset && t.dataset.bind) {
    const isNum = t.type === 'number' || t.type === 'range';
    if (isNum && t.value === '') return;
    setPath(state, t.dataset.bind, isNum ? Number(t.value) : t.value);
    saveState(true);
    /* 公告的标题 / 日期 / 正文改动：主页要立刻看到（尤其「New」是按最新日期算的），
       这里只重绘主视图，控制台的输入框不会重建，光标不会掉。 */
    if (t.dataset.bind === 'rules.dstat' || t.dataset.bind === 'rules.dstatRecite') refreshDstatRulesCard();
    if (t.dataset.bind === 'rules.regstat') refreshRegstatRulesCard();
    if (t.dataset.bind.indexOf('notices.') === 0) renderView();
    if (t.dataset.bind.indexOf('meta.') === 0) applyTheme();
    if (t.dataset.apply === 'theme') {
      applyTheme();
      const out = t.parentElement && t.parentElement.querySelector('output');
      if (out && t.type === 'range') out.textContent = `${Number(t.value).toFixed(2)}×`;
      const codeEl = t.parentElement && t.parentElement.querySelector('.code');
      if (codeEl) codeEl.textContent = String(t.value).toUpperCase();
    }
    if (t.dataset.apply === 'switch') {
      saveState(true);
      renderView();
    }
    return;
  }
});

  if (t.dataset && t.dataset.noticePin !== undefined) {
    const n = noticeList()[Number(t.dataset.noticePin)];
    if (!n) return;
    n.pinned = !!t.checked;
    n.updatedAt = new Date().toISOString();
    saveState();
    renderAdmin();
    renderView();
    toast(n.pinned ? '已置顶这条公告' : '已取消置顶', 'ok', 1800);
    return;
  }

  /* 录入学员：失焦时清理多余空格并把显示值同步回来 */
  if (t.dataset && t.dataset.enroll !== undefined) {
    const v = String(t.value || '').replace(/\s+/g, ' ').trim().slice(0, 12);
    if (v !== t.value) t.value = v;
    applyEnrollInput(t);
    return;
  }

  if (t.id === 'dateInput') {
    setViewDate(t.value);
    return;
  }

  if (t.id === 'taskSelect') {
    const store = TASK_STORE[currentModule];
    if (store) currentTaskId[store] = t.value;

});

    if (modalOpen) closeModal();

    undo();
  }
});
