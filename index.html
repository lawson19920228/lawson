/* ---------- 常规违纪统计：作业 + 纪律 合并 ---------- */
function regAllRows() {
  const map = new Map();
  const touch = (name) => {
    if (!map.has(name)) map.set(name, { name, hw: 0, dis: 0, hwHits: [], disHits: [] });
    return map.get(name);
  };
  regSummary('hwcheck').forEach((r) => {
    const m = touch(r.name);
    m.hw += r.n;
    m.hwHits = r.hits;
  });
  regSummary('discipline').forEach((r) => {
    const m = touch(r.name);
    m.dis += r.n;
    m.disHits = r.hits;
  });
  return Array.from(map.values())
    .map((r) => Object.assign(r, { total: r.hw + r.dis }))
    .sort((a, b) => (b.total - a.total) || (b.dis - a.dis) || a.name.localeCompare(b.name, 'zh'));
}

/* 全班涉及到的姓名（按各份记录的名单合并），用于算「零违纪」人数 */
function regAllNames() {
  const set = new Set();
  ['hwcheck', 'discipline'].forEach((kind) => {
    regList(kind).forEach((t) => {
      ((t.roster && t.roster.students) || []).forEach((s) => {
        if (s && s.name) set.add(s.name);
      });
    });
  });
  return set;
}

function renderRegStat() {
  const hwAll = regTotals('hwcheck');
  const disAll = regTotals('discipline');
  const rows = regAllRows();
  const total = rows.reduce((n, r) => n + r.total, 0);
  const clean = rows.filter((r) => r.total > 0);
  const maxTotal = rows.length ? rows[0].total : 1;
  const zeroCount = Math.max(0, regAllNames().size - clean.length);

  const body = rows.length
    ? rows.map((r, i) => `<tr class="${r.total ? '' : 'is-clean'}">
        <td class="reg-td-idx">${i + 1}</td>
        <td class="reg-td-name"><b>${esc(r.name)}</b></td>
        <td class="reg-td-n">${r.hw ? `<span class="reg-n reg-n--hw">${r.hw}</span>` : '<span class="reg-zero">—</span>'}</td>
        <td class="reg-td-n">${r.dis ? `<span class="reg-n reg-n--disc">${r.dis}</span>` : '<span class="reg-zero">—</span>'}</td>
        <td class="reg-td-total">
          <span class="reg-total"><b>${r.total}</b><span class="reg-total__bar"><i style="width:${Math.round((r.total / maxTotal) * 100)}%"></i></span></span>
          <span class="reg-total__u">次</span>
        </td>
        <td class="reg-td-detail">
          ${r.hwHits.map((h) => `<i class="reg-tag" data-kind="hwcheck">任务 · ${esc(h.task)}</i>`).join('')}
          ${r.disHits.map((h) => `<i class="reg-tag" data-kind="discipline">纪律 · ${esc(h.task)}${h.n > 1 ? ` ×${h.n}` : ''}</i>`).join('')}
        </td>
      </tr>`).join('')
    : '';

  $('#view').innerHTML = `
  <div class="module-view module-view--regstat">
    <header class="module-head module-head--regstat">
      <button class="btn btn--ghost btn--sm" data-nav="#/home" aria-label="返回首页">← 返回</button>
      <div class="module-head__title">
        <div class="module-head__name">
          <h1>常规违纪统计</h1>
          <span class="sys-sub">任务督检 + 课堂纪律 · 合并汇总</span>
        </div>
      </div>
      <div class="module-head__stats">
        <div class="mstat mstat--bad"><b>${total}</b><span>违纪合计</span></div>
        <div class="mstat"><b>${clean.length}</b><span>涉及人数</span></div>
        <div class="mstat mstat--done"><b>${zeroCount}</b><span>零违纪</span></div>
      </div>
      <div class="module-head__actions">
        ${classSwitchHTML({ compact: true })}
        <button class="btn btn--outline btn--sm" data-action="regstat-refresh">↻ 刷新</button>
      </div>
    </header>

    ${regstatRulesHTML()}

    <div class="reg-cards">
      <button class="reg-card" data-nav="#/module/hwcheck" data-kind="hwcheck">
        <span class="reg-card__en">TASK CHECK</span>
        <b>任务督检</b>
        <span class="reg-card__nums"><b>${hwAll.tasks}</b> 份统计 · <em>${hwAll.hit}</em> 人次未完成</span>
        <span class="reg-card__go">去录入 →</span>
      </button>
      <button class="reg-card" data-nav="#/module/discipline" data-kind="discipline">
        <span class="reg-card__en">DISCIPLINE</span>
        <b>课堂纪律</b>
        <span class="reg-card__nums"><b>${disAll.tasks}</b> 次监管 · <em>${disAll.hit}</em> 次违纪</span>
        <span class="reg-card__go">去录入 →</span>
      </button>
      <div class="reg-card reg-card--sum">
        <span class="reg-card__en">TOTAL</span>
        <b>合计</b>
        <span class="reg-card__nums"><b>${total}</b> 次 · 涉及 <em>${clean.length}</em> 人</span>
        <span class="reg-card__go">任务 ${hwAll.hit} + 纪律 ${disAll.hit}</span>
      </div>
    </div>

    <section class="reg-panel">
      <div class="reg-panel__head">
        <span class="reg-panel__title">违纪明细（按合计次数排序）</span>
        <span class="reg-panel__desc">任务未完成每 1 次记 1 次；课堂纪律每标记 1 下记 1 次，合计 = 两项相加</span>
        <span class="reg-panel__count">${clean.length} 人有记录 · ${total} 次</span>
      </div>
      ${rows.length ? `<div class="reg-tablewrap">
        <table class="table reg-table">
          <thead><tr>
            <th>#</th><th>姓名</th><th>任务未完成</th><th>纪律违纪</th><th>合计</th><th>明细</th>
          </tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>` : `<p class="reg-empty">还没有任何记录。先到「任务督检」或「课堂纪律」发布一次统计，这里会自动汇总。</p>`}
    </section>
  </div>`;
}

/* =========================================================
   21. 左侧目录：长按拖动排序
   ---------------------------------------------------------
   适用：听写 / 背诵的目录树（任意层级）、任务督检的目录树、课堂纪律的已发布列表。
   交互：按住目录项约 0.4 秒进入「抬起」态，再拖动到同层另一项的上 / 下边缘，
        松手即写入新顺序；顺序直接改写底层数组，随数据一起保存，刷新后不变。
   限制：只在同层、同类（目录 / 任务 / 记录）之间移动，不会改变层级归属。
   ========================================================= */
const sortDrag = { pending: null, timer: 0, active: false, el: null, target: null, after: false, guard: 0, startY: 0 };

function sortScopeAllowed(scope) {
  if (scope === 'hw') return can.admin || leaderCanEdit('hwcheck');
  return can.admin;
}

function sortCancelPending() {
  if (sortDrag.timer) { clearTimeout(sortDrag.timer); sortDrag.timer = 0; }
  sortDrag.pending = null;
}

function sortBegin() {
  const p = sortDrag.pending;
  sortDrag.timer = 0;
  if (!p) return;
  sortDrag.active = true;
  sortDrag.el = p.el;
  sortDrag.target = null;
  sortDrag.after = false;
  sortDrag.startY = p.y;
  p.el.classList.add('is-lifting');
  document.body.classList.add('is-sorting');
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (err) { /* 忽略 */ }
}

/* 指针落点 → 同组里最近的一个兄弟项，落在它的上半 = 插到前面，下半 = 插到后面 */
function sortHover(y) {
  const el = sortDrag.el;
  if (!el) return;
  const group = el.dataset.sortGroup;
  let best = null;
  let bestD = Infinity;
  let after = false;
  $$('[data-sort-group]').forEach((c) => {
    if (c === el || c.dataset.sortGroup !== group) return;
    const r = c.getBoundingClientRect();
    const cy = r.top + r.height / 2;
    const d = Math.abs(y - cy);
    if (d < bestD) { bestD = d; best = c; after = y > cy; }
  });
  if (sortDrag.target && sortDrag.target !== best) {
    sortDrag.target.classList.remove('is-drop-before', 'is-drop-after');
  }
  sortDrag.target = bestD <= 90 ? best : null;
  if (sortDrag.target) {
    sortDrag.target.classList.toggle('is-drop-before', !after);
    sortDrag.target.classList.toggle('is-drop-after', after);
  }
  sortDrag.after = after;
}

/* 把 ids 的顺序写回底层数组：只调换这几个元素占据的位置，其他元素不动 */
function sortReorder(arr, ids) {
  const slots = [];
  arr.forEach((it, i) => { if (ids.indexOf(it.id) >= 0) slots.push(i); });
  const picked = ids.map((id) => arr.find((it) => it.id === id)).filter(Boolean);
  slots.forEach((p, i) => { if (picked[i]) arr[p] = picked[i]; });
}

function sortWrite(scope, kind, ids) {
  if (scope === 'disc') { sortReorder(state.discTasks, ids); return; }
  if (scope === 'hw') {
    sortReorder(kind === 'node' ? hwCat() : regList('hwcheck'), ids);
    return;
  }
  const cfg = scope === 'r' ? SYS_CFG.recite : SYS_CFG.dictation;
  sortReorder(kind === 'node' ? sysCat(cfg) : taskListOf(cfg.store), ids);
}

function sortApply(el, target, after) {
  const group = el.dataset.sortGroup;
  const id = el.dataset.sortId;
  const tid = target.dataset.sortId;
  if (!id || !tid) return;
  const ids = $$('[data-sort-group]').filter((n) => n.dataset.sortGroup === group).map((n) => n.dataset.sortId);
  const next = ids.filter((x) => x !== id);
  const at = next.indexOf(tid);
  if (at < 0) return;
  next.splice(after ? at + 1 : at, 0, id);
  if (next.join('|') === ids.join('|')) return;
  sortWrite(el.dataset.sortScope, el.dataset.sortKind, next);
  saveState();
  /* 重画一次让计数 / 高亮跟着更新，同时把左栏滚动位置还原 */
  const tree = document.querySelector('.sys-tree');
  const top = tree ? tree.scrollTop : 0;
  renderView();
  const tree2 = document.querySelector('.sys-tree');
  if (tree2) tree2.scrollTop = top;
  toast('顺序已保存', 'ok', 1200);
}

function sortFinish(apply) {
  if (!sortDrag.active) { sortCancelPending(); return; }
  const el = sortDrag.el;
  const target = sortDrag.target;
  const after = sortDrag.after;
  if (el) { el.classList.remove('is-lifting'); el.style.transform = ''; }
  if (target) target.classList.remove('is-drop-before', 'is-drop-after');
  document.body.classList.remove('is-sorting');
  sortDrag.active = false;
  sortDrag.el = null;
  sortDrag.target = null;
  sortDrag.pending = null;
  sortDrag.timer = 0;
  sortDrag.guard = Date.now();
  if (apply && el && target && target !== el) sortApply(el, target, after);
}

document.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const el = e.target.closest('[data-sortable]');
  if (!el) return;
  if (e.target.closest('.sys-node__acts') || e.target.closest('.sys-node__caret')
    || e.target.closest('input, textarea, select')) return;
  if (!sortScopeAllowed(el.dataset.sortScope)) return;
  sortDrag.pending = { el, x: e.clientX, y: e.clientY };
  clearTimeout(sortDrag.timer);
  sortDrag.timer = setTimeout(sortBegin, 420);
}, true);

document.addEventListener('pointermove', (e) => {
  if (!sortDrag.active) {
    const p = sortDrag.pending;
    if (p && (Math.abs(e.clientX - p.x) > 8 || Math.abs(e.clientY - p.y) > 8)) sortCancelPending();
    return;
  }
  /* 抬起的那一项跟着指针走，下面的落点指示线说明会插到哪里 */
  const dy = e.clientY - (sortDrag.startY || e.clientY);
  if (sortDrag.el) sortDrag.el.style.transform = `translateY(${dy}px)`;
  sortHover(e.clientY);
}, { passive: true });

document.addEventListener('pointerup', () => sortFinish(true));
document.addEventListener('pointercancel', () => sortFinish(false));
/* 拖动中不要滚动页面 / 弹右键菜单 */
document.addEventListener('touchmove', (e) => {
  if (sortDrag.active) e.preventDefault();
}, { passive: false });
document.addEventListener('contextmenu', (e) => {
  if (sortDrag.active || sortDrag.pending) e.preventDefault();
}, true);

/* =========================================================
   22. 座次表大屏模式
   ---------------------------------------------------------
   所有带座次表的页面（听写 / 背诵的过关与抄写、任务督检、
   课堂纪律、录入学员、作业）都能一键把座位铺满整屏：
     · 只切换 body 上的类 + 顶部控制条，不重画页面，数据不受影响；
     · 席位点击、草稿、保存条在大屏下照常可用；
     · Esc、顶部「退出大屏」、换个页面都会自动退回普通视图。
   ========================================================= */
let seatBig = false;
let seatBigFull = false;      /* 是否由「全屏」按钮进入的浏览器全屏，退出时一并还原 */

function seatBigTitle() {
  const txt = (sel) => {
    const el = document.querySelector(sel);
    return el ? String(el.textContent || '').replace(/\s+/g, ' ').trim() : '';
  };
  const task = txt('.sys-taskhead__name') || txt('.reg-meta__name')
    || txt('.enroll-board__title') || txt('.module-head__name h1');
  return [currentClassName(), String(task).replace(/^正在编辑：/, '')].filter(Boolean).join(' · ') || '座次表';
}

function seatBigSet(on) {
  const next = !!on;
  seatBig = next;
  document.body.classList.toggle('is-seatbig', next);
  const title = document.getElementById('seatBigTitle');
  if (title) title.textContent = next ? seatBigTitle() : '';
  $$('[data-action="seat-big"]').forEach((b) => {
    b.setAttribute('aria-pressed', next ? 'true' : 'false');
    b.classList.toggle('is-on', next);
  });
  if (!next && seatBigFull) {
    seatBigFull = false;
    try {
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    } catch (err) { /* 忽略 */ }
  }
  if (next) {
    const view = document.getElementById('view');
    if (view) view.scrollTop = 0;
  }
  syncSeatBigSavebar();
}

function seatBigToggle() {
  if (seatBig) { seatBigSet(false); return; }
  if (!document.querySelector('.stage')) { toast('这一页没有座次表', 'warn'); return; }
  seatBigSet(true);
}

/* 页面重画后同步：换到没有座次表的页面就自动退出；仍在座次表页就刷新标题 */
function syncSeatBig() {
  if (!seatBig) return;
  if (!document.querySelector('[data-action="seat-big"]')) { seatBigSet(false); return; }
  document.body.classList.add('is-seatbig');
  const title = document.getElementById('seatBigTitle');
  if (title) title.textContent = seatBigTitle();
  syncSeatBigSavebar();
}

function seatBigFullscreen() {
  seatBigFull = true;
  toggleFullscreen();
}

/* 大屏下底部保存条出现时，整块座次表上收，别压住最后一排 */
function syncSeatBigSavebar() {
  const on = !!(seatBig && document.querySelector('.sys-savebar.is-on'));
  document.body.classList.toggle('is-seatbig-save', on);
}

/* ---------------- 18. 启动 ---------------- */
let state = bootDoc();   // 先按默认结构渲染，服务器快照到达后覆盖
link.token = session.token || '';
applyTheme();
renderAuth();
renderModeBanner();
if ($('#dateInput')) $('#dateInput').value = viewDate;

/* 组长登录状态恢复：本机还留着组长身份就接着算 5 分钟；
   上次登录的是别的班（数据换过 / 切过班）则直接作废。 */
if (leaderSession) {
  const left = (leaderSession.at || 0) + LEADER_TTL_MS - Date.now();
  if (leaderSession.classId === state.activeClass && leaderPassReady() && left > 0) {
    leaderStartClock(left);
  } else {
    clearLeaderSession();
  }
}
if (!location.hash) location.hash = '#/home';
renderView();
updateSaveStatus();

/* 顶栏日期块 + 天气（30 分钟刷新一次；取不到就显示 --°，不影响其他功能） */
renderTodayBlock();
loadWeather();
setInterval(renderTodayBlock, 60 * 1000);
setInterval(() => loadWeather(), 30 * 60 * 1000);

/* 先探测服务端是否为本站（静态预览 / file:// 打开会失败），再建立实时通道；
   4.5 秒内仍连不上则自动进入离线模式，保证页面与录入、登录都可用 */
probeServer().then((ok) => {
  link.probe = ok ? 'ok' : 'fail';
  if (!ok && !link.online) startGraceTimer();
});
connectServer();

</script>
