}

/* =========================================================
   41. 风采展示图片（v3.10）
   41.1 控制台缩略图 / 41.2 首页图片条（多图自动滚动）/ 41.3 大图查看
   —— 图片文件存在服务端 data/uploads，页面只拿到 /uploads/xxx.jpg 短路径
   ========================================================= */

/* ---------- 41.1 控制台：每条记录一张缩略图 ---------- */
.mini-thumb-wrap { position: relative; width: 100%; }
.mini-thumb {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  width: 100%;
  height: 40px;
  padding: 0;
  border: 1px dashed var(--line);
  border-radius: 9px;
  background: #16212E;
  color: var(--ink-3);
  cursor: pointer;
  overflow: hidden;
  transition: border-color .16s ease, color .16s ease;
}
.mini-thumb b { font-size: 13px; font-weight: 800; line-height: 1; }
.mini-thumb i { font-style: normal; font-size: 9px; letter-spacing: .02em; }
.mini-thumb:hover { border-color: var(--brand); color: var(--brand); }
.mini-thumb.has-img { border-style: solid; }
.mini-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini-thumb__del {
  position: absolute;
  top: -6px; right: -6px;
  width: 17px; height: 17px;
  border-radius: 50%;
  border: 1px solid #3A2029;
  background: #2E1A21;
  color: #E07385;
  font-size: 11px;
  line-height: 1;
  cursor: pointer;
  z-index: 2;
}
.mini-thumb__del:hover { background: #43222C; }
.mini-file {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 12px;
  min-height: 34px;
  border: 1px dashed var(--line);
  border-radius: 9px;
  background: #16212E;
  color: var(--ink-3);
  font-size: 12px;
  white-space: nowrap;
  cursor: pointer;
  transition: border-color .16s ease, color .16s ease;
}
.mini-file:hover { border-color: var(--brand); color: var(--brand); }
.mini-file input[type="file"] { display: none; }
.mini-file.is-picked { border-style: solid; border-color: var(--brass); color: var(--brass); }

/* ---------- 41.2 首页「风采展示」图片条 ---------- */
.spot-shots { position: relative; margin: 2px 0 4px; }
.spot-shots--grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
.spot-shots--grid .spot-shot { margin: 0; }
.spot-shots--grid .spot-shot:only-child { grid-column: 1 / -1; }
.spot-shots--flow {
  overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%);
}
.spot-shots__track {
  display: flex;
  width: max-content;
  animation: spotFlow var(--flow-dur, 30s) linear infinite;
}
.spot-shots--flow:hover .spot-shots__track,
.spot-shots--flow:focus-within .spot-shots__track { animation-play-state: paused; }
@keyframes spotFlow {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

.spot-shot {
  position: relative;
  flex: 0 0 auto;
  width: 100%;
  aspect-ratio: 4 / 3;
  margin: 0 7px 0 0;
  padding: 0;
  border: 1px solid rgba(32, 50, 60, 0.16);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.5);
  overflow: hidden;
  cursor: zoom-in;
  font: inherit;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.spot-shots--flow .spot-shot { width: 128px; }
.spot-shot img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .35s ease;
}
.spot-shot:hover { border-color: rgba(32, 50, 60, 0.36); box-shadow: 0 6px 18px rgba(16, 32, 48, 0.16); }
.spot-shot:hover img { transform: scale(1.045); }
.spot-shot__cap {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 12px 7px 5px;
  font-family: var(--serif);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .03em;
  color: #F4F8FF;
  text-align: left;
  background: linear-gradient(180deg, rgba(12, 24, 36, 0) 0%, rgba(12, 24, 36, 0.72) 78%);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.spot-shot__zoom {
  position: absolute;
  top: 5px; right: 5px;
  width: 17px; height: 17px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: rgba(12, 24, 36, 0.46);
  color: #EAF2FF;
  font-size: 10px;
  opacity: 0;
  transition: opacity .16s ease;
}
.spot-shot:hover .spot-shot__zoom,
.spot-shot:focus-visible .spot-shot__zoom { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .spot-shots--flow { overflow-x: auto; -webkit-mask-image: none; mask-image: none; }
  .spot-shots__track { animation: none; }
}

/* ---------- 41.3 大图查看（灯箱） ---------- */
body.is-zoom { overflow: hidden; }
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: clamp(16px, 3vw, 40px);
  background: rgba(6, 12, 18, 0.94);
  backdrop-filter: blur(3px);
  animation: lightboxIn .18s ease;
}
@keyframes lightboxIn { from { opacity: 0; } to { opacity: 1; } }
.lightbox__stage {
  position: relative;
  margin: 0;
  max-width: min(1100px, 92vw);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.lightbox__img {
  max-width: 100%;
  max-height: 74vh;
  border-radius: 10px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  object-fit: contain;
  background: #0D141D;
}
.lightbox__cap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; justify-content: center; text-align: center; }
.lightbox__cap b { font-family: var(--serif); font-size: 17px; color: #F1F6FF; letter-spacing: .03em; }
.lightbox__cap span { font-size: 12.5px; color: #8FD3D3; }
.lightbox__cap i { flex-basis: 100%; font-style: normal; font-size: 12px; line-height: 1.7; color: #9FB0C4; }
.lightbox__close {
  position: absolute;
  top: 18px; right: 22px;
  width: 38px; height: 38px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.22);
  background: rgba(255, 255, 255, 0.08);
  color: #E8F0FA;
  font-size: 15px;
  cursor: pointer;
}
.lightbox__close:hover { background: rgba(255, 255, 255, 0.18); }
.lightbox__nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 46px; height: 46px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.08);
  color: #E8F0FA;
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
}
.lightbox__nav:hover { background: rgba(255, 255, 255, 0.2); }
.lightbox__nav--prev { left: clamp(8px, 2vw, 34px); }
.lightbox__nav--next { right: clamp(8px, 2vw, 34px); }
.lightbox__foot {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11.5px;
  color: #93A6BA;
  letter-spacing: .04em;
}
.lightbox__kind { color: #8FD3D3; font-weight: 800; letter-spacing: .12em; }
.lightbox__count { font-variant-numeric: tabular-nums; }
.lightbox__hint { color: #6F8399; }

/* ---------- 41.4 大屏：列表行前的小照片 ---------- */
.slide-list__row.has-thumb {
  grid-template-columns: 42px 84px minmax(70px, .7fr) minmax(0, 1.6fr) minmax(0, 1.3fr) 90px;
}
.slide-list__thumb {
  width: 84px; height: 54px;
  border-radius: 9px;
  overflow: hidden;
  background: rgba(22, 33, 46, 0.08);
  border: 1px solid rgba(22, 33, 46, 0.12);
}
.slide-list__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

@media (max-width: 720px) {
  .lightbox__hint { display: none; }
  .lightbox__img { max-height: 66vh; }
}

/* =========================================================
   42. 公告栏 + 个人查询提示条（v3.12）
   42.1 个人查询通栏提示 / 42.2 主页公告栏 / 42.3 控制台公告管理
   —— 两者都是「一眼要看见」的信息，放在报头下方、每日常规之前
   ========================================================= */

/* ---------- 42.1 待办查询区：个人 + 全班 双按钮入口 ---------- */
.query-hub {
  display: flex;
  flex-wrap: wrap;
  align-items: center;

.query-hub__intro { flex: 1 1 320px; min-width: 0; }
.query-hub__en {
  display: block;

}
.query-hub__title {

}
.query-hub__desc { margin-top: 4px; font-size: 11.5px; line-height: 1.7; color: var(--ink-3); }
.query-hub__live {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 8px;
  padding: 2px 10px;
  border-radius: 999px;

  letter-spacing: .02em;
  color: #FFD9C2;

}
.query-hub__live b { font-weight: 800; font-variant-numeric: tabular-nums; }
.query-hub__live.is-clear {
  color: #BDF0D4;
  background: rgba(87, 192, 140, .14);
  border-color: rgba(87, 192, 140, .4);
}
.query-hub__btns { display: flex; flex-wrap: wrap; gap: 10px; flex: 0 0 auto; }
.query-btn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 5px;
  padding: 12px 18px 11px;
  border: 1px solid transparent;
  border-radius: 13px;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
}
.query-btn b {
  display: inline-flex;
  align-items: center;

  font-size: 15.5px;
  font-weight: 900;
  letter-spacing: .04em;

.query-btn small { font-size: 10.5px; line-height: 1; letter-spacing: .02em; white-space: nowrap; }
.query-btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
.query-btn:focus-visible { outline: 3px solid var(--brand-2); outline-offset: 2px; }
/* 个人：品牌蓝（原金色按钮换色，与页面的主色呼应） */
.query-btn--me {

  background: linear-gradient(135deg, #3E6FD8 0%, #4C7CF0 55%, #5E8CF5 100%);

/* 全班：青绿，与「全班待办查询」页的汇总色一致 */
.query-btn--all {
