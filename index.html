/* 新增输入项：模板 / 草稿 / 海报 / 名单 / 鼓励语 */
function segFieldTarget(kind) {
  if (kind === 'tpl') {
    if (!state.reading.template) state.reading.template = { segments: [] };
    if (!Array.isArray(state.reading.template.segments)) state.reading.template.segments = [];
    return state.reading.template.segments;
  }
  if (!readDraft) return null;
  if (!Array.isArray(readDraft.segments)) readDraft.segments = [];
  return readDraft.segments;
}

document.addEventListener('input', (e) => {
  const t = e.target;

  if (t.dataset && t.dataset.segField) {
    const row = t.closest('[data-seg]');
    const kind = row ? row.dataset.seg : 'tpl';
    const list = segFieldTarget(kind);
    if (!list) return;
    const i = Number(t.dataset.idx) || 0;
    if (!list[i]) list[i] = { start: '', end: '', content: '' };
    list[i][t.dataset.segField] = t.value;
    if (kind === 'tpl') saveState(true);
    return;
  }

  if (t.dataset && t.dataset.draft) {
    if (!readDraft) return;
    readDraft[t.dataset.draft] = t.type === 'checkbox' ? t.checked : t.value;
    return;
  }

  if (t.dataset && t.dataset.slogans !== undefined) {
    if (!state.reading) return;
    state.reading.slogans = String(t.value).split('\n').map((x) => x.trim()).filter(Boolean).slice(0, 40);
    saveState(true);
  }
});

/* 出题表单：只写草稿，点「保存」才落库 */
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.quizField) {
    if (!quizDraft) return;
    quizDraft[t.dataset.quizField] = t.value;
    return;
  }
  if (t.dataset && t.dataset.quizOpt) {
    if (!quizDraft) return;
    if (!Array.isArray(quizDraft.options)) quizDraft.options = QUIZ_KEYS.map((k) => ({ k, t: '' }));
    const opt = quizDraft.options.find((o) => o.k === t.dataset.quizOpt);
    if (opt) opt.t = t.value;
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  /* 选择题：点选项前的圆点即设为正确答案，不重绘表单（避免光标丢失） */
  if (t.dataset && t.dataset.quizPick) {
    if (!quizDraft) return;
    quizDraft.answer = t.dataset.quizPick;
    $$('.quiz-opt-row').forEach((row) => {
      const pick = row.querySelector('[data-quiz-pick]');
      row.classList.toggle('is-answer', !!pick && pick.checked);
    });
    const now = $('.quiz-ansnow');
    if (now) now.textContent = t.dataset.quizPick;
    return;
  }
  if (t.dataset && t.dataset.quizField === 'answer') {
    if (!quizDraft) return;
    quizDraft.answer = t.value;
    $$('.quiz-opt-row').forEach((row) => {
      const k = row.querySelector('b');
      row.classList.toggle('is-answer', !!k && k.textContent.trim() === t.value);
    });
  }
  if (t.dataset && t.dataset.quizField === 'published' && quizDraft) {
    quizDraft.published = t.value === '1';
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;

  if (t.dataset && t.dataset.screenOpt) {
    state.reading.screen[t.dataset.screenOpt] = t.checked;
    saveState();
    if (t.dataset.screenOpt === 'rotate') startScreenTimer();
    return;
  }

  if (t.dataset && t.dataset.screenInterval !== undefined) {
    const v = Math.min(120, Math.max(4, Number(t.value) || 12));
    state.reading.screen.interval = v;
    t.value = v;
    saveState();
    return;
  }

  if (t.dataset && t.dataset.posterOn) {
    const p = posterList().find((x) => x.id === t.dataset.posterOn);
    if (p) { p.on = t.checked; saveState(); }
    return;
  }

  if (t.dataset && t.dataset.posterArt) {
    const p = posterList().find((x) => x.id === t.dataset.posterArt);
    if (p) { p.art = t.value; saveState(); renderAdmin(); }
    return;
  }
});

/* 大屏快捷键：← → 切换、空格暂停、F 全屏、Esc 退出 */
document.addEventListener('keydown', (e) => {
  if (!document.body.classList.contains('is-screen')) return;
  const key = e.key;
  if (key === 'ArrowRight') { e.preventDefault(); nextSlide(1); startScreenTimer(); return; }
  if (key === 'ArrowLeft') { e.preventDefault(); nextSlide(-1); startScreenTimer(); return; }
  if (key === ' ') { e.preventDefault(); toggleScreenPause(); return; }
  if (key === 'Escape') { e.preventDefault(); location.hash = '#/module/reading'; return; }
  if (key === 'f' || key === 'F') { e.preventDefault(); toggleFullscreen(); }
});

/* =========================================================
   19. 双系统：听写 / 背诵（目录树 · 任务 · 抄写轮次 · 草稿保存）
   ---------------------------------------------------------
   两套系统数据结构完全一致，只是 state 里的键名不同：
     dTasks / dCat   ← 听写；  rTasks / rCat ← 背诵
   一个任务：{id, nodeId, levels, name, date, records, copyDone, copyRounds}
     records     过关：sid -> true（没标记 = 未通过）
     copyRounds  抄写任务（全部靠「发布」生成，发布即快照）：
                 [{ id, no, name, sids:[发布时未过关], pass:{发布时已过关}, done:{}, createdAt, by }]
                 · 名单在发布那一刻固化，之后过关数据怎么变都不影响已发布的轮次
                 · name = 任务名 + 中文轮数 + 轮抄写（必修一 Unit 1 一轮抄写）
   修改一律先进「草稿」，点「保存」才写回 state 并同步服务器。
   ========================================================= */

const SYS_LIST = ['dictation', 'recite'];

const SYS_CFG = {
  dictation: {
    key: 'dictation', store: 'dTasks', cat: 'dCat', copyMod: 'dcopy',
    kind: '听写', passTitle: '听写过关统计', copyTitle: '听写抄写统计', tone: 'd'
  },
  recite: {
    key: 'recite', store: 'rTasks', cat: 'rCat', copyMod: 'rcopy',
    kind: '背诵', passTitle: '背诵过关统计', copyTitle: '背诵抄写统计', tone: 'r'
  }
};

const sysOfMod = (mod) => ((mod === 'dictation' || mod === 'dcopy') ? SYS_CFG.dictation : SYS_CFG.recite);
const sysOfStore = (store) => (store === 'rTasks' ? SYS_CFG.recite : SYS_CFG.dictation);

/* 当前选中的任务 / 抄写轮次（按系统分开记忆） */
const sysSel = { dTasks: '', rTasks: '' };
const sysRoundSel = { dTasks: 'auto', rTasks: 'auto' };
const sysFold = {};          // 目录展开状态：nodeId -> false 表示收起
let sysDraft = null;         // {store, taskId, roundId, kind:'pass'|'copy', map:{}}
const sysChartSel = { dTasks: '', rTasks: '' };  // 每个系统上次选取的座次表（发布任务时默认勾上）
let sysChartPick = null;     // 打开中的座次表选取器 {cfg, onPick}

/* ---------- 19.1 目录树 ---------- */
function sysCat(cfg) {
  return Array.isArray(state[cfg.cat]) ? state[cfg.cat] : [];
}
function sysNode(cfg, id) {
  return sysCat(cfg).find((n) => n.id === String(id || '')) || null;
}
function sysChildren(cfg, parentId) {
  return sysCat(cfg).filter((n) => String(n.parentId || '') === String(parentId || ''));
}
function sysPath(cfg, id) {
  const out = [];
  let cur = sysNode(cfg, id);
  let hop = 0;
  while (cur && hop < 5) {
    out.unshift(cur.name);
    cur = cur.parentId ? sysNode(cfg, cur.parentId) : null;
    hop += 1;
  }
  return out;
}
const sysDepthOf = (cfg, id) => sysPath(cfg, id).length;

/* 目录下的任务（含子目录的？不含 —— 每个任务只挂在自己那一层） */
function sysTasksOf(cfg, nodeId) {
  return sysTasksAll(cfg).filter((t) => String(t.nodeId || '') === String(nodeId || ''));
}

function sysTasksAll(cfg) {
  /* 顺序就是数组顺序：新任务追加在末尾，长按拖动后按拖动结果写回数组 */
  return taskListOf(cfg.store).slice();
}

function sysActiveTask(cfg) {
  const list = sysTasksAll(cfg);
  const id = sysSel[cfg.store];
  return list.find((t) => t.id === id) || list[list.length - 1] || null;
}

function sysSelectTask(cfg, taskId) {
  sysSel[cfg.store] = String(taskId || '');
  if (sysDraft && sysDraft.store === cfg.store && sysDraft.taskId !== sysSel[cfg.store]) sysDraft = null;
}

/* ---------- 19.2 统计 / 轮次 ---------- */
/* 任务用哪份名单：发布时选取并固化的座次表快照（roster）；老任务没有快照就沿用全班名单 */
function taskStudents(task) {
  const r = task && task.roster;
  if (r && Array.isArray(r.students) && r.students.length) return r.students;
  return state.students;
}

function taskLayout(task) {
  const r = task && task.roster;
  if (r && r.layout && Number(r.layout.groups)) return r.layout;
  return state.layout;
}

/* 任务使用的座次表名称：按 chartId 实时查本班座次表，改名后各统计页立即同步；
   座次表已被删除时回落到发布时固化的快照名称。 */
function taskChartName(task) {
  const r = task && task.roster;
  if (!r) return '';
  const live = (Array.isArray(state.charts) ? state.charts : []).find((c) => c.id === r.chartId);
  return (live && live.name) || r.chartName || '';
}

/* 任务座次矩阵 / 显示范围：与 seatMatrix / seatView 同构，但按任务的名单与布局 */
function sysSeatMatrix(task) {
  const layout = taskLayout(task);
  const map = new Map();
  taskStudents(task).forEach((s) => map.set(`${s.group}:${s.row}`, s));
  const cols = [];
  for (let g = 1; g <= layout.groups; g += 1) {
    const col = [];
    for (let r = 1; r <= layout.rows; r += 1) col.push(map.get(`${g}:${r}`) || null);
    cols.push(col);
  }
  return cols;
}

function sysSeatView(task) {
  const layout = taskLayout(task);
  const usedG = new Set();
  let maxRow = 1;
  taskStudents(task).forEach((s) => {
    if (s.row >= 1 && s.row <= layout.rows) maxRow = Math.max(maxRow, s.row);
    if (s.group >= 1 && s.group <= layout.groups) usedG.add(s.group);
  });
  if (!usedG.size) return { minG: 1, maxG: 1, maxRow: 1, empty: true };
  if (layout.podium) maxRow = Math.max(maxRow, Math.min(layout.rows, layout.podium.row));
  let minG = 1;
  let maxG = layout.groups;
  while (minG < maxG && !usedG.has(minG)) minG += 1;
  while (maxG > minG && !usedG.has(maxG)) maxG -= 1;
  return { minG, maxG, maxRow: Math.max(1, Math.min(layout.rows, maxRow)), empty: false };
}

/* 过关统计。传 cfg 时把「还没保存的草稿」也算进来——页头数字因此能跟着点击实时变；
   ／发布抄写、侧栏徽标等需要「已落库」的口径，不传 cfg 即可。 */
function sysTaskStats(task, cfg) {
  let total = 0;
  let passed = 0;
  const draftOn = !!(cfg && task && sysDraftMatch(cfg, task, null, 'pass'));
  taskStudents(task).forEach((s) => {
    if (!s.name || !s.name.trim()) return;
    total += 1;
    const val = draftOn
      ? sysEffective(cfg, task, null, s.id, 'pass')
      : !!(task && task.records && task.records[s.id]);
    if (val) passed += 1;
  });
  return { total, passed, failed: total - passed, rate: total ? Math.round((passed / total) * 100) : 0 };
}

/* 过关统计页头三块数字：单独抽出来，点座位 / 批量标记后就地刷新，不整页重画 */
function sysHeadStatsInner(st) {
  return `<div class="mstat mstat--done"><b>${st.passed}</b><span>已通过</span></div>
    <div class="mstat mstat--undone"><b>${st.failed}</b><span>未通过</span></div>
    <div class="mstat"><b>${st.rate}%</b><span>过关率</span></div>`;
}

/* 批量操作条：一键全完成 / 一键全未完成（只改草稿，点「保存」才落库） */
function sysBulkHTML(task) {
  if (!task) return '';
  return `<div class="sys-bulk">
      <span class="sys-bulk__label">批量</span>
      <button class="btn btn--outline btn--sm" data-action="sys-bulk" data-val="1"
        title="把这份座次表上的同学全部标为「已通过」">✓ 一键全完成</button>
      <button class="btn btn--ghost btn--sm is-danger-soft" data-action="sys-bulk" data-val="0"
        title="把这份座次表上的同学全部标为「未通过」">✕ 一键全未完成</button>
      <span class="sys-bulk__hint">批量只改草稿，点「保存」才写入；点「放弃」可整批还原</span>
    </div>`;
}

function sysFailedIds(task) {
  if (!task) return [];
  return taskStudents(task)
    .filter((s) => s.name && s.name.trim() && !(task.records && task.records[s.id]))
    .map((s) => s.id);
}

/* 抄写轮次：全部由「发布抄写任务」生成，发布瞬间把当时的过关情况拍成快照，此后不再跟随。
   轮次名统一按发布次序取「一轮抄写 / 二轮抄写 / 三轮抄写」，不再把任务名拼进轮次名
   （任务名在上方标题和左侧目录里已经有了，轮次名只负责说明是第几轮）。 */
function sysRounds(task) {
  if (!task) return [];
  return (Array.isArray(task.copyRounds) ? task.copyRounds : [])
    .slice()
    .sort((a, b) => (Number(a.no) || 0) - (Number(b.no) || 0))
    .map((r) => {
      const no = Math.max(1, Number(r.no) || 1);
      const name = `${cnNum(no)}轮抄写`;
      return {
        id: String(r.id || `${task.id}k${no}`),
        no, name, label: name,
        sids: Array.isArray(r.sids) ? r.sids.slice() : [],
        pass: (r.pass && typeof r.pass === 'object') ? r.pass : {},
        done: (r.done && typeof r.done === 'object') ? r.done : {},
        createdAt: String(r.createdAt || ''),
        by: String(r.by || '')
      };
    });
}

/* 某一轮要抄写的学生：发布时冻结的名单，不随过关变化 */
function sysRoundSids(task, round) {
  if (!round) return [];
  return Array.isArray(round.sids) ? round.sids.slice() : [];
}

/* 该轮发布时已经过关的人（显示「无需抄写」）；老数据没有 pass 时用「不在名单」兜底 */
function sysRoundPassed(task, round, sid) {
  if (!round) return false;
  if (round.pass && Object.prototype.hasOwnProperty.call(round.pass, sid)) return !!round.pass[sid];
  return round.sids.indexOf(sid) < 0;
}

function sysCopyStats(task, round) {
  const sids = sysRoundSids(task, round);
  const doneMap = (round && round.done) || {};
  let done = 0;
  sids.forEach((sid) => { if (doneMap[sid]) done += 1; });
  return { total: sids.length, done, undone: sids.length - done };
}

/* 任一轮已抄完的学生集合（给首页卡片 / 导出等旧代码用） */
function copyDoneOf(task) {
  const out = {};
  sysRounds(task).forEach((r) => {
    Object.keys(r.done || {}).forEach((sid) => { if (r.done[sid]) out[sid] = true; });
  });
  return out;
}

/* 所有已发布轮次合并后的进度 */
function copyAgg(task) {
  let total = 0;
  let done = 0;
  sysRounds(task).forEach((r) => { const st = sysCopyStats(task, r); total += st.total; done += st.done; });
  return { total, done, undone: Math.max(0, total - done), rate: total ? Math.round((done / total) * 100) : 0 };
}

/* ---------- 19.3 草稿 ---------- */
const SYS_LABEL_DONE = { pass: '已通过', copy: '已抄写' };
const SYS_LABEL_UNDONE = { pass: '未通过', copy: '待抄写' };

function sysBaseValue(task, round, sid) {
  if (!task) return false;
  if (!round) return !!task.records[sid];
  return !!(round.done && round.done[sid]);
}

function sysDraftMatch(cfg, task, round, kind) {
  const roundId = round ? round.id : '';
  return !!(sysDraft
    && sysDraft.store === cfg.store
    && sysDraft.taskId === (task ? task.id : '')
    && sysDraft.roundId === roundId
    && sysDraft.kind === kind);
}

function sysDraftStart(cfg, task, round, kind) {
  sysDraft = { store: cfg.store, taskId: task ? task.id : '', roundId: round ? round.id : '', kind, map: {} };
  return sysDraft;
}

function sysDraftCount(cfg, task, round, kind) {
  if (!sysDraftMatch(cfg, task, round, kind)) return 0;
  return Object.keys(sysDraft.map).length;
}

function sysEffective(cfg, task, round, sid, kind) {
  if (sysDraftMatch(cfg, task, round, kind) && Object.prototype.hasOwnProperty.call(sysDraft.map, sid)) {
    return !!sysDraft.map[sid];
  }
  return sysBaseValue(task, round, sid);
}

/* ---------- 19.4 点击座位：只改草稿，不落库 ---------- */
function sysSeatClick(sid) {
  const mod = currentModule;
  if (!(can.entry || leaderCanEdit(mod))) {
    openRegLogin(mod);
    return;
  }
  const cfg = sysOfMod(mod);
  const isCopy = isCopyMod(mod);
  const task = sysActiveTask(cfg);
  if (!task) { toast(`请先发布${cfg.kind}任务`, 'warn'); return; }
  const round = isCopy ? sysCurrentRound(cfg, task) : null;

  if (isCopy) {
    if (!round) { toast(`还没发布抄写任务，请到「${cfg.passTitle}」里发布`, 'warn', 3200); return; }
    if (round.sids.indexOf(sid) < 0) {
      toast(sysRoundPassed(task, round, sid) ? '该同学发布抄写时已过关，本轮无需抄写' : '该同学不在本轮抄写名单里', 'warn');
      return;
    }
  }

  const kind = isCopy ? 'copy' : 'pass';
  if (!sysDraftMatch(cfg, task, round, kind)) sysDraftStart(cfg, task, round, kind);
  const base = sysBaseValue(task, round, sid);
  const next = !sysEffective(cfg, task, round, sid, kind);
  if (next === base) delete sysDraft.map[sid];
  else sysDraft.map[sid] = next;

  const btn = document.querySelector(`.seat[data-sysseat="${sid}"]`);
  if (btn) {
    btn.classList.toggle('is-done', next);
    btn.setAttribute('aria-pressed', next ? 'true' : 'false');
    const lab = btn.querySelector('.seat__status');
    if (lab) lab.textContent = next ? SYS_LABEL_DONE[kind] : SYS_LABEL_UNDONE[kind];
    btn.classList.toggle('is-dirty', next !== base);
  }
  sysUpdateSaveBar(cfg, task, round, kind);
  sysRefreshHeadStats();
}

/* 页头统计 + 进度条就地刷新（草稿也算进去），不整页重画 */
function sysRefreshHeadStats() {
  const mod = currentModule;
  if (!isTaskMod(mod) || isCopyMod(mod)) return;
  const cfg = sysOfMod(mod);
  const task = sysActiveTask(cfg);
  if (!task) return;
  const st = sysTaskStats(task, cfg);
  const head = document.getElementById('sysHeadStats');
  if (head) head.innerHTML = sysHeadStatsInner(st);
  const bar = document.querySelector('.sys-taskhead__bar');
  if (bar) {
    bar.setAttribute('title', `过关率 ${st.rate}%`);
    const fill = bar.querySelector('i');
    if (fill) fill.style.width = `${st.rate}%`;
  }
  /* 「发布抄写」用的是已落库的名单：有未保存草稿时先禁掉，避免草稿被悄悄丢弃 */
  const copyBtn = document.querySelector('[data-action="sys-copy-new"]');
  if (copyBtn) {
    const n = sysDraftCount(cfg, task, null, 'pass');
    const baseFailed = sysTaskStats(task).failed;
    copyBtn.disabled = !(baseFailed && !n);
    copyBtn.title = n
      ? `还有 ${n} 项修改没保存，先「保存」或「放弃」再发布抄写`
      : (baseFailed ? `把此刻仍未过关的 ${baseFailed} 人固化成一份抄写名单` : '当前没有未过关学生');
  }
}

/* 一键全完成 / 一键全未完成：先确认，再整批写进草稿（不直接落库，避免误点无法回头） */
function sysBulkPass(val) {
  const mod = currentModule;
  if (!isTaskMod(mod) || isCopyMod(mod)) return;
  const cfg = sysOfMod(mod);
  if (!(can.entry || leaderCanEdit(mod))) { openRegLogin(mod); return; }
  const task = sysActiveTask(cfg);
  if (!task) { toast(`还没有${cfg.kind}任务`, 'warn'); return; }
  const list = taskStudents(task).filter((s) => s.name && s.name.trim());
  if (!list.length) { toast('这份座次表还没有学生', 'warn'); return; }
  const done = val === '1';
  const changed = list.filter((s) => sysEffective(cfg, task, null, s.id, 'pass') !== done);
  if (!changed.length) {
    toast(`已经是「全部${done ? '已完成' : '未完成'}」了，没有需要改的`, 'warn', 2600);
    return;
  }
  openConfirm({
    title: done ? '把全班标为已通过？' : '把全班标为未通过？',
    message: `「${esc(task.name)}」共 <b>${list.length}</b> 人，这次会有 <b>${changed.length}</b> 人改变状态。<br><br>
      批量修改先记在草稿里，<b>点「保存」才真正写入并同步</b>；如果点错了，点「放弃」就能整批还原。`,
    confirmText: done ? '全部标为已通过' : '全部标为未通过',
    danger: !done,
    onConfirm: () => {
      if (!sysDraftMatch(cfg, task, null, 'pass')) sysDraftStart(cfg, task, null, 'pass');
      list.forEach((s) => {
        const base = sysBaseValue(task, null, s.id);
        if (done === base) delete sysDraft.map[s.id];
        else sysDraft.map[s.id] = done;
      });
      closeModal();     /* 关弹层并重画：座位、页头统计、保存条一起更新 */
      toast(`已整批标记 ${changed.length} 人，记得点「保存」`, done ? 'ok' : 'warn', 3600);
    }
  });
}

function sysUpdateSaveBar(cfg, task, round, kind) {
  const bar = document.getElementById('sysSaveBar');
  if (!bar) return;
  const n = sysDraftCount(cfg, task, round, kind);
  bar.classList.toggle('is-on', n > 0);
  const b = bar.querySelector('[data-sys-count]');
  if (b) b.textContent = String(n);
  const btn = bar.querySelector('[data-action="sys-save"]');
  if (btn) btn.disabled = n === 0;
  syncSeatBigSavebar();
}

function sysSave(quiet) {
  if (!sysDraft) { if (!quiet) toast('没有需要保存的修改', 'warn'); return; }
  const cfg0 = sysOfStore(sysDraft.store);
  if (!(can.entry || leaderCanEdit(cfg0.key))) {
    if (!quiet) { toast('请先用「管理员登录」或「组长登录」进入录入状态', 'warn'); openRegLogin(cfg0.key); }
    return;
  }
  const cfg = cfg0;
  const task = taskListOf(cfg.store).find((t) => t.id === sysDraft.taskId);
  if (!task) { toast('任务已不存在，请刷新', 'warn'); return; }

  let target = null;
  if (sysDraft.kind === 'pass') target = task.records;
  else {
    const r = (task.copyRounds || []).find((x) => x.id === sysDraft.roundId);
    target = r ? r.done : null;
  }
  if (!target) { toast('找不到要保存的名单，请刷新后重试', 'warn'); return; }

  let n = 0;
  Object.keys(sysDraft.map).forEach((sid) => {
    if (sysDraft.map[sid]) { if (!target[sid]) n += 1; target[sid] = true; }
    else if (target[sid]) { delete target[sid]; n += 1; }
  });
  if (!n) { sysDraft = null; renderView(); return; }

  pushLog({
    t: Date.now(),
    date: task.date || todayStr(),
    module: sysDraft.kind === 'pass' ? cfg.key : cfg.copyMod,
    taskId: task.id,
    by: actorName(),
    text: `保存 ${n} 项（${sysDraft.kind === 'pass' ? cfg.kind + '过关' : cfg.kind + '抄写'}）`
  });
  sysDraft = null;
  saveState();
  renderView();
  if (!quiet) toast(`已保存 ${n} 项修改`, 'ok');
}

function sysDiscard() {
  if (!sysDraft || !Object.keys(sysDraft.map).length) { toast('没有未保存的修改'); return; }
  sysDraft = null;
  renderView();
  toast('已放弃未保存的修改');
}

/* ---------- 19.5 目录 / 任务操作 ---------- */
function sysSyncTaskNames(cfg) {
  taskListOf(cfg.store).forEach((t) => {
    const p = sysPath(cfg, t.nodeId);
    if (!p.length) return;
    t.levels = p;
    /* 自己起过名的任务不动；默认名跟随目录等级 */
    if (!t.customName) t.name = p.join(' ');
  });
}

/* 新建任务时的默认名 = 任务所在目录等级 */
function sysDefaultTaskName(cfg, nodeId) {
  return sysPath(cfg, nodeId).join(' ');
}

function sysAddNode(parentId) {
  if (!can.admin) { toast('只有管理员可以改目录', 'warn'); return; }
  const cfg = sysOfMod(currentModule);
  if (parentId && sysDepthOf(cfg, parentId) >= 3) { toast('目录最多三级', 'warn'); return; }
  openPrompt({
    title: parentId ? '新建子目录' : '新建一级目录',
    desc: parentId ? `会建在「${sysPath(cfg, parentId).join(' › ')}」下面，最多三级。` : '例如：必修一 / 必修二 / 选择性必修一。',
    value: '',
    placeholder: '目录名称',
    onSave: (v) => {
      const name = String(v || '').trim().slice(0, 30);
      if (!name) { toast('请填写目录名称', 'warn'); return; }
      state[cfg.cat] = sysCat(cfg).concat({ id: newCatId(), name, parentId: String(parentId || '') });
      sysFold[parentId || ''] = true;
      saveState();
      closeModal();
      renderView();
      toast('目录已创建', 'ok');
    }
  });
}

function sysRenameNode(nodeId) {
  if (!can.admin) return;
  const cfg = sysOfMod(currentModule);
  const node = sysNode(cfg, nodeId);
  if (!node) return;
  openPrompt({
    title: '重命名目录',
    desc: '改名后，挂在这个目录下的任务名会自动跟着变（任务名 = 各级目录名拼接）。',
    value: node.name,
    onSave: (v) => {
      const name = String(v || '').trim().slice(0, 30);
      if (!name) { toast('名称不能为空', 'warn'); return; }
      node.name = name;
      sysSyncTaskNames(cfg);
      saveState();
      closeModal();
      renderView();
      toast('目录已重命名', 'ok');
    }
  });
}

function sysDeleteNode(nodeId) {
  if (!can.admin) return;
  const cfg = sysOfMod(currentModule);
  const node = sysNode(cfg, nodeId);
  if (!node) return;
  const kids = sysChildren(cfg, nodeId);
  if (kids.length) { toast('这个目录下还有子目录，请先删掉子目录', 'warn'); return; }
  if (sysTasksOf(cfg, nodeId).length) { toast(`目录下还有 ${sysTasksOf(cfg, nodeId).length} 个任务，请先删除任务`, 'warn'); return; }
  openConfirm({
    title: '删除目录',
    message: `确定删除「${node.name}」？该目录下没有任务，删除后不可恢复。`,
    danger: true,
    onConfirm: () => {
      state[cfg.cat] = sysCat(cfg).filter((n) => n.id !== nodeId);
      saveState();
      closeModal();
      renderView();
      toast('目录已删除', 'ok');
    }
  });
}

/* 在目录上发布任务：默认名 = 目录等级，可自己改名；座次表全部「未通过」 */
/* 座次表选取器：每次发布听写 / 背诵任务都弹出，手动选一份并固化成任务快照（roster）。
   选完之后无论怎么改座次表、改全班名单，这个任务的座次表都不再变化。 */
function sysPickChart(cfg, onPick) {
  const charts = Array.isArray(state.charts) ? state.charts : [];
  if (!charts.length) { toast('还没有座次表，先到「录入学员」建一份', 'warn', 3600); return; }
  let pickId = sysChartSel[cfg.store];
  if (!charts.some((c) => c.id === pickId)) pickId = charts[0].id;
  sysChartPick = { cfg, onPick };
  openModal(`
    <h2>选择座次表</h2>
    <p class="modal__desc">发布${esc(cfg.kind)}任务时会把所选座次表整份固化进任务：此后修改座次表、修改名单，都不影响这个任务。</p>
    <div class="chart-pick">
      ${charts.map((c) => `
        <label class="chart-pick__row${c.id === pickId ? ' is-pick' : ''}">
          <input type="radio" name="chartPick" value="${esc(c.id)}" ${c.id === pickId ? 'checked' : ''} />
          <span class="chart-pick__name">${esc(c.name)}</span>
          <span class="chart-pick__num">${c.students.length} 人</span>
        </label>`).join('')}
    </div>
    <div class="modal__actions">
      <button type="button" class="btn btn--ghost" data-action="close-modal">取消</button>
      <button type="button" class="btn btn--primary" data-action="sys-chart-pick-confirm">选取并发布</button>
    </div>`);
}

/* 选取框点「选取并发布」：读中意的单选并回调（测试可直接调用本函数） */
function sysConfirmChartPick() {
  const pick = sysChartPick;
  if (!pick) return;
  const checked = $('#modalRoot input[name="chartPick"]:checked');
  const id = checked ? checked.value : '';
  const charts = Array.isArray(state.charts) ? state.charts : [];
  const chart = charts.find((c) => c.id === id) || charts[0];
  if (!chart) { toast('请选择座次表', 'warn'); return; }
  sysChartSel[pick.cfg.store] = chart.id;
  sysChartPick = null;
  closeModal();
  pick.onPick(chart);
}

function sysPublishTask(nodeId) {
  if (!can.admin) { toast('只有管理员可以发布任务', 'warn'); return; }
  const cfg = sysOfMod(currentModule);
  const path = sysPath(cfg, nodeId);
  if (!path.length) { toast('请先选择目录', 'warn'); return; }
  const def = sysDefaultTaskName(cfg, nodeId);
  openPrompt({
    title: `发布${cfg.kind}任务`,
    desc: `目录：${path.join(' › ')}。任务名默认取「目录等级」（${def}），可以自己改。`,
    value: def,
    placeholder: `任务名，例如 ${def}`,
    onSave: (v) => {
      const name = String(v || '').replace(/\s+/g, ' ').trim().slice(0, 60) || def;
      closeModal();
      sysPickChart(cfg, (chart) => {
        const rosterStudents = chart.students
          .filter((s) => s.name && s.name.trim())
          .map((s) => ({ id: s.id, name: s.name, group: s.group, row: s.row }));
        if (!rosterStudents.length) { toast('「' + chart.name + '」还没有学生，先去「录入学员」填写', 'warn', 3600); return; }
        const task = newTask(name, actorName(), cfg.key, path, nodeId);
        task.customName = name !== def;
        task.roster = {
          chartId: chart.id,
          chartName: chart.name,
          students: rosterStudents,
          layout: JSON.parse(JSON.stringify(chart.layout || {}))
        };
        state[cfg.store] = taskListOf(cfg.store).concat(task);
        sysSel[cfg.store] = task.id;
        sysRoundSel[cfg.store] = '';
        if (sysDraft) sysDraft = null;
        saveState();
        renderView();
        toast(`已发布「${name}」${cfg.kind}任务（座次表「${chart.name}」· ${rosterStudents.length} 人，全部未通过）`, 'ok', 3600);
      });
    }
  });
}

/* 给已发布的任务改名（不影响已录入的过关 / 抄写数据） */
function sysRenameTask(taskId) {
  if (!can.admin) return;
  const cfg = sysOfMod(currentModule);
  const task = taskListOf(cfg.store).find((t) => t.id === taskId);
  if (!task) return;
  const def = sysDefaultTaskName(cfg, task.nodeId);
  openPrompt({
    title: '任务命名',
    desc: '改名只影响显示与抄写任务名，已录入的过关 / 抄写数据不变。清空则回到默认的目录等级名。',
    value: task.name,
    placeholder: `留空 = 使用目录等级（${def}）`,
    onSave: (v) => {
      const name = String(v || '').replace(/\s+/g, ' ').trim().slice(0, 60);
      if (!name || name === def) { task.name = def; task.customName = false; }
      else { task.name = name; task.customName = true; }
      saveState();
      closeModal();
      renderView();
      toast('任务名已更新', 'ok');
    }
  });
}

function sysDeleteTask(taskId) {
  if (!can.admin) return;
  const cfg = sysOfMod(currentModule);
  const task = taskListOf(cfg.store).find((t) => t.id === taskId);
  if (!task) return;
  openConfirm({
    title: '删除任务',
    message: `确定删除「${task.name}」？该任务的过关与抄写记录会一起删除，不可恢复。`,
    danger: true,
    onConfirm: () => {
      state[cfg.store] = taskListOf(cfg.store).filter((t) => t.id !== taskId);
      if (sysSel[cfg.store] === taskId) sysSel[cfg.store] = '';
      if (sysDraft && sysDraft.taskId === taskId) sysDraft = null;
      saveState();
      closeModal();
      renderView();
      toast('任务已删除', 'ok');
    }
  });
}

/* 发布抄写任务：过关统计页的头部按钮、抄写统计页的目录项都能发起。
   把发布时刻的过关情况拍成快照 —— 未过关的进名单，已过关的标记「无需抄写」；
   轮次名按发布次序取「一轮抄写 / 二轮抄写 / 三轮抄写」。
   传入 task 就发布到那个任务，不传则发到当前选中的任务。 */
function sysPublishCopy(taskArg) {
  if (!can.admin) { toast('只有管理员可以发布抄写任务', 'warn'); return; }
  const cfg = sysOfMod(currentModule);
  const task = taskArg || sysActiveTask(cfg);
  if (!task) { toast('请先选择任务', 'warn'); return; }
  /* 有未保存的过关草稿时先别发抄写：发布用的是已落库的名单，草稿会悄悄丢掉 */
  if (sysDraft && sysDraft.kind === 'pass' && sysDraft.taskId === task.id
    && Object.keys(sysDraft.map).length) {
    toast(`「${task.name}」还有 ${Object.keys(sysDraft.map).length} 项过关修改没保存，先「保存」或「放弃」再发布抄写`, 'warn', 3800);
    return;
  }
  const failed = sysFailedIds(task);
  if (!failed.length) { toast('当前没有未过关学生，不需要发布抄写任务', 'warn', 3200); return; }
  const rounds = Array.isArray(task.copyRounds) ? task.copyRounds : [];
  const no = rounds.reduce((m, r) => Math.max(m, Number(r.no) || 0), 0) + 1;
  const passed = {};
  taskStudents(task).forEach((s) => {
    if (s.name && s.name.trim() && task.records[s.id]) passed[s.id] = true;
  });
  const round = {
    id: newRoundId(),
    no,
    name: `${cnNum(no)}轮抄写`,
    sids: failed.slice(),
    pass: passed,
    done: {},
    createdAt: new Date().toISOString(),
    by: actorName()
  };
  task.copyRounds = rounds.concat(round);
  sysRoundSel[cfg.store] = round.id;
  if (sysDraft) sysDraft = null;
  saveState();
  renderView();
  toast(`已发布「${round.name}」：${failed.length} 人待抄，名单按此刻过关情况固化`, 'ok', 3600);
}

/* 抄写统计页的目录项发布入口：把任务挂到点中的那个目录上。
   一个目录可能发过多次听写 / 背诵任务，这里固定取该目录最新的一次，
   保证同一目录项反复发布时，轮次能在同一个任务里按「一轮 / 二轮 / 三轮」往上走。 */
function sysPublishCopyFor(nodeId) {
  if (!can.admin) { toast('只有管理员可以发布抄写任务', 'warn'); return; }
  const cfg = sysOfMod(currentModule);
  const node = sysNode(cfg, nodeId);
  if (!node) { toast('目录不存在，可能已被删除', 'warn'); return; }
  const task = sysTasksAll(cfg).find((t) => String(t.nodeId || '') === String(nodeId));
  if (!task) {
    toast(`「${node.name}」还没有${cfg.kind}任务，先到「${cfg.passTitle}」在这个目录发布任务`, 'warn', 3800);
    return;
  }
  sysSelectTask(cfg, task.id);
  sysPublishCopy(task);
}

function sysDeleteRound(roundId) {
  if (!can.admin) return;
  const cfg = sysOfMod(currentModule);
  const task = sysActiveTask(cfg);
  if (!task) return;
  const r = (task.copyRounds || []).find((x) => x.id === roundId);
  if (!r) return;
  openConfirm({
    title: '删除这一轮抄写',
    message: `确定删除「${r.name || '第 ' + r.no + ' 轮'}」抄写任务？这一轮的完成情况会一起删除。`,
    danger: true,
    onConfirm: () => {
      task.copyRounds = (task.copyRounds || []).filter((x) => x.id !== roundId);
      if (sysRoundSel[cfg.store] === roundId) sysRoundSel[cfg.store] = '';
      if (sysDraft && sysDraft.roundId === roundId) sysDraft = null;
      saveState();
      closeModal();
      renderView();
      toast('已删除该轮抄写', 'ok');
    }
  });
}

/* 当前查看的抄写轮次：选中的那一轮；没选过就默认最新发布的一轮 */
function sysCurrentRound(cfg, task) {
  const rounds = sysRounds(task);
  if (!rounds.length) return null;
  return rounds.find((r) => r.id === sysRoundSel[cfg.store]) || rounds[rounds.length - 1];
}

/* ---------- 19.6 座次表渲染 ---------- */
/* 按任务渲染：名单与教室布局都取任务固化的座次表快照（老任务回退全班名单） */
function sysStageHTML(seatFor, task) {
  const cols = sysSeatMatrix(task);
  const view = sysSeatView(task);
  const layout = taskLayout(task);
  const aisles = Array.isArray(layout.aisleAfter) ? layout.aisleAfter : [];
  const podium = layout.podium;
  if (view.empty) {
    return `<div class="seat-hint">这份座次表还没有学生。${can.admin
      ? '到「录入学员」建一份座次表，发布任务时选取它。'
      : '等管理员在「录入学员」建好座次表并发布任务后，这里就会显示。'}</div>`;
  }
  return cols.slice(view.minG - 1, view.maxG).map((col, gi) => {
    const g = view.minG + gi;
    const cells = col.slice(0, view.maxRow).map((s, ri) => {
      const r = ri + 1;
      if (podium && podium.row === r && podium.group === g) return '<div class="seat seat--podium">讲台</div>';
      if (!s) return '<div class="seat seat--empty" aria-hidden="true"></div>';
      return seatFor(s);
    }).join('');
    return `<div class="seat-group${aisles.indexOf(g) !== -1 ? ' aisle-after' : ''}">
      <div class="seat-group__label">第 ${g} 组</div>
      <div class="seat-column" style="grid-template-rows:repeat(${view.maxRow},minmax(46px,1fr))">${cells}</div>
    </div>`;
  }).join('');
}

function sysSeatButton(s, val, kind, dirty) {
  return `<button class="seat ${val ? 'is-done' : ''}${dirty ? ' is-dirty' : ''}" data-action="sys-seat"
      data-sysseat="${s.id}" data-sid="${s.id}" aria-pressed="${val}"
      title="第 ${s.row} 排 · 第 ${s.group} 组 · 点击切换">
      <span class="seat__name">${esc(s.name)}</span>
      <span class="seat__status">${val ? SYS_LABEL_DONE[kind] : SYS_LABEL_UNDONE[kind]}</span>
    </button>`;
}

function sysSeatNa(s, text) {
  return `<div class="seat seat--na" title="${esc(text)}">
    <span class="seat__name">${esc(s.name)}</span>
    <span class="seat__status">无需抄写</span>
  </div>`;
}

function sysSaveBarHTML(cfg, task, round, kind) {
  const n = sysDraftCount(cfg, task, round, kind);
  return `<div class="sys-savebar${n ? ' is-on' : ''}" id="sysSaveBar">
      <span class="sys-savebar__text">未保存 <b data-sys-count>${n}</b> 项修改</span>
      <button class="btn btn--primary btn--sm" data-action="sys-save" ${n ? '' : 'disabled'}>保存</button>
      <button class="btn btn--ghost btn--sm" data-action="sys-discard">放弃</button>
    </div>`;
}

/* ---------- 19.7 目录树（两页共用） ---------- */
function sysTaskRowHTML(cfg, task, active, opts = {}) {
  const st = sysTaskStats(task);
  let badge = '';
  let tip = `${task.levels.join(' › ')} · ${task.date} 发布${task.customName ? ' · 自定义名' : ''}`;
  if (opts.copy) {
    const rounds = sysRounds(task);
    let todo = 0;
    rounds.forEach((r) => { todo += sysCopyStats(task, r).undone; });
    /* 抄写页的侧栏只有 200 多像素：徽标写短（2 轮·待 12），完整说法放 title；
       发布日期也不再单独占一列，让任务名能露出来。 */
    badge = rounds.length
      ? `<span class="sys-task__badge ${todo ? 'is-todo' : 'is-ok'}">${rounds.length} 轮·待 ${todo}</span>`
      : '<span class="sys-task__badge">未发布</span>';
    tip = `${task.levels.join(' › ')} · 共 ${rounds.length} 轮抄写，待抄 ${todo} 人次`;
  } else {
    badge = `<span class="sys-task__badge ${st.failed ? 'is-todo' : 'is-ok'}">${st.passed}/${st.total}</span>`;
  }
  return `<button class="sys-task${active ? ' is-active' : ''}" data-action="sys-task-open" data-id="${esc(task.id)}"
      data-sortable="1" data-sort-scope="${cfg.store === 'rTasks' ? 'r' : 'd'}" data-sort-kind="task"
      data-sort-id="${esc(task.id)}" data-sort-group="${cfg.store === 'rTasks' ? 'r' : 'd'}:task:${esc(task.nodeId || '')}"
      title="${esc(tip)}">
      <span class="sys-task__dot" data-tone="${cfg.tone}"></span>
      <span class="sys-task__name">${esc(task.name)}</span>
      ${badge}
      ${opts.copy ? '' : `<span class="sys-task__date">${esc(String(task.date || '').slice(5))}</span>`}
    </button>`;
}

function sysTreeHTML(cfg, activeId, opts = {}) {
  const copyMode = !!opts.copy;
  const rows = [];
  const walk = (parentId, depth) => {
    sysChildren(cfg, parentId).forEach((n) => {
      const kids = sysChildren(cfg, n.id);
      const tasks = sysTasksOf(cfg, n.id);
      const open = sysFold[n.id] !== false;
      const caret = (kids.length || tasks.length)
        ? `<button class="sys-node__caret${open ? '' : ' is-closed'}" data-action="sys-fold" data-id="${esc(n.id)}"
             aria-label="${open ? '收起' : '展开'}">${open ? '▾' : '▸'}</button>`
        : '<span class="sys-node__caret is-empty"></span>';
      const rounds = tasks.reduce((k, t) => k + sysRounds(t).length, 0);
      const count = copyMode ? (rounds || '') : (tasks.length || '');
      /* 两页共用同一份目录数据：这边能改的（新增 / 改名 / 删除）那边立刻同步；
         抄写页只多一个「＋抄写」——把这一项目的未过关名单固化成下一轮抄写。 */
      const acts = copyMode
        ? `${can.admin && tasks.length ? `<button data-action="sys-copy-node" data-id="${esc(n.id)}" title="把「${esc(n.name)}」此刻的未过关名单固化成「${cnNum(rounds + 1)}轮抄写」">＋抄写</button>` : ''}`
        : (can.admin ? `<button data-action="sys-task-new" data-id="${esc(n.id)}" title="在这个目录发布${esc(cfg.kind)}任务">＋任务</button>
              ${depth < 2 ? `<button data-action="sys-node-new" data-id="${esc(n.id)}" title="新建子目录">＋子级</button>` : ''}
              <button data-action="sys-node-rename" data-id="${esc(n.id)}" title="重命名">✎</button>
              <button data-action="sys-node-del" data-id="${esc(n.id)}" title="删除目录">×</button>` : '');
      rows.push(`<div class="sys-node" data-depth="${depth}">
          <div class="sys-node__row" data-sortable="1" data-sort-scope="${cfg.store === 'rTasks' ? 'r' : 'd'}"
               data-sort-kind="node" data-sort-id="${esc(n.id)}"
               data-sort-group="${cfg.store === 'rTasks' ? 'r' : 'd'}:cat:${esc(parentId)}">
            ${caret}
            <span class="sys-node__name" title="第 ${depth + 1} 级目录">${esc(n.name)}</span>
            <span class="sys-node__count" title="${copyMode ? `${rounds} 轮抄写` : `${tasks.length} 个任务`}">${count}</span>
            <span class="sys-node__acts${copyMode && can.admin ? ' is-always' : ''}">${acts}</span>
          </div>
          ${open ? tasks.map((t) => `<div class="sys-node__tasks" data-depth="${depth + 1}">${sysTaskRowHTML(cfg, t, t.id === activeId, copyMode ? { copy: true } : {})}</div>`).join('') : ''}
        </div>`);
      if (open) walk(n.id, depth + 1);
    });
  };
  walk('', 0);
  if (rows.length) return rows.join('');
  return copyMode
    ? '<p class="sys-side__empty">目录与「' + esc(cfg.passTitle) + '」共用一份。先在那边建好目录，这里会自动出现。</p>'
    : '<p class="sys-side__empty">还没有目录。管理员点「＋ 一级目录」开始。</p>';
}

/* 过关页里的一条「已发布抄写」集合：点任一项跳到对应轮次的抄写座次表 */
function sysCopyStripHTML(cfg, task) {
  const rounds = sysRounds(task);
  const failed = sysFailedIds(task).length;
  if (!rounds.length) {
    return `<div class="sys-copystrip">
      <span class="sys-copystrip__label">抄写任务</span>
      <span class="sys-copystrip__empty">还没发布${failed ? ` —— 点右上「＋ 发布抄写任务」，把此刻 ${failed} 名未过关学生固化成第一轮` : '（当前全部过关）'}</span>
    </div>`;
  }
  const chips = rounds.map((r) => {
    const cs = sysCopyStats(task, r);
    return `<button class="sys-copy-chip${cs.undone ? '' : ' is-ok'}" data-action="sys-jump" data-mod="${cfg.copyMod}"
      data-id="${esc(task.id)}" data-round="${esc(r.id)}" title="${esc(r.name)} · 点击打开这一轮的座次表">
      ${esc(r.name)}<span>${cs.done}/${cs.total} 已抄</span></button>`;
  }).join('');
  return `<div class="sys-copystrip">
    <span class="sys-copystrip__label">抄写任务 ${rounds.length} 轮</span>
    ${chips}
  </div>`;
}

/* ---------- 19.8 听写 / 背诵过关统计页 ---------- */

   只有「背诵过关统计」与「任务督检」会渲染它；组长在这里登录，管理员也能从这里保存并退出。 */

    <span class="editbar__ico" aria-hidden="true">🔒</span>
    <div class="editbar__text">
      <b>只读预览</b>
      <span>${leaderOk

   不论从哪进，名单都是发布那一刻固化下来的，轮次名按发布次序叫「一轮抄写 / 二轮抄写 / 三轮抄写」。 */
function renderSysCopy(cfg) {
  const task = sysActiveTask(cfg);
  const rounds = task ? sysRounds(task) : [];

  const seatStage = (task && round)
    ? sysStageHTML((s) => {

        return sysSeatNa(s, sysRoundPassed(task, round, s.id) ? '发布抄写时已过关，无需抄写' : '不在本轮抄写名单');
      }
      const val = sysEffective(cfg, task, round, s.id, kind);
      const dirtyOne = sysDraftMatch(cfg, task, round, kind) && Object.prototype.hasOwnProperty.call(sysDraft.map, s.id);
      return sysSeatButton(s, val, kind, dirtyOne);
    }, task)
    : '';

  const tabs = rounds.map((r) => {

    const active = round && r.id === round.id;
    return `<button class="sys-round${active ? ' is-active' : ''}" data-action="sys-round-open" data-id="${esc(r.id)}"

  }).join('');

  /* 左栏与「过关统计」共用同一份目录：那边新增 / 改名 / 删除，这里立刻跟着变。
     任务挂在所属目录下，抄写轮次不上左栏（仍显示在右侧上方的标签条里）。 */
  const treeHTML = sysTreeHTML(cfg, task ? task.id : '', { copy: true });
  const nextNo = task ? (rounds.reduce((m, r) => Math.max(m, r.no), 0) + 1) : 1;
  const failedN = task ? sysFailedIds(task).length : 0;

        ${round ? `<span class="tag">${esc(round.name)}</span>` : '<span class="tag">尚未发布抄写任务</span>'}
        ${taskChartName(task) ? `<span class="tag tag--chart" title="该任务使用的座次表，改名后这里会同步">座次表 ${esc(taskChartName(task))}</span>` : ''}
      </div>
      <div class="module-head__stats">
        <div class="mstat mstat--undone"><b>${st.undone}</b><span>待抄写</span></div>
        <div class="mstat mstat--done"><b>${st.done}</b><span>已抄写</span></div>
        <div class="mstat"><b>${st.total}</b><span>本轮人数</span></div>
      </div>
      <div class="module-head__actions">
        ${classSwitchHTML({ compact: true })}
        <button class="btn btn--outline btn--sm" data-action="seat-big" aria-pressed="false" title="把座次表放大铺满屏幕，按 Esc 返回">⛶ 大屏</button>
        ${task && can.admin ? `<button class="btn btn--primary btn--sm" data-action="sys-copy-new" ${canNew ? '' : 'disabled'}
            title="${failedN ? `把此刻仍未过关的 ${failedN} 人固化成「${cnNum(nextNo)}轮抄写」` : '这个任务此刻全部过关，没有要抄的人'}">＋ 发布${cnNum(nextNo)}轮抄写</button>` : ''}
        <button class="btn btn--outline btn--sm" data-nav="#/module/${cfg.key}">去${esc(cfg.passTitle)} →</button>
      </div>
    </header>

    <div class="sys-body">
      <aside class="sys-side">
        <div class="sys-side__head">
          <span>${esc(cfg.kind)}抄写目录</span>
          <span class="sys-side__num">${sysTasksAll(cfg).length} 个任务</span>
        </div>
        <div class="sys-tree">${treeHTML}</div>
        <p class="sys-side__hint">${can.admin
          ? `目录与「${esc(cfg.passTitle)}」共用同一份，那边增改删，这里立刻同步。点「＋抄写」把该项目的未过关名单固化成下一轮。`
          : `目录与「${esc(cfg.passTitle)}」共用同一份，老师那边改了这里立刻同步。`}长按目录项可拖动排序。</p>
      </aside>

      <div class="sys-main">
        ${task && round ? `
          <div class="sys-rounds">${tabs}</div>

          <div class="stage stage--sys">
            ${state.layout.podium ? '' : '<div class="podium" aria-hidden="true">讲台</div>'}
            <div class="seat-stage">${seatStage}</div>

              <span><i class="sys-dot" data-tone="done"></i>已抄写</span>
              <span><i class="sys-dot" data-tone="undone"></i>待抄写</span>
              <span><i class="sys-dot" data-tone="na"></i>发布时已过关</span>

            </div>
          </div>
        ` : `<div class="sys-empty">
            <b>${task ? `「${esc(task.name)}」还没有抄写任务` : `还没有${esc(cfg.kind)}任务`}</b>
            <p>${task
              ? `点右上角「＋ 发布${cnNum(nextNo)}轮抄写」，就会把此刻未过关的同学固化成一份抄写座次表；也可以点左侧该目录上的「＋抄写」。`
              : `先到「${esc(cfg.passTitle)}」的目录里发布${esc(cfg.kind)}任务，任务会自动挂到对应目录下。`}</p>
            ${task && can.admin
              ? `<button class="btn btn--primary btn--sm" data-action="sys-copy-new" ${canNew ? '' : 'disabled'}>＋ 发布${cnNum(nextNo)}轮抄写</button>`
              : `<button class="btn btn--primary btn--sm" data-nav="#/module/${cfg.key}">去${esc(cfg.passTitle)} →</button>`}
          </div>`}
      </div>
    </div>
  </div>`;
}

/* 路由入口：四个模块（听写/听写抄写/背诵/背诵抄写）都走这里 */
function renderSysModule(mod) {
  const cfg = sysOfMod(mod);
  if (isCopyMod(mod)) renderSysCopy(cfg);
  else renderSysPass(cfg);
}

/* ---------- 19.10 新版每日统计：过关情况 + 抄写完成情况 ---------- */
function sysNamesChips(task, ids, tone) {
  if (!ids.length) return '<span class="dstat-ok">全部完成 ✓</span>';
  const map = new Map(taskStudents(task).map((s) => [s.id, s]));
  return ids.map((sid) => {
    const s = map.get(sid);
    return s ? `<span class="dstat-chip" data-tone="${tone}">${esc(s.name)}</span>` : '';
  }).join('');
}

function sysSeatOrder(task, ids) {
  const map = new Map(taskStudents(task).map((s) => [s.id, s]));
  return ids.slice().sort((a, b) => {
    const A = map.get(a);
    const B = map.get(b);
    if (!A || !B) return 0;
    return (A.row - B.row) || (A.group - B.group);
  });
}

/* 学情待办汇总顶部的「听写规章」：一条一行；行首写 ①②③ 的作为上一条的细则，缩进显示 */
/* 当前选中的规章标签：dictation / recite。只存在内存里，刷新回到「听写规章」 */
let dstatRuleTab = 'dictation';

/* 把规章文本解析成 有序条目：一条一行；行首 ①②③ 的算上一条的细则 */
function dstatRuleListHTML(text) {
  const lines = String(text || '').split('\n').map((l) => l.trim()).filter(Boolean);
  if (!lines.length) return '';
  const items = [];
  lines.forEach((line) => {
    const m = line.match(/^([①②③④⑤⑥⑦⑧⑨])\s*(.*)$/);
    if (m && items.length) {
      const body = m[2];
      const at = body.indexOf('：');
      items[items.length - 1].subs.push({
        no: m[1],
        label: at > 0 ? body.slice(0, at) : '',
        text: at > 0 ? body.slice(at + 1) : body
      });
      return;
    }
    items.push({ text: m ? m[2] : line, subs: [] });
  });
  return `<ol class="doc-rules__list">${items.map((it) => `<li>${esc(it.text)}${it.subs.length ? `<ul class="doc-rules__sub">${
    it.subs.map((sb) => `<li data-no="${esc(sb.no)}">${sb.label ? `<b>${esc(sb.label)}</b>：` : ''}${esc(sb.text)}</li>`).join('')
  }</ul>` : ''}</li>`).join('')}</ol>`;
}

/* 学情待办汇总顶部：听写规章 / 背诵规章 两个标签页 */
function dstatRulesHTML() {
  const panels = [
    { key: 'dictation', title: '听写规章', en: 'DICTATION', html: dstatRuleListHTML(state.rules.dstat) },
    { key: 'recite', title: '背诵规章', en: 'RECITATION', html: dstatRuleListHTML(state.rules.dstatRecite) }
  ].filter((p) => p.html);
  if (!panels.length) return '';
  /* 只配了一类内容时不必给标签，直接按单栏展示 */
  if (panels.length === 1) {
    return `<section class="doc-rules" aria-label="${esc(panels[0].title)}">
      <div class="doc-rules__head">
        <h2 class="doc-rules__title">${esc(panels[0].title)}</h2>
        <span class="doc-rules__en">${panels[0].en}</span>
      </div>
      ${panels[0].html}
    </section>`;
  }
  const active = dstatRuleTab === 'recite' ? 'recite' : 'dictation';
  return `<section class="doc-rules" aria-label="学情规章">
      <div class="doc-rules__head">
        <div class="doc-tabs" role="tablist" aria-label="规章类型">
          ${panels.map((p) => `<button type="button" class="doc-tab${p.key === active ? ' is-active' : ''}" role="tab"
            aria-selected="${p.key === active}" data-action="dstat-rule-tab" data-tab="${p.key}">${esc(p.title)}<i>${p.en}</i></button>`).join('')}
        </div>
      </div>
      ${panels.map((p) => `<div class="doc-panel" role="tabpanel" data-panel="${p.key}"${p.key === active ? '' : ' hidden'}>${p.html}</div>`).join('')}
    </section>`;
}

/* 切换规章标签：只切 DOM，不整页重画，滚动位置不动 */
function setDstatRuleTab(tab) {
  dstatRuleTab = tab === 'recite' ? 'recite' : 'dictation';
  $$('.doc-tab').forEach((b) => {
    const on = b.dataset.tab === dstatRuleTab;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  $$('.doc-panel').forEach((panel) => { panel.hidden = panel.dataset.panel !== dstatRuleTab; });
}

/* 后台改了规章文字：不重建控制台，只把页面上那块换掉 */
function refreshDstatRulesCard() {
  const host = document.querySelector('.doc-rules');
  if (!host) return;
  const box = document.createElement('div');
  box.innerHTML = dstatRulesHTML();
  if (box.firstElementChild) host.replaceWith(box.firstElementChild);
}

function renderDailyStats() {
  const M = MODULES.dstat;
  statRefreshedAt = hhmmss();

  /* 汇总口径：该系统下「全部已发布任务」与「全部已发布轮次」，
     不是只算最新一次——历史任务没人过关，统计页也必须能看见。 */
  const systems = SYS_LIST.map((key) => {
    const cfg = SYS_CFG[key];
    const tasks = sysTasksAll(cfg);
    const all = tasks.reduce((n, t) => {
      const st = sysTaskStats(t);
      return { total: n.total + st.total, passed: n.passed + st.passed, failed: n.failed + st.failed };
    }, { total: 0, passed: 0, failed: 0 });
    const rounds = tasks.reduce((n, t) => n + sysRounds(t).length, 0);
    const copyPending = tasks.reduce((n, t) => (
      n + sysRounds(t).reduce((k, r) => k + sysCopyStats(t, r).undone, 0)
    ), 0);
    return { cfg, tasks, all, rounds, copyPending };
  });

  /* 第一部分：每个任务的过关情况
     只显示仍有未过关学员的任务：全员过关的任务不再出现，避免清单越攒越长。 */
  const passRows = systems.map(({ cfg, tasks, all }) => {
    const pendingTasks = tasks.filter((t) => sysTaskStats(t).failed > 0);
    return `
    <div class="dstat-card" data-tone="${cfg.tone}">
      <div class="dstat-card__head">
        <span class="dstat-card__tag" data-tone="${cfg.tone}">${cfg.kind}</span>
        <b>待过关</b>
        <span class="dstat-card__count">${pendingTasks.length} 个任务 · 待过关 ${all.failed} 人次</span>
      </div>
      ${pendingTasks.length ? `<div class="dstat-rows">
        ${pendingTasks.map((t) => {
          const st = sysTaskStats(t);
          const failedIds = sysSeatOrder(t, sysFailedIds(t));
          return `<div class="dstat-row" data-tone="${cfg.tone}">
            <div class="dstat-row__top">
              <button class="dstat-row__name" data-action="sys-jump" data-mod="${cfg.key}" data-id="${esc(t.id)}"
                title="打开这个任务的座次表">${esc(taskPathText(t))}</button>
              <span class="dstat-row__chart" title="这个任务使用的座次表">${esc(taskChartName(t) || '全班名单')}</span>
              <span class="dstat-row__date">${esc(String(t.date || '').slice(5))}</span>
              <span class="dstat-row__num"><b>${st.passed}</b>/${st.total}</span>
            </div>
            <div class="dstat-bar"><i style="width:${st.rate}%"></i></div>
            <div class="dstat-row__names">${sysNamesChips(t, failedIds, cfg.tone)}</div>
          </div>`;
        }).join('')}
      </div>` : `<p class="dstat-empty">${tasks.length ? '所有任务已全员过关 ✓' : '还没有发布任务'}</p>`}
    </div>`;
  }).join('');

  /* 第二部分：每个任务的抄写完成情况（第 1 轮 + 已发布的二次抄写）
     只显示仍有待抄学员的轮次：全员抄完的轮次不再出现。 */
  const copyRows = systems.map(({ cfg, tasks }) => {
    const blocks = [];
    tasks.forEach((t) => {
      const rounds = sysRounds(t);
      rounds.forEach((r) => {
        const st = sysCopyStats(t, r);
        const pending = sysSeatOrder(t, sysRoundSids(t, r).filter((sid) => !(r.done && r.done[sid])));
        blocks.push({ t, r, st, pending });
      });
    });
    const shown = blocks.filter((b) => b.st.undone > 0);
    const totalPending = shown.reduce((n, b) => n + b.st.undone, 0);
    return `<div class="dstat-card" data-tone="${cfg.tone}">
      <div class="dstat-card__head">
        <span class="dstat-card__tag" data-tone="${cfg.tone}">${cfg.kind}</span>
        <b>待抄写</b>
        <span class="dstat-card__count">${shown.length} 个轮次 · 待抄写 ${totalPending} 人次</span>
      </div>
      ${shown.length ? `<div class="dstat-rows">
        ${shown.map(({ t, r, st, pending }) => `
          <div class="dstat-row" data-tone="${cfg.tone}">
            <div class="dstat-row__top">
              <button class="dstat-row__name" data-action="sys-jump" data-mod="${cfg.copyMod}" data-id="${esc(t.id)}"
                data-round="${esc(r.id)}" title="打开这一轮抄写座次表">${esc(taskPathText(t))}</button>
              <span class="dstat-row__badge">${esc(r.label)}</span>
              <span class="dstat-row__num"><b>${st.done}</b>/${st.total}</span>
            </div>
            <div class="dstat-bar"><i style="width:${st.total ? Math.round((st.done / st.total) * 100) : 0}%"></i></div>
            <div class="dstat-row__names">${sysNamesChips(t, pending, cfg.tone)}</div>
          </div>`).join('')}
      </div>` : `<p class="dstat-empty">${blocks.length ? '所有抄写轮次已完成 ✓' : '还没有发布抄写任务（到「过关统计」里发布）'}</p>`}
    </div>`;
  }).join('');

  const totalCopyPending = systems.reduce((n, { cfg, tasks }) => n + tasks.reduce((m, t) => (
    m + sysRounds(t).reduce((k, r) => k + sysCopyStats(t, r).undone, 0)
  ), 0), 0);

  $('#view').innerHTML = `
  <div class="module-view module-view--stat">
    <header class="module-head module-head--stat">
      <button class="btn btn--ghost btn--sm" data-nav="#/home" aria-label="返回首页">← 返回</button>
      <div class="module-head__title">
        <div class="module-head__name">
          <h1>${M.title}</h1>
          <span class="stat-sub">只统计仍有未完成学员的任务与轮次 · 全员完成的自动收起</span>
        </div>
      </div>
      <div class="module-head__stats">
        ${systems.map(({ cfg, all }) => `
          <div class="mstat mstat--undone" title="该系统全部任务的未过关人次合计"><b>${all.failed}</b><span>${cfg.kind}待过关</span></div>`).join('')}
        <div class="mstat mstat--undone" title="全部任务、全部轮次里还没抄完的人次合计"><b>${totalCopyPending}</b><span>待抄项</span></div>
      </div>
      <div class="module-head__actions">
        ${classSwitchHTML({ compact: true })}
        <span class="stat-stamp" title="每次打开都按服务器最新数据重新汇总">数据时间 ${esc(statRefreshedAt)}</span>
        <button class="btn btn--outline btn--sm" data-action="stat-refresh">↻ 刷新</button>
      </div>
    </header>

    ${dstatRulesHTML()}

    <div class="dstat-parts">
      <section class="dstat-part">
        <div class="dstat-part__head">
          <span class="dstat-part__no">一</span>
          <div>
            <h2>待过关</h2>
            <p>汇总听写与背诵的<b>全部已发布任务</b>（不止最新一次）：每个任务一行，列出仍未通过的同学，点任务名可直接跳到那张座次表。<b>全员过关的任务不再显示</b>。</p>
          </div>
        </div>
        <div class="dstat-grid">${passRows}</div>
      </section>

      <section class="dstat-part">
        <div class="dstat-part__head">
          <span class="dstat-part__no">二</span>
          <div>
            <h2>待抄写</h2>
            <p>汇总听写抄写与背诵抄写的<b>全部已发布轮次</b>（第 1 轮 + 每一轮二次抄写）：每轮一行，按发布时冻结的名单统计。<b>全员抄完的轮次不再显示</b>。</p>
          </div>
        </div>
        <div class="dstat-grid">${copyRows}</div>
      </section>
    </div>
  </div>`;
}

/* =========================================================
   20. 常规表现：任务督检 / 课堂纪律（每次发布一张座次表）
   ---------------------------------------------------------
   与「学情表现」的区别：听写 / 背诵记录的是「学得怎么样」，
   这里记录的是「作业交没交、课上守不守纪」，都属于行为常规。
   共同点：都按座位点选、都实时保存、都按班级各存一份。
   数据结构（都挂在班级字段上，切换班级自动跟着变）：
     hwChecks : [{ id, name, date, roster{chartId,chartName,students,layout},
                   records{sid:true 已交}, by, createdAt }]
     discTasks: [{ id, name, date, roster{...}, counts{sid:n}, by, createdAt }]
   ========================================================= */
const REG_CFG = {
  hwcheck: {
    key: 'hwcheck', store: 'hwChecks', title: '任务督检', noun: '督检任务',
    okLabel: '已完成', badLabel: '未完成'
  },
  discipline: {
    key: 'discipline', store: 'discTasks', title: '课堂纪律', noun: '纪律监管任务',
    okLabel: '守纪', badLabel: '违纪'
  }
};

const regSel = { hwcheck: '', discipline: '' };
const regDel = { id: '' };      // 课堂纪律：上一次点过的座位（用于「撤销上一次」）

/* 课堂纪律的草稿：点座位只改这里的 counts，点「保存」才写回任务并同步。
   结构 { taskId, counts:{sid:新次数} }；值为 0 的键在保存时按删除处理。 */
let discDraft = null;

function discDraftCount(task) {
  if (!discDraft || !task || discDraft.taskId !== task.id) return 0;
  return Object.keys(discDraft.counts).length;
}

/* 某个座位此刻该显示的次数：有草稿用草稿，没草稿用已保存的值 */
function discSeatCount(task, sid) {
  const base = Math.max(0, Number(task && task.counts && task.counts[sid]) || 0);
  if (discDraft && task && discDraft.taskId === task.id
    && Object.prototype.hasOwnProperty.call(discDraft.counts, sid)) {
    return discDraft.counts[sid];
  }
  return base;
}

function discDraftEnsure(task) {
  if (!discDraft || discDraft.taskId !== task.id) discDraft = { taskId: task.id, counts: {} };
  return discDraft;
}

/* 草稿里记一笔：next 与已保存值相同就把这个键清掉，避免「假修改」 */
function discDraftSet(task, sid, next) {
  const base = Math.max(0, Number(task.counts && task.counts[sid]) || 0);
  const d = discDraftEnsure(task);
  if (next === base) delete d.counts[sid];
  else d.counts[sid] = next;
}

function discSave(quiet) {
  const task = regTask('discipline');
  const n = discDraftCount(task);
  if (!task || !n) { if (!quiet) toast('没有需要保存的修改', 'warn'); return; }
  if (!task.counts) task.counts = {};
  Object.keys(discDraft.counts).forEach((sid) => {
    const v = Number(discDraft.counts[sid]) || 0;
    if (v > 0) task.counts[sid] = v;
    else delete task.counts[sid];
  });
  discDraft = null;
  saveState();
  renderView();
  if (!quiet) toast(`课堂纪律已保存：${n} 项修改已同步`, 'ok', 2200);
}

function discDiscard() {
  if (!discDraft) return;
  discDraft = null;
  renderView();
  toast('已放弃未保存的修改', 'ok', 1600);
}

function discSaveBarHTML(task) {
  const n = discDraftCount(task);
  return `<div class="sys-savebar sys-savebar--reg${n ? ' is-on' : ''}" id="regSaveBar">
      <span class="sys-savebar__text">未保存 <b data-reg-count>${n}</b> 项修改</span>
      <button class="btn btn--primary btn--sm" data-action="reg-save" ${n ? '' : 'disabled'}>保存</button>
      <button class="btn btn--ghost btn--sm" data-action="reg-discard" ${n ? '' : 'disabled'}>放弃</button>
    </div>`;
}

/* 取该项目的全部记录（返回 state 上的真实数组，可直接 unshift / splice） */
function regList(kind) {
  const key = REG_CFG[kind].store;
  if (!Array.isArray(state[key])) state[key] = [];
  return state[key];
}

function regTask(kind) {
  const list = regList(kind);
  return list.find((t) => t.id === regSel[kind]) || list[0] || null;
}

/* ---------- 任务督检：左侧目录树（结构与听写 / 背诵的目录树一致） ---------- */
function hwCat() {
  if (!Array.isArray(state.hwCat)) state.hwCat = [];
  return state.hwCat;
}
function hwNode(id) {
  return hwCat().find((n) => n.id === String(id || '')) || null;
}
function hwChildren(parentId) {
  return hwCat().filter((n) => String(n.parentId || '') === String(parentId || ''));
}
function hwRootNode() {
  return hwChildren('')[0] || null;
}
function hwPath(id) {
  const out = [];
  let cur = hwNode(id);
  let hop = 0;
  while (cur && hop < 5) {
    out.unshift(cur.name);
    cur = cur.parentId ? hwNode(cur.parentId) : null;
    hop += 1;
  }
  return out;
}
const hwDepthOf = (id) => hwPath(id).length;
/* 目录下的督检任务：按数组顺序（= 拖动后的顺序） */
function hwTasksOf(nodeId) {
  return regList('hwcheck').filter((t) => String(t.nodeId || '') === String(nodeId || ''));
}
/* 一个目录都没有时补一个一级目录，保证「总有地方能发布」 */
function hwEnsureRoot() {
  const root = hwRootNode();
  if (root) return root;
  const node = { id: newCatId(), name: '全部任务', parentId: '' };
  state.hwCat = hwCat().concat(node);
  return node;
}

/* 周一起算的「本周」零点：用于默认命名（第几周）与「同周第几份」 */
function regWeekStart(dateStr) {
  const d = new Date(`${dateStr || todayStr()}T00:00:00`);
  if (Number.isNaN(d.getTime())) return regWeekStart(todayStr());
  const w = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - w);
  d.setHours(0, 0, 0, 0);
  return d;
}

/* 默认名称：任务督检「第一周小卷1」，课堂纪律「第1周纪律监管」；
   同一周再发布就顺延序号，跨周自动进到下一周。 */
function regDefaultName(kind) {
  const list = regList(kind);
  if (!list.length) return kind === 'hwcheck' ? '第一周小卷1' : '第1周纪律监管';
  const now = regWeekStart(todayStr()).getTime();
  const first = list.reduce((a, t) => (String(t.date) < String(a.date) ? t : a), list[0]);
  const wk = Math.max(1, Math.round((now - regWeekStart(first.date).getTime()) / (7 * 86400000)) + 1);
  const seq = list.filter((t) => regWeekStart(t.date).getTime() === now).length + 1;
  if (kind === 'hwcheck') return `第${cnNum(wk)}周小卷${seq}`;
  return `第${wk}周纪律监管${seq > 1 ? ` ${seq}` : ''}`;
}

/* 发布用的座次表快照：取本班「主座次表」（与班级人数同一口径），发布后固化 */
function regSnapshot() {
  const cls = currentClass();
  const ch = primaryChart(cls);
  const src = (ch && Array.isArray(ch.students)) ? ch.students : classRoster(cls);
  const students = src
    .filter((s) => s && String(s.name || '').trim())
    .map((s, i) => ({
      id: String(s.id || `g${i + 1}`),
      name: String(s.name).replace(/\s+/g, ' ').trim().slice(0, 12),
      group: Math.min(12, Math.max(1, Number(s.group) || 1)),
      row: Math.min(12, Math.max(1, Number(s.row) || 1))
    }));
  const lay = (ch && ch.layout) || state.layout || {};
  const podium = lay.podium && Number(lay.podium.row) && Number(lay.podium.group)
    ? { row: Number(lay.podium.row), group: Number(lay.podium.group) } : null;
  return {
    chartId: ch ? String(ch.id || '') : '',
    chartName: (ch && ch.name) || currentClassName(),
    students,
    layout: {
      groups: Math.min(12, Math.max(1, Number(lay.groups) || 6)),
      rows: Math.min(12, Math.max(1, Number(lay.rows) || 8)),
      aisleAfter: Array.isArray(lay.aisleAfter) ? lay.aisleAfter.map(Number).filter((n) => n >= 1) : [],
      podium
    }
  };
}

function regPublish(kind, nodeId) {
  const cfg = REG_CFG[kind];
  if (!can.admin) { toast(`只有管理员可以发布${cfg.noun}`, 'warn'); return; }
  const snap = regSnapshot();
  if (!snap.students.length) {
    toast(`「${currentClassName()}」还没有座次表，请先到「录入学员」建一份`, 'warn', 3600);
    return;
  }
  /* 任务督检：发布到左侧目录里（默认挂在当前任务所在目录，没有就挂一级目录） */
  let node = null;
  if (kind === 'hwcheck') {
    const cur = regTask('hwcheck');
    node = hwNode(nodeId) || hwNode(cur && cur.nodeId) || hwRootNode();
    if (!node) node = hwEnsureRoot();
  }
  const nodePath = node ? hwPath(node.id) : [];
  openPrompt({
    title: `发布${cfg.noun}`,
    desc: `${esc(currentClassName())} · 座次表「${esc(snap.chartName)}」（${snap.students.length} 人）· 表格按发布这一刻的座位生成，之后可随时改名。${nodePath.length ? `<br />目录：${esc(nodePath.join(' › '))}` : ''}`,
    value: regDefaultName(kind),
    placeholder: kind === 'hwcheck' ? '例如：第一周小卷1' : '例如：第1周纪律监管',
    onSave: (v) => {
      const name = String(v || '').replace(/\s+/g, ' ').trim().slice(0, 30) || regDefaultName(kind);
      const task = {
        id: (kind === 'hwcheck' ? 'h' : 'd') + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
        kind,
        name,
        date: todayStr(),
        roster: JSON.parse(JSON.stringify(snap)),
        by: actorName(),
        createdAt: new Date().toISOString()
      };
      if (kind === 'hwcheck') {
        /* 默认全部「已完成」：records 里记 true 即已完成，缺省才是未完成 */
        task.nodeId = node ? node.id : '';
        task.records = {};
        snap.students.forEach((s) => { task.records[s.id] = true; });
      } else {
        task.counts = {};
      }
      /* 新发布的一份排在最上面 */
      regList(kind).unshift(task);
      regSel[kind] = task.id;
      regDel.id = '';
      saveState();
      closeModal();
      renderView();
      toast(`已发布「${name}」：默认${kind === 'hwcheck' ? '全部已完成' : '全体守纪'}`, 'ok');
    }
  });
}

function regRename(kind) {
  const cfg = REG_CFG[kind];
  const task = regTask(kind);
  if (!task) return;
  if (!can.admin) { toast('只有管理员可以改名', 'warn'); return; }
  openPrompt({
    title: '给这份记录改名',
    desc: '名字会显示在左侧列表、座次表标题与汇总明细里。',
    value: task.name,
    onSave: (v) => {
      const name = String(v || '').replace(/\s+/g, ' ').trim().slice(0, 30);
      if (!name) { toast('名称不能为空', 'warn'); return; }
      task.name = name;
      saveState();
      closeModal();
      renderView();
      toast('已改名', 'ok');
    }
  });
}

function regDelete(kind) {
  const cfg = REG_CFG[kind];
  const task = regTask(kind);
  if (!task) return;
  if (!can.admin) { toast('只有管理员可以删除', 'warn'); return; }
  openConfirm({
    title: `删除「${task.name}」？`,
    message: `这是 ${esc(task.date)} 发布的一份${esc(cfg.noun)}。删除后这一份的${kind === 'hwcheck' ? '未完成记录' : '违纪次数'}不再计入汇总，其他记录不受影响。`,
    danger: true,
    confirmText: '确认删除',
    onConfirm: () => {
      const arr = regList(kind);
      const i = arr.findIndex((t) => t.id === task.id);
      if (i >= 0) arr.splice(i, 1);
      regSel[kind] = '';
      saveState();
      closeModal();
      renderView();
      toast('已删除', 'ok');
    }
  });
}

/* ---------- 统计口径 ---------- */
/* 单份记录：ok = 已交 / 守纪人数，bad = 未交 / 违纪人数，hit = 违纪人次 */
function regStats(kind, task) {
  const list = (task && task.roster && Array.isArray(task.roster.students)) ? task.roster.students : [];
  let ok = 0;
  let bad = 0;
  let hit = 0;
  list.forEach((s) => {
    if (kind === 'hwcheck') {
      if (task.records && task.records[s.id]) ok += 1;
      else { bad += 1; hit += 1; }
    } else {
      /* 纪律：草稿也算进去，页头的「涉及人数 / 违纪人次」和座位上的颜色始终对得上 */
      const n = Math.max(0, Number(discSeatCount(task, s.id)) || 0);
      if (n) { bad += 1; hit += n; } else ok += 1;
    }
  });
  return { total: list.length, ok, bad, hit, rate: list.length ? Math.round((ok / list.length) * 100) : 0 };
}

function regTotals(kind) {
  const list = regList(kind);
  return list.reduce((acc, t) => {
    const st = regStats(kind, t);
    acc.tasks += 1;
    acc.hit += st.hit;
    acc.bad += st.bad;
    acc.total += st.total;
    return acc;
  }, { tasks: 0, hit: 0, bad: 0, total: 0 });
}

/* 按姓名跨记录累计（不同座次表的 id 可能不同，姓名才是同一个人） */
function regSummary(kind) {
  const map = new Map();
  const bump = (name, n, taskName) => {
    if (!n) return;
    let row = map.get(name);
    if (!row) { row = { name, n: 0, hits: [] }; map.set(name, row); }
    row.n += n;
    row.hits.push({ task: taskName, n });
  };
  regList(kind).forEach((t) => {
    ((t.roster && t.roster.students) || []).forEach((s) => {
      if (kind === 'hwcheck') bump(s.name, (t.records && t.records[s.id]) ? 0 : 1, t.name);
      else bump(s.name, Math.max(0, Number(discSeatCount(t, s.id)) || 0), t.name);
    });
  });
  return Array.from(map.values()).sort((a, b) => (b.n - a.n) || a.name.localeCompare(b.name, 'zh'));
}

/* ---------- 座次表 ---------- */
function regSeatHTML(kind, task, s) {
  if (kind === 'hwcheck') {
    const ok = !!(task.records && task.records[s.id]);
    return `<button class="seat ${ok ? 'is-done' : 'seat--miss'}" data-action="reg-seat" data-kind="hwcheck"
      data-sid="${esc(s.id)}" aria-pressed="${ok}"
      title="第 ${s.row} 排 · 第 ${s.group} 组 · 点击在「已完成 / 未完成」之间切换">
      <span class="seat__name">${esc(s.name)}</span>
      <span class="seat__status">${ok ? '已完成' : '未完成'}</span>
    </button>`;
  }
  const n = discSeatCount(task, s.id);
  const base = Math.max(0, Number(task.counts && task.counts[s.id]) || 0);
  const lv = Math.min(5, n);
  return `<button class="seat seat--disc${n !== base ? ' is-dirty' : ''}" data-action="reg-seat" data-kind="discipline"
    data-sid="${esc(s.id)}" data-n="${n}" data-lv="${lv}" aria-pressed="${n ? 'true' : 'false'}"
    title="第 ${s.row} 排 · 第 ${s.group} 组 · 点一次记 1 次违纪（当前 ${n} 次${n !== base ? '，未保存' : ''}）">
    <span class="seat__name">${esc(s.name)}</span>
    <span class="seat__status">${n ? `违纪 ${n} 次` : '守纪'}</span>
    ${n ? `<span class="seat__count">${n}</span>` : ''}
  </button>`;
}

function regStageHTML(kind, task) {
  const cols = sysSeatMatrix(task);
  const view = sysSeatView(task);
  const layout = taskLayout(task);
  const aisles = Array.isArray(layout.aisleAfter) ? layout.aisleAfter : [];
  const podium = layout.podium;
  if (view.empty) {
    return `<div class="seat-hint">这份座次表还没有学生。${can.admin
      ? '到「录入学员」建一份座次表，再发布新的记录。'
      : '等管理员建好座次表并发布记录后，这里就会显示。'}</div>`;
  }
  return cols.slice(view.minG - 1, view.maxG).map((col, gi) => {
    const g = view.minG + gi;
    const cells = col.slice(0, view.maxRow).map((s, ri) => {
      const r = ri + 1;
      if (podium && podium.row === r && podium.group === g) return '<div class="seat seat--podium">讲台</div>';
      if (!s) return '<div class="seat seat--empty" aria-hidden="true"></div>';
      return regSeatHTML(kind, task, s);
    }).join('');
    return `<div class="seat-group${aisles.indexOf(g) !== -1 ? ' aisle-after' : ''}">
      <div class="seat-group__label">第 ${g} 组</div>
      <div class="seat-column" style="grid-template-rows:repeat(${view.maxRow},minmax(52px,1fr))">${cells}</div>
    </div>`;
  }).join('');
}

/* ---------- 局部刷新（点座位后不整页重画，避免滚动位置跳掉） ---------- */
function regPatchSeat(kind, task, s) {
  const host = document.getElementById('regStage');
  if (!host) return;
  const btn = Array.from(host.querySelectorAll('.seat[data-sid]')).find((b) => b.dataset.sid === s.id);
  if (!btn) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = regSeatHTML(kind, task, s);
  const next = tmp.firstElementChild;
  if (next) btn.replaceWith(next);
}

function regRefresh(kind) {
  const task = regTask(kind);
  if (!task) return;
  const st = regStats(kind, task);
  const head = document.getElementById('regHeadStats');
  if (head) head.innerHTML = regHeadStatsInner(kind, task, st);
  const meta = document.getElementById('regTaskMeta');
  if (meta) meta.innerHTML = regMetaInner(kind, task, st);
  const sum = document.getElementById('regSumBody');
  if (sum) sum.innerHTML = regSumInner(kind);
  const item = document.querySelector(`.reg-item[data-kind="${kind}"].is-active .reg-item__meta`);
  if (item) {
    const s2 = regStats(kind, task);
    item.innerHTML = regItemMeta(kind, task, s2);
  }
  /* 任务督检：左栏当前这一份的徽标跟着变，不用整页重画 */
  if (kind === 'hwcheck') {
    const row = document.querySelector('.sys-task.is-active');
    const badge = row ? row.querySelector('.sys-task__badge') : null;
    if (badge) {
      badge.textContent = `${st.ok}/${st.total}`;
      badge.classList.toggle('is-todo', !!st.bad);
      badge.classList.toggle('is-ok', !st.bad);
    }
  }
}

/* ---------- 交互 ---------- */
function regSeatClick(kind, sid) {
  if (!(can.entry || leaderCanEdit(kind))) {
    openRegLogin(kind);
    return;
  }
  const task = regTask(kind);
  if (!task) return;
  const s = ((task.roster && task.roster.students) || []).find((x) => x.id === sid);
  if (!s) return;
  if (kind === 'hwcheck') {
    if (task.records[sid]) delete task.records[sid];
    else task.records[sid] = true;
    saveState();
  } else {
    /* 纪律：只改草稿，点「保存」才落库 */
    const next = Math.min(99, discSeatCount(task, sid) + 1);
    discDraftSet(task, sid, next);
    regDel.id = sid;
    regDel.taskId = task.id;
  }
  regPatchSeat(kind, task, s);
  regRefresh(kind);
  if (kind === 'discipline') discUpdateSaveBar(task);
}

/* 纪律的保存条：只改条上的数字与按钮状态，不重画整页 */
function discUpdateSaveBar(task) {
  const bar = document.getElementById('regSaveBar');
  if (!bar) return;
  const n = discDraftCount(task);
  bar.classList.toggle('is-on', n > 0);
  const label = bar.querySelector('[data-reg-count]');
  if (label) label.textContent = String(n);
  bar.querySelectorAll('[data-action="reg-save"], [data-action="reg-discard"]').forEach((b) => {
    b.disabled = n === 0;
  });
  syncSeatBigSavebar();
}

function regUndo(kind) {
  const task = regTask(kind);
  if (!task || !regDel.id) { toast('还没有可撤销的标记', 'warn'); return; }
  if (!can.entry) { toast('请先用「管理员登录」进入录入状态', 'warn'); openLogin('main'); return; }
  const s = ((task.roster && task.roster.students) || []).find((x) => x.id === regDel.id);
  if (kind === 'discipline') {
    const cur = discSeatCount(task, regDel.id);
    if (!cur) { toast('这个座位还没有违纪记录', 'warn'); return; }
    discDraftSet(task, regDel.id, Math.max(0, cur - 1));
    if (s) regPatchSeat(kind, task, s);
    regRefresh(kind);
    discUpdateSaveBar(task);
    toast('已撤销 1 次（记得点「保存」）', 'ok', 1600);
    return;
  }
  const n = Math.max(0, Number((task.counts || {})[regDel.id]) || 0);
  if (!n) { toast('这个座位还没有违纪记录', 'warn'); return; }
  if (n <= 1) delete task.counts[regDel.id];
  else task.counts[regDel.id] = n - 1;
  saveState();
  if (s) regPatchSeat(kind, task, s);
  regRefresh(kind);
  toast('已撤销 1 次', 'ok', 1200);
}

function regItemMeta(kind, t, st) {

  return `${esc(tail)} · <b>${kind === 'hwcheck' ? `未完成 ${st.bad} 人` : `违纪 ${st.hit} 次`}</b>`;
}

function regHeadStatsInner(kind, task, st) {
  if (kind === 'hwcheck') {
    return `<div class="mstat mstat--done"><b>${st.ok}</b><span>已完成</span></div>
      <div class="mstat mstat--bad"><b>${st.bad}</b><span>未完成</span></div>
      <div class="mstat"><b>${st.rate}%</b><span>完成率</span></div>`;
  }
  return `<div class="mstat mstat--done"><b>${st.ok}</b><span>守纪</span></div>
    <div class="mstat mstat--bad"><b>${st.bad}</b><span>涉及人数</span></div>

    <span class="reg-meta__pill">座次表「${esc(taskChartName(task) || '全班名单')}」· ${st.total} 人</span>
    <span class="reg-meta__hint">${kind === 'hwcheck'
      ? '点姓名在「已完成 / 未完成」之间切换 · 一次未完成记 1 次违纪'
      : '点姓名记 1 次违纪 · 再点累加 · 颜色越深次数越多'}</span>`;
}

function regSumInner(kind) {
  const cfg = REG_CFG[kind];
  const rows = regSummary(kind);
  const total = rows.reduce((n, r) => n + r.n, 0);
  /* 分母至少按 3 次算：只有 1 次时条形不会一下子拉满，几次之间也能看出差别 */
  const max = Math.max(3, rows.length ? rows[0].n : 1);
  const head = `<div class="reg-panel__head">
      <span class="reg-panel__title">${cfg.title} · 违纪汇总</span>
      <span class="reg-panel__desc">${kind === 'hwcheck'
        ? '每出现一次「未完成」记 1 次，跨全部督检任务累计'
        : '每被标记 1 下记 1 次，跨全部纪律监管任务累计'}</span>
      <span class="reg-panel__count">${rows.length} 人 · 合计 <b>${total}</b> 次</span>
    </div>`;
  if (!rows.length) {
    return head + `<p class="reg-empty">${regList(kind).length
      ? `所有同学都干净 ✓（共 ${regList(kind).length} 份记录）`
      : '还没有发布记录；发布后这里会自动汇总'}</p>`;
  }
  return head + `<div class="reg-rows">
    ${rows.map((r, i) => `<div class="reg-row">
      <span class="reg-row__idx">${i + 1}</span>
      <span class="reg-row__name">${esc(r.name)}</span>
      <span class="reg-row__bar"><i style="width:${Math.max(6, Math.round((r.n / max) * 100))}%"></i></span>
      <span class="reg-row__n">${r.n} 次</span>
      <span class="reg-row__tags">${r.hits.map((h) => `<i class="reg-tag">${esc(h.task)}${h.n > 1 ? ` ×${h.n}` : ''}</i>`).join('')}</span>
    </div>`).join('')}
  </div>`;
}

function hwTreeHTML(activeId) {
  const rows = [];
  const walk = (parentId, depth) => {
    hwChildren(parentId).forEach((n) => {
      const kids = hwChildren(n.id);
      const tasks = hwTasksOf(n.id);
      const open = sysFold[n.id] !== false;
      const caret = (kids.length || tasks.length)
        ? `<button class="sys-node__caret${open ? '' : ' is-closed'}" data-action="sys-fold" data-id="${esc(n.id)}"
             aria-label="${open ? '收起' : '展开'}">${open ? '▾' : '▸'}</button>`
        : '<span class="sys-node__caret is-empty"></span>';
      const acts = can.admin
        ? `<button data-action="hw-task-new" data-id="${esc(n.id)}" title="在这个目录发布一次督检">＋任务</button>
           ${depth < 2 ? `<button data-action="hw-node-new" data-id="${esc(n.id)}" title="新建子目录">＋子级</button>` : ''}
           <button data-action="hw-node-rename" data-id="${esc(n.id)}" title="重命名">✎</button>
           <button data-action="hw-node-del" data-id="${esc(n.id)}" title="删除目录">×</button>`
        : '';
      rows.push(`<div class="sys-node" data-depth="${depth}">
          <div class="sys-node__row" data-sortable="1" data-sort-scope="hw" data-sort-kind="node"
               data-sort-id="${esc(n.id)}" data-sort-group="hw:cat:${esc(parentId)}">
            ${caret}
            <span class="sys-node__name" title="第 ${depth + 1} 级目录">${esc(n.name)}</span>
            <span class="sys-node__count" title="${tasks.length} 个督检任务">${tasks.length || ''}</span>
            <span class="sys-node__acts">${acts}</span>
          </div>
          ${open ? tasks.map((t) => hwTaskRowHTML(t, t.id === activeId)).join('') : ''}
        </div>`);
      if (open) walk(n.id, depth + 1);
    });
  };
  walk('', 0);
  return rows.length ? rows.join('') : '<p class="sys-side__empty">还没有目录。管理员点「＋ 一级目录」开始。</p>';
}

  openConfirm({
    title: '删除目录',
    message: `确定删除「${node.name}」？该目录下没有任务，删除后不可恢复。`,
    danger: true,

/* 常规违纪统计顶部的「常规违纪规章」
   解析：一条一行；行首 ①②③ 的行作为上一条的细则，缩进显示；
        「标签：正文」的写法只把冒号前的标签加粗，正文照原样排。 */
function regstatRulesHTML() {
  const lines = String(state.rules.regstat || '').split('\n').map((l) => l.trim()).filter(Boolean);
  const items = [];
  lines.forEach((line) => {
    const m = line.match(/^([①②③④⑤⑥⑦⑧⑨])\s*(.*)$/);
    if (m && items.length) {
      const body = m[2];
      const at = body.search(/[：:]/);
      items[items.length - 1].subs.push({
        no: m[1],
        label: at > 0 ? body.slice(0, at) : '',
        text: at > 0 ? body.slice(at + 1) : body
      });
      return;
    }
    const body = m ? m[2] : line;
    const at = body.search(/[：:]/);
    items.push({
      label: at > 0 ? body.slice(0, at) : '',
      text: at > 0 ? body.slice(at + 1) : body,
      subs: []
    });
  });
  const list = items.map((it) => `<li>${it.label ? `<b class="doc-rules__lead">${esc(it.label)}</b>：` : ''}${esc(it.text)}${it.subs.length ? `<ul class="doc-rules__sub">${
    it.subs.map((sb) => `<li data-no="${esc(sb.no)}">${sb.label ? `<b>${esc(sb.label)}</b>：` : ''}${esc(sb.text)}</li>`).join('')
  }</ul>` : ''}</li>`).join('');
  return `<section class="doc-rules doc-rules--regstat" aria-labelledby="regRulesTitle"${items.length ? '' : ' hidden'}>
      <div class="doc-rules__head">
        <h2 class="doc-rules__title" id="regRulesTitle">常规违纪规章</h2>
        <span class="doc-rules__en">DISCIPLINE RULES</span>
      </div>
      <ol class="doc-rules__list">${list}</ol>
    </section>`;
}
