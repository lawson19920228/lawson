const uid = (prefix = 'id') => prefix + Math.random().toString(36).slice(2, 8);

function setPath(obj, path, value) {
  const parts = path.split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i += 1) {
    const k = parts[i];
    if (typeof cur[k] !== 'object' || cur[k] === null) {
      cur[k] = /^\d+$/.test(parts[i + 1] || '') ? [] : {};
    }
    cur = cur[k];
  }
  cur[parts[parts.length - 1]] = value;
}

/* 根据背景色计算可读的文字色（保证对比度，深色底配白字，浅色底配深字） */
function idealInk(hex) {
  let h = String(hex || '').replace('#', '').trim();
  if (h.length === 3) h = h.split('').map((c) => c + c).join('');
  if (h.length !== 6) return '#0F172A';
  const r = parseInt(h.slice(0, 2), 16) / 255;
  const g = parseInt(h.slice(2, 4), 16) / 255;
  const b = parseInt(h.slice(4, 6), 16) / 255;
  const lin = (x) => (x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4));
  const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  return L > 0.55 ? '#0B1220' : '#FFFFFF';
}

/* ---------------- 3. 默认数据 / 校验 ---------------- */
/* defaultState() 与 normalize() 已移至 assets/core.js（浏览器与服务端共用） */

/* ---------------- 3b. 多班级：整份文档 ↔ 当前班级视图 ----------------
 * 服务端保存的是整份文档（含两个班级）；页面读到的是「当前班级」——
 * 把 classes[activeClass] 镜像到顶层后的扁平结构，所以所有页面代码都不用关心班级。
 * 切换班级只改本机查看的班级（各设备可以各看一个班），改动仍写回对应班级的数据。 */
function readViewClass() {
  try { return localStorage.getItem(CLASS_KEY) || ''; } catch (err) { return ''; }
}

let viewClass = readViewClass();        // 本机正在查看的班级 id

function classList() {
  return Array.isArray(state.classes) ? state.classes : [];
}

function classById(id) {
  return classList().find((c) => c.id === String(id || '')) || null;
}

/* 当前班级对象（名称 / 学生 / 座次表都在这份里） */
function currentClass() {
  const list = classList();
  return list.find((c) => c.id === state.activeClass) || list[0] || null;
}

function currentClassName() {
  const c = currentClass();
  return (c && c.name) || '班级';
}

/* 收到快照 / 读本地备份：规范化之后投影到本机选中的班级 */
let docOrigin = 'seed';

function applyDoc(raw, origin) {
  const doc = normalize(raw);
  const list = doc.classes || [];
  if (!list.some((c) => c.id === viewClass)) viewClass = doc.activeClass || (list[0] && list[0].id) || '';
  if (viewClass) mirrorClass(doc, viewClass);
  state = doc;
  /* 记下这份数据从哪来：'server' 服务端快照 / 'local' 本机存档 / 'seed' 初始占位。
     离线切换时靠它判断「本机那份是不是比眼前的更旧」，避免旧档把新数据盖掉。 */
  docOrigin = origin === 'server' ? 'server' : (origin === 'seed' ? 'seed' : 'local');
  return state;
}

/* 启动时先用默认结构占位（不能调用 applyDoc：此时 state 还在初始化） */
function bootDoc() {
  const doc = normalize(null);
  const list = doc.classes || [];
  if (!list.some((c) => c.id === viewClass)) viewClass = doc.activeClass || (list[0] && list[0].id) || '';
  if (viewClass) mirrorClass(doc, viewClass);
  return doc;
}

/* 换班级后，上个班级选中的任务 / 座次表 id 都不再适用，清掉 */
function resetClassSelections() {
  enrollChartId = '';
  sysSel.dTasks = '';
  sysSel.rTasks = '';
  sysRoundSel.dTasks = 'auto';
  sysRoundSel.rTasks = 'auto';
  sysDraft = null;
  sysChartPick = null;
  regSel.hwcheck = '';
  regSel.discipline = '';
  regDel.id = '';
  discDraft = null;
  /* 换班后抽签历史作废：新的班级要重新抽 */
  pickState.last = [];
  pickState.seen = [];
}

function switchClass(id) {
  const target = classById(id);
  if (!target) return;
  /* 组长身份只属于登录时的那个班：换班要重新输入本班密码 */
  const dropLeader = !!leaderSession && leaderSession.classId !== target.id;
  if (dropLeader) { clearLeaderSession(); renderAuth(); }
  syncClassFromTop(state);          // 先把当前班级的改动存回 classes
  mirrorClass(state, target.id);    // 再把目标班级镜像到顶层
  viewClass = target.id;
  try { localStorage.setItem(CLASS_KEY, viewClass); } catch (err) { /* 忽略 */ }
  resetClassSelections();
  updateSaveStatus();
  renderView();
  /* 控制台开着的时候一起刷新，避免里面还显示上一个班级的统计 */
  if (document.querySelector('.overlay--admin')) renderAdmin();
  toast(`已切换到「${target.name}」：只显示这个班级的数据${dropLeader ? '（组长登录已退出，需输入本班密码重新登录）' : ''}`, 'ok', 3400);
}

/* 班级切换按钮：听写 / 背诵 / 每日统计 / 个人查询都跟着它走 */
function classSwitchHTML(opts) {
  const o = opts || {};
  const list = classList();
  if (!list.length) return '';
  const tabs = list.map((c) => {
    const on = c.id === state.activeClass;
    const n = classSize(c);
    return `<button class="class-tab${on ? ' is-active' : ''}" data-action="class-switch" data-id="${esc(c.id)}"
      aria-pressed="${on}" title="查看「${esc(c.name)}」的每日常规（${n} 人）">
      <b>${esc(c.name)}</b><i>${n} 人</i></button>`;
  }).join('');
  return `<div class="class-switch${o.compact ? ' class-switch--compact' : ''}" role="group" aria-label="班级切换">
    ${o.label === false ? '' : '<span class="class-switch__label">班级</span>'}
    <div class="class-switch__tabs">${tabs}</div>
    ${can.admin ? `<button class="class-switch__rename" data-action="class-rename" data-id="${esc(state.activeClass)}"
      title="重命名当前班级的座次表">✎ 命名</button>` : ''}
  </div>`;
}

/* 首页「每日常规」入口处的班级切换条（含说明） */
function classBarHTML() {
  if (classList().length < 2) return '';
  return `<div class="class-bar">
    <div class="class-bar__main">
      <span class="class-bar__en">CLASS</span>
      ${classSwitchHTML()}
    </div>
    <p class="class-bar__hint">两个班级数据互相独立；切换后，下方入口与两种待办查询都只显示 <b>${esc(currentClassName())}</b> 的数据。</p>
  </div>`;
}

/* 重命名班级（= 该班座次表名称，默认「班级」）；主座次表同名，一并同步 */
function renameClass(id) {
  if (!can.admin) { toast('只有管理员可以重命名班级', 'warn'); return; }
  const cls = classById(id) || currentClass();
  if (!cls) return;
  /* 从控制台里点进来的话，保存后回到控制台原标签页（弹窗会盖掉控制台，所以先记下来） */
  const fromAdmin = !!document.querySelector('.overlay--admin');
  const backTab = adminTab;
  openPrompt({
    title: '重命名班级 / 座次表',
    desc: '默认名称是「班级」。改成实际班名（如「高二（25）班」）后，顶部的班级切换按钮与听写 / 背诵过关统计里的座次表名称会一起更新。',
    value: cls.name,
    placeholder: '班级名称',
    onSave: (v) => {
      const name = String(v || '').replace(/\s+/g, ' ').trim().slice(0, 20);
      if (!name) { toast('请填写班级名称', 'warn'); return; }
      syncClassFromTop(state);                 // 先落回 classes，避免顶层与班级数据打架
      const old = cls.name;
      cls.name = name;
      /* 该班的主座次表与班级同名（默认两者都叫「班级」）→ 一起改名，保证各页显示一致 */
      const charts = Array.isArray(cls.charts) ? cls.charts : [];
      const main = charts[0];
      if (main && (main.name === old || charts.length === 1)) {
        main.name = name;
        main.updatedAt = new Date().toISOString();
      }
      mirrorClass(state, state.activeClass);
      saveState();
      closeModal();
      renderView();
      if (fromAdmin) openAdmin(backTab, true);   /* 在控制台里改名：留在原标签页，不把人踢回看板 */
      toast(`已重命名为「${name}」`, 'ok');
    }
  });
}

/* ---------------- 4. 服务端实时同步 ---------------- */
const LOCAL_STATE_KEY = 'english-routine-board/local-state';
const READ_BG_KEY = 'english-routine-board/reading-bg';
const READ_SEL_KEY = 'english-routine-board/reading-selected';   // 本机选中的早读任务

/* link.mode：connecting（正在连）/ server（已连服务端）/ local（离线模式，数据存在本机）
   任何情况下界面都可正常浏览；登录有三条通道：WS → HTTP → 本机校验 */
let link = {
  ws: null,
  online: false,
  mode: 'connecting',
  token: '',
  commitTimer: null,
  offlineWarned: false,
  loginTimer: null,
  graceTimer: null,
  rehello: 0,
  probe: 'unknown',
  localDirty: false,
  localNoticed: false
};

const isFileProtocol = () => location.protocol === 'file:';

function wsUrl() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${proto}//${location.host}/ws`;
}

function readLocalState() {
  try {
    const raw = localStorage.getItem(LOCAL_STATE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (err) { return null; }
}

let storageWarned = false;

function writeLocalState() {
  try {
    syncClassFromTop(state);   // 先把当前班级的改动写回 classes，离线备份也按整份文档存
    const nextRaw = JSON.stringify(state);
    guardBeforeWrite(nextRaw);
    localStorage.setItem(LOCAL_STATE_KEY, nextRaw);
    link.localDirty = true;
    storageWarned = false;
  } catch (err) {
    /* 以前这里是静默忽略：一体机上浏览器禁用存储 / 空间写满时，
       老师录了一整节课，刷新后全没了，页面却什么都没说。
       现在至少要说清楚「这次没保存成功」。 */
    if (!storageWarned) {
      storageWarned = true;
      showFatalTip('本机保存失败：浏览器不允许保存数据或存储空间已满，这次修改刷新后会丢失。'
        + '请点首页「⤓ 备份数据」导出 JSON，换用 Chrome / Edge 打开并允许本站保存数据。');
    }
  }
}

/* 本机是否真的能存数据（无痕模式 / 浏览器「退出时清除数据」/ 组策略禁用都会失败） */
function storageUsable() {
  try {
    const k = '__routine_probe__';
    localStorage.setItem(k, '1');
    const ok = localStorage.getItem(k) === '1';
    localStorage.removeItem(k);
    return ok;
  } catch (err) { return false; }
}

/* ================= 数据保护：自动快照 + 覆盖前备份 =================
   经历一次「整包被重置」之后加的保护层：
   · 每次写入前比对旧值：如果数据量骤减（被种子数据覆盖 / 误删班级），先把旧值原样存进快照；
   · 平时每 10 分钟存一份快照，最多留 4 份（含时间和人数，够回溯到上一次可用状态）；
   · 打开页面时若发现当前数据明显少于快照，首页顶部出现「恢复」条，一键写回。
   快照只存在本机 localStorage，跨浏览器清数据仍会一起没掉 —— 所以首页另给「备份数据」按钮下载 JSON。 */
const BACKUP_KEY = 'english-routine-board/state-backups';
const BACKUP_MAX = 4;

/* 数据量：学生数按 2 分，座次表按 2 分 + 人数，任务类按 3 分 —— 只用来比较多少，不做展示 */
function docWeight(doc) {
  if (!doc || !Array.isArray(doc.classes)) return 0;
  let n = 0;
  doc.classes.forEach((c) => {
    n += (c.students || []).length * 2;
    (c.charts || []).forEach((ch) => { n += 2 + (ch.students || []).length * 2; });
    ['dTasks', 'rTasks', 'hwChecks', 'discTasks', 'notices', 'quizzes', 'writing'].forEach((k) => {
      n += (c[k] || []).length * 3;
    });
  });
  return n;
}

function readBackups() {
  try {
    const list = JSON.parse(localStorage.getItem(BACKUP_KEY) || '[]');
    return Array.isArray(list) ? list.filter((b) => b && b.raw) : [];
  } catch (err) { return []; }
}

function writeBackups(list) {
  try {
    localStorage.setItem(BACKUP_KEY, JSON.stringify(list.slice(0, BACKUP_MAX)));
  } catch (err) {
    /* 容量不足：只留最近两份再试一次 */
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify(list.slice(0, 2))); } catch (e2) { /* 放弃 */ }
  }
}

function backupPush(raw, reason) {
  if (!raw) return;
  const list = readBackups();
  if (list.length && list[0].raw === raw) return;      // 内容没变就不重复存
  let weight = 0;
  try { weight = docWeight(JSON.parse(raw)); } catch (err) { return; }
  list.unshift({ at: new Date().toISOString(), reason: reason || '', weight, raw });
  writeBackups(list);
}

function backupLastAt() {
  const list = readBackups();
  return list.length ? Date.parse(list[0].at) || 0 : 0;
}

/* 写入前的守门：骤减就先把旧值存起来 */
function guardBeforeWrite(nextRaw) {
  let prevRaw = '';
  try { prevRaw = localStorage.getItem(LOCAL_STATE_KEY) || ''; } catch (err) { return; }
  if (!prevRaw) return;
  let prev = null;
  try { prev = JSON.parse(prevRaw); } catch (err) { return; }
  let next = null;
  try { next = JSON.parse(nextRaw); } catch (err) { return; }
  const wPrev = docWeight(prev);
  const wNext = docWeight(next);
  /* 旧数据像样、新数据掉到七成以下：认定是覆盖 / 误删，先备份旧值 */
  if (wPrev >= 80 && wNext < wPrev * 0.7) {
    backupPush(prevRaw, '覆盖前自动备份');
    toast('检测到数据明显减少：上一版已自动备份，可在首页「数据备份」里恢复', 'warn', 5600);
    return;
  }
  /* 常规快照：每 10 分钟最多一份 */
  if (wNext >= 80 && Date.now() - backupLastAt() > 10 * 60 * 1000) {
    backupPush(nextRaw, '自动快照');
  }
}

/* 首页顶部：数据疑似被重置时给出恢复入口 */
function dataGuardTip() {
  const list = readBackups();
  if (!list.length) return null;
  const best = list.slice().sort((a, b) => (b.weight - a.weight) || (Date.parse(b.at) - Date.parse(a.at)))[0];
  const cur = docWeight(state);
  if (!best || best.weight < 120) return null;
  if (cur >= best.weight * 0.75) return null;
  if (sessionStorage.getItem('english-routine-board/guard-dismissed') === best.at) return null;
  return best;
}

function dataGuardHTML() {
  const best = dataGuardTip();
  if (!best) return '';
  const when = new Date(best.at);
  const stamp = `${pad2(when.getMonth() + 1)}-${pad2(when.getDate())} ${pad2(when.getHours())}:${pad2(when.getMinutes())}`;
  return `<div class="dataguard" role="alert">
    <span class="dataguard__ico" aria-hidden="true">⚠</span>
    <div class="dataguard__text">
      <b>当前数据比备份少很多，可能被重置过</b>
      <span>最近一份可用备份：${stamp}（数据量 ${best.weight}${best.reason ? ` · ${esc(best.reason)}` : ''}）。点右侧可一键写回。</span>
    </div>
    <div class="dataguard__acts">
      <button class="btn btn--primary btn--sm" data-action="restore-backup">恢复这份备份</button>
      <button class="btn btn--ghost btn--sm" data-action="dismiss-guard" data-at="${esc(best.at)}">暂不恢复</button>
    </div>
  </div>`;
}

/* 一键恢复：写回 localStorage 后刷新，草稿 / 选择状态一并重置 */
function restoreBackup() {
  const list = readBackups();
  if (!list.length) { toast('没有可用的备份', 'warn'); return; }
  const best = list.slice().sort((a, b) => (b.weight - a.weight) || (Date.parse(b.at) - Date.parse(a.at)))[0];
  openConfirm({
    title: '恢复备份',
    message: `确定用 ${new Date(best.at).toLocaleString('zh-CN')} 的备份覆盖当前数据？当前数据会先存一份快照，恢复后页面自动刷新。`,
    onConfirm: () => {
      try {
        const cur = localStorage.getItem(LOCAL_STATE_KEY);
        if (cur) backupPush(cur, '恢复前备份');
        localStorage.setItem(LOCAL_STATE_KEY, best.raw);
        closeModal();
        location.reload();
      } catch (err) {
        toast('恢复失败：浏览器存储不可用', 'err', 3600);
      }
    }
  });
}

/* 首页「备份数据」：下载一份 JSON，同时存进本机快照 */
function exportStateBackup() {
  try {
    const raw = JSON.stringify(state);
    backupPush(raw, '手动备份');
    const blob = new Blob([raw], { type: 'application/json' });
    const a = document.createElement('a');
    const d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = `日课数据备份-${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('已下载备份文件，并存入本机快照', 'ok', 3200);
  } catch (err) {
    toast('备份失败：浏览器不允许下载', 'err', 3600);
  }
}


/* 探测当前页面是否由本站服务端提供（静态预览 / file:// 打开时一定会失败） */
function probeServer() {
  if (isFileProtocol()) return Promise.resolve(false);
  return fetch('/api/health', { cache: 'no-store' })
    .then((r) => (r.ok ? r.json() : null))
    .then((info) => !!(info && info.ok && info.app === 'english-routine'))
    .catch(() => false);
}

/* 用服务端响应的 Date 头校正本机时钟（网络实时时间）；失败时静默沿用本机时间 */
function syncServerClock() {
  if (isFileProtocol()) return;
  fetch('/api/health', { cache: 'no-store' }).then((r) => {
    const raw = r && r.headers && typeof r.headers.get === 'function' ? r.headers.get('date') : '';
    const serverMs = raw ? Date.parse(raw) : NaN;
    /* 只接受 7 天以内的偏差，避免响应头缺失/异常时把时间带偏 */
    if (Number.isFinite(serverMs) && Math.abs(serverMs - Date.now()) < 7 * 864e5) {
      clockSkew = serverMs - Date.now();
    }
    return r;
  }).catch(() => {});
}

/* 进入离线模式：数据写 localStorage，功能全部可用，服务器恢复后自动切回 */
function enterLocalMode(reason) {
  if (link.mode === 'local') return;
  const saved = readLocalState();
  if (saved) {
    /* 以前这里是无条件用本机存档覆盖当前数据 —— 一体机上常见的情况是：
       本机存档还是几天前的，而屏幕上的数据是刚从服务器同步来的最新版，
       一切到离线就被旧档盖掉，看上去像「数据丢了 / 显示的是旧版本」。
       现在只在「眼前这份还是初始占位」或「本机存档确实更新」时才采用本机存档。 */
    const curTs = Date.parse((state && state.updatedAt) || '') || 0;
    const savTs = Date.parse(saved.updatedAt || '') || 0;
    const staleLocal = docOrigin === 'server' && curTs && (!savTs || savTs < curTs - 1000);
    if (staleLocal) {
      /* 本机存档更旧：保留屏幕上的数据，并把这份较新的数据写回本机，避免越离越旧 */
      writeLocalState();
      setTimeout(() => toast('本机存档比当前数据旧，已保留屏幕上的最新数据（本机存档已同步更新）', 'warn', 5200), 600);
    } else {
      applyDoc(saved, 'local');
    }
  }
  link.mode = 'local';
  link.online = false;
  renderModeBanner();
  renderAuth();
  renderView();
  updateSaveStatus();
  if (!link.localNoticed) {
    link.localNoticed = true;
    toast(reason || '未连接服务器：已切换为离线模式，数据只保存在本机', 'warn', 4600);
  }
}

function connectServer() {
  if (link.ws && (link.ws.readyState === 0 || link.ws.readyState === 1)) return;
  syncServerClock();   // 顺便用服务端时间校正本机时钟（早读页显示实时日期用）
  if (isFileProtocol()) {   // 直接双击 index.html 打开：没有服务端可用
    link.probe = 'fail';
    enterLocalMode('当前是本地文件方式打开，无法连接服务器：已切换为离线模式');
    return;
  }
  let ws;
  try {
    ws = new WebSocket(wsUrl());
  } catch (err) {
    link.online = false;
    setTimeout(connectServer, 3000);
    return;
  }
  link.ws = ws;
  const socket = ws;
  let opened = false;

  ws.onopen = () => {
    opened = true;
    ws.send(JSON.stringify({ t: 'hello', token: link.token || '' }));
  };

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    onServerMessage(msg, ws);
  };

  ws.onclose = () => {
    if (link.ws === socket) link.ws = null;
    const wasServer = link.mode === 'server';
    link.online = false;
    updateSaveStatus();
    /* 首次就没连上：给 4.5 秒宽限后进入离线模式，避免页面长时间空转 */
    if (!opened && link.mode !== 'local') startGraceTimer();
    setTimeout(connectServer, wasServer ? 1200 : 3000);
  };
  ws.onerror = () => { try { ws.close(); } catch (err) { /* ignore */ } };
}

function startGraceTimer() {
  clearTimeout(link.graceTimer);
  link.graceTimer = setTimeout(() => {
    if (!link.online) {
      enterLocalMode(link.probe === 'fail'
        ? '当前页面不是由本站服务端提供（可能是静态预览或本地文件），已切换离线模式'
        : '暂时连不上服务器，已切换为离线模式（数据存在本机），恢复后会自动重连');
    }
  }, 4500);
}

function onServerMessage(msg, ws) {
  if (msg.t === 'init') {
    /* 竞态保护：登录请求刚通过 HTTP 成功、WS 却仍以旧 token 握手时，
       服务端会回 guest。此时不能把刚登录的身份清掉，先带新 token 再握一次。 */
    if (msg.you && msg.you.role === 'guest' && link.token && link.rehello < 1) {
      link.rehello += 1;
      try { ws.send(JSON.stringify({ t: 'hello', token: link.token })); } catch (err) { /* ignore */ }
      return;
    }
    const expired = !!(msg.you && msg.you.role === 'guest' && link.token);
    link.rehello = 0;
    const backFromLocal = link.mode === 'local';
    const hadLocalChanges = link.localDirty;
    /* 离线期间改过的数据马上要被服务端快照覆盖：先原样存一份快照，
       这样即使「服务器数据为准」也不会把一体机上刚录的内容直接抹掉。 */
    if (backFromLocal && hadLocalChanges) {
      try { backupPush(JSON.stringify(state), '重连前保存的离线修改'); } catch (err) { /* ignore */ }
    }
    clearTimeout(link.graceTimer);
    link.mode = 'server';
    link.online = true;
    link.localNoticed = false;
    link.offlineWarned = false;
    applyDoc(msg.state, 'server');

    if (msg.you && msg.you.role !== 'guest') {
      session = { role: msg.you.role, name: msg.you.name, token: link.token };
    } else if (expired) {
      session = { role: 'guest', name: '', token: '' };
      link.token = '';
      toast('登录状态已失效（服务端重启或长时间未操作），请重新登录', 'warn', 4200);
    } else if (!link.token) {
      session = { role: 'guest', name: '', token: '' };
    }
    persistSession();

    renderModeBanner();
    renderAuth();
    renderView();
    updateSaveStatus();

    if (backFromLocal) {
      toast(hadLocalChanges
        ? '已连上服务器：已切换为服务器数据；离线期间的修改已自动存进本机快照，可在首页「数据备份」里找回'
        : '已连上服务器，数据恢复实时同步', 'ok', 4600);
      link.localDirty = false;
    }
    return;
  }

  /* 连上服务端后，补发一次因断网未能验证的登录 */
  if (msg.t === 'init' && link.pendingLogin && Date.now() - link.pendingLogin.at < 120000) {
    const pending = link.pendingLogin;
    link.pendingLogin = null;
    sendLogin({ role: pending.role, pass: pending.pass });
  }

  if (msg.t === 'update') {
    /* 其他设备的修改：同步快照并刷新当前视图（弹层不受影响） */
    link.online = true;
    link.mode = 'server';
    applyDoc(msg.state, 'server');
    renderView();
    updateSaveStatus();
    return;
  }

  if (msg.t === 'login-ok') {
    clearTimeout(link.loginTimer);
    applyLoginOK(msg);
    return;
  }

  if (msg.t === 'login-err') {
    clearTimeout(link.loginTimer);
    toast(msg.msg || '登录失败，请重试', 'err', 3200);
    return;
  }

  if (msg.t === 'err') {
    toast(msg.msg || '操作失败', 'err', 3200);
  }
}

/* 登录成功（WS 或 HTTP 兜底返回）后的统一处理 */
function applyLoginOK(msg) {
  link.pendingLogin = null;
  link.token = msg.token || '';
  link.mode = 'server';
  link.online = true;   // 能登录成功说明服务端可达（WS 稍后自动重连补上实时通道）
  clearTimeout(link.graceTimer);
  link.probe = 'ok';
  session = { role: msg.role, name: msg.name, token: link.token };
  clearLeaderSession();          // 管理员登录后，组长身份作废
  persistSession();
  applyDoc(msg.state, 'server');
  closeModal();
  renderModeBanner();
  renderAuth();
  renderView();
  updateSaveStatus();
  toast(msg.role === 'main' ? '已以管理员身份登录' : `欢迎，${msg.name}`, 'ok');
}

/* 发送登录请求：
   1) WS 已就绪 → 走 WS（3 秒无响应自动降级）
   2) 否则走 HTTP /api/login（5 秒超时）
   3) 都失败 → 用本机数据校验密码，进入离线模式（保证密码正确一定能进） */
function sendLogin(payload) {
  if (link.ws && link.ws.readyState === 1 && link.mode === 'server') {
    link.ws.send(JSON.stringify(Object.assign({ t: 'login' }, payload)));
    clearTimeout(link.loginTimer);
    link.loginTimer = setTimeout(() => loginViaHTTP(payload), 3000);
    return;
  }
  loginViaHTTP(payload);
}

function loginViaHTTP(payload) {
  const canAbort = typeof AbortController === 'function';
  const ctrl = canAbort ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, 5000);
  const finish = () => { clearTimeout(timer); clearTimeout(link.loginTimer); };

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    cache: 'no-store',
    signal: ctrl ? ctrl.signal : undefined
  }).then((r) => {
    const ct = (r.headers.get('content-type') || '').toLowerCase();
    if (!ct.includes('application/json')) throw new Error('NO_API');   // 静态服务器没有这个接口
    return r.json().then((data) => ({ data }));
  }).then(({ data }) => {
    finish();
    if (data && data.ok) {
      applyLoginOK(data);
      connectServer();     // 带 token 重新握手，恢复实时同步
    } else {
      toast((data && data.msg) || '登录失败，请重试', 'err', 3200);
    }
  }).catch(() => {
    finish();
    loginOffline(payload);
  });
}

/* 服务端不可达时的本机校验：密码正确则进入离线模式并登录 */
function loginOffline(payload) {
  const local = normalize(readLocalState() || state);
  const ok = payload.role === 'main' && String(payload.pass || '') === String(local.auth.mainPassword || '');
  const role = 'main';
  const name = '管理员';

  if (!ok) {
    /* 密码对不对先放一边：连不上服务端时，真正的失败原因是「网络」。
       把这次登录意图存下来，等 WS 重连成功后自动补发一次，
       用户不用守着页面反复点登录。 */
    link.pendingLogin = { role: 'main', pass: payload.pass, at: Date.now() };
    toast(link.probe === 'fail'
      ? '没连上服务端：页面是以静态方式打开的（或服务已停止）。请在项目目录运行 npm start，再用 http://localhost:3001 打开。'
      : '服务端暂时无响应，本次登录已排队；恢复连接后会自动重试，也可点右上角「重连」。', 'err', 6000);
    return;
  }
  link.pendingLogin = null;

  link.mode = 'local';
  link.online = false;
  writeLocalState();
  session = { role, name, token: `local-${Date.now().toString(36)}` };
  clearLeaderSession();
  link.token = session.token;
  persistSession();
  closeModal();
  renderModeBanner();
  renderAuth();
  renderView();
  updateSaveStatus();
  toast(`已登录（离线模式）：数据只保存在本机，暂不同步到其他设备`, 'warn', 4600);
}

/* 手动重连：给「离线模式」一个明确的恢复入口 */
function retryLink() {
  toast('正在重连服务器…');
  link.mode = 'connecting';
  link.localNoticed = false;
  link.probe = 'unknown';
  renderModeBanner();
  updateSaveStatus();
  if (link.ws) { try { link.ws.close(); } catch (err) { /* ignore */ } link.ws = null; }
  probeServer().then((ok) => { link.probe = ok ? 'ok' : 'fail'; });
  connectServer();
  startGraceTimer();
}

/* 把当前本地状态提交到服务端（乐观更新后的保存入口）
   通道优先级：WS（毫秒级广播）→ HTTP /api/commit（WS 被挡时仍能保存）→ 本机离线存储 */
function commitToServer() {
  if (link.ws && link.ws.readyState === 1 && link.mode === 'server') {
    link.ws.send(JSON.stringify({ t: 'commit', token: link.token, state }));
    link.offlineWarned = false;
    updateSaveStatus();
    return;
  }
  if (link.mode === 'server' || link.mode === 'connecting') {
    commitViaHTTP();
    return;
  }
  /* 离线：先把改动存本机，保证刷新不丢，再提示不同步 */
  writeLocalState();
  if (link.mode !== 'local') {
    enterLocalMode('与服务器断开：已切换为离线模式，修改保存在本机');
  } else if (!link.offlineWarned) {
    link.offlineWarned = true;
    toast('离线模式：修改已保存在本机，恢复连接前不会同步到其他设备', 'warn', 3600);
  }
  updateSaveStatus();
}

/* WebSocket 不可用时的 HTTP 保存通道 */
function commitViaHTTP() {
  if (!link.token) {   // 未登录的浏览者没有可提交的内容，静默转本机
    writeLocalState();
    updateSaveStatus();
    return;
  }
  fetch('/api/commit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: link.token, state }),
    cache: 'no-store'
  }).then((r) => {
    if (r.status === 401) {
      session = { role: 'guest', name: '', token: '' };
      link.token = '';
      persistSession();
      renderAuth();
      toast('登录状态已失效，请重新登录', 'warn', 3600);
      throw new Error('EXPIRED');
    }
    if (!r.ok) throw new Error('HTTP_COMMIT_FAIL');
    link.mode = 'server';
    link.online = true;
    updateSaveStatus();
  }).catch(() => {
    writeLocalState();
    if (link.mode !== 'local') enterLocalMode('保存失败：已切换为离线模式，修改保存在本机');
  });
}

let lastCommitAt = 0;
function saveState(silent) {   /* 兼容原调用点：所有修改统一从这里提交服务端 */
  syncClassFromTop(state);      // 页面改的是顶层字段，提交前先写回当前班级
  state.updatedAt = new Date().toISOString();
  clearTimeout(link.commitTimer);
  const gap = Date.now() - lastCommitAt;
  if (gap > 150) {
    lastCommitAt = Date.now();
    commitToServer();
  } else {
    link.commitTimer = setTimeout(() => {
      lastCommitAt = Date.now();
      commitToServer();
    }, 150);
  }
}

function updateSaveStatus() {
  const el = $('#saveStatus');
  const retry = $('#linkRetry');
  if (el) {
    if (link.mode === 'server' && link.online) {
      const d = new Date(state.updatedAt || Date.now());
      el.textContent = `已实时同步 · ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
      el.style.color = '';
    } else if (link.mode === 'server') {
      el.textContent = '已连接服务器 · 实时通道重连中（修改仍会保存）';
      el.style.color = '#B45309';
    } else if (link.mode === 'local') {
      el.textContent = '⚠ 离线模式 · 数据仅保存在本机';
      el.style.color = '#B45309';
    } else {
      el.textContent = '正在连接服务器…';
      el.style.color = '#64748B';
    }
  }
  if (retry) retry.hidden = !(link.mode === 'local' || !link.online);
}

/* 数据最后更新时间（页脚 / 离线提示条共用）：一体机上判断「是不是旧数据」就看它 */
function dataUpdatedText() {
  const ts = Date.parse((state && state.updatedAt) || '');
  if (!ts) return '未知';
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

/* 顶栏下方的模式说明条（只在离线 / 未连接时出现） */
function renderModeBanner() {
  const el = $('#modeBanner');
  if (!el) return;
  if (link.mode === 'local') {
    el.hidden = false;
    el.className = 'mode-banner mode-banner--local';
    /* 两种「看着像数据丢了」的常见真相，都在这里说清楚：
       · 浏览器禁用本地存储 → 刷新就回到示例数据；
       · 这台电脑上还没有本机数据 → 显示的是示例数据，不是班里的真实记录。 */
    let hasLocal = false;
    try { hasLocal = !!localStorage.getItem(LOCAL_STATE_KEY); } catch (err) { hasLocal = false; }
    const usable = storageUsable();
    const extra = !usable
      ? ' <b style="color:#FFC9A3">注意：这台电脑的浏览器禁用了本地存储（无痕模式或设置了「退出时清除数据」），刷新后数据会丢失。</b>'
      : (!hasLocal
        ? ' <b style="color:#FFC9A3">这台电脑上还没有本班数据，下面显示的是示例数据 —— 请点「导入最新数据」导入老师导出的 JSON 备份。</b>'
        : '');
    el.innerHTML = `<b>离线模式</b>
      <span>未连上网站服务端，数据只存在这台电脑的浏览器里，不会同步到其他设备。
      本机数据最后更新：<b>${esc(dataUpdatedText())}</b>。要换成最新数据，点「导入最新数据」选择导出的 JSON 备份。${extra}</span>
      <button class="btn btn--outline btn--sm" data-action="import-json" title="选择另一台电脑导出的 JSON 备份，导入后覆盖本机数据">导入最新数据</button>
      <button class="btn btn--outline btn--sm" data-action="retry-link">重连服务器</button>`;
    return;
  }
  el.hidden = true;
  el.innerHTML = '';
}

/* ---------------- 5. 会话与权限 ---------------- */
let session = readSession();
let viewDate = readViewDate();
let currentModule = 'dictation';
let currentTaskId = { dTasks: '', rTasks: '' };   // 各任务数组当前选中的任务 id
let editNamesMode = false;

function readSession() {
  try {
    const s = JSON.parse(sessionStorage.getItem(SESSION_KEY));
    if (s && s.role === 'main') {
      return { role: s.role, name: s.name || '', token: s.token || '' };
    }
  } catch (err) { /* ignore */ }
  return { role: 'guest', name: '', token: '' };
}

function persistSession() {
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch (err) { /* ignore */ }
}

function writeSession(s) {
  session = s;
  /* 管理员登录 / 退出：组长身份一并作废，一个页面只保留一种编辑身份 */
  if (!s || s.role !== 'leader') clearLeaderSession();
  link.token = s.token || '';
  persistSession();
  renderAuth();
  applyRoleAttrs();
}

function readViewDate() {
  try {
    const saved = sessionStorage.getItem(DATE_KEY);
    if (saved && /^\d{4}-\d{2}-\d{2}$/.test(saved)) return saved;
  } catch (err) { /* ignore */ }
  return todayStr();
}

function setViewDate(d) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
  viewDate = d;
  try { sessionStorage.setItem(DATE_KEY, d); } catch (err) { /* ignore */ }
  const input = $('#dateInput');
  if (input) input.value = d;
  renderTodayBlock();
  renderView();
}

const can = {
  get admin() { return session.role === 'main'; },
  /* 组长身份：只对「登录时所在的那一个班」有效，切班即失效 */
  get leader() { return leaderActive(); },
  get entry() {
    if (session.role === 'main') return true;
    return !!state.settings.allowGuestEntry;
  }
};

/* ---------------- 5b. 组长登录 ----------------
   规则：
   · 每个班级的座次表对应一个独立的组长密码（state.leaderPass，跟着班级走）；
   · 组长只能编辑「背诵过关统计」与「任务督检」两页，不进控制台、不能发布 / 删除任务；
   · 登录满 5 分钟没有任何操作 → 自动保存当前界面 + 自动退出。 */
const LEADER_KEY = 'english-routine-board/leader';
const LEADER_TTL_MS = 5 * 60 * 1000;   // 组长会话固定 5 分钟
const LEADER_EDIT_MODS = { recite: 1, hwcheck: 1 };

let leaderSession = readLeaderSession();
let leaderDeadline = 0;
let leaderTicker = 0;
let leaderPassShown = false;

function readLeaderSession() {
  try {
    const s = JSON.parse(sessionStorage.getItem(LEADER_KEY));
    if (s && s.classId) return { classId: String(s.classId), at: Number(s.at) || Date.now() };
  } catch (err) { /* ignore */ }
  return null;
}

function persistLeaderSession() {
  try {
    if (leaderSession) sessionStorage.setItem(LEADER_KEY, JSON.stringify(leaderSession));
    else sessionStorage.removeItem(LEADER_KEY);
  } catch (err) { /* ignore */ }
}

/* 静默清掉组长身份（管理员登录、切换班级时用） */
function clearLeaderSession() {
  if (leaderTicker) { clearInterval(leaderTicker); leaderTicker = 0; }
  if (!leaderSession) return;
  leaderSession = null;
  persistLeaderSession();
}

/* 当前登录的组长是否就是这个班 */
function leaderActive() {
  if (session.role === 'main') return false;
  return !!(leaderSession && leaderSession.classId === state.activeClass);
}

/* 本班（或指定班级）的组长密码 */
function leaderPassOf(cls) {
  const c = cls || currentClass();
  return String((c && c.leaderPass) || '');
}

function leaderPassReady(cls) {
  return leaderPassOf(cls).length >= 4;
}

/* 组长能否编辑这个页面：只有背诵过关统计 / 任务督检 */
function leaderCanEdit(mod) {
  return leaderActive() && !!LEADER_EDIT_MODS[mod];
}

/* 随机 6 位数字密码（避开 000000 / 123456 这类一眼能猜的） */
function leaderGenPass() {
  const bad = { '000000': 1, '111111': 1, '123456': 1, '654321': 1, '888888': 1, '666666': 1 };
  for (let i = 0; i < 40; i += 1) {
    const p = String(Math.floor(100000 + Math.random() * 900000));
    if (!bad[p]) return p;
  }
  return String(Math.floor(100000 + Math.random() * 900000));
}

/* ---- 倒计时：只改文字，不重画页面 ---- */
function leaderClockText(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return `${Math.floor(s / 60)}:${pad2(s % 60)}`;
}

/* 会话固定 5 分钟：从登录那一刻起算，中间怎么操作都不延长 ——
   组长在教室一体机上忘记退出时，到点一定自动保存并收尾。 */
function leaderStartClock(leftMs) {
  /* 刷新页面时不重置这 5 分钟：按登录时刻算剩下的时间 */
  const span = Number.isFinite(leftMs) ? Math.max(1000, Number(leftMs)) : LEADER_TTL_MS;
  leaderDeadline = Date.now() + span;
  if (leaderTicker) clearInterval(leaderTicker);
  leaderTicker = setInterval(leaderTick, 1000);
}

function leaderStopClock() {
  if (leaderTicker) clearInterval(leaderTicker);
  leaderTicker = 0;
}

function leaderTick() {
  if (!leaderSession) { leaderStopClock(); return; }
  const left = leaderDeadline - Date.now();
  if (left <= 0) { leaderExpire(); return; }
  document.querySelectorAll('[data-leader-left]').forEach((el) => {
    el.textContent = leaderClockText(left);
    el.classList.toggle('is-warn', left < 60000);
  });
}

/* 超时：先保存，再退出 */
function leaderExpire() {
  leaderStopClock();
  flushEditWork();
  leaderSession = null;
  persistLeaderSession();
  renderAuth();
  closeModal();
  toast('组长登录已满 5 分钟未操作：当前数据已自动保存，并已退出登录', 'warn', 4600);
  renderView();
}

/* 保存当前界面（背诵过关的草稿 / 任务督检的点击都已落库，这里兜底一次） */
function flushEditWork() {
  try {
    if (sysDraft) {
      const cfg = sysOfStore(sysDraft.store);
      const task = taskListOf(cfg.store).find((t) => t.id === sysDraft.taskId);
      if (task) {
        const round = sysDraft.roundId
          ? (task.copyRounds || []).find((x) => x.id === sysDraft.roundId)
          : null;
        if (sysDraftCount(cfg, task, round, sysDraft.kind) > 0) sysSave(true);
      }
    }
  } catch (err) { /* 草稿结构不完整就跳过 */ }
  try {
    if (discDraft && discDraftCount(regTask('discipline')) > 0) discSave(true);
  } catch (err) { /* 纪律草稿异常不影响退出 */ }
  try { saveState(true); } catch (err) { /* ignore */ }
}

function leaderLogin(pwd) {
  if (session.role === 'main') {
    toast('当前已是管理员身份，可以直接录入', 'warn', 2400);
    return false;
  }
  const cls = currentClass();
  const real = leaderPassOf(cls);
  const input = normPass(pwd);
  if (!real) {
    toast('本班还没设置组长密码，请管理员先在「录入学员」页设置', 'warn', 3600);
    return false;
  }
  if (!input) { toast('请先输入组长密码', 'warn'); return false; }
  if (input !== normPass(real)) { toast('组长密码不正确', 'bad', 2600); return false; }
  leaderSession = { classId: cls.id, at: Date.now() };
  persistLeaderSession();
  leaderStartClock();
  renderAuth();
  closeModal();
  toast(`组长登录成功：「${cls.name}」的编辑权限已开启（5 分钟内有效，到点自动保存退出）`, 'ok', 3600);
  renderView();
  return true;
}

function leaderLogout(quiet) {
  if (!leaderSession) return;
  leaderStopClock();
  leaderSession = null;
  persistLeaderSession();
  renderAuth();
  if (!quiet) toast('已退出组长登录');
  renderView();
}

/* 页面上的通用「保存并退出登录」：管理员与组长共用一个入口 */
function askSaveExit() {
  const isLeader = !!leaderSession;
  openModal(`
      <h2>保存并退出登录</h2>
      <p class="modal__desc">是否保存并退出登录？</p>
      <p class="modal__hint">选「是」：保存当前界面的修改并退出${isLeader ? '组长' : '管理员'}登录；
        选「否」：留在本页继续编辑（任务督检的每次点击本来就会自动保存）。</p>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" data-action="close-modal">否</button>
        <button type="button" class="btn btn--primary" data-action="edit-save-exit">是</button>
      </div>`, { width: '480px' });
}

function doSaveExit() {
  closeModal();
  flushEditWork();
  if (session.role === 'main') {
    logout();
  } else {
    leaderLogout(true);
    toast('已保存并退出登录', 'ok');
  }
}

function actorName() {
  if (session.role === 'main') return '管理员';
  if (leaderActive()) return `组长（${currentClassName()}）`;
  return '未登录录入';
}

/* ---------------- 6. 主题应用 ---------------- */
function applyTheme() {
  const t = state.theme;
  const root = document.documentElement.style;
  root.setProperty('--done', t.doneColor);
  root.setProperty('--undone', t.undoneColor);
  root.setProperty('--done-ink', idealInk(t.doneColor));
  root.setProperty('--undone-ink', idealInk(t.undoneColor));
  root.setProperty('--seat-font', String(t.seatScale || 1));

  /* 顶栏不展示班级信息：品牌固定为「日课 DAILY LESSON」 */
  const ct = $('#classTitle');
  const st = $('#schoolTitle');
  if (ct) ct.textContent = '日课';
  if (st) st.textContent = 'DAILY LESSON';
  document.title = '日课 DAILY LESSON · 英语学习看板';
  applyRoleAttrs();
}

function applyRoleAttrs() {
  document.body.dataset.role = session.role;
  document.body.classList.toggle('is-edit-names', !!editNamesMode && can.admin);
}

/* ---------------- 7. 每日一题（检查上一次课的知识点） ---------------- */
function quizList() {
  const list = Array.isArray(state.quizzes) ? state.quizzes : [];
  return list.slice().sort((a, b) => (
    (String(b.date) + String(b.createdAt)).localeCompare(String(a.date) + String(a.createdAt))
  ));
}

function quizById(id) {
  return quizList().find((q) => q.id === id) || null;
}

function publishedQuizList() {
  return quizList().filter((q) => q.published !== false);
}

/* 展示用的题目：今天的优先，否则取不晚于今天的最近一条 */
function currentQuiz() {
  const pub = publishedQuizList();
  if (!pub.length) return null;
  const today = todayStr();
  const exact = pub.find((q) => q.date === today);
  if (exact) return exact;
  const past = pub.filter((q) => String(q.date) <= today);
  return past[0] || pub[0];
}

function quizEmptyHTML() {
  return `
    <div class="quizcard quizcard--empty">
      <span class="quizcard__ribbon">QUESTION OF THE DAY</span>
      <p class="quizcard__none">今天还没有出题</p>
      <p class="quizcard__none-sub">管理员在「控制台 → 每日一题」选题型、出题并发布后，这里会显示题目；答案默认折叠。</p>
      ${can.admin ? '<button class="btn btn--outline btn--sm" data-action="new-quiz">＋ 现在出题</button>' : ''}
    </div>`;
}

/* ---- 按题型渲染：题干 / 作答提示 / 答案 ----
   四种题型共用一套卡片骨架，只换中间这一段与答案那一段：
   choice 题干 + 选项 / blank 带空句子 / translation 原句 / word 单词。 */
const QUIZ_ANS_LABEL = { choice: '答案', blank: '参考答案', translation: '参考译文', word: '释义' };
const QUIZ_STEM_LABEL = { choice: '题干', blank: '句子', translation: '原句', word: '单词' };
const QUIZ_ASK = {
  choice: '',
  blank: '把正确的词或词形填在横线上',
  translation: '把上面这句话译成英语',
  word: '说出这个单词的中文意思'
};

/* 填空题：把 ______ 画成可写的横线；其余题型原样输出（都先转义） */
function quizStemHTML(q) {
  const raw = esc(q.stem || '');
  return raw.replace(/_{3,}/g, '<span class="qblank" aria-hidden="true"></span>');
}

function quizBodyHTML(q, cls = 'quizcard') {
  const type = normQuizType(q.type);
  const stem = String(q.stem || '').trim();
  if (type === 'choice') {
    return `<p class="${cls}__stem">${esc(stem || '（题干未填写）')}</p>
      <ul class="${cls}__opts">
        ${(q.options || []).map((o) => `
          <li><b>${esc(o.k)}</b><span>${esc(o.t || '—')}</span></li>`).join('')}
      </ul>`;
  }
  const body = type === 'blank'
    ? (stem ? quizStemHTML(q) : '（句子未填写）')
    : esc(stem || '（内容未填写）');
  return `<p class="${cls}__stem ${cls}__stem--${type}">${body}</p>
    ${QUIZ_ASK[type] ? `<p class="${cls}__ask">${esc(QUIZ_ASK[type])}</p>` : ''}`;
}

function quizAnswerHTML(q, cls = 'quizcard') {
  const type = normQuizType(q.type);
  const label = QUIZ_ANS_LABEL[type] || '答案';
  const ans = String(q.answer || '').trim();
  const key = type === 'translation'
    ? `<span class="${cls}__ans-label">${label}</span>
       <p class="${cls}__ans-text">${ans ? esc(ans) : '（未填写）'}</p>`
    : `<span class="${cls}__ans-key">${label} ${ans ? esc(ans) : '—'}</span>`;
  return `<div class="${cls}__ans">
      ${key}
      ${q.analysis ? `<p class="${cls}__ans-note">${esc(q.analysis)}</p>` : ''}
    </div>`;
}

function quizCardHTML(q, opts = {}) {
  if (!q) return quizEmptyHTML();
  const type = normQuizType(q.type);
  const meta = quizTypeMeta(type);
  const isToday = q.date === todayStr();
  const big = opts.big ? ' quizcard--big' : '';
  return `
    <article class="quizcard quizcard--${type}${big}${q.published === false ? ' is-draft' : ''}">
      <header class="quizcard__head">
        <span class="quizcard__ribbon">QUESTION OF THE DAY</span>
        <span class="quizcard__meta">
          <span class="qtype-chip" data-type="${esc(type)}">${esc(meta.name)}</span>
          ${esc(q.point || '知识点检查')}${isToday ? '' : ` · ${esc(String(q.date).slice(5).replace('-', '/'))}`}
        </span>
      </header>
      ${quizBodyHTML(q, 'quizcard')}
      <div class="quizcard__foot">
        <button class="quizcard__reveal" data-action="quiz-reveal">显示答案</button>
        <a class="quizcard__more" data-nav="#/module/quiz" href="#/module/quiz">投影模式 ↗</a>
      </div>
      ${quizAnswerHTML(q, 'quizcard')}
    </article>`;
}

/* ---------------- 7b. 首页渲染 ---------------- */
function homeRules() {
  return String(state.rules.home || '').split('\n').map((l) => l.trim()).filter(Boolean);
}

/* 每个常规模块的一句话状态（只给状态与待办，不显示完成率） */
function dailyEntryMeta(mod) {
  if (mod === 'dictation' || mod === 'recite') {
    const t = currentTaskFor(mod);
    return t
      ? { key: 'on', text: `当前任务：${t.name}` }
      : { key: 'off', text: '还没有发布任务' };
  }
  if (mod === 'dcopy' || mod === 'rcopy') {
    const st = moduleStats(mod);
    return st.undone
      ? { key: 'todo', text: `待抄 ${st.undone} 项 · 按已发布名单` }
      : { key: 'clear', text: st.total ? '全部抄完 · 按已发布名单' : '还没发布抄写任务' };
  }
  if (mod === 'dstat') {
    /* 与「每日统计」页同口径：全部任务 + 全部轮次 */
    const snap = statSnapshot();
    if (!snap.taskCount) return { key: 'off', text: '还没有发布任务' };
    return (snap.passCount || snap.itemCount)
      ? { key: 'todo', text: `待过关 ${snap.passCount} 人次 · 待抄 ${snap.itemCount} 项` }
      : { key: 'clear', text: '全部任务已过关 · 抄写已清零' };
  }
  if (mod === 'enroll') {
    const c = enrollChart();
    return { key: 'idle', text: `${Array.isArray(state.charts) ? state.charts.length : 0} 份座次表备用 · 当前编辑 ${c ? `「${c.name}」${c.students.length} 人` : '（空）'}` };
  }
  if (mod === 'homework') {
    const t = state.tasks.homework;
    return t ? { key: 'on', text: `今日作业：${t}` } : { key: 'off', text: '还没有填写今日作业' };
  }
  /* 常规表现：任务督检 / 课堂纪律 / 违纪汇总 —— 都按「最新一份」给状态 */
  if (mod === 'hwcheck' || mod === 'discipline') {
    const list = regList(mod);
    if (!list.length) return { key: 'off', text: mod === 'hwcheck' ? '还没有发布督检任务' : '还没有发布纪律监管任务' };
    const t = list[0];
    const st = regStats(mod, t);
    const tail = String(t.date || '').slice(5);
    if (!st.hit) return { key: 'clear', text: `${t.name} · ${mod === 'hwcheck' ? '全部已完成' : '全体守纪'}（${tail}）` };
    return {
      key: 'todo',
      text: `${t.name} · ${mod === 'hwcheck' ? `未完成 ${st.bad} 人` : `违纪 ${st.hit} 人次`}（${tail}）`
    };
  }
  if (mod === 'regstat') {
    const hw = regTotals('hwcheck');
    const dis = regTotals('discipline');
    if (!hw.tasks && !dis.tasks) return { key: 'off', text: '还没有常规记录' };
    const people = regAllRows().filter((r) => r.total > 0).length;
    const total = hw.hit + dis.hit;
    return total
      ? { key: 'todo', text: `作业 ${hw.hit} 次 + 纪律 ${dis.hit} 次 = ${total} 次 · ${people} 人` }
      : { key: 'clear', text: '常规零违纪 · 作业全交' };
  }
  if (mod === 'reading') {
    const t = selectedReadingTask();
    if (!t) return { key: 'off', text: '还没有发布早读任务' };
    const rs = readingStatus(t, nowMinutes(), todayStr());
    return { key: rs.key === 'doing' ? 'live' : 'on', text: `${segmentsText(t)} · ${rs.label}` };
  }
  return { key: 'idle', text: MODULES[mod].defaultTask || '' };
}

/* ---------------- 7a. 公告栏（主页展示 + 控制台发布 / 编辑 / 删除） ----------------
 * 数据：state.notices = [{ id, title 公告名称, body 正文, files 附件[{id,name,url,size}],
 *                        date, pinned 置顶, by, createdAt, updatedAt }]
 * 公告按班级各存一份（学习任务 / 考试答案 / 成绩都是某个班的），
 * 正文与附件都只是「引用」：附件文件在服务端 data/uploads，state 里只存短路径。 */
function noticeList() {
  return Array.isArray(state.notices) ? state.notices : [];
}

/* 展示顺序：置顶优先 → 日期新的在前 → 同一天按发布时间。
   只在渲染时排副本，state.notices 本身的顺序不动（控制台按下标绑定输入框）。 */
function noticeSorted() {
  return noticeList().slice().sort((a, b) => (
    (Number(b.pinned) - Number(a.pinned))
    || String(b.date || '').localeCompare(String(a.date || ''))
    || String(b.createdAt || '').localeCompare(String(a.createdAt || ''))
  ));
}

/* 公告日期：统一成 YYYY-MM-DD（服务端已归一，这里再兜一层，防止手改数据） */
function noticeDateText(v) {
  const m = String(v || '').trim().match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  return m ? `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}` : '';
}

/* 「最新」只看日期，不看排列顺序、也不看置顶：
   取全部公告里最大的那个日期；几条公告日期相同，就几条都算最新（都标 New）。 */
function noticeLatestDate() {
  return noticeList().reduce((max, n) => {
    const d = noticeDateText(n.date);
    return d > max ? d : max;
  }, '');
}

function noticeCardHTML(n, compact, latest) {
  const body = String(n.body || '');
  /* 侧栏版（compact）：正文只显示两行，长文不再折叠，直接进「查看全部」看全文 */
  const long = !compact && body.length > 220;
  const files = Array.isArray(n.files) ? n.files : [];
  const date = noticeDateText(n.date);
  const isNew = !!date && date === (latest === undefined ? noticeLatestDate() : latest);
  return `<article class="notice-card${n.pinned ? ' is-pin' : ''}${isNew ? ' is-new' : ''}${compact ? ' is-compact' : ''}">
    <div class="notice-card__top">
      ${n.pinned ? '<span class="notice-card__pin">置顶</span>' : ''}
      <h3 class="notice-card__title">${esc(n.title || '未命名公告')}</h3>
      ${date ? `<span class="notice-card__date" title="发布日期 ${date}">${date}</span>` : ''}
      ${isNew ? `<span class="notice-card__new" title="最新日期的公告" aria-label="最新公告"><i aria-hidden="true"></i>New</span>` : ''}
    </div>
    ${body
      ? (long
        ? `<details class="notice-card__fold">
            <summary>展开全文 · ${body.length} 字</summary>
            <div class="notice-card__text">${esc(body)}</div>
          </details>`
        : `<div class="notice-card__text">${esc(body)}</div>`)
      : ''}
    ${files.length ? `<div class="notice-card__files">${files.map(noticeFileHTML).join('')}</div>` : ''}
  </article>`;
}

function noticeSizeText(n) {
  const v = Number(n) || 0;
  if (!v) return '';
  if (v < 1024) return `${v} B`;
  if (v < 1024 * 1024) return `${Math.max(1, Math.round(v / 1024))} KB`;
  return `${(v / 1024 / 1024).toFixed(1)} MB`;
}

function noticeFileKind(name) {
  const ext = String(name || '').split('.').pop().toLowerCase();
  const map = {
    pdf: 'PDF', doc: 'DOC', docx: 'DOC', xls: 'XLS', xlsx: 'XLS', ppt: 'PPT', pptx: 'PPT',
    zip: 'ZIP', rar: 'ZIP', txt: 'TXT', csv: 'CSV', mp3: 'MP3', mp4: 'MP4',
    png: 'IMG', jpg: 'IMG', jpeg: 'IMG', webp: 'IMG', gif: 'GIF'
  };
  return map[ext] || 'FILE';
}

/* 附件链接：同一份文件既能在浏览器里打开，也能「下载」存成原文件名 */
function noticeFileHTML(f) {

}

/* ---------------- 7c. 顶部三栏 · 第二栏：随机提问 ----------------
 * 抽取范围 = 当前「每日常规」所选班级的全体学员（与班级切换按钮同源）。
 * 抽签过程：快速滚名 → 减速 → 停在中签者，并盖一枚「抽中」章。
 * 「不重复」打开后，本轮抽过的人不会再被抽到，全班轮完自动重置。 */

/* 一次可以抽几位：1–4 人，抽中的人互不重复 */
const PICK_MAX = 4;
const PICK_COUNTS = [1, 2, 3, 4];
const pickState = { last: [], seen: [], noRepeat: false, busy: false, count: 1 };

function pickRoster() {
  try {
    const snap = regSnapshot();
    return snap.students.map((s) => ({
      id: s.id, name: s.name, row: s.row, group: s.group
    }));
  } catch (err) { return []; }
}

function pickHistoryHTML() {
  if (!pickState.last.length) return '<i>最近</i><em>还没有抽过</em>';
  return '<i>最近</i>'
    + pickState.last.slice(0, 4).map((n) => `<span>${esc(n)}</span>`).join('');
}

function pickNamesHTML(list) {
  const multi = list.length > 1;
  return list.map((s) => `<span class="picker__slot">
        <b class="picker__name">${esc(s.name)}</b>
        ${multi ? `<i class="picker__seat picker__seat--mini">${s.row} 排 ${s.group} 组</i>` : ''}
      </span>`).join('');
}

function pickerHTML() {
  const list = pickRoster();
  const n = list.length;
  const want = Math.max(1, Math.min(PICK_MAX, pickState.count || 1));
  const name = n ? '准备好了吗' : '暂无名单';
  const seat = n
    ? `点「随机点名」，从「${esc(currentClassName())}」${n} 人中抽 ${want} 位`
    : '先到「录入学员」建一份座次表';
  return `<section class="panel panel--pick" aria-labelledby="pickTitle" data-picker>
    <header class="panel__head">
      <div class="panel__headmain">
        <p class="panel__eyebrow">RANDOM CALL</p>
        <h2 class="panel__title" id="pickTitle">随机提问</h2>
      </div>
      <span class="panel__chip" title="抽取范围：当前班级全体学员">${esc(currentClassName())} · ${n} 人</span>
    </header>
    <div class="picker__stage" data-pick-stage>
      <span class="picker__ring" aria-hidden="true"></span>
      <span class="picker__stamp" aria-hidden="true">抽中</span>
      <div class="picker__reel" aria-live="polite">
        <div class="picker__names" data-pick-names><span class="picker__slot"><b class="picker__name">${name}</b></span></div>
        <span class="picker__seat" data-pick-seat>${seat}</span>
      </div>
    </div>
    <div class="picker__counts" role="group" aria-label="抽取人数">
      <span class="picker__counts__label">抽取</span>
      ${PICK_COUNTS.map((k) => `<button type="button" class="picker__count${k === want ? ' is-on' : ''}"
        data-action="pick-count" data-n="${k}" aria-pressed="${k === want}"
        title="本次抽 ${k} 位同学">${k} 人</button>`).join('')}
    </div>
    <div class="picker__acts">
      <button type="button" class="picker__btn" data-action="pick-roll"${n ? '' : ' disabled'}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="4"/>
          <circle cx="8.4" cy="8.4" r="1.25" fill="currentColor" stroke="none"/>
          <circle cx="15.6" cy="15.6" r="1.25" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="12" r="1.25" fill="currentColor" stroke="none"/>
        </svg>
        <span data-pick-label>随机点名</span>
      </button>
      <button type="button" class="picker__mode" data-action="pick-mode"
        aria-pressed="${pickState.noRepeat ? 'true' : 'false'}"
        title="打开后同一轮不会重复抽到同一个人">不重复</button>
    </div>
    <p class="picker__hist" data-pick-hist>${pickHistoryHTML()}</p>
  </section>`;
}

/* 从池子里抽 n 位，保证互不重复；同名同学只取一位，若因此不足 n 位再用剩下的人补齐 */
function pickWinners(pool, n) {
  const bag = pool.slice();
  const out = [];
  const used = new Set();
  const spare = [];
  while (bag.length && out.length < n) {
    const s = bag.splice(Math.floor(Math.random() * bag.length), 1)[0];
    if (used.has(s.name)) { spare.push(s); continue; }
    used.add(s.name);
    out.push(s);
  }
  while (out.length < n && spare.length) out.push(spare.pop());
  return out;
}

function pickRoll() {
  const sec = document.querySelector('[data-picker]');
  if (!sec || pickState.busy) return;
  const all = pickRoster();
  if (!all.length) {
    toast(`「${currentClassName()}」还没有座次表，先到「录入学员」建一份`, 'warn', 3600);
    return;
  }
  const want = Math.max(1, Math.min(PICK_MAX, pickState.count || 1));
  let pool = all;
  if (pickState.noRepeat) {
    pool = all.filter((s) => pickState.seen.indexOf(s.id) < 0);
    if (pool.length < want) {           // 剩下的人不够这一轮，重新开一轮
      pickState.seen = [];
      pool = all;
    }
  }
  const need = Math.min(want, pool.length);
  if (need < want) {
    toast(`「${currentClassName()}」还能抽的只剩 ${need} 人，本次抽 ${need} 人`, 'warn', 3200);
  }
  const winners = pickWinners(pool, need);
  const stage = sec.querySelector('[data-pick-stage]');
  const nameEl = sec.querySelector('[data-pick-names]');
  const seatEl = sec.querySelector('[data-pick-seat]');
  const labelEl = sec.querySelector('[data-pick-label]');
  if (!stage || !nameEl || !seatEl) return;

  nameEl.classList.toggle('is-multi', need > 1);
  nameEl.classList.toggle('is-quad', need > 2);
  stage.classList.toggle('is-group', need > 1);
  nameEl.innerHTML = pickNamesHTML(winners);
  const slots = Array.prototype.slice.call(nameEl.querySelectorAll('.picker__name'));

  pickState.busy = true;
  stage.classList.remove('is-hit');
  stage.classList.add('is-rolling');
  if (labelEl) labelEl.textContent = '抽签中…';
  /* 滚动过程中不要逐字播报，抽完再读一遍结果 */
  const reel = sec.querySelector('.picker__reel');
  if (reel) reel.setAttribute('aria-live', 'off');

  const DUR = 1100;
  let elapsed = 0;
  const step = () => {
    if (!document.contains(nameEl)) { pickState.busy = false; return; }
    const p = Math.min(1, elapsed / DUR);
    const rand = all[Math.floor(Math.random() * all.length)];
    slots.forEach((el) => { el.textContent = rand.name; });
    const delay = 46 + 132 * p * p;     // 先快后慢
    elapsed += delay;
    if (elapsed >= DUR) { setTimeout(settle, delay); return; }
    setTimeout(step, delay);
  };

  const settle = () => {
    if (!document.contains(nameEl)) { pickState.busy = false; return; }
    nameEl.innerHTML = pickNamesHTML(winners);
    seatEl.textContent = winners.length > 1
      ? `抽中 ${winners.length} 人 · ${currentClassName()}`
      : `第 ${winners[0].row} 排 · 第 ${winners[0].group} 组 · ${currentClassName()}`;
    stage.classList.remove('is-rolling');
    stage.classList.add('is-hit');
    if (labelEl) labelEl.textContent = '再抽一次';
    const names = winners.map((w) => w.name);
    pickState.last = names
      .concat(pickState.last.filter((n) => names.indexOf(n) < 0))
      .slice(0, 6);
    if (pickState.noRepeat) winners.forEach((w) => { if (pickState.seen.indexOf(w.id) < 0) pickState.seen.push(w.id); });
    const hist = sec.querySelector('[data-pick-hist]');
    if (hist) hist.innerHTML = pickHistoryHTML();
    if (reel) reel.setAttribute('aria-live', 'polite');
    pickState.busy = false;
  };

  setTimeout(step, 40);
}

/* 切换抽取人数（1–4）：只改界面，不动任何班级数据 */
function pickSetCount(n) {
  const v = Math.max(1, Math.min(PICK_MAX, Number(n) || 1));
  const sec = document.querySelector('[data-picker]');
  if (!sec || pickState.busy || v === pickState.count) return;
  pickState.count = v;
  Array.prototype.forEach.call(sec.querySelectorAll('[data-action="pick-count"]'), (b) => {
    const on = Number(b.dataset.n) === v;
    b.classList.toggle('is-on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  const stage = sec.querySelector('[data-pick-stage]');
  if (!stage || stage.classList.contains('is-rolling')) return;
  const total = pickRoster().length;
  const seatEl = sec.querySelector('[data-pick-seat]');
  const wrapEl = sec.querySelector('[data-pick-names]');
  const hit = stage.classList.contains('is-hit');
  stage.classList.remove('is-hit', 'is-group');
  if (seatEl) {
    seatEl.textContent = total
      ? `点「随机点名」，从「${currentClassName()}」${total} 人中抽 ${v} 位`
      : '先到「录入学员」建一份座次表';
  }
  if (wrapEl) {
    wrapEl.classList.remove('is-multi', 'is-quad');
    wrapEl.innerHTML = `<span class="picker__slot"><b class="picker__name">${total ? '准备好了吗' : '暂无名单'}</b></span>`;
  }
  const labelEl = sec.querySelector('[data-pick-label]');
  if (labelEl && !hit) labelEl.textContent = '随机点名';
}

function pickToggleMode() {
  pickState.noRepeat = !pickState.noRepeat;
  pickState.seen = pickState.noRepeat ? pickState.seen : [];
  const sec = document.querySelector('[data-picker]');
  const btn = sec && sec.querySelector('[data-action="pick-mode"]');
  if (btn) btn.setAttribute('aria-pressed', pickState.noRepeat ? 'true' : 'false');
  toast(pickState.noRepeat

/* ---------------- 8. 录入页渲染 ---------------- */
function recFor(date, mod) {
  if (!state.records[date]) state.records[date] = {};
  if (!state.records[date][mod]) state.records[date][mod] = {};
  return state.records[date][mod];
}

/* ---------- 任务（听写 / 背诵通用） ---------- */
/* 各任务型模块 → 状态里的任务数组键名 */
const TASK_STORE = { dictation: 'dTasks', dcopy: 'dTasks', recite: 'rTasks', rcopy: 'rTasks' };
const TASK_KIND_NAME = { dictation: '听写', dcopy: '听写', recite: '背诵', rcopy: '背诵' };

const isTaskMod = (mod) => mod === 'dictation' || mod === 'dcopy' || mod === 'recite' || mod === 'rcopy';
const isCopyMod = (mod) => mod === 'dcopy' || mod === 'rcopy';
const mainModOf = (mod) => (mod === 'recite' || mod === 'rcopy') ? 'recite' : 'dictation';

function taskListOf(store) {
  return Array.isArray(state[store]) ? state[store] : [];
}

function currentTaskFor(mod) {
  if (!isTaskMod(mod)) return null;
  /* 双系统：按当前选中的任务取，没有选中就取最新发布的一条 */
  return sysActiveTask(sysOfMod(mod));
}

function currentTask() {   // 当前模块的任务（首页等上下文请用 currentTaskFor）
  return currentTaskFor(currentModule);
}

/* ---------- 任务层级（必修 / 必修一 / Unit 1 …） ---------- */
/* levels 是事实源；老任务没有 levels 时退回按 name 显示成一层 */
function taskLevels(task) {
  if (!task) return [];
  if (Array.isArray(task.levels) && task.levels.length) return task.levels.filter(Boolean);
  const name = String(task.name || '').trim();
  return name ? [name] : [];
}

function levelsText(task, sep = ' / ') {
  return taskLevels(task).join(sep);
}

/* 完整路径：目录层级 + 任务自己的名字（末级）
   —— levels 只是「任务挂在哪个目录」，任务名是这一层里的最后一级；
      例如目录「必修一」下的任务「Unit 1」，完整路径是「必修一 › Unit 1」。
   名字本身已经等于整条路径（自动命名 = 各级连写）时不重复拼。 */
function taskPathList(task) {
  const dirs = taskLevels(task).slice();
  const name = String((task && task.name) || '').replace(/\s+/g, ' ').trim();
  if (!name) return dirs;
  const joined = dirs.join(' ');
  if (!joined) return [name];
  if (name === joined || name === dirs[dirs.length - 1]) return dirs;
  if (name.indexOf(joined) === 0) {
    const rest = name.slice(joined.length).replace(/^[\s·•/|｜>＞–—-]+/, '').trim();
    return rest ? dirs.concat([rest]) : dirs;
  }
  return dirs.concat([name]);
}

function taskPathText(task, sep = ' › ') {
  return taskPathList(task).join(sep);
}

/* 层级面包屑：必修 › 必修一 › Unit 1；单层时只显示一层，不加箭头 */
function lvCrumbsHTML(task, cls) {
  const lv = taskLevels(task);
  if (!lv.length) return '';
  const parts = lv.map((x) => `<b class="lv-crumbs__item">${esc(x)}</b>`).join('<i class="lv-crumbs__sep" aria-hidden="true">›</i>');
  return `<span class="lv-crumbs ${cls || ''}" title="任务层级：${esc(lv.join(' / '))}">${parts}</span>`;
}

/* 某个任务数组里「最新发布」的那一条：日期优先，同日期取最后发布的 */
function latestTaskOf(store) {
  const list = taskListOf(store);
  if (!list.length) return null;
  const sorted = list.slice().sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
  return sorted[sorted.length - 1];
}

  { mod: 'recite', copyMod: 'rcopy', store: 'rTasks', label: '背诵抄写', short: '背诵', tone: 'r' }
];

/* 本系统全部已发布任务：按日期 + 发布时间正序（老任务在前，最新在后） */
function statTasksOf(store) {
  return taskListOf(store).slice().sort((a, b) => (
    String(a.date || '').localeCompare(String(b.date || ''))
    || String(a.createdAt || '').localeCompare(String(b.createdAt || ''))
  ));
}

/* 汇总一次：每个学生的「待过关」与「待抄写」项目
   —— 覆盖该系统的【全部任务】与【全部抄写轮次】，不是只算最新一次：
      只要历史任务 / 历史轮次还没完成，就会一直出现在这里（与每日统计页同一口径）。
   纯派生数据，不写回 state，任何一侧改动都会在下一次渲染自动体现 */
function statSnapshot() {
  const scopes = STAT_SCOPES.map((sc) => Object.assign({}, sc, { tasks: statTasksOf(sc.store) }));
  const bySid = new Map();
  const rows = [];
  /* 人群 = 全班名单 ∪ 各任务固化的座次表快照名单（任务可能用了别的座次表） */
  const pop = [];
  const seen = new Set();
  const pushStu = (s) => {
    if (s && s.id && !seen.has(s.id)) { seen.add(s.id); pop.push(s); }
  };
  state.students.forEach(pushStu);
  scopes.forEach((sc) => { sc.tasks.forEach((t) => taskStudents(t).forEach(pushStu)); });
  pop.forEach((s) => {
    if (!s.name || !s.name.trim()) return;
    const pending = [];   // 待抄写（每一轮一份冻结名单）
    const pass = [];      // 待过关（任务 records 里没有这位同学）
    let need = 0;
    let copied = 0;
    scopes.forEach((sc) => {
      sc.tasks.forEach((t) => {
        if (!taskStudents(t).some((x) => x.id === s.id)) return;
        if (!(t.records && t.records[s.id])) pass.push({ sc, task: t });
        sysRounds(t).forEach((r) => {
          if (r.sids.indexOf(s.id) < 0) return;
          need += 1;
          if (r.done && r.done[s.id]) { copied += 1; return; }
          pending.push({ sc, task: t, round: r });
        });
      });
    });
    const info = { s, need, copied, pending, pass };
    bySid.set(s.id, info);
    if (pending.length || pass.length) rows.push(info);
  });
  /* 从上到下 = 按座位顺序（先第 1 排，再组内从左到右） */
  rows.sort((a, b) => (a.s.row - b.s.row) || (a.s.group - b.s.group));
  const itemCount = rows.reduce((n, r) => n + r.pending.length, 0);   // 待抄写项数
  const passCount = rows.reduce((n, r) => n + r.pass.length, 0);      // 待过关人次
  const copyPeople = rows.filter((r) => r.pending.length).length;     // 有待抄的人
  const taskCount = scopes.reduce((n, sc) => n + sc.tasks.length, 0);
  const roundCount = scopes.reduce((n, sc) => n + sc.tasks.reduce((m, t) => m + sysRounds(t).length, 0), 0);
  return {
    scopes,
    bySid,
    rows,
    itemCount,
    passCount,
    copyPeople,
    taskCount,
    roundCount,
    missingTask: scopes.filter((sc) => !sc.tasks.length).map((sc) => sc.label)
  };
}

/* 需要罚抄的学生映射：任务中「未完成」的同学（由主模块自动派生） */
function needCopyMap(task) {
  const need = {};
  if (!task) return need;
  taskStudents(task).forEach((s) => {
    if (s.name && s.name.trim() && !task.records[s.id]) need[s.id] = true;
  });
  return need;
}

/* 按记录对象统计完成情况 */
function statsFromRec(rec) {
  let total = 0;
  let done = 0;
  state.students.forEach((s) => {
    if (!s.name || !s.name.trim()) return;
    total += 1;
    if (rec[s.id]) done += 1;
  });
  return { total, done, undone: Math.max(0, total - done), rate: total ? Math.round((done / total) * 100) : 0 };
}

/* 各模块统计：听写/背诵及其抄写按当前任务，作业按日期 */
function moduleStats(mod) {
  if (isTaskMod(mod)) {
    const task = currentTaskFor(mod);
    if (!task) return { total: 0, done: 0, undone: 0, rate: 0 };
    if (isCopyMod(mod)) return copyAgg(task);   // 按已发布的抄写轮次合并统计
    return statsFromRec(task.records);
  }
  return statsFromRec((state.records[viewDate] || {})[mod] || {});
}

/* 当前模块对应的记录对象（读用，不自动创建） */
function recForModule(mod) {
  if (mod === 'homework') return (state.records[viewDate] || {}).homework || {};
  const task = currentTaskFor(mod);
  if (!task) return {};
  return isCopyMod(mod) ? copyDoneOf(task) : task.records;
}

/* ---------- 早读常规：多任务 · 多段内容 · 实时日期 ---------- */
const nowMinutes = (d = nowDate()) => d.getHours() * 60 + d.getMinutes();
const hhmmss = (d = nowDate()) => `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
const timeToMin = (t) => {
  const m = String(t || '').match(/^(\d{2}):(\d{2})$/);
  return m ? Number(m[1]) * 60 + Number(m[2]) : 0;
};

/* 全部任务（控制台用）与已发布任务（大屏 / 早读页用） */
function readingList() {
  return Array.isArray(state.rdTasks) ? state.rdTasks : [];
}

function publishedReadingList() {
  return readingList().filter((t) => t.published !== false);
}

function readingTaskById(id) {
  return readingList().find((t) => t.id === id) || null;
}

function readSelectedId() {
  try { return localStorage.getItem(READ_SEL_KEY) || ''; } catch (err) { return ''; }
}

function readSaveSelected(id) {
  try {
    if (id) localStorage.setItem(READ_SEL_KEY, id);
    else localStorage.removeItem(READ_SEL_KEY);
  } catch (err) { /* ignore */ }
}

/* 默认展示哪个任务：今天正在进行的 → 今天还没开始且最近的一段 → 今天最后一条 → 最近一个未到的 → 全部里最后一条 */
function defaultReadingTask() {
  const list = publishedReadingList();
  const today = todayStr();
  const todays = list.filter((t) => t.date === today);
  if (todays.length) {
    const now = nowMinutes();
    const doing = todays.find((t) => readingStatus(t, now, today).key === 'doing');
    if (doing) return doing;
    const next = todays
      .filter((t) => (t.segments || []).some((s) => timeToMin(s.start) >= now))
      .sort((a, b) => a.segments[0].start.localeCompare(b.segments[0].start))[0];
    if (next) return next;
    return todays[todays.length - 1];
  }
  const upcoming = list.filter((t) => t.date >= today)
    .sort((a, b) => a.date.localeCompare(b.date))[0];
  return upcoming || list.slice(-1)[0] || null;
}

/* 本机选中的展示对象（选择结果只存本机，不影响别人） */
function selectedReadingTask() {
  const list = publishedReadingList();
  const picked = readingTaskById(readSelectedId());
  if (picked && picked.published !== false) return picked;
  return defaultReadingTask();
}

function selectReadingTask(id) {
  const task = readingTaskById(id);
  if (!task) return;
  readSaveSelected(id);
  if (location.hash !== '#/module/reading') { location.hash = '#/module/reading'; return; }
  renderReading();
  const stage = $('.read-stage');
  if (stage && stage.scrollIntoView) stage.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function readBgKey() {
  let local = '';
  try { local = localStorage.getItem(READ_BG_KEY) || ''; } catch (err) { /* ignore */ }
  const key = local || (state.reading && state.reading.bg) || 'dawn';
  return READ_BACKGROUNDS.some((b) => b.key === key) ? key : 'dawn';
}

function readBgPreset(key) {
  const k = key || readBgKey();
  return READ_BACKGROUNDS.find((b) => b.key === k) || READ_BACKGROUNDS[0];
}

/* ---------- 大屏相关数据 ---------- */

/* ---------- 展示图片：上传 / 压缩 / 取列表 ---------- */
/* 图片只存一个短路径（/uploads/xxx.jpg），文件在服务端 data/uploads 里，
   这样 state.json 与实时广播都很小；首页与大屏都用这个路径显示。 */
const SPOT_MAX_SIDE = 1600;      // 压缩后的长边（足够 1080P 大屏看细节）
const SPOT_QUALITY = 0.86;
const SPOT_KIND_NAME = { star: '学习标兵', work: '优秀作业' };

function spotListOf(kind) {
  return kind === 'star' ? starList() : workList();
}

function spotImages(kind) {
  return spotListOf(kind).filter((it) => it.img).map((it) => ({
    id: it.id,
    src: it.img,
    name: it.name || '',
    text: kind === 'star' ? (it.title || '学习标兵') : (it.item || '优秀作业'),
    note: it.note || ''
  }));
}

/* 浏览器端先压一遍：长边 ≤ 1600、转 JPEG，手机原图（5–10MB）通常压到 200KB 左右。
   GIF 原样上传，免得动图被截成一张静态图。 */
async function compressSpotImage(file) {
  if (/^image\/gif$/i.test(file.type || '')) return file;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = () => reject(new Error('这张图片读不出来，换一张试试'));
      im.src = url;
    });
    const w0 = img.naturalWidth || img.width || 1;
    const h0 = img.naturalHeight || img.height || 1;
    const scale = Math.min(1, SPOT_MAX_SIDE / Math.max(w0, h0));
    const w = Math.max(1, Math.round(w0 * scale));
    const h = Math.max(1, Math.round(h0 * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';     // PNG 透明底转 JPEG 时垫白，避免变成黑块
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise((resolve) => canvas.toBlob((b) => resolve(b), 'image/jpeg', SPOT_QUALITY));
    return blob || file;
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function uploadSpotImage(file) {
  if (!file) throw new Error('没有选择图片');
  if (!/^image\//i.test(file.type || '')) throw new Error('请选择图片文件（JPG / PNG / WebP）');
  const blob = await compressSpotImage(file);
  const r = await fetch('/api/upload-image', {
    method: 'POST',
    headers: { 'content-type': blob.type || 'image/jpeg', 'x-token': link.token || '' },
    body: blob
  });
  const data = await r.json().catch(() => null);
  if (!r.ok || !data || !data.ok) throw new Error((data && data.msg) || '上传失败，请稍后重试');
  return data.url;
}

/* 当前正在等哪一条记录选图（点缩略图 → 触发隐藏的 file input） */
let spotPick = { kind: '', id: '' };

function pickSpotImage(kind, id) {
  if (!can.admin) return;
  spotPick = { kind, id };
  const input = $('#spotImgFile');
  if (input) input.click();
  else toast('当前浏览器不支持选择文件', 'err');
}

async function handleSpotFile(input) {
  const file = input.files && input.files[0];
  input.value = '';                       // 允许下次再选同一张
  const target = spotPick;
  spotPick = { kind: '', id: '' };
  if (!file || !target.id) return;
  const kindName = SPOT_KIND_NAME[target.kind] || '记录';
  try {
    toast(`正在上传${kindName}图片…`, 'ok', 1600);
    const url = await uploadSpotImage(file);
    const it = spotListOf(target.kind).find((x) => x.id === target.id);
    if (!it) { toast('这条记录已经被删除了', 'warn'); return; }
    it.img = url;
    saveState();
    renderAdmin();
    renderView();
    toast('图片已保存：首页与大屏都会显示', 'ok', 2600);
  } catch (err) {
    toast((err && err.message) || '上传失败', 'err', 3800);
  }
}

function clearSpotImage(kind, id) {
  const it = spotListOf(kind).find((x) => x.id === id);
  if (!it || !it.img) return;
  it.img = '';
  saveState();
  renderAdmin();
  renderView();
  toast('已移除这张图片', 'ok');
}

/* ---------- 图片放大查看（灯箱）：首页点缩略图打开，← → 翻页，Esc / 点空白关闭 ---------- */
let spotZoom = { kind: 'star', items: [], idx: 0 };

function openSpotZoom(kind, id) {
  const items = spotImages(kind);
  if (!items.length) return;
  const idx = Math.max(0, items.findIndex((x) => x.id === id));
  spotZoom = { kind, items, idx };
  paintSpotZoom();
}

function stepSpotZoom(step) {
  const n = spotZoom.items.length;
  if (!n) return;
  spotZoom.idx = ((spotZoom.idx + step) % n + n) % n;
  paintSpotZoom();
}

function closeSpotZoom() {
  const root = $('#modalRoot');
  if (root && root.innerHTML.indexOf('class="lightbox"') >= 0) root.innerHTML = '';
  document.body.classList.remove('is-zoom');
  spotZoom = { kind: 'star', items: [], idx: 0 };
}

function paintSpotZoom() {
  const { items, idx, kind } = spotZoom;
  const it = items[idx];
  if (!it) return;
  const root = $('#modalRoot');
  if (!root) return;
  const kindName = SPOT_KIND_NAME[kind] || '展示';
  const label = it.name ? `${it.name} · ${it.text}` : it.text;
  root.innerHTML = `<div class="lightbox" role="dialog" aria-modal="true" aria-label="${esc(kindName)}图片">
    <button class="lightbox__close" data-action="spot-zoom-close" aria-label="关闭">✕</button>
    ${items.length > 1 ? '<button class="lightbox__nav lightbox__nav--prev" data-action="spot-zoom-step" data-step="-1" aria-label="上一张">‹</button>' : ''}
    <figure class="lightbox__stage">
      <img class="lightbox__img" src="${esc(it.src)}" alt="${esc(label)}" />
      <figcaption class="lightbox__cap">
        <b>${esc(it.name || '—')}</b>
        <span>${esc(it.text)}</span>
        ${it.note ? `<i>${esc(it.note)}</i>` : ''}
      </figcaption>
    </figure>
    ${items.length > 1 ? '<button class="lightbox__nav lightbox__nav--next" data-action="spot-zoom-step" data-step="1" aria-label="下一张">›</button>' : ''}
    <div class="lightbox__foot">
      <span class="lightbox__kind">${esc(kindName)}</span>
      <span class="lightbox__count">${idx + 1} / ${items.length}</span>
      <span class="lightbox__hint">点击空白处或按 Esc 关闭 · ← → 切换</span>
    </div>
  </div>`;
  document.body.classList.add('is-zoom');
  const box = $('.lightbox', root);
  if (box) box.addEventListener('mousedown', (e) => { if (e.target === box) closeSpotZoom(); });
}

/* ---------- 状态计算 ---------- */
function readStatusOf(task) {
  return readingStatus(task, nowMinutes(), todayStr());
}

function readStatusText(task) {
  if (!task) return '还没有发布早读任务';
  const st = readStatusOf(task);
  if (st.key === 'other') return `${task.date} 的任务`;
  if (st.key === 'doing') {
    const multi = task.segments.length > 1 ? `第 ${st.segIndex + 1} 段 · ` : '';
    return `${multi}进行中 · 剩余 ${st.diff} 分钟`;
  }
  if (st.key === 'before') return `未开始 · ${st.diff} 分钟后开始`;
  if (st.key === 'break') return `时段间歇 · ${st.diff} 分钟后进入第 ${st.segIndex + 1} 段`;
  if (st.key === 'after') return '今日早读已结束';
  return st.label;
}

/* 首页模块卡上的显示：文案要短，避免撑破数字行 */
function readCardState(task) {
  if (!task) return '未发布';
  const st = readStatusOf(task);
  if (st.key === 'doing') return '进行中';
  if (st.key === 'before') return '未开始';
  if (st.key === 'break') return '时段间歇';
  if (st.key === 'after') return '已结束';
  return '其他日期';
}

/* 卡片进度条：进行中显示当前时段进度，已结束 100%，未开始 0% */
function readProgress(task) {
  if (!task) return 0;
  const st = readStatusOf(task);
  if (st.key === 'after') return 100;
  if (st.key !== 'doing' || !st.seg) return 0;
  const s = timeToMin(st.seg.start);
  const e = timeToMin(st.seg.end);
  const n = nowMinutes();
  if (e <= s) return 0;
  return Math.max(0, Math.min(100, Math.round(((n - s) / (e - s)) * 100)));
}

function readingStats() {
  const task = selectedReadingTask();
  const segCount = task ? task.segments.length : 0;
  const mins = task ? totalMinutes(task) : 0;
  return {
    done: 0,
    undone: 0,
    rate: readProgress(task),
    nums: `<span>时间段 <b>${segCount}</b></span><span>合计 <b>${mins}</b> 分钟</span>`
      + `<span class="read-state is-${task ? readStatusOf(task).key : 'none'}">${esc(readCardState(task))}</span>`
  };
}

/* 早读页顶部：已发布任务之间的切换（点谁就大屏展示谁，仅本机记忆） */

function bgDotsHTML(activeKey, cls) {

/* 单段分钟数 */
function segMinutes(seg) {
  return Math.max(0, timeToMin(seg && seg.end) - timeToMin(seg && seg.start));

/* 某一段的朗读内容：优先用该段自己的内容，旧数据回落到任务总内容 */

/* 每秒刷新：网络实时日期 / 时间、任务状态、当前时段高亮；跨天自动整页重算 */
let readClockTimer = null;
let readClockDay = '';

function startReadClock() {
  clearInterval(readClockTimer);
  readClockDay = todayStr();
  readClockTimer = setInterval(tickReadClock, 1000);
}

function tickReadClock() {
  const now = new Date(Date.now() + clockSkew);
  if (todayStr(now) !== readClockDay) {
    readClockDay = todayStr(now);
    renderView();
    return;
  }
  const dEl = $('#readToday');
  if (dEl) dEl.textContent = dateLabel(todayStr(now));
  const cEl = $('#readClock');
  if (cEl) cEl.textContent = hhmmss(now);

  const task = selectedReadingTask();
  if (!task) return;
  const st = readStatusOf(task);
  const sEl = $('#readStatus');
  if (sEl) {
    sEl.textContent = readStatusText(task);
    sEl.className = `morning__status is-${st.key}`;
  }
  $$('[data-seg-index]').forEach((row) => {
    const i = Number(row.dataset.segIndex);
    const seg = task.segments[i];
    if (!seg) return;
    row.className = `read-seg is-${segmentStatus(seg, nowMinutes(now))}`;
  });
}

function saveReadingTask(forcePublish) {
  if (!can.admin || !readDraft) return;
  const segs = normSegments(readDraft.segments, []);
  if (!segs.length) { toast('请至少填写一个有效时间段：开始时间要早于结束时间', 'warn', 3200); return; }
  const date = String(readDraft.date || '').slice(0, 10) || todayStr();
  const name = String(readDraft.name || '').trim().slice(0, 30) || defaultReadingName(date);
  const published = forcePublish ? true : readDraft.published !== false;
  const content = String(readDraft.content || '').trim().slice(0, 220);

  let savedId = '';
  if (adminEditId === 'new' || !readDraft.id) {
    const task = newReadingTask({ name, date, segments: segs, content, published, by: actorName() });
    state.rdTasks = readingList().concat(task);
    savedId = task.id;
    toast(published ? `已发布「${name}」` : `已保存预设「${name}」，点「发布」后才会展示`, 'ok', 3600);
  } else {
    const idx = readingList().findIndex((t) => t.id === readDraft.id);
    if (idx < 0) { closeReadingEditor(); return; }
    const prev = readingList()[idx];
    state.rdTasks[idx] = Object.assign({}, prev, {
      name, date, segments: segs, content, published,
      by: prev.by || actorName()
    });
    savedId = prev.id;
    toast(published ? `已更新并发布「${name}」` : `已保存「${name}」（预设）`, 'ok', 3200);
  }
  state.rdTasks = readingList().slice().sort((a, b) => (a.date + a.segments[0].start).localeCompare(b.date + b.segments[0].start));
  if (published && savedId) readSaveSelected(savedId);
  saveState();
  closeReadingEditor();
  renderView();
}

function toggleReadingPublish(id) {
  if (!can.admin) return;
  const task = readingTaskById(id);
  if (!task) return;
  const next = task.published === false;
  state.rdTasks = readingList().map((t) => (t.id === id ? Object.assign({}, t, { published: next }) : t));
  if (next) readSaveSelected(id);
  saveState();
  renderAdmin();
  renderView();
  toast(next ? `已发布「${task.name}」，早读常规与大屏可见` : `已撤回「${task.name}」，仅控制台可见`, 'ok', 3200);
}

function removeReadingTask(id) {
  if (!can.admin) return;
  const task = readingTaskById(id);
  if (!task) return;
  openConfirm({
    title: `删除「${task.name}」？`,
    message: `将删除 <b>${esc(task.date)} · ${esc(segmentsText(task))}</b> 的早读任务。其他任务不受影响，此操作不可撤销。`,
    confirmText: '确认删除',
    danger: true,
    onConfirm: () => {

function setReadBg(key) {

function seatMatrix() {
  const { groups, rows } = state.layout;
  const map = new Map();
  state.students.forEach((s) => map.set(`${s.group}:${s.row}`, s));
  const cols = [];
  for (let g = 1; g <= groups; g += 1) {
    const col = [];
    for (let r = 1; r <= rows; r += 1) col.push(map.get(`${g}:${r}`) || null);
    cols.push(col);
  }
  return cols;
}

/* 座次表显示范围：只保留「有姓名」的排与组，外围整排 / 整组留空就自动收起。
   中间的空位（讲台两侧、空桌）仍然占位，保证每个人的座位与教室实际位置对得上；
   这些空位在页面上不画框、不写「空位」二字，视觉上只留下有名字的区块。 */
function seatView() {
  const { groups, rows } = state.layout;
  const usedG = new Set();
  let maxRow = 1;
  state.students.forEach((s) => {
    if (s.row >= 1 && s.row <= rows) maxRow = Math.max(maxRow, s.row);
    if (s.group >= 1 && s.group <= groups) usedG.add(s.group);
  });
  if (!usedG.size) return { minG: 1, maxG: 1, maxRow: 1, empty: true };
  if (state.layout.podium) maxRow = Math.max(maxRow, Math.min(rows, state.layout.podium.row));
  let minG = 1;
  let maxG = groups;
  while (minG < maxG && !usedG.has(minG)) minG += 1;
  while (maxG > minG && !usedG.has(maxG)) maxG -= 1;
  return { minG, maxG, maxRow: Math.max(1, Math.min(rows, maxRow)), empty: false };
}

function seatHTML(s, rec) {
  const done = !!(s && rec[s.id]);
  const label = done ? state.theme.doneLabel : state.theme.undoneLabel;
  return `<button class="seat ${done ? 'is-done' : ''}" data-action="seat" data-sid="${s.id}"
      aria-pressed="${done}" title="第 ${s.row} 排 · 第 ${s.group} 组">
      <span class="seat__name">${esc(s.name)}</span>
      <span class="seat__status">${esc(label)}</span>
    </button>`;
}

/* 抄写模块座位（听写抄写 / 背诵抄写通用）：主项已完成 → 「无需罚抄」不可点；未完成 → 可点选罚抄完成 */
function seatCopyHTML(s, task) {
  const need = task && !task.records[s.id];
  if (!need) {
    return `<div class="seat seat--na" title="已完成，无需罚抄">
      <span class="seat__name">${esc(s.name)}</span>
      <span class="seat__status">无需罚抄</span>
    </div>`;
  }
  const done = !!copyDoneOf(task)[s.id];
  return `<button class="seat ${done ? 'is-done' : ''}" data-action="seat" data-sid="${s.id}"
      aria-pressed="${done}" title="第 ${s.row} 排 · 第 ${s.group} 组">
      <span class="seat__name">${esc(s.name)}</span>
      <span class="seat__status">${done ? '罚抄完成' : '待罚抄'}</span>
    </button>`;
}

function undoList() {
  if (isTaskMod(currentModule)) {
    const task = currentTask();
    if (!task) return [];
    return state.log.filter((e) => e.module === currentModule && e.taskId === task.id);
  }
  return state.log.filter((e) => e.date === viewDate && e.module === currentModule);
}

function lastActionText() {
  const list = undoList();
  const last = list[list.length - 1];
  if (!last) return '暂无操作记录';
  const st = state.students.find((s) => s.id === last.sid);
  const name = st ? st.name : '（已移除的学生）';
  const toLabel = isCopyMod(last.module)
    ? (last.to ? '罚抄完成' : '待罚抄')
    : (last.to ? state.theme.doneLabel : state.theme.undoneLabel);
  return `${last.by} 将 ${name} 标记为「${toLabel}」`;
}
