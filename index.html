  line-height: 1.55;
}

.entry__dot { flex: 0 0 6px; width: 6px; height: 6px; border-radius: 50%; background: #2A4750; margin-left: auto; }
.entry__dot.is-on { background: #4FB183; }
.entry__dot.is-live { background: #E07385; box-shadow: 0 0 0 3px rgba(224, 115, 133, 0.16); animation: entryPulse 2.6s ease-in-out infinite; }
.entry__dot.is-todo { background: #3FB3B0; }
.entry__dot.is-off { background: #5A7089; }
.entry__dot.is-clear { background: #5A7089; }
@keyframes entryPulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

.entry__go {
  flex: 0 0 auto;
  font-size: 12px;
  color: var(--ink-3);
  opacity: 0;
  transform: translateX(-3px);
  transition: opacity .16s, transform .16s, color .16s;
}
.entry:hover .entry__go { opacity: 1; transform: none; color: var(--brass); }

/* 每个模块一个低饱和强调色（只在图标上，不铺满整卡） */
.entry[data-accent="reading"] .entry__icon { background: #102A2C; border-color: #23514F; color: #7BD8D0; }
.entry[data-accent="dictation"] .entry__icon { background: #1A2743; border-color: #2B4573; color: #9FBBFA; }
.entry[data-accent="homework"] .entry__icon { background: #12292B; border-color: #23514F; color: #7BD8D0; }
.entry[data-accent="recite"] .entry__icon { background: #1D1A33; border-color: #37306B; color: #B4A8F7; }
.entry[data-accent="dcopy"] .entry__icon { background: #142434; border-color: #2A4356; color: #8FC4E4; }
.entry[data-accent="rcopy"] .entry__icon { background: #2A1720; border-color: #5A2C3C; color: #E79BB6; }
.entry[data-accent="quiz"] .entry__icon { background: #16242F; border-color: #2C4055; color: #9EC3E0; }
.entry[data-accent="extend"] .entry__icon { background: #16243B; border-color: #2B4573; color: #93B4F8; }

.board__note {
  margin-top: auto;
  display: flex;
  gap: 9px;
  align-items: flex-start;
  padding: 10px 13px;
  border: 1px dashed var(--line-strong);
  border-radius: 10px;
  font-size: 11.5px;
  line-height: 1.75;
  color: var(--ink-3);
}
.board__note-key {
  flex: 0 0 auto;
  font-size: 9.5px; font-weight: 850;
  letter-spacing: .16em;
  color: var(--brass);
  padding-top: 2px;
}

/* ---------- 风采展示（深色） ---------- */
.spotlight {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 16px;
  height: 100%;
  padding: clamp(18px, 2vw, 26px);
  border-radius: 16px;
  color: #20323C;
  background: linear-gradient(168deg, #C3D8FF 0%, #C3D8FF 58%, #C3D8FF 100%);
  overflow: hidden;
}
.spotlight::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(420px 220px at 100% 0%, rgba(94, 140, 149, 0.18), transparent 70%);
  pointer-events: none;
}
.spotlight__head { position: relative; display: flex; flex-direction: column; gap: 3px; padding-bottom: 12px; border-bottom: 1px solid rgba(32, 50, 60, 0.14); }
.spotlight__en { font-size: 9px; font-weight: 800; letter-spacing: .26em; color: var(--brass-2); }
.spotlight__title { font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: .02em; }
.spotlight__desc { font-size: 11px; color: rgba(32, 50, 60, 0.58); letter-spacing: .02em; }

.spotlight__group { position: relative; display: flex; flex-direction: column; gap: 9px; }
.spotlight__label { display: flex; align-items: center; gap: 8px; }
.spotlight__label h3 { font-size: 11.5px; font-weight: 800; letter-spacing: .16em; color: rgba(32, 50, 60, 0.78); }
.link-btn {
  margin-left: auto;
  padding: 0; background: none; border: none;
  font-size: 10.5px; color: rgba(32, 50, 60, 0.45);
  cursor: pointer; letter-spacing: .06em;
}
.link-btn:hover { color: var(--brass-2); }

.spot__list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.spot__item {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 2px 9px;
  padding: 8px 11px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.068);
  border: 1px solid rgba(255, 255, 255, 0.105);
}
.spot__name { font-family: var(--serif); font-size: 13.5px; font-weight: 600; letter-spacing: .04em; }
.spot__tag { font-size: 10.5px; color: var(--brass-2); letter-spacing: .04em; text-align: right; }
.spot__note {
  grid-column: 1 / -1;
  font-size: 10.5px;
  line-height: 1.6;
  color: rgba(32, 50, 60, 0.58);
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.spot__empty { font-size: 11px; line-height: 1.8; color: rgba(32, 50, 60, 0.42); }

.spotlight__foot {
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px solid rgba(32, 50, 60, 0.14);
  font-size: 10px;
  letter-spacing: .1em;
  color: rgba(32, 50, 60, 0.38);
}

/* ---------- 25.4 拓展阅读：独立书架区 ---------- */
.shelf {
  display: grid;
  grid-template-columns: minmax(200px, 280px) minmax(0, 1fr);
  gap: clamp(16px, 2vw, 32px);
  padding: clamp(20px, 2.4vw, 32px);
  background: linear-gradient(180deg, #20323C 0%, #2A4750 100%);
  border: 1px solid #2A4750;
  border-radius: 16px;
}
.shelf__rail { display: flex; flex-direction: column; gap: 10px; padding-right: clamp(12px, 1.6vw, 22px); border-right: 1px solid rgba(195, 216, 255, 0.12); }
.shelf__en { font-size: 9px; font-weight: 800; letter-spacing: .26em; color: #8FD3D3; }
.shelf__title { font-family: var(--serif); font-size: clamp(22px, 2.2vw, 30px); font-weight: 600; letter-spacing: .01em; color: #D2DFEC; }
.shelf__desc { font-size: 11.5px; line-height: 1.9; color: #B2C4D6; }
.shelf__rail .btn { align-self: flex-start; margin-top: auto; border-color: #2A4750; color: #C6EDEA; }

.shelf__cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 11px; }
.spine {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-height: 158px;
  padding: 14px 13px 12px;
  background: #1B2A33;
  border: 1px solid #2A4750;
  border-left: 3px solid var(--brass);
  border-radius: 4px 9px 9px 4px;
  color: #D2DFEC;
  text-decoration: none;
  transition: transform .16s ease, box-shadow .16s ease, border-left-color .16s;
}
.spine:hover {
  transform: translateY(-2px);
  border-left-color: var(--ink);
  box-shadow: 0 20px 30px -26px rgba(3, 7, 13, 0.92);
}
.spine__no { font-family: var(--serif); font-size: 22px; line-height: 1; color: #5E8C95; }
.spine__cat { font-size: 13px; font-weight: 800; letter-spacing: .02em; }
.spine__title {
  font-size: 11px;
  line-height: 1.65;
  color: var(--ink-2);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}
.spine__count { margin-top: auto; font-size: 10px; letter-spacing: .08em; color: var(--ink-3); }
.spine__arrow { font-size: 11px; color: var(--brass); align-self: flex-end; }

/* ---------- 25.5 每日一题 · 投影页 ---------- */
.quizstage {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: clamp(24px, 3vw, 46px);
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 3px solid var(--ink);
  border-radius: 3px 3px 16px 16px;
}
.quizstage__head { display: flex; align-items: baseline; gap: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.quizstage__point { font-size: 11px; font-weight: 850; letter-spacing: .18em; color: var(--brass); }
.quizstage__date { margin-left: auto; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.quizstage__stem {
  font-family: var(--serif);
  font-size: clamp(20px, 2.6vw, 38px);
  line-height: 1.6;
  color: var(--ink);
}
.quizstage__opts { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 22px; }
.quizstage__opts li {
  display: flex; align-items: baseline; gap: 12px;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
  font-size: clamp(14px, 1.4vw, 20px);
}
.quizstage__opts b {
  flex: 0 0 auto;
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  font-size: 12.5px; font-weight: 800;
  background: var(--surface);
}
.quizstage__ans {
  display: none;
  padding: 16px 20px;
  border-left: 3px solid var(--brass);
  background: var(--brass-soft);
  border-radius: 0 10px 10px 0;
}
.quizstage__ans-key { display: block; font-size: 12px; font-weight: 850; letter-spacing: .14em; color: #8FD3D3; margin-bottom: 6px; }
.quizstage__ans p { font-size: clamp(13px, 1.1vw, 15px); line-height: 1.9; color: var(--ink-2); }
.quizstage.is-revealed .quizstage__ans { display: block; }
.quizstage--empty { align-items: flex-start; gap: 8px; }
.quizstage__none { font-family: var(--serif); font-size: clamp(20px, 2.4vw, 32px); }
.quizstage__none-sub { font-size: 13px; line-height: 1.9; color: var(--ink-3); max-width: 46em; }

.quiz-recent { display: flex; flex-direction: column; gap: 10px; }
.quiz-recent__title { font-family: var(--serif); font-size: 17px; font-weight: 600; letter-spacing: .02em; }
.quiz-recent__list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.quiz-recent__list li {
  display: grid;
  grid-template-columns: 62px 150px minmax(0, 1fr);
  gap: 12px;
  align-items: baseline;
  padding: 9px 13px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  font-size: 12px;
}
.quiz-recent__date { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.quiz-recent__point { font-weight: 800; font-size: 11.5px; color: var(--brass); }
.quiz-recent__stem { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 25.6 控制台：出题表单 ---------- */
.quiz-opt-editor { display: flex; flex-direction: column; gap: 7px; }
.quiz-opt-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
}
.quiz-opt-row b {
  flex: 0 0 24px;
  width: 24px; height: 24px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  font-size: 11.5px;
  color: var(--ink-2);
}
.quiz-opt-row input { flex: 1; min-width: 0; border: none; background: transparent; padding: 4px 2px; }
.quiz-opt-row.is-answer { border-color: var(--brass); background: var(--brass-soft); }
.quiz-opt-row.is-answer b { border-color: var(--brass); color: #8FD3D3; background: #1B2A33; }

.tips-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.tips-list li {
  position: relative;
  padding-left: 16px;
  font-size: 12.5px;
  line-height: 1.8;
  color: var(--ink-2);
}
.tips-list li::before {
  content: "";
  position: absolute;
  left: 0; top: .62em;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--brass);
}
.tips-list b { color: var(--ink); }

/* ---------- 25.7 页脚 / 响应式 ---------- */
.foot { border-top: 1px solid var(--line); }
.foot__en { font-family: var(--serif); font-style: italic; }
.foot__cn { letter-spacing: .2em; }

@media (max-width: 1180px) {
  .masthead { grid-template-columns: minmax(0, 1fr); }
  .masthead__quiz { margin-top: 6px; }
  .board { grid-template-columns: minmax(0, 1fr); }
  .spotlight { height: auto; }
  .shelf { grid-template-columns: minmax(0, 1fr); }
  .shelf__rail { border-right: none; border-bottom: 1px solid rgba(195, 216, 255, 0.12); padding: 0 0 14px; }
  .shelf__rail .btn { margin-top: 4px; }
}

@media (max-width: 860px) {
  .topbar__mid { gap: 10px; }
  .today__line { display: none; }
  .entries { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .masthead__points { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .masthead__points li { border-left-width: 2px; }
  .quizcard__opts { grid-template-columns: minmax(0, 1fr); }
  .quizstage__opts { grid-template-columns: minmax(0, 1fr); }
  .quiz-recent__list li { grid-template-columns: 56px minmax(0, 1fr); }
  .quiz-recent__stem { grid-column: 1 / -1; white-space: normal; }
}

@media (max-width: 640px) {
  .weather__text, .weather__city, .date-toggle span { display: none; }
  .date-toggle { padding: 5px 8px; }
  .entries { grid-template-columns: minmax(0, 1fr); }
  .entry { min-height: 56px; }
  .masthead__title { font-size: 30px; }
  .spotlight { padding: 16px; }
}

@media print {
  .masthead, .spotlight, .shelf { break-inside: avoid; }
  .spotlight { background: #16212E; color: #E9F1F8; }
}

/* =========================================================
   25. v5 配色统一层（深海石板 · 冷调高对比）
   说明：第 1 节的变量已切到深色冷调，但 v2–v4 里有一批
   「写入死值」的浅色渐变、半透明遮罩与暖色强调族，无法靠变量
   切换，必须在此显式改写。原则：
   1) 面只有 4 级明度：--bg < --surface < --surface-2 < --surface-3；
   2) 强调只用 3 个色系：冷靛（主）、冷青（辅）、冷银（分隔）；
   3) 语义色禁止暖色：完成=冷绿、危险=冷玫、提示=冷靛；
   4) 所有正文对比度 ≥ 4.5:1，大字号标题 ≥ 3:1。
   ========================================================= */

/* ---------- 25.1 基础：色彩模式、滚动条、表单控件 ---------- */
html { color-scheme: dark; }

* { scrollbar-color: #344456 transparent; scrollbar-width: thin; }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: #2E3D4F;
  border: 3px solid transparent;
  border-radius: 99px;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: #43566C; background-clip: content-box; }

input::placeholder, textarea::placeholder { color: #67798D; }
::-webkit-calendar-picker-indicator { filter: invert(.78); opacity: .85; cursor: pointer; }
select option { background: #16212E; color: #E9F1F8; }

/* ---------- 25.2 顶栏 / 品牌 / 日期 ---------- */
.topbar {
  background: rgba(13, 20, 29, .82);
  backdrop-filter: blur(18px) saturate(1.25);
  -webkit-backdrop-filter: blur(18px) saturate(1.25);
  border-bottom: 1px solid var(--line);
}
.brand__mark {
  background: linear-gradient(150deg, var(--brand-2) 0%, #2C51C4 100%);
  color: #FFFFFF;
  box-shadow: 0 10px 22px -14px rgba(76, 124, 240, .95), inset 0 0 0 1px rgba(255, 255, 255, .18);
}
.brand__text strong { color: var(--ink); }
.datebar { background: var(--surface-2); border-color: var(--line); }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }

.role-chip { background: var(--surface-2); border-color: var(--line); color: var(--ink-2); }
.role-chip--main { background: var(--brand-soft); color: var(--brand-ink); border-color: #2B4573; }
.role-chip--deputy { background: var(--teal-soft); color: #8FE0D8; border-color: #23514F; }
.role-chip--guest { background: var(--surface-2); color: var(--ink-3); border-color: var(--line); }

/* ---------- 25.3 按钮 ---------- */
.btn { background: var(--surface-2); border-color: var(--line); color: var(--ink); }
.btn:hover { background: var(--surface-3); }
.btn--primary {
  background: linear-gradient(180deg, #3E68DC 0%, #2F53C4 100%);
  border-color: #2C4FBC;
  color: #FFFFFF;
  box-shadow: 0 12px 26px -16px rgba(76, 124, 240, .95), inset 0 1px 0 rgba(255, 255, 255, .18);
}
.btn--primary:hover { filter: brightness(1.07); }
.btn--outline { background: transparent; border-color: var(--line-strong); color: var(--ink); }
.btn--outline:hover { border-color: var(--brand); color: var(--brand-ink); background: var(--brand-soft); }
.btn--ghost { background: transparent; color: var(--ink-2); }
.btn--ghost:hover { background: var(--surface-3); color: var(--ink); }
.btn--danger { background: #C54A62; border-color: #B44157; color: #FFFFFF; }
.btn--danger:hover { filter: brightness(1.08); }
.btn.is-danger { color: var(--danger-2); }
.btn.is-danger:hover { background: var(--danger-soft); }

/* ---------- 25.4 卡片 / 面 / 分隔 ---------- */
.card { background: var(--surface); border-color: var(--line); }
.card__hint, .field__hint { color: var(--ink-3); }
.eyebrow { color: var(--brand-ink); }

/* ---------- 25.5 首页 · 标语横幅（改为深色压印） ---------- */
.motto {
  color: var(--ink);
  background:
    radial-gradient(680px 240px at 90% -30%, rgba(76, 124, 240, .28), rgba(76, 124, 240, 0) 68%),
    radial-gradient(520px 220px at 4% 130%, rgba(53, 168, 162, .20), rgba(53, 168, 162, 0) 70%),
    linear-gradient(112deg, #16243B 0%, #14202E 48%, #101A24 100%);
  border: 1px solid #24374F;
  box-shadow: 0 26px 56px -38px rgba(3, 7, 13, .95), inset 0 1px 0 rgba(255, 255, 255, .05);
}
.motto__en { color: #F2F7FD; }
.motto__cn { color: #A9C2DC; }
.motto__seal { border-color: #33506F; color: #A6C6DF; background: rgba(255, 255, 255, .04); }
.motto::after { opacity: .5; }

/* ---------- 25.6 首页 · Hero ---------- */
.hero__main {
  border-color: #22334A;
  background:
    radial-gradient(620px 280px at 100% -6%, rgba(76, 124, 240, .20) 0%, rgba(76, 124, 240, 0) 70%),
    linear-gradient(180deg, #182739 0%, #131E2B 100%);
  box-shadow: var(--shadow-md);
}
.hero__title { color: var(--ink); }
.hero__desc { color: var(--ink-2); }
.hero__side { background: var(--surface); border-color: var(--line); }
.stat { background: var(--surface-2); border-color: var(--line); }
.stat__label { color: var(--ink-3); }
.stat__value { color: var(--ink); }

/* ---------- 25.7 模块卡：8 套冷色强调 ---------- */
.module-card {
  background: var(--surface);
  border-color: var(--line);
}
.module-card:hover { border-color: #2C4055; box-shadow: 0 22px 44px -30px rgba(3, 7, 13, .9); }
.module-card__icon { background: var(--accent-soft); color: var(--accent-2); border-color: color-mix(in srgb, var(--accent) 22%, transparent); }
.module-card__title { color: var(--ink); }
.module-card__tag { color: var(--accent-2); background: var(--accent-soft); }
.module-card__task { color: var(--ink-2); }
.module-card__foot { border-top-color: var(--line); }
.module-card__nums { color: var(--ink-3); }
.module-card__go {
  background: var(--accent-soft);
  color: var(--accent-2);
  border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
  box-shadow: none;
}
.module-card__go:hover { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }
.progress { background: #1D2A39; }

.module-card--dictation { --accent: #5B8CF5; --accent-2: #9FBBFA; --accent-soft: #1A2743; }
.module-card--homework  { --accent: #2FB3A8; --accent-2: #7BD8D0; --accent-soft: #12292B; }
.module-card--dcopy     { --accent: #4F93C4; --accent-2: #8FC4E4; --accent-soft: #142434; }
.module-card--recite    { --accent: #8B7BF0; --accent-2: #B4A8F7; --accent-soft: #1D1A33; }
.module-card--rcopy     { --accent: #C9628A; --accent-2: #E79BB6; --accent-soft: #2A1720; }
.module-card--reading   { --accent: #35A8A2; --accent-2: #79D3CD; --accent-soft: #102A2C; }
.module-card--extend    { --accent: #4C7CF0; --accent-2: #93B4F8; --accent-soft: #16243B; }
.module-card--quiz      { --accent: #5F8FB9; --accent-2: #9EC3E0; --accent-soft: #16242F; }

/* ---------- 25.8 首页 · 标兵 / 作业 / 页脚 ---------- */
.showcase__list li { background: var(--surface-2); border-color: var(--line); }
.showcase__name { color: var(--ink); }
.showcase__main { color: var(--brand-ink); }
.showcase__note { color: var(--ink-3); }
.foot__en, .foot__cn { color: var(--ink-3); }

/* ---------- 25.9 座位表 ---------- */
.seat--podium {
  background: linear-gradient(160deg, #223243, #1A2634) !important;
  color: var(--ink-3);
  box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .06);
}
.seat--empty { background: transparent; }
.seat:hover { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .22), 0 6px 16px -10px rgba(3, 7, 13, .8); }
.seat.is-done { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .16), 0 8px 18px -12px rgba(3, 7, 13, .7); }
.demo-seat { background: var(--surface-2); border-color: var(--line); color: var(--ink-2); }
body.is-edit-names .seat { outline: 2px dashed rgba(110, 155, 250, .55); outline-offset: -4px; }

/* ---------- 25.10 弹层 / 提示 ---------- */
.overlay { background: rgba(3, 7, 13, .74); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); }
.modal { background: var(--surface); border-color: var(--line-strong); }
.admin { background: var(--surface); border: 1px solid var(--line); }
.admin__tab:hover { background: var(--surface-3); }
.admin__tab.is-active { background: var(--brand-soft); color: var(--brand-ink); border-color: #2B4573; box-shadow: none; }
.admin-section { background: var(--surface-2); border-color: var(--line); }
.admin-section h3 { color: var(--ink); }
.hint { color: var(--ink-3); }

.toast {
  background: #1E2C3C;
  color: var(--ink);
  border: 1px solid var(--line-strong);
  box-shadow: 0 20px 44px -22px rgba(3, 7, 13, .95);
}
.toast--ok { background: #1B3A2C; color: #C8F0DA; border-color: #2C6B4C; }
.toast--warn { background: #1D2C42; color: #CFE0FA; border-color: #32507A; }
.toast--err { background: #3A1D27; color: #FDD2DC; border-color: #78323F; }

.mode-banner { color: #CFE0FA; background: #16243B; border-bottom-color: #274063; }

/* ---------- 25.11 表单 ---------- */
.input, .seg-row input[type="time"], .field input, .field select, .field textarea, .task-select {
  background: var(--surface-2);
  border-color: var(--line-strong);
  color: var(--ink);
}
.input:focus, .field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(76, 124, 240, .22);
}
.stepper button { background: var(--surface-3); color: var(--ink-2); }

/* ---------- 25.12 状态徽标 / 标签 ---------- */
.tag { background: var(--surface-2); border-color: var(--line); color: var(--ink-2); }
.tag--accent { background: var(--brand-soft); border-color: #2B4573; color: var(--brand-ink); }
.badge { background: var(--surface-3); color: var(--ink-2); }
.badge.is-pub { background: #16332A; color: #8FE0B8; }
.badge.is-pre { background: #1B2A3D; color: #A9C2DC; }
.badge-count { background: var(--brand-soft); color: var(--brand-ink); }

.banner { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.banner--read { background: var(--teal-soft); border-color: #23514F; color: #8FE0D8; }
.banner--edit { background: var(--brand-soft); border-color: #2B4573; color: var(--brand-ink); }

/* ---------- 25.13 早读常规（深色舞台） ---------- */
.read-stage {
  background: var(--read-bg, linear-gradient(135deg, #16243B 0%, #12212F 46%, #141C2A 100%));
  color: var(--read-ink, #E9F1F8);
  border: 1px solid #22334A;
}
.read-seg {
  background: rgba(255, 255, 255, .045);
  border-color: rgba(255, 255, 255, .09);
}
.read-seg.is-doing {
  background: rgba(76, 124, 240, .16);
  border-color: rgba(110, 155, 250, .45);
}
.read-seg.is-done { opacity: .72; }
.read-seg__clock { color: #FFFFFF; }
.read-seg__text { color: #C7D6E6; }
.read-stage__head { color: #A9C2DC; }
.read-stage__note { color: #8FA6BD; }
.read-switch__item { background: var(--surface); border-color: var(--line); }
.read-switch__item.is-active { background: var(--brand-soft); border-color: #2B4573; }
.read-switch__dot { background: var(--brand-2); }
.read-chip { background: var(--surface-2); border-color: var(--line); color: var(--ink-2); }

/* ---------- 25.14 大屏投影（深色 + 冷靛） ---------- */
.screen {
  color: var(--ink);
  background:
    radial-gradient(1100px 680px at 10% -14%, rgba(76, 124, 240, .26) 0%, rgba(76, 124, 240, 0) 62%),
    radial-gradient(900px 560px at 92% 108%, rgba(53, 168, 162, .18) 0%, rgba(53, 168, 162, 0) 60%),
    linear-gradient(145deg, #0B121B 0%, #0D1723 52%, #0A1017 100%);
}
.screen__glow { opacity: .55; }
.screen__top, .screen__foot { color: #A9C2DC; }
.screen__bar { background: rgba(255, 255, 255, .10); }
.screen__bar i { background: linear-gradient(90deg, var(--brand-2), var(--teal-2)); }
.screen-dot { background: rgba(255, 255, 255, .22); }
.screen-dot.is-on { background: var(--brand-2); }
.slide__kicker { color: #A9C2DC; }
.slide__title, .slide__list-title, .slide-list__name { color: #FFFFFF; }
.slide-seg { background: rgba(255, 255, 255, .055); border-color: rgba(255, 255, 255, .10); }
.slide-seg__time b { color: #FFFFFF; }
.slide-seg__text { color: #C7D6E6; }
.slide-quote__en { color: #F4F8FD; }
.slide-quote__cn { color: #A9C2DC; }
.slide-list__item { background: rgba(255, 255, 255, .05); border-color: rgba(255, 255, 255, .08); }

/* ---------- 25.15 拓展阅读 / 每日一题 ---------- */
.ex-card { background: var(--surface); border-color: var(--line); }
.ex-card:hover { border-color: #2C4055; }
.ex-card__title { color: var(--ink); }
.ex-card__desc { color: var(--ink-2); }
.ex-card__meta { color: var(--ink-3); }
.ex-cats .chip.is-active { background: var(--brand); border-color: var(--brand); color: #FFFFFF; }
.art__cat { background: var(--brand-soft); color: var(--brand-ink); }
.art__title { color: var(--ink); }
.art__h { color: var(--ink); }
.art__p, .art__ul { color: var(--ink-2); }
.art__tip { background: var(--brand-soft); border-left-color: var(--brand); color: #CFE0FA; }

.quizstage {
  background:
    radial-gradient(560px 260px at 100% -10%, rgba(76, 124, 240, .18), rgba(76, 124, 240, 0) 70%),
    var(--surface);
  border: 1px solid var(--line);
}
.quizstage__point { background: var(--brand-soft); color: var(--brand-ink); }
.quizstage__stem { color: var(--ink); }
.quizstage__opts li { background: var(--surface-2); border-color: var(--line); color: var(--ink); }
.quizstage__ans { background: #14243A; border-color: #2B4573; }
.quizstage__ans-key { background: var(--brand); color: #FFFFFF; }
.quiz-opt-row { background: var(--surface-2); border-color: var(--line); }
.quiz-opt-row.is-answer { background: #16332A; border-color: #2C6B4C; }

/* ---------- 25.16 任务行 / 表格 ---------- */
.task-row { background: var(--surface-2); border-color: var(--line); }
.task-row__title b { color: var(--ink); }
.task-row__seg { color: var(--ink-2); }
.task-row__seg i { color: var(--ink-3); }
.table th { color: var(--ink-3); border-bottom-color: var(--line); }
.table td { border-bottom-color: var(--line); color: var(--ink-2); }
.kv { color: var(--ink-2); }

/* ---------- 25.17 打印：回归白纸黑字 ---------- */
@media print {
  html { color-scheme: light; }
  body { background: #FFFFFF !important; color: #000000 !important; }
  .card, .stage, .module-card, .admin, .modal { background: #FFFFFF !important; border-color: #CCCCCC !important; box-shadow: none !important; }
  .masthead, .hero__main, .motto { background: #FFFFFF !important; color: #000000 !important; border-color: #CCCCCC !important; }
  .motto__en, .motto__cn, .hero__title, .hero__desc, .card__title, .module-card__title { color: #000000 !important; }
  .topbar, .foot, .no-print { display: none !important; }
}

/* ---------- 25.18 首页实装结构：报头 / 分栏 / 书架 ----------
   （renderHome 实际输出的是 masthead + board + shelf，
     上面的 .motto / .hero / .showcase 为历史版本选择器，保留不冲突） */

/* 报头 */
.masthead {
  background:
    radial-gradient(760px 320px at 92% -18%, rgba(76, 124, 240, .20) 0%, rgba(76, 124, 240, 0) 68%),
    linear-gradient(180deg, #131E2A 0%, #0F1823 100%);
  border: 1px solid #22334A;
  border-top: 3px solid var(--brand);
  border-radius: 4px 4px 16px 16px;
  box-shadow: 0 26px 54px -40px rgba(3, 7, 13, .95);
}
.masthead__title { color: var(--ink); }
.masthead__title em { color: #9FBBFA; }
.masthead__title em::after { background: rgba(76, 124, 240, .28); }
.masthead__kicker { color: var(--ink-3); }
.masthead__kicker span { color: var(--brass-2); }
.masthead__lede { color: var(--ink-2); }
.masthead__lede b { color: var(--ink); }
.masthead__points li { border-left-color: #2A3B4F; }
.masthead__points b { color: var(--ink); }
.masthead__points span { color: var(--ink-3); }
.masthead__motto { border-top-color: var(--line); }
.masthead__motto-en { color: var(--ink-2); }
.masthead__motto-cn { color: var(--brass-2); }

/* 每日一题卡 */
.quizcard {
  background: #141F2C;
  border-color: #2A3D54;
  background-image: repeating-linear-gradient(180deg, transparent 0 31px, rgba(120, 148, 180, .07) 31px 32px);
}
.quizcard__ribbon { color: var(--brass-2); }
.quizcard__ribbon::after { background: var(--brass); }
.quizcard__meta { color: var(--ink-3); }
.quizcard__stem { color: var(--ink); }

/* 分栏标题 */
.sec-head { border-bottom-color: var(--line); }
.sec-head__en { color: var(--brass-2); }
.sec-head__title { color: var(--ink); }
.sec-head__desc { color: var(--ink-3); }

/* 常规入口卡 */
.entry { background: var(--surface); border-color: var(--line); }
.entry:hover { border-color: #2C4055; box-shadow: 0 18px 30px -26px rgba(3, 7, 13, .95); background: var(--surface-2); }
.entry__icon { background: var(--surface-2); border-color: var(--line); color: var(--ink-2); }
.entry__title { color: var(--ink); }
.entry__meta { color: var(--ink-3); }
.entry__go { color: var(--ink-3); }
.entry:hover .entry__go { color: var(--brand-2); }

/* 风采展示（原为浅色卡，改为深色卡） */
.spotlight {
  color: var(--ink);
  background:
    radial-gradient(460px 240px at 100% -6%, rgba(53, 168, 162, .16) 0%, rgba(53, 168, 162, 0) 68%),
    linear-gradient(168deg, #16233A 0%, #131C29 100%);
  border: 1px solid #22334A;
}
.spotlight::before { background: radial-gradient(420px 220px at 100% 0%, rgba(120, 148, 180, .14), transparent 70%); }
.spotlight__head { border-bottom-color: rgba(255, 255, 255, .10); }
.spotlight__en { color: #7BD8D0; }
.spotlight__title { color: var(--ink); }
.spotlight__desc { color: var(--ink-3); }
.spotlight__label h3 { color: var(--ink-2); }
.spotlight__foot { color: var(--ink-3); }
.link-btn { color: var(--ink-3); }
.link-btn:hover { color: var(--brand-2); }
.spot__item { background: rgba(255, 255, 255, .05); border-color: rgba(255, 255, 255, .09); }
.spot__name { color: var(--ink); }
.spot__tag { color: var(--brand-ink); }
.spot__note { color: var(--ink-3); }
.spot__empty { color: var(--ink-3); }

/* 书架（拓展阅读，与常规区明显区分） */
.shelf {
  background: linear-gradient(180deg, #111A26 0%, #0D1520 100%);
  border-color: #22334A;
  border-left: 3px solid var(--teal);
}
.shelf__rail { border-right-color: rgba(255, 255, 255, .08); }
.shelf__en { color: #7BD8D0; }
.shelf__title { color: var(--ink); }
.shelf__desc { color: var(--ink-2); }
.shelf__rail .btn { border-color: #2C4055; color: var(--brand-ink); }
.shelf__rail .btn:hover { border-color: var(--brand); background: var(--brand-soft); }
.spine {
  background: #16212E;
  border-color: #22334A;
  border-left: 3px solid #2E5C6B;
  color: var(--ink-2);
}
.spine:hover { border-left-color: var(--teal-2); box-shadow: 0 20px 32px -26px rgba(3, 7, 13, .95); background: #182634; }
.spine__no { color: #4E7A85; }
.spine__cat { color: var(--ink); }
.spine__title { color: var(--ink-2); }
.spine__count { color: var(--ink-3); }
.spine__arrow { color: #7BD8D0; }

/* 录入说明条 */
.board__note { color: var(--ink-3); border-color: var(--line); }
.board__note-key { color: var(--brass-2); }

/* 每日一题投影页顶线 */
.quizstage { border-top: 3px solid var(--brand); background: var(--surface); }
.quizstage__point { color: var(--brand-ink); }

/* ---------- 25.19 大屏 / 拓展精选 / 拾遗（最终生效层） ----------
   级联扫描发现这些选择器的深色文字未被前两层覆盖，统一在此修正。 */

/* 大屏控制按钮与进度信息 */
.screen__btn {
  background: rgba(255, 255, 255, .08);
  border-color: rgba(255, 255, 255, .16);
  color: #CFE0FA;
}
.screen__btn:hover { background: rgba(255, 255, 255, .14); color: #FFFFFF; }

/* 任务页 */
.slide__kicker { color: #A9C2DC; }
.slide__kicker .dot { background: var(--brand-2); }
.slide-seg__idx { color: #8FA6C8; }
.slide-seg__time b, .slide-seg__content { color: #E9F1F8; }
.slide-seg__time i { color: #7E90A5; }
.slide__pill.is-after { color: #8FA6C8; }
.slide__note { color: #8FA6C8; }
.slide__meta { color: #A9C2DC; }

/* 海报页 / 鼓励语页（白字压在冷色渐变上） */
.slide--poster .slide-quote, .slide-quote--big { color: #FFFFFF; }
.slide-quote__cn { color: #C9DAF2; }
.slide__list-title { color: #FFFFFF; }
.slide-list__rank { color: #8FA6C8; }
.slide-list__name { color: #FFFFFF; }
.slide-list__main { color: #C7D6E6; }

/* 拓展阅读精选卡 */
.ex-feature { color: var(--ink); }
.ex-feature__cat { color: var(--brand-ink); }
.ex-feature__go { color: var(--brand-2); }
.ex-feature__desc { color: var(--ink-2); }

/* 背景选择器的「深色」示例点 */
.bg-picker--large .bg-dot--dark span { color: #C7D6E6; }

/* 精选大卡：改为深靛渐变 + 白字（原为浅蓝渐变，深底主题下对比不足） */
.ex-feature {
  color: #F2F7FD;
  background:
    radial-gradient(560px 240px at 94% -12%, rgba(120, 158, 255, .35) 0%, rgba(120, 158, 255, 0) 66%),
    linear-gradient(118deg, #1B2C55 0%, #22366B 52%, #2C51C4 100%);
  border: 1px solid #2E4A86;
  box-shadow: 0 30px 60px -44px rgba(3, 7, 13, .95);
}
.ex-feature:hover { box-shadow: 0 36px 70px -40px rgba(3, 7, 13, .98); }
.ex-feature__cat { color: #A9C2DC; }
.ex-feature h2 { color: #FFFFFF; }
.ex-feature__en { color: rgba(233, 241, 248, .72); }
.ex-feature__desc { color: rgba(233, 241, 248, .88); }
.ex-feature__go { color: #FFFFFF; }
.ex-feature__side { border-left-color: rgba(255, 255, 255, .16); }

/* 每日一题卡 */
.quizcard__stem { color: var(--ink); }
.quizcard__opts { color: var(--ink-2); }

/* =========================================================
   31. 分层任务（必修 › 必修一 › Unit 1）+ 每日统计
   —— 31.1 层级面包屑 / 31.2 层级编辑器 / 31.3 每日统计页
   ========================================================= */

/* ---------- 31.1 模块标题下的层级面包屑 ---------- */
.module-head__name { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

.lv-crumbs {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
  min-width: 0;
  font-size: 12px;
  line-height: 1.5;
}
.lv-crumbs__item {
  font-weight: 650;
  color: var(--brand-ink);
  background: var(--brand-soft);
  border: 1px solid #22385E;
  border-radius: 7px;
  padding: 1px 7px;
  white-space: nowrap;
  max-width: 260px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lv-crumbs__sep {
  font-style: normal;
  font-size: 11px;
  color: var(--ink-3);
  opacity: .85;
}
/* 标题行：整体压紧，避免把任务选择器挤走 */
.lv-crumbs--head { margin-top: 1px; }
.lv-crumbs--head .lv-crumbs__item {
  font-size: 11.5px;
  padding: 0 7px;
  background: #16243B;
  border-color: #22385E;
}
/* 预览 / 明细：字号大一点，方便确认改对了 */
.lv-crumbs--preview .lv-crumbs__item,
.lv-crumbs--detail .lv-crumbs__item { font-size: 13px; padding: 2px 9px; }
.lv-crumbs--detail { gap: 5px; }
.lv-crumbs--scope .lv-crumbs__item { font-size: 11.5px; padding: 1px 7px; }
.lv-crumbs__empty { font-size: 12px; color: var(--ink-3); }

/* ---------- 31.2 层级编辑器 ---------- */
.lv-editor {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 14px;
}
.lv-row {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) 32px;
  align-items: center;
  gap: 9px;
}
.lv-row__no {
  display: grid;
  place-items: center;
  width: 22px; height: 22px;
  border-radius: 7px;
  background: var(--brand-soft);
  border: 1px solid #22385E;
  color: var(--brand-ink);
  font-size: 11px;
  font-weight: 800;
}
.lv-row__input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--ink);
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
}
.lv-row__input::placeholder { color: var(--ink-3); font-weight: 500; }
.lv-row__input:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(76, 124, 240, .18);
}
.lv-row__del {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: transparent;
  color: var(--ink-3);
  font-size: 12px;
  cursor: pointer;
  transition: color .16s ease, background-color .16s ease, border-color .16s ease;
}
.lv-row__del:hover:not(:disabled) {
  color: var(--danger-2);
  background: var(--danger-soft);
  border-color: #4A2330;
}
.lv-row__del:disabled { opacity: .32; cursor: not-allowed; }

.lv-tools { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.lv-tools .btn[disabled] { opacity: .4; cursor: not-allowed; }

.lv-preview {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--bg-2);
  border: 1px dashed var(--line-strong);
}
.lv-preview__label {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: .1em;
  color: var(--ink-3);
}
.lv-preview__box { display: inline-flex; align-items: center; min-width: 0; }

/* ---------- 31.3 每日统计 ---------- */
/* 这一页要「完整显示」：不锁死为一屏高度，让页面自然变高、可整体滚动 */
.module-view--stat { height: auto; min-height: 0; }
.module-head--stat { align-items: flex-start; }
.stat-sub { font-size: 11.5px; color: var(--ink-3); font-weight: 600; letter-spacing: .02em; }
.stat-stamp {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--ink-3);
  white-space: nowrap;
}

/* 统计范围条：两类抄写各占一半，直接写明用的是哪条任务 */
.stat-scope {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.stat-scope__item {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--line-strong);
}
.stat-scope__item[data-tone="d"] { border-left-color: #4F93C4; }
.stat-scope__item[data-tone="r"] { border-left-color: #C9628A; }
.stat-scope__label { font-size: 12.5px; font-weight: 800; letter-spacing: .01em; }
.stat-scope__date,
.stat-scope__num { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.stat-scope__num { margin-left: auto; }
.stat-scope__empty { font-size: 11.5px; color: var(--ink-3); }

/* 主体：左座次表 / 右待抄名单 */
.module-body--stat { grid-template-columns: minmax(0, 1fr) 372px; align-items: start; }
.stage--stat { overflow: visible; }
.stage--stat .seat-column { grid-auto-rows: minmax(64px, auto); }

/* 待抄：深石板底 + 冷蓝描边 + 项目数，和「已抄完」的绿色一眼区分 */
.seat--stat-todo {
  gap: 2px;
  background: linear-gradient(160deg, #24344A, #1E2A3B);
  color: #EAF2FC;
  box-shadow: inset 0 0 0 1.5px rgba(110, 155, 250, .55), 0 10px 22px -16px rgba(3, 7, 13, .95);
}
.seat--stat-todo:hover {
  box-shadow: inset 0 0 0 2px #6E9BFA, 0 12px 26px -14px rgba(3, 7, 13, 1);
}
.seat--stat-todo .seat__status { opacity: 1; color: #CFE0F6; font-weight: 750; }
.seat--static { cursor: default; }
.seat--static:hover { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .28), 0 8px 18px -12px rgba(195, 216, 255, .6); }

/* 座次格里直接标出「听写 / 背诵」，不点开也知道欠哪类 */
.seat__flags { display: inline-flex; gap: 3px; margin-top: 2px; }
.seat__flags i {
  font-style: normal;
  font-size: calc(9px * var(--seat-font));
  font-weight: 800;
  line-height: 1.5;
  padding: 0 5px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .16);
  color: #EAF2FB;
}
.seat__flags i[data-tone="d"] { background: rgba(79, 147, 196, .42); color: #E4F1FA; }
.seat__flags i[data-tone="r"] { background: rgba(201, 98, 138, .40); color: #FCE4EC; }

/* 图例 */
.stat-legend {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 16px;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
  font-size: 11.5px;
  color: var(--ink-3);
}
.stat-legend__item { display: inline-flex; align-items: center; gap: 6px; }
.stat-dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: 0 0 auto; }
.stat-dot[data-tone="todo"] { background: #24344A; box-shadow: inset 0 0 0 1.5px #6E9BFA; }
.stat-dot[data-tone="done"] { background: var(--done); }
.stat-dot[data-tone="na"] { background: repeating-linear-gradient(45deg, #182741, #182741 3px, #1C2D4A 3px, #1C2D4A 6px); }
.stat-legend__hint { margin-left: auto; color: var(--ink-3); }

/* 右侧待抄名单 */
.rail--stat { overflow: visible; }
.stat-list-card { display: flex; flex-direction: column; min-height: 0; }
.stat-list {
  list-style: none;
  margin: 10px 0 0;
  padding: 0 4px 0 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: min(58vh, 620px);
  overflow: auto;
}
.stat-item {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.stat-item__head {
  width: 100%;
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 8px;
  padding: 9px 11px;
  background: transparent;
  border: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background-color .15s ease;
}
.stat-item__head:hover { background: #21314A; }
.stat-item__no {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10.5px;
  color: var(--ink-3);
}
.stat-item__name { font-size: 13.5px; font-weight: 780; color: var(--ink); }
.stat-item__seat { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.stat-item__count {
  font-size: 10.5px;
  font-weight: 800;
  color: #DCE9FB;
  background: rgba(76, 124, 240, .26);
  border: 1px solid rgba(110, 155, 250, .35);
  border-radius: 999px;
  padding: 1px 8px;
  white-space: nowrap;
}
.stat-item__items {
  list-style: none;
  margin: 0;
  padding: 0 11px 9px 45px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.stat-item__items li {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
  color: var(--ink-2);
  min-width: 0;
}
.stat-item__path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 类别标签 */
.stat-tag {
  flex: 0 0 auto;
  font-size: 10.5px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 6px;
  background: #16243B;
  border: 1px solid #22385E;
  color: var(--brand-ink);
  white-space: nowrap;
}
.stat-tag[data-tone="d"] { background: rgba(79, 147, 196, .20); border-color: #2A4E6E; color: #BCD9F0; }
.stat-tag[data-tone="r"] { background: rgba(201, 98, 138, .18); border-color: #5A2A3C; color: #F0C6D5; }
.stat-tag--sm { font-size: 10px; padding: 1px 6px; }

.stat-empty {
  margin-top: 12px;
  font-size: 12.5px;
  line-height: 1.9;
  color: var(--ink-2);
}
.stat-empty span { display: block; font-size: 11.5px; color: var(--ink-3); }

/* 学生明细弹层 */
.stat-detail {
  list-style: none;
  margin: 14px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.stat-detail__row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) 22px;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.stat-detail__body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat-detail__meta { font-size: 11.5px; color: var(--ink-3); }
.stat-detail__no {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--ink-3);
  text-align: right;
}
.stat-detail__seat {
  margin-left: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-3);
}

/* ---------- 31.4 响应式 ---------- */
@media (max-width: 1240px) {
  .module-body--stat { grid-template-columns: minmax(0, 1fr) 330px; }
}
@media (max-width: 1180px) {
  .module-body--stat { grid-template-columns: minmax(0, 1fr); }
  .stat-list { max-height: none; }
  .stage--stat .seat-column { grid-auto-rows: minmax(58px, auto); }
}
@media (max-width: 720px) {
  .stat-scope { grid-template-columns: minmax(0, 1fr); }
  .stat-scope__num { margin-left: 0; }
  .stat-item__head { grid-template-columns: 22px minmax(0, 1fr) auto; }
  .stat-item__seat { display: none; }
  .lv-row { grid-template-columns: 20px minmax(0, 1fr) 30px; gap: 7px; }
  .stat-stamp { display: none; }
}

/* 31.5 修正：统计页座次表在 1240–1500px 宽度下会比容器略宽，
   原先 overflow:visible 让左侧座位压到了右侧名单上。
   改为必要时横向滚动，并把统计页的组距 / 过道收紧，常见宽度下不再出现滚动条。 */
.stage--stat {
  overflow-x: auto;
  --gap-group: clamp(8px, 1vw, 18px);
}
.stage--stat .seat-group { min-width: 86px; }
.stage--stat .seat-group.aisle-after { margin-left: clamp(12px, 1.6vw, 30px); }

/* =========================================================
   32. 录入学员（12 × 12 空白座次表）
   —— 32.1 座次表空位收敛 / 32.2 录入页 / 32.3 响应式
   ========================================================= */

/* ---------- 32.1 座次表：空位不显示、空名单给提示 ---------- */
.seat-hint {
  margin: auto;
  max-width: 480px;
  padding: 28px 16px;
  text-align: center;
  font-size: 13px;
  line-height: 1.95;
  color: var(--ink-3);
}

/* ---------- 32.2 录入页 ---------- */
.module-view--enroll { height: auto; min-height: 0; }
.module-head--enroll { align-items: flex-start; }
.enroll-sub {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-3);
  letter-spacing: .01em;
}
.enroll-stamp {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--ink-3);
  white-space: nowrap;
}

.module-body--enroll {
  grid-template-columns: minmax(0, 1fr) 330px;
  align-items: start;
}
.stage--enroll { overflow: visible; padding: 14px; gap: 10px; }

.enroll-board {
  overflow: auto;
  padding: 12px;
  border-radius: 14px;
  background: #101A26;
  border: 1px solid var(--line);
  max-height: min(64vh, 700px);
}

/* 12 列 + 行首标签；-1 用 1fr 让格子随宽度均分，窄屏时整块横向滚动 */
.enroll-grid {
  display: grid;
  grid-template-columns: 52px repeat(12, minmax(64px, 1fr));
  gap: 6px;
  min-width: 900px;
}

.enroll-grid__corner {
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .04em;
  color: #4B6076;
  display: grid;
  place-items: center;
  align-self: end;
  padding-bottom: 4px;
}
.enroll-grid__col {
  font-size: 10.5px;
  font-weight: 800;
  color: var(--ink-3);
  text-align: center;
  letter-spacing: .01em;
  align-self: end;
  padding-bottom: 4px;
  white-space: nowrap;
}
.enroll-grid__row {
  display: grid;
  place-items: center;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10.5px;
  font-weight: 800;
  color: var(--ink-3);
  white-space: nowrap;
}

.enroll-cell { min-width: 0; }
.enroll-cell input {
  width: 100%;
  height: 36px;
  padding: 0 6px;
  border-radius: 9px;
  border: 1px solid #243447;
  background: #14202E;
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  font-weight: 650;
  text-align: center;
  transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
}
.enroll-cell input:hover { border-color: #2F4560; background: #172636; }
.enroll-cell input.is-filled {
  background: rgba(76, 124, 240, .18);
  border-color: #3E63B8;
  color: #EAF2FF;
}
.enroll-cell input:focus {
  outline: none;
  border-color: var(--brand);
  background: #16273F;
  box-shadow: 0 0 0 3px rgba(76, 124, 240, .22);
}
.enroll-cell--podium {
  display: grid;
  place-items: center;
  height: 36px;
  border-radius: 9px;
  background: linear-gradient(160deg, #C3D8FF, #A8C4F2);
  color: #182741;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .16em;
  text-indent: .16em;
  cursor: default;
}

.enroll-legend {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 16px;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
  font-size: 11.5px;
  color: var(--ink-3);
}
.enroll-legend__item { display: inline-flex; align-items: center; gap: 6px; }
.enroll-dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: 0 0 auto; }
.enroll-dot[data-tone="filled"] { background: rgba(76, 124, 240, .55); box-shadow: inset 0 0 0 1px #3E63B8; }
.enroll-dot[data-tone="blank"] { background: #14202E; box-shadow: inset 0 0 0 1px #243447; }
.enroll-dot[data-tone="podium"] { background: #C3D8FF; }
.enroll-legend__hint { margin-left: auto; }

/* 右侧：同步范围列表 */
.rail--enroll { overflow: visible; }
.enroll-sync {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.enroll-sync__row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.enroll-sync__name {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink);
  text-decoration: none;
}
.enroll-sync__name:hover { color: var(--brand-ink); }
.enroll-sync__num { margin-left: auto; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.enroll-sync__num b { font-size: 12.5px; color: var(--ink); }
.enroll-sync__note {
  margin-top: 10px;
  font-size: 11.5px;
  line-height: 1.8;
  color: var(--ink-3);
}

/* 控制台「录入学员」标签页里的概览 */
.enroll-mini {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0 14px;
}
.enroll-mini div {
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.enroll-mini b { display: block; font-size: 16px; font-weight: 800; color: var(--ink); }
.enroll-mini span { font-size: 11px; color: var(--ink-3); }

/* ---------- 32.3 响应式 ---------- */
@media (max-width: 1240px) {
  .module-body--enroll { grid-template-columns: minmax(0, 1fr) 300px; }
}
@media (max-width: 1180px) {
  .module-body--enroll { grid-template-columns: minmax(0, 1fr); }
  .enroll-board { max-height: none; }
}
@media (max-width: 720px) {
  .enroll-grid {
    grid-template-columns: 40px repeat(12, minmax(54px, 1fr));
    gap: 5px;
    min-width: 760px;
  }
  .enroll-cell input { height: 34px; font-size: 12px; }
  .enroll-cell--podium { height: 34px; font-size: 10px; }
  .enroll-legend__hint { margin-left: 0; width: 100%; }
  .enroll-mini { grid-template-columns: minmax(0, 1fr); }
  .enroll-stamp { display: none; }
}

/* 32.4 首页入口图标：补上「每日统计」「录入学员」的冷色底色，避免落到默认样式 */
.entry[data-accent="dstat"] .entry__icon { background: #122A26; border-color: #23514A; color: #86D6C4; }
.entry[data-accent="enroll"] .entry__icon { background: #1A2432; border-color: #2E4258; color: #A9C4DE; }

/* 标题栏里「10 排 · 11 组」比纯数字长，单独降一档字号 */
.mstat--range b { font-size: 14px; letter-spacing: 0; white-space: nowrap; }
@media (max-width: 720px) { .mstat--range b { font-size: 12.5px; } }

/* 32.5 常规页座次表：1240–1560px 中宽屏收紧组距与过道，
   9–12 个组不再被右缘裁掉（此前只有统计页做了同样处理） */
@media (max-width: 1560px) {
  .stage:not(.stage--stat) { --gap-group: clamp(6px, .8vw, 14px); }
  .stage:not(.stage--stat) .seat-group { min-width: 86px; }
  .stage:not(.stage--stat) .seat-group.aisle-after { margin-left: clamp(12px, 1.6vw, 30px); }
}

/* =========================================================
   33. 首页「每日常规」分区（v3.1）
   结构：① 早读课件 —— 独立成块、青底色 + 外框，与下方统计区区分
        ② 过关 / 抄写 / 汇总 —— 2 列网格：
           第 1 行 听写过关统计 + 听写抄写统计
           第 2 行 背诵过关统计 + 背诵抄写统计
           第 3 行 右侧「每日统计」
   原则：分区靠「块」而不是靠分割线；对应关系靠同色系 + 连接符；
        全部用 grid，任何宽度都只换列数、不改结构，避免错位与空白。
   ========================================================= */

.daily { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.daily__block { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

/* 分区小标签：等宽小字 + 向右延伸的细线，起到「分节」作用又不抢注意力 */
.daily__label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: .2em;
  color: var(--ink-3);
}
.daily__label::after {
  content: '';
  flex: 1 1 auto;
  height: 1px;
  background: var(--line);
}

/* ---------- 33.1 第一部分：早读课件 ---------- */
.daily__block--lesson {
  padding: 10px 12px 12px;
  border: 1px solid rgba(53, 168, 162, .24);
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(53, 168, 162, .10), rgba(53, 168, 162, .028));
}
.daily__block--lesson .daily__label { color: var(--teal-2); }
.daily__block--lesson .daily__label::after {
  background: linear-gradient(90deg, rgba(53, 168, 162, .38), rgba(53, 168, 162, 0));
}

.entries--lesson { grid-template-columns: minmax(0, 1fr); }

.entry--lesson {
  min-height: 78px;
  padding: 12px 15px;
  gap: 14px;
  background: rgba(16, 42, 44, .55);
  border-color: rgba(53, 168, 162, .30);
}
.entry--lesson:hover {
  background: rgba(16, 42, 44, .82);
  border-color: rgba(95, 203, 196, .52);
  box-shadow: 0 18px 30px -26px rgba(3, 7, 13, .95);
}
.entry--lesson .entry__icon {
  flex: 0 0 40px;
  width: 40px;
  height: 40px;
  background: #102A2C;
  border-color: #23514F;
  color: #7BD8D0;
}
.entry--lesson .entry__icon svg { width: 20px; height: 20px; }
.entry--lesson .entry__title { font-size: 16px; letter-spacing: .01em; }
.entry--lesson .entry__meta { font-size: 11.5px; }

/* ---------- 33.2 第二部分：过关 / 抄写 / 汇总 ---------- */
.entries--pairs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.entries--pairs .entry { min-height: 66px; }

/* 抄写条目：与左侧「过关」同一色系（浅一档），并从左侧引一条连接线 */
.entry[data-accent="dcopy"] .entry__icon { background: #131E36; border-color: #26386B; color: #9FB4F2; }
.entry[data-accent="rcopy"] .entry__icon { background: #20182E; border-color: #3B2F63; color: #C0AEF5; }

.entry--derived { position: relative; }
.entry--derived::before {
  content: '';
  position: absolute;
  left: -10px;
  top: 50%;
  width: 10px;
  height: 1px;
  background: var(--line-strong);
  pointer-events: none;
}
.entry--derived::after {
  content: '▸';
  position: absolute;
  left: -6px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 8px;
  line-height: 1;
  color: var(--brass);
  pointer-events: none;
}

/* 每日统计：落在第 3 行右侧，用汇总色与「合计」语义呼应 */
.entry--sum {
  grid-column: 2;
  background: linear-gradient(180deg, rgba(62, 154, 134, .12), rgba(62, 154, 134, .04));
  border-color: rgba(62, 154, 134, .28);
}
.entry--sum:hover { border-color: rgba(134, 214, 196, .46); }
.entry--sum .entry__title { display: inline-flex; align-items: center; gap: 6px; }
.entry--sum .entry__title::after {
  content: '汇总';
  padding: 1px 5px;
  border: 1px solid rgba(134, 214, 196, .34);
  border-radius: 5px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .06em;
  color: #86D6C4;
}

/* ---------- 33.3 响应式：只换列数，不换结构 ---------- */
@media (max-width: 1360px) {
  .entries--pairs .entry { min-height: 64px; padding: 9px 11px; gap: 9px; }
  .entries--pairs .entry__icon { flex-basis: 28px; width: 28px; height: 28px; }
  .entries--pairs .entry__title { font-size: 12.5px; }
}

@media (max-width: 980px) {
  /* 板面已单列，横向空间变大，恢复正常的点击区高度 */
  .entries--pairs .entry { min-height: 68px; padding: 11px 13px; gap: 11px; }
  .entries--pairs .entry__icon { flex-basis: 32px; width: 32px; height: 32px; }
  .entries--pairs .entry__title { font-size: 13.5px; }
  .entry--lesson .entry__title { font-size: 17px; }
}

@media (max-width: 640px) {
  .entries--pairs { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .entry--sum { grid-column: auto; }
  .entry--derived::before { left: 6px; width: 0; }
  .entry--derived::after { content: '↑'; left: -1px; }
  .daily__block--lesson { padding: 9px 10px 10px; }
  .entry--lesson { min-height: 70px; padding: 11px 12px; gap: 11px; }
  .entry--lesson .entry__icon { flex-basis: 34px; width: 34px; height: 34px; }
  .entry--lesson .entry__title { font-size: 15px; }
}

/* =========================================================
   34. 双系统（听写 / 背诵）：目录树 + 任务 + 抄写轮次 + 每日统计
   ---------------------------------------------------------
   布局：左目录（固定 264px）+ 右座次表；窄屏自动上下堆叠。
   颜色：听写=冷靛（蓝），背诵=冷紫，两个系统靠色相区分但不刺眼。
   ========================================================= */

/* ---------- 34.1 页头 ---------- */
.sys-sub { font-size: 11px; color: var(--ink-3); letter-spacing: .02em; }
.module-head--sys .module-head__title { gap: 8px; }
.module-head--sys .tag { font-size: 11px; }

/* ---------- 34.2 主体两栏 ---------- */
.sys-body {
  display: grid;
  grid-template-columns: minmax(230px, 264px) minmax(0, 1fr);
  gap: clamp(12px, 1.4vw, 18px);
  align-items: start;
  min-height: 0;
}

.sys-side {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  padding: 10px 10px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  max-height: calc(100vh - 210px);
}
.sys-side__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: .18em;
  color: var(--ink-3);
  padding: 2px 2px 6px;
  border-bottom: 1px solid var(--line);
}
.sys-side__add,
.sys-node__acts button {
  border: 1px solid var(--line-strong);
  background: var(--surface-2);
  color: var(--ink-2);
  border-radius: 6px;
  font-size: 10px;
  letter-spacing: 0;
  padding: 2px 6px;
  cursor: pointer;
  transition: color .14s, border-color .14s, background .14s;
}
.sys-side__add:hover,
.sys-node__acts button:hover { color: var(--ink); border-color: var(--brand); background: var(--brand-soft); }
.sys-side__num { color: var(--ink-3); font-weight: 700; }
.sys-side__hint {
  margin: 4px 2px 0;
  font-size: 10.5px;
  line-height: 1.7;
  color: var(--ink-3);
}
.sys-side__empty { font-size: 11.5px; color: var(--ink-3); padding: 8px 4px; line-height: 1.7; }

/* ---------- 34.3 目录树 ---------- */
.sys-tree {
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
  min-height: 0;
  padding-right: 2px;
}
.sys-node { display: flex; flex-direction: column; gap: 2px; }
.sys-node[data-depth="1"] { padding-left: 12px; }
.sys-node[data-depth="2"] { padding-left: 24px; }

.sys-node__row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 6px;
  border-radius: 8px;
  min-width: 0;
}
.sys-node__row:hover { background: var(--surface-2); }
.sys-node__caret {
  flex: 0 0 16px;
  width: 16px;
  height: 16px;
  display: grid;
  place-items: center;
  border: none;
  background: transparent;
  color: var(--ink-3);
  font-size: 10px;
  cursor: pointer;
  border-radius: 4px;
}
.sys-node__caret:hover { color: var(--ink); background: var(--surface-3); }
.sys-node__caret.is-empty { cursor: default; }
.sys-node__name {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.sys-node__count {
  font-size: 10px;
  color: var(--ink-3);
  background: var(--surface-2);
  border-radius: 999px;
  padding: 0 5px;
  min-width: 16px;
  text-align: center;
}
.sys-node__acts { margin-left: auto; display: none; gap: 3px; }
.sys-node__row:hover .sys-node__acts { display: flex; }
/* 抄写页：发布入口是主操作，常显，不等悬停 */
.sys-node__acts.is-always { display: flex; }
.sys-node__acts.is-always button { color: var(--brand-ink, var(--brand)); border-color: rgba(76, 124, 240, .45); background: var(--brand-soft); }

.sys-node__tasks { padding-left: 18px; }

.sys-task {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 5px 8px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-2);
  font-size: 11.5px;
  text-align: left;
  cursor: pointer;
  min-width: 0;
}
.sys-task:hover { background: var(--surface-2); color: var(--ink); }
.sys-task.is-active {
  background: var(--brand-soft);
  border-color: rgba(76, 124, 240, .38);
  color: var(--ink);
}
.sys-task__dot { flex: 0 0 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
.sys-task__dot[data-tone="r"] { background: var(--violet); }
.sys-task__name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sys-task__badge {
  flex: 0 0 auto;
  font-size: 9.5px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--surface-3);
  color: var(--ink-3);
}
.sys-task__badge.is-todo { color: #F0A9B8; background: rgba(220, 92, 116, .16); }
.sys-task__badge.is-ok { color: #7FD3A9; background: rgba(47, 163, 107, .16); }
.sys-task__date { flex: 0 0 auto; font-size: 9.5px; color: var(--ink-3); }

/* ---------- 34.4 右侧主区 ---------- */
.sys-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.sys-taskhead {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.sys-taskhead__left { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.sys-taskhead__name {
  font-size: 15px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: .01em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sys-taskhead__path {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
  letter-spacing: .01em;
}
.sys-taskhead__meta { font-size: 11px; color: var(--ink-3); }

/* 已发布抄写任务条（过关页）：点任一枚跳到对应轮次的座次表 */
.sys-copystrip {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
}
.sys-copystrip__label {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-3);
  letter-spacing: .04em;
  margin-right: 2px;
}
.sys-copystrip__empty { font-size: 11.5px; color: var(--ink-3); }
.sys-copy-chip {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  max-width: 100%;
  padding: 4px 9px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-2);
  font-size: 11.5px;
  font-weight: 650;
  cursor: pointer;
  transition: .16s;
}
.sys-copy-chip span { font-size: 10px; color: var(--ink-3); font-weight: 600; }
.sys-copy-chip:hover { border-color: var(--brand); color: var(--ink); transform: translateY(-1px); }
.sys-copy-chip.is-ok { border-color: rgba(46, 160, 122, .5); color: var(--ok-2); }
.sys-taskhead__bar {
  flex: 1 1 auto;
  min-width: 90px;
  height: 6px;
  border-radius: 999px;
  background: var(--surface-3);
  overflow: hidden;
}
.sys-taskhead__bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--teal-2)); border-radius: 999px; transition: width .25s; }

/* 保存条：有未保存修改时高亮 */
.sys-savebar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border: 1px dashed var(--line-strong);
  border-radius: 10px;
  background: transparent;
  color: var(--ink-3);
  font-size: 11.5px;
}
.sys-savebar.is-on {
  border-style: solid;
  border-color: rgba(76, 124, 240, .45);
  background: rgba(76, 124, 240, .10);
  color: var(--ink);
}
.sys-savebar__text b { font-size: 13px; color: var(--ink); }
.sys-savebar .btn { margin-left: 0; }
.sys-savebar .btn[disabled] { opacity: .45; cursor: not-allowed; }
.sys-savebar .btn--ghost { margin-left: auto; }
/* 课堂纪律的保存条：两个按钮挨着放，不要一个左一个右 */
.sys-savebar--reg .sys-savebar__text { margin-right: auto; }
.sys-savebar--reg .btn--ghost { margin-left: 0; }
.sys-savebar--reg.is-on { border-color: rgba(224, 160, 90, .5); background: rgba(224, 160, 90, .10); }

/* 座次表容器 */
.stage--sys {
  overflow-x: auto;
  padding: 12px 10px 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.stage--sys .seat-column { grid-auto-rows: minmax(52px, auto); }

/* 草稿态：改了还没保存的座位加一圈虚线光晕 */
.seat.is-dirty { box-shadow: inset 0 0 0 2px rgba(110, 155, 250, .75), 0 0 0 2px rgba(110, 155, 250, .18); }

.sys-legend {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 10px;
  font-size: 10.5px;
  color: var(--ink-3);
}
.sys-legend span { display: inline-flex; align-items: center; gap: 5px; }
.sys-legend__hint { margin-left: auto; }
.sys-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.sys-dot[data-tone="done"] { background: var(--done); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
.sys-dot[data-tone="undone"] { background: var(--undone); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
.sys-dot[data-tone="dirty"] { background: transparent; box-shadow: inset 0 0 0 2px rgba(110,155,250,.8); }
.sys-dot[data-tone="na"] { background: var(--surface-3); }

/* ---------- 34.5 抄写轮次 ---------- */
.sys-rounds {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.sys-round {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 320px;
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-2);
  font-size: 11.5px;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sys-round:hover { border-color: var(--line-strong); color: var(--ink); }
.sys-round.is-active {
  border-color: rgba(76, 124, 240, .5);
  background: var(--brand-soft);
  color: var(--ink);
}
.sys-round__num { font-size: 9.5px; color: var(--ink-3); }
.sys-round__del {
  font-style: normal;
  font-size: 10px;
  color: var(--ink-3);
  padding: 0 2px;
  border-radius: 4px;
}
.sys-round__del:hover { color: var(--danger-2); background: rgba(220, 92, 116, .14); }

.sys-empty {
  padding: 34px 22px;
  border: 1px dashed var(--line-strong);
  border-radius: 14px;
  background: var(--surface);
  text-align: center;
  color: var(--ink-3);
}
.sys-empty b { display: block; font-size: 14px; color: var(--ink); margin-bottom: 6px; }
.sys-empty p { font-size: 11.5px; line-height: 1.8; }

/* 抄写页左侧：任务平铺列表，不显示层级缩进 */
.sys-tree--flat { gap: 3px; }
.sys-tree--flat .sys-task { padding: 7px 9px; }

/* ---------- 34.6 每日统计：两部分 ---------- */
.dstat-parts { display: flex; flex-direction: column; gap: 18px; }

.dstat-part__head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 12px;
}
.dstat-part__no {
  flex: 0 0 30px;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--brand-soft);
  border: 1px solid rgba(76, 124, 240, .35);
  color: var(--brand-2);
  font-size: 13px;
  font-weight: 800;
}
.dstat-part__head h2 { font-size: 16px; font-weight: 780; letter-spacing: .01em; }
.dstat-part__head p { font-size: 11px; color: var(--ink-3); margin-top: 3px; }

.dstat-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.dstat-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 12px 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  min-width: 0;
}
.dstat-card[data-tone="d"] { border-top: 2px solid rgba(76, 124, 240, .55); }
.dstat-card[data-tone="r"] { border-top: 2px solid rgba(139, 123, 240, .55); }

.dstat-card__head { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.dstat-card__head b { font-size: 12.5px; }
.dstat-card__tag {
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-2);
}
.dstat-card__tag[data-tone="r"] { background: var(--violet-soft); color: var(--violet-2); }
.dstat-card__count { margin-left: auto; font-size: 10.5px; color: var(--ink-3); }

.dstat-rows {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 46vh;
  overflow-y: auto;
  padding-right: 4px;
}
.dstat-row {
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
}
.dstat-row__top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dstat-row__name {
  border: none;
  background: none;
  padding: 0;
  color: var(--ink);
  font-size: 11.5px;
  font-weight: 700;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.dstat-row__name:hover { color: var(--brand-2); text-decoration: underline; }
.dstat-row__date { flex: 0 0 auto; font-size: 9.5px; color: var(--ink-3); }
.dstat-row__badge {
  flex: 0 0 auto;
  font-size: 9.5px;
  color: var(--ink-3);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0 6px;
}
.dstat-row__num { margin-left: auto; flex: 0 0 auto; font-size: 10.5px; color: var(--ink-3); }
.dstat-row__num b { font-size: 12px; color: var(--ink); }

.dstat-bar {
  height: 4px;
  margin: 6px 0 7px;
  border-radius: 999px;
  background: var(--surface-3);
  overflow: hidden;
}
.dstat-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--brand), var(--teal-2)); transition: width .25s; }

.dstat-row__names { display: flex; flex-wrap: wrap; gap: 4px; }
.dstat-chip {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 5px;
  background: rgba(220, 92, 116, .14);
  color: #F0A9B8;
  border: 1px solid rgba(220, 92, 116, .22);
}
.dstat-chip[data-tone="r"] { background: rgba(139, 123, 240, .14); color: #C3B8FA; border-color: rgba(139, 123, 240, .24); }
.dstat-ok { font-size: 10.5px; color: #7FD3A9; }
.dstat-empty { font-size: 11px; color: var(--ink-3); padding: 8px 2px; }

/* ---------- 34.7 响应式 ---------- */
@media (max-width: 1180px) {
  .sys-body { grid-template-columns: minmax(0, 1fr); }
  .sys-side { max-height: none; }
  .sys-tree { max-height: 34vh; }
  .dstat-grid { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 720px) {
  .sys-side { padding: 8px; }
  .sys-node__acts { display: flex; }
  .sys-taskhead { flex-direction: column; align-items: stretch; gap: 8px; }
  .sys-savebar { flex-wrap: wrap; }
  .sys-savebar .btn--ghost { margin-left: 0; }
  .sys-legend { gap: 10px; }
  .sys-legend__hint { margin-left: 0; width: 100%; }
  .dstat-rows { max-height: none; }
  .stage--sys { padding: 8px 6px; }
}

/* ================= 35. 座次表库（录入学员多表管理 + 任务选取弹窗） ================= */
.enroll-charts-wrap {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border: 1px dashed var(--line-strong);
  border-radius: 12px;
  background: var(--bg-2);
}
.enroll-charts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  flex: 1 1 auto;
  min-width: 0;
}
.enroll-chart {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  max-width: 240px;
  padding: 5px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-2);
  font-size: 12px;
  cursor: pointer;
  transition: border-color .15s, color .15s, background .15s;
}
.enroll-chart:hover { border-color: var(--line-strong); color: var(--ink); }
.enroll-chart.is-active {
  border-color: var(--brand);
  background: var(--brand-soft);
  color: var(--brand-ink);
}
.enroll-chart__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 640; }
.enroll-chart__num { flex: none; font-size: 10.5px; color: var(--ink-3); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.enroll-charts__acts { display: flex; flex-wrap: wrap; gap: 6px; flex: none; }

.enroll-board__title {
  font-size: 11.5px;
  font-weight: 640;
  color: var(--ink-3);
  letter-spacing: .02em;
  padding: 2px 2px 8px;
}

/* 发布任务时的座次表选取弹窗 */
.chart-pick {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin: 4px 0 14px;
  max-height: 46vh;
  overflow: auto;
}
.chart-pick__row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  cursor: pointer;
}
.chart-pick__row:hover { border-color: var(--line-strong); }
.chart-pick__row.is-pick { border-color: var(--brand); background: var(--brand-soft); }
.chart-pick__row input { accent-color: var(--brand); }
.chart-pick__name { flex: 1; min-width: 0; font-weight: 640; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart-pick__num { flex: none; font-size: 11px; color: var(--ink-3); }

/* ================= 36. 名单导入（录入学员 · Excel / Word / 图片） ================= */
.import-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 4px 0 14px;
}
.import-row input[type="file"] {
  font-size: 13px;
  color: var(--ink-2);
  max-width: 100%;
}
#importStatus { font-size: 12.5px; color: var(--ink-3); }
#importApplyBtn:disabled { opacity: 0.55; cursor: not-allowed; }

/* ================= 37. 个人查询 / 每日统计提示 ================= */
.banner--dstat {
  /* 这一条是大段说明文字：块级排版，避免 flex 把每段文字拆成竖列 */
  display: block;
  margin: 0 0 16px;
  padding: 12px 16px;
  border-radius: 12px;
  background: var(--accent-soft, #FFF7E6);
  border: 1px solid var(--accent-line, #F2D9A6);
  color: var(--ink-1, #1F2937);
  font-size: 13.5px;
  line-height: 1.75;
}
.banner--dstat .banner__note { display: block; margin-top: 4px; color: var(--ink-2, #475569); }

/* 学情待办汇总：顶部「听写规章」整段说明 */
.doc-rules {
  margin: 0 0 16px;
  padding: 15px 20px 16px;
  border-radius: 14px;
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.doc-rules__head {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding-bottom: 0;
  margin-bottom: 13px;
  border-bottom: 1px solid var(--line);
}
.doc-rules__title { font-size: 15px; font-weight: 780; letter-spacing: .04em; color: var(--ink); padding-bottom: 10px; }
.doc-rules__en { font-size: 10px; font-weight: 700; letter-spacing: .18em; color: var(--ink-3); padding-bottom: 11px; }
/* 听写 / 背诵 两个规章标签 */
.doc-tabs { display: flex; align-items: flex-end; gap: 4px; }
.doc-tab {
  position: relative;
  padding: 2px 10px 10px;
  border: 0;
  background: none;
  font: inherit;
  font-size: 14px;
  font-weight: 750;
  letter-spacing: .03em;
  color: var(--ink-3);
  cursor: pointer;
}
.doc-tab i {
  font-style: normal;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .14em;
  margin-left: 5px;
  opacity: .6;
}
.doc-tab:hover { color: var(--ink-2); }
.doc-tab:hover i { opacity: .85; }
.doc-tab.is-active { color: var(--ink); }
.doc-tab.is-active i { color: var(--brand-2); opacity: 1; }
.doc-tab.is-active::after {
  content: '';
  position: absolute;
  left: 6px;
  right: 6px;
  bottom: -1px;
  height: 2px;
  border-radius: 2px;
  background: var(--brand);
}
.doc-tab:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.doc-panel[hidden] { display: none; }

/* 常规违纪统计：顶部规章（与学情待办汇总同一套版式） */
.doc-rules--regstat[hidden] { display: none; }
.doc-rules__lead { color: var(--ink); font-weight: 760; }
.doc-rules--regstat .doc-rules__list > li { line-height: 1.78; }
@media (max-width: 560px) {
  .doc-rules--regstat .doc-rules__list > li { font-size: 12.2px; }
}
.doc-rules__list {
  list-style: none;

  display: flex;
  flex-direction: column;

  padding: 0;

.doc-rules__list > li {

  height: 20px;

.pquery-card {

/* ---------- 38. 班级切换（两个独立班级 · v3.7） ---------- */
.class-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin: 10px 0 14px;
  padding: 10px 12px;

  background: var(--surface);
}
.class-bar__main { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.class-bar__en { font-size: 9.5px; font-weight: 800; letter-spacing: .24em; color: var(--brass); }
.class-bar__hint {
  flex: 1 1 260px;
  margin: 0;
  font-size: 11.5px;
  line-height: 1.65;
  color: var(--ink-3);
}

.class-switch { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.class-switch__label { font-size: 10.5px; font-weight: 700; letter-spacing: .16em; color: var(--ink-3); }
.class-switch__tabs {
  display: inline-flex;
  gap: 4px;
  padding: 3px;
  border: 1px solid var(--line);

}

  align-items: baseline;
  gap: 6px;
  padding: 5px 11px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-2);

  cursor: pointer;
  white-space: nowrap;

}
.class-tab b { font-size: 13px; font-weight: 700; }
.class-tab i { font-style: normal; font-size: 10.5px; color: var(--ink-3); }
.class-tab:hover { background: var(--surface-2); color: var(--ink); }
.class-tab.is-active {
  background: var(--brand-soft);
  border-color: var(--line-strong);

}
.class-tab.is-active i { color: var(--brand-ink); opacity: .72; }
.class-switch__rename {
  padding: 4px 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: transparent;
  color: var(--ink-3);
  font: inherit;
  font-size: 11px;
  cursor: pointer;
}
.class-switch__rename:hover { color: var(--ink); border-color: var(--line-strong); }
.class-switch--compact .class-tab { padding: 4px 9px; }
.class-switch--compact .class-tab b { font-size: 12px; }
.class-switch--compact .class-switch__label { display: none; }

.class-rows { display: grid; gap: 8px; margin-top: 10px; }
.class-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
}
.class-row.is-active { border-color: var(--line-strong); background: var(--brand-soft); }
.class-row__main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.class-row__main b { font-size: 14px; color: var(--ink); }
.class-row__main span { font-size: 11.5px; color: var(--ink-3); }
.class-row__acts { display: flex; gap: 6px; flex-shrink: 0; }
.class-row .btn[disabled] { opacity: .55; cursor: default; }

.tag--chart { border-color: var(--line-strong); color: var(--brand-ink); }
.dstat-row__chart {
  font-size: 10.5px;
  color: var(--ink-3);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 7px;
  white-space: nowrap;
}

@media (max-width: 720px) {

  .class-bar__hint { display: none; }
  .class-row { flex-direction: column; align-items: flex-start; }

}

/* 录入学员：空班级提示条 */
.banner--enroll {
  margin: 0 0 12px;
  border: 1px solid var(--line-strong);
  background: var(--brand-soft);
  color: var(--brand-ink);
  font-size: 12.5px;
  line-height: 1.7;
}

/* 模块头部放得下班级切换：允许换行，窄屏不溢出 */
.module-head__actions { flex-wrap: wrap; row-gap: 6px; }

/* ---------- 39. 拓展阅读材料库（控制台 v3.8） ---------- */
.art-lib { display: grid; gap: 16px; }
.art-group { display: grid; gap: 6px; }
.art-group__head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 2px 2px 5px;
  border-bottom: 1px dashed var(--line);
}
.art-group__head span { font-size: 12.5px; font-weight: 800; letter-spacing: .04em; color: var(--ink); }
.art-group__head i { font-style: normal; font-size: 11px; color: var(--ink-3); }

.mini-row--artlib { grid-template-columns: 76px minmax(0, 1.25fr) minmax(0, 1.6fr) 62px auto; }
.art-src {

}
.art-src.is-edited { border-color: var(--line-strong); color: var(--brand-ink); background: var(--brand-soft); }
.art-src.is-custom { border-color: var(--teal); color: var(--teal-2); background: var(--teal-soft); }
.art-src.is-hidden { opacity: .72; }

.mini-row__acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.mini-row__acts .btn { white-space: nowrap; }
.art-del { color: var(--danger-2); }
.art-del:hover { border-color: var(--danger); background: var(--danger-soft); }

@media (max-width: 760px) {

/* ---------- 40. 录入学员：撤销 / 保存 / 上下翻转（v3.9） ---------- */
.enroll-save-state {
