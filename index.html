  background: linear-gradient(135deg, #2F8A74 0%, #3E9A86 55%, #4CAD97 100%);
  border-color: rgba(120, 205, 180, .5);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 14px 28px -14px rgba(62, 154, 134, .85);
}
.query-btn--all small { color: #C4EDE0; }
@media (max-width: 720px) {
  .query-hub { padding: 12px 14px; gap: 10px; }
  .query-hub__btns { width: 100%; }
  .query-btn { flex: 1 1 152px; min-width: 0; padding: 10px 14px 9px; }
  .query-btn b { font-size: 14px; }
  .query-btn small { font-size: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  .query-btn:hover { transform: none; }
}

/* ---------- 42.2 主页公告栏 ---------- */
.notice {
  padding: 14px 16px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: linear-gradient(180deg, rgba(27, 40, 55, .92) 0%, rgba(22, 33, 46, .92) 100%);
  box-shadow: var(--shadow-sm);
}
.notice__head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  margin-bottom: 10px;
}
.notice__headmain { flex: 1 1 320px; min-width: 0; }
.notice__titlerow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.notice__en {
  display: inline-block;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .26em;
  color: var(--brass);
}
.notice__title {
  font-family: var(--serif);
  font-size: clamp(18px, 1.7vw, 22px);
  font-weight: 600;
  letter-spacing: .01em;
}
.notice__desc { margin-top: 3px; font-size: 11px; line-height: 1.65; color: var(--ink-3); }
.notice__acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.notice__count {
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  color: var(--brand-ink);
  background: var(--brand-soft);
  border: 1px solid rgba(76, 124, 240, .34);
  white-space: nowrap;
}
.notice__list {
  /* auto-fill：公告少时卡片只占自己的列，不再被拉成占满整行的长条 */
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 9px;
}
.notice__list--modal { grid-template-columns: 1fr; max-height: 56vh; overflow: auto; margin-top: 4px; }
.notice__empty {
  margin: 0;
  padding: 12px 14px;
  border: 1px dashed var(--line-strong);
  border-radius: 12px;
  font-size: 12px;
  line-height: 1.7;
  color: var(--ink-3);
  text-align: left;
}

.notice-card {
  position: relative;
  padding: 10px 13px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--surface);
  overflow: hidden;
}
.notice-card.is-pin {
  border-color: rgba(76, 124, 240, .5);
  background: linear-gradient(135deg, rgba(76, 124, 240, .13) 0%, var(--surface) 62%);
}
.notice-card.is-pin::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--brand-2), var(--teal-2));
}
.notice-card__top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; }
.notice-card__pin {
  padding: 1px 7px;
  border-radius: 5px;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .08em;
  color: #0D141D;
  background: var(--brand-2);
}
.notice-card__title {
  flex: 1 1 60%;
  font-size: 14.5px;
  font-weight: 750;
  line-height: 1.5;
  color: var(--ink);
  word-break: break-word;
}
.notice-card__date {
  font-size: 10.5px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  letter-spacing: .04em;
}
.notice-card__text {
  margin-top: 6px;
  font-size: 12.5px;
  line-height: 1.75;
  color: var(--ink-2);
  white-space: pre-wrap;
  word-break: break-word;
}
.notice-card__fold { margin-top: 7px; }
.notice-card__fold > summary {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  color: var(--brand-ink);
  background: var(--brand-soft);
  border: 1px solid rgba(76, 124, 240, .3);
  cursor: pointer;
  list-style: none;
}
.notice-card__fold > summary::-webkit-details-marker { display: none; }
.notice-card__fold > summary::before { content: "▾"; font-size: 9px; opacity: .8; }
.notice-card__fold[open] > summary::before { content: "▴"; }
.notice-card__fold[open] > summary { margin-bottom: 6px; }
.notice-card__fold[open] > summary::after { content: "（点击收起）"; font-weight: 500; opacity: .7; }

.notice-card__files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.notice-file {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  padding: 4px 9px 4px 5px;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: 11.5px;
  text-decoration: none;
  transition: border-color .15s ease, background .15s ease, color .15s ease;
}
.notice-file:hover { border-color: var(--brand); background: var(--brand-soft); color: var(--ink); }
.notice-file__kind {
  flex: 0 0 auto;
  padding: 1px 5px;
  border-radius: 5px;
  font-size: 8.5px;
  font-weight: 800;
  letter-spacing: .05em;
  color: #0D141D;
  background: var(--brass-2);
}
.notice-file__kind[data-kind="PDF"] { background: #F08CA0; }
.notice-file__kind[data-kind="DOC"] { background: #8FB7F5; }
.notice-file__kind[data-kind="XLS"] { background: #57C08C; }
.notice-file__kind[data-kind="PPT"] { background: #E0A277; }
.notice-file__kind[data-kind="ZIP"] { background: #A99CF7; }
.notice-file__kind[data-kind="IMG"] { background: #5FCBC4; }
.notice-file__name {
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-decoration: none;
  color: inherit;
}
a.notice-file__name:hover { text-decoration: underline; }
.notice-file__size { font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ---------- 42.3 控制台 → 公告 ---------- */
.notice-form { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.notice-form .row-2 { align-items: end; }
.notice-form__pin { padding-bottom: 9px; }
.notice-form__files { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.notice-form .field textarea { min-height: 96px; }

.notice-admin { display: flex; flex-direction: column; gap: 10px; }
.notice-admin__row {
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
}
.notice-admin__row.is-pin { border-color: rgba(76, 124, 240, .46); background: linear-gradient(135deg, rgba(76, 124, 240, .1), var(--surface) 60%); }
.notice-admin__head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
.notice-admin__head input[type="text"].notice-admin__title { flex: 1 1 240px; font-weight: 700; }
.notice-admin__head input[type="date"] { width: 148px; }
.notice-admin__row textarea {
  width: 100%;
  min-height: 62px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--bg-2);
  color: var(--ink);
  font: inherit;
  font-size: 12.5px;
  line-height: 1.75;
  resize: vertical;
}
.notice-admin__files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.notice-file--admin { padding-right: 4px; }
.notice-file__del {
  width: 17px; height: 17px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid #3A2029;
  background: #2E1A21;
  color: #E07385;
  font-size: 11px;
  line-height: 1;
  cursor: pointer;
}
.notice-file__del:hover { background: #43222C; }
.notice-file--draft { padding-right: 4px; }

@media (max-width: 560px) {
  .notice { padding: 14px; }
  .notice__acts { width: 100%; }
  .notice-file__name { max-width: 120px; }
}

/* ---------- 43. 写作素材库（应用文 / 读后续写 · 范文与积累） ---------- */
/* 43.1 首页栏目：四个子板块并排 */
.wl-home {
  padding: clamp(18px, 2.2vw, 28px);
  border: 1px solid var(--line);
  border-radius: 16px;
  background:
    radial-gradient(680px 260px at 100% -30%, rgba(76, 124, 240, .12) 0%, rgba(76, 124, 240, 0) 70%),
    linear-gradient(180deg, #121B26 0%, #16202C 100%);
  display: grid;
  gap: clamp(14px, 1.6vw, 22px);
}
.wl-home__head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.wl-home__en { font-size: 9px; font-weight: 800; letter-spacing: .26em; color: #7BD8D0; }
.wl-home__title {
  margin: 6px 0 6px;
  font-family: var(--serif);
  font-size: clamp(22px, 2.1vw, 30px);
  font-weight: 600;
  letter-spacing: .02em;
  color: var(--ink);
}
.wl-home__desc { font-size: 11.5px; line-height: 1.9; color: var(--ink-2); max-width: 86ch; }
.wl-home__desc b { color: var(--ink); }
.wl-home__cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 10px;
}
.wl-home-card {
  display: flex;
  flex-direction: column;
  gap: 5px;
  text-align: left;
  padding: 14px 14px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 2px solid var(--brand);
  border-radius: 12px;
  color: var(--ink);
  font: inherit;
  cursor: pointer;
  transition: transform .16s ease, border-color .16s, box-shadow .16s;
}
.wl-home-card:nth-child(2) { border-top-color: var(--teal); }
.wl-home-card:nth-child(3) { border-top-color: var(--violet); }
.wl-home-card:nth-child(4) { border-top-color: var(--brass); }
.wl-home-card:hover {
  transform: translateY(-2px);
  border-color: var(--line-strong);
  box-shadow: 0 20px 34px -28px rgba(3, 7, 13, .95);
}
.wl-home-card__no { font-family: var(--serif); font-size: 13px; letter-spacing: .12em; color: var(--brass); }
.wl-home-card__name { font-size: 13.5px; font-weight: 820; letter-spacing: -.01em; }
.wl-home-card__count { font-size: 10px; letter-spacing: .08em; color: var(--ink-3); }
.wl-home-card__desc { font-size: 10.5px; line-height: 1.75; color: var(--ink-3); }
.wl-home-card__sample {
  margin-top: auto;
  padding-top: 8px;
  font-size: 10.5px;
  line-height: 1.65;
  color: var(--brand-ink);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.wl-home-card__go { font-size: 10.5px; font-weight: 800; color: var(--brass); }

/* 43.2 素材库页面：子板块说明条 */
.wl-sechead {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: center;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--wl-accent, var(--brand));
  border-radius: 12px;
  background: var(--surface);
}
.wl-sechead__en { font-size: 9px; font-weight: 800; letter-spacing: .22em; color: var(--ink-3); }
.wl-sechead__main h2 { margin: 6px 0 6px; font-size: 17px; font-weight: 840; letter-spacing: -.01em; color: var(--ink); }
.wl-sechead__main p { font-size: 12px; line-height: 1.85; color: var(--ink-2); }
.wl-sechead__side {
  display: grid;
  grid-auto-flow: row;
  justify-items: end;
  gap: 2px;
  padding-left: 18px;
  border-left: 1px solid var(--line);
}
.wl-sechead__side b { font-size: 26px; font-weight: 860; line-height: 1; color: var(--ink); }
.wl-sechead__side span { font-size: 10px; letter-spacing: .12em; color: var(--ink-3); }
.wl-sechead__side i {
  margin-top: 6px;
  max-width: 190px;
  text-align: right;
  font-style: normal;
  font-size: 10.5px;
  line-height: 1.7;
  color: var(--ink-3);
}
.wl-disclaim {
  margin: 0;
  padding: 10px 14px;
  border: 1px dashed var(--line-strong);
  border-radius: 10px;
  background: var(--bg-2);
  font-size: 11px;
  line-height: 1.8;
  color: var(--ink-3);
}

/* 43.3 卡片 */
.wl-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}
.wl-card {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  cursor: pointer;
  transition: transform .16s ease, border-color .16s, box-shadow .16s;
}
.wl-card:hover {
  transform: translateY(-2px);
  border-color: var(--line-strong);
  box-shadow: var(--shadow-md);
}
.wl-card:focus-visible {
  border-color: var(--brand-2);
  box-shadow: 0 0 0 2px var(--brand-soft), var(--shadow-md);
  outline: 2px solid var(--brand-2);
  outline-offset: 2px;
}
.wl-card__top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.wl-kind {
  display: inline-block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: .06em;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid transparent;
}
.wl-kind[data-kind="gk"] { background: var(--brand-soft); color: var(--brand-ink); border-color: rgba(76, 124, 240, .3); }
.wl-kind[data-kind="lk"] { background: var(--violet-soft); color: var(--violet-2); border-color: rgba(139, 123, 240, .3); }
.wl-kind[data-kind="sc"] { background: var(--teal-soft); color: var(--teal-2); border-color: rgba(53, 168, 162, .3); }
.wl-card__topic { font-size: 10.5px; color: var(--ink-3); }
.wl-card h3 { font-size: 15px; font-weight: 800; line-height: 1.5; letter-spacing: -.01em; color: var(--ink); }
.wl-card__en { font-family: Georgia, var(--serif); font-style: italic; font-size: 11.5px; color: var(--ink-3); }
.wl-card__desc {
  font-size: 11.5px;
  line-height: 1.8;
  color: var(--ink-2);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.wl-card__foot {
  margin-top: auto;
  padding-top: 9px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.wl-card__src {
  font-size: 10.5px;
  color: var(--brass);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.wl-card__go { font-size: 10.5px; font-weight: 800; color: var(--brand-2); flex: 0 0 auto; }

/* 43.4 阅读弹窗：原题引用 + 英文范文 */
.wl-art__note {
  margin: 14px 0 0;
  padding: 9px 12px;
  border-radius: 9px;
  background: var(--bg-2);
  border: 1px dashed var(--line-strong);
  font-size: 11px;
  line-height: 1.75;
  color: var(--ink-3);
}
.art__q {
  margin: 0;
  padding: 12px 14px;
  border-left: 3px solid var(--brass);
  border-radius: 0 10px 10px 0;
  background: var(--surface-2);
  font-size: 12.5px;
  line-height: 1.95;
  color: var(--ink-2);
}
.art__essay {
  padding: 15px 17px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-2);
  font-family: Georgia, "Times New Roman", var(--serif);
  font-size: 14px;
  line-height: 2.05;
  color: var(--ink);
  white-space: pre-line;
}
.art--write .art__meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.art--write .art__meta b { color: var(--brass-2); font-weight: 750; }

@media (max-width: 900px) {
  .wl-sechead { grid-template-columns: minmax(0, 1fr); }
  .wl-sechead__side {
    grid-auto-flow: column;
    justify-items: start;
    align-items: baseline;
    gap: 6px;
    padding-left: 0;
    padding-top: 10px;
    border-left: 0;
    border-top: 1px solid var(--line);
  }
  .wl-sechead__side i { margin-top: 0; max-width: none; text-align: left; }
  .wl-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .wl-home { padding: 14px; }
  .wl-home-card { padding: 12px; }
  .wl-card { padding: 13px; }
  .art__essay { font-size: 13px; line-height: 1.95; padding: 12px; }
}

/* =========================================================
   44. 公告日期 + New 标记 / 「一键查询」大标题（v3.14）
   44.1 公告标题后的日期章 / 44.2 New 标记 / 44.3 个人查询横幅
   ========================================================= */

/* ---------- 44.1 公告日期：紧跟标题的小章 ---------- */
.notice-card__top { align-items: center; }
.notice-card__top .notice-card__title { flex: 0 1 auto; }
.notice-card__date {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 7px 1px 6px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--bg-2);
  font-size: 10px;
  font-weight: 700;
  line-height: 1.7;
  letter-spacing: .04em;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ---------- 44.2 New 标记：暖色高对比，明显到不用找 ---------- */
.notice-card__new {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 9px 2px 7px;
  border-radius: 999px;
  font-size: 9.5px;
  font-weight: 900;
  letter-spacing: .1em;
  line-height: 1.6;
  text-transform: uppercase;
  color: #26160A;
  background: linear-gradient(135deg, #FFD166 0%, #FF9F5A 100%);
  border: 1px solid rgba(255, 214, 150, .75);
  box-shadow: 0 6px 14px -8px rgba(255, 159, 90, .95);
  white-space: nowrap;
  animation: noticeNewPulse 2.4s ease-in-out infinite;
}
.notice-card__new i {
  display: block;
  flex: 0 0 auto;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #B33A12;
  box-shadow: 0 0 0 2px rgba(179, 58, 18, .22);
}
@keyframes noticeNewPulse {
  0%, 100% { box-shadow: 0 6px 14px -8px rgba(255, 159, 90, .95); }
  50% { box-shadow: 0 8px 20px -7px rgba(255, 159, 90, 1), 0 0 0 3px rgba(255, 194, 77, .16); }
}
.notice-card.is-new {
  border-color: rgba(255, 194, 77, .34);
  background: linear-gradient(135deg, rgba(255, 194, 77, .07) 0%, var(--surface) 60%);
}
.notice-card.is-new.is-pin {
  background: linear-gradient(135deg, rgba(255, 194, 77, .11) 0%, rgba(76, 124, 240, .11) 55%, var(--surface) 100%);
}
/* 控制台里同样标一下，改成旧日期后这里会立刻消失 */
.notice-card__new--admin { animation: none; }

@media (prefers-reduced-motion: reduce) {
  .notice-card__new { animation: none; }
}

/* ---------- 44.3 （旧「一键查询」横幅样式已移除，改为 42.1 的 query-hub 双按钮区） ---------- */

.field__with-btn { display: flex; align-items: center; gap: 8px; }
.field__with-btn > input { flex: 1 1 auto; min-width: 0; }
.field__with-btn > .btn { flex: 0 0 auto; }

@media (max-width: 560px) {
  .notice-card__date { font-size: 9.5px; }
}

/* =========================================================
   45. 每日一题四种题型（v3.15）
   45.1 题型选择卡 / 45.2 题型徽标 / 45.3 按题型呈现的题面与答案 / 45.4 选项行圆点
   ========================================================= */

/* ---------- 45.1 控制台：题型选择 ---------- */
.qtype-picker {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 9px;
  margin-bottom: 16px;
}
.qtype-opt {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  padding: 11px 12px 10px;
  text-align: left;
  font: inherit;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
  transition: border-color .15s ease, background .15s ease, transform .15s ease;
}
.qtype-opt:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.qtype-opt b { font-size: 13.5px; font-weight: 820; color: var(--ink); letter-spacing: .01em; }
.qtype-opt__hint { font-size: 10.5px; line-height: 1.6; color: var(--ink-3); }
.qtype-opt__mark {
  position: absolute;
  top: 9px;
  right: 10px;
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: 11px;
  font-weight: 900;
  color: #0D1B2A;
  background: var(--teal-2);
  opacity: 0;
  transform: scale(.6);
  transition: opacity .15s ease, transform .15s ease;
}
.qtype-opt.is-on {
  border-color: var(--teal);
  background: linear-gradient(160deg, rgba(53, 168, 162, .14) 0%, var(--surface) 65%);
}
.qtype-opt.is-on .qtype-opt__mark { opacity: 1; transform: scale(1); }
.qtype-opt.is-on b { color: var(--teal-2); }
.qtype-opt:focus-visible { outline: 2px solid var(--teal-2); outline-offset: 2px; }

.field > span em {
  margin-left: 6px;
  font-style: normal;
  font-weight: 500;
  font-size: 11px;
  color: var(--ink-3);
}
.btn-row--tight { align-items: center; margin: 2px 0 12px; }
.btn-row--tight .field__hint { margin-left: 4px; }

/* ---------- 45.2 题型徽标（卡片 / 控制台列表通用） ---------- */
.qtype-chip {
  display: inline-flex;
  align-items: center;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .08em;
  line-height: 1.7;
  border: 1px solid transparent;
  vertical-align: 1px;
}
.qtype-chip--sm { font-size: 9.5px; padding: 0 7px; }
.qtype-chip[data-type="choice"] { color: var(--brand-ink); background: var(--brand-soft); border-color: rgba(76, 124, 240, .38); }
.qtype-chip[data-type="blank"] { color: var(--teal-2); background: var(--teal-soft); border-color: rgba(53, 168, 162, .38); }
.qtype-chip[data-type="translation"] { color: var(--violet-2); background: var(--violet-soft); border-color: rgba(139, 123, 240, .38); }
.qtype-chip[data-type="word"] { color: #E8C07A; background: rgba(232, 192, 122, .12); border-color: rgba(232, 192, 122, .35); }

/* ---------- 45.3 按题型呈现：题面 / 作答提示 / 答案 ---------- */
/* 填空题的空：一条可以「写」的横线 */
.qblank {
  display: inline-block;
  width: 4.2em;
  height: 1em;
  margin: 0 .18em;
  vertical-align: -.14em;
  border-bottom: 2px solid var(--brass-2);
  border-radius: 1px;
}
.quizcard__ask,
.quizstage__ask {
  margin: -4px 0 0;
  font-size: 11.5px;
  letter-spacing: .02em;
  color: var(--ink-3);
}
.quizcard__stem--word,
.quizstage__stem--word {
  font-family: Georgia, var(--serif);
  font-size: clamp(30px, 3.4vw, 44px);
  font-weight: 700;
  letter-spacing: .02em;
  line-height: 1.25;
}
.quizcard__stem--translation,
.quizstage__stem--translation {
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.9;
}
/* 答案区：翻译题是整句英文，用衬线体另起一行 */
.quizcard__ans-label,
.quizstage__ans-label {
  display: block;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .16em;
  color: var(--brass-2);
}
.quizcard__ans-text,
.quizstage__ans-text {
  margin: 4px 0 0;
  font-family: Georgia, var(--serif);
  font-size: 15.5px;
  line-height: 1.85;
  color: var(--ink);
}
.quizstage__ans-text { font-size: clamp(19px, 2vw, 26px); }
.quizcard__ans-note,
.quizstage__ans-note { color: var(--ink-2); }

/* ---------- 45.4 选择题选项行：圆点即正确答案 ---------- */
.quiz-opt-pick {
  flex: 0 0 16px;
  width: 16px;
  height: 16px;
  margin: 0;
  accent-color: var(--teal);
  cursor: pointer;
}
.quiz-opt-row input[type="text"] { flex: 1 1 auto; }
.quiz-opt-row.is-answer { border-color: var(--teal); background: var(--ok-soft); }
.quiz-opt-row.is-answer b { border-color: var(--teal); color: var(--teal-2); background: var(--teal-soft); }
.quiz-ansnow { color: var(--teal-2); letter-spacing: .06em; }

@media (max-width: 720px) {
  .qtype-picker { grid-template-columns: minmax(0, 1fr); }
  .quizcard__stem--word, .quizstage__stem--word { font-size: 30px; }
}

/* =========================================================
   46. 每日常规：两大部分（v4.4）
   ---------------------------------------------------------
   一 学情表现：听写 / 背诵 → 过关 + 抄写（每组一列，上下串联）
   二 常规表现：任务督检 / 课堂纪律（各一张座次表）+ 违纪汇总
   两部分用同一套骨架：编号 → 标题 → 说明 → 组卡片 → 底部汇总行，
   左右对称、上下同构，扫一眼就知道哪一项归属哪一部分。
   ========================================================= */

.daily__part {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 13px 11px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background:
    linear-gradient(180deg, rgba(76, 124, 240, .075), rgba(76, 124, 240, 0) 58%),
    var(--surface);
}
.daily__part[data-part="2"] {
  background:
    linear-gradient(180deg, rgba(127, 166, 200, .085), rgba(127, 166, 200, 0) 58%),
    var(--surface);
}

.daily__parthead { display: flex; align-items: flex-start; gap: 9px; }
.daily__partno {
  flex: 0 0 24px;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 900;
  background: #1A2743;
  border: 1px solid #2B4573;
  color: #9FBBFA;
}
.daily__part[data-part="2"] .daily__partno {
  background: #1B2836;
  border-color: #2C3E4E;
  color: #A6C6DF;
}
.daily__parttitle { min-width: 0; }
.daily__parttitle h3 {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: .02em;
  line-height: 1.2;
}
.daily__parttitle p {
  margin-top: 2px;
  font-size: 10.5px;
  line-height: 1.5;
  color: var(--ink-3);
}
.daily__parttag {
  margin-left: auto;
  flex: 0 0 auto;
  align-self: center;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .06em;
  color: var(--ink-3);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 8px;
  white-space: nowrap;
}

/* 两组并排：每组一列，组内「过关 → 抄写」上下串联 */
.part-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}
.part-col {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, .05);
  background: rgba(255, 255, 255, .016);
}
.part-col__head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: .1em;
  color: var(--ink-2);
  padding: 0 2px 1px;
}
.part-col__dot {
  width: 7px;
  height: 7px;
  border-radius: 2px;
  background: var(--brand);
}
.part-col__dot[data-tone="d"] { background: #5B8CF5; }
.part-col__dot[data-tone="r"] { background: #8B7BF0; }
.part-col__dot[data-tone="hw"] { background: #2FB3A8; }
.part-col__dot[data-tone="dc"] { background: #DC5C74; }

/* 过关 → 抄写 的因果关系：一条竖线 + 箭头 + 一句说明 */
.part-col__link {
  position: relative;
  margin: -1px 0 -1px 20px;
  padding-left: 15px;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .02em;
  line-height: 1.45;
  color: var(--ink-3);
}
.part-col__link::before {
  content: '';
  position: absolute;
  left: 4px;
  top: -2px;
  bottom: -1px;
  width: 1px;
  background: linear-gradient(180deg, rgba(127, 166, 200, .5), rgba(127, 166, 200, .1));
}
.part-col__link::after {
  content: '▾';
  position: absolute;
  left: 0;
  bottom: -2px;
  font-size: 8px;
  line-height: 1;
  color: var(--brass-2);
}

/* 组内小计：这一组累计了多少、累计多少违纪（让两组卡片高度接近，信息也不空） */
.part-col__stat {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 1px;
  padding: 6px 9px;
  border-radius: 9px;
  border: 1px dashed var(--line);
  background: rgba(255, 255, 255, .024);
  font-size: 10px;
  font-weight: 650;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.part-col__stat b { margin: 0 1px; font-size: 12.5px; font-weight: 800; color: var(--ink-2); }
.part-col__stat-n { margin-left: auto; color: #F0A9B6; }
.part-col__stat-n b { color: #F6B4C0; }

/* 底部汇总行：与上方组卡片用虚线分隔，表示「由上面这些汇总而来」 */.part-sum {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 11px;
  border: 1px dashed var(--line-strong);
  border-radius: 11px;
  background: rgba(255, 255, 255, .02);
  color: inherit;
  text-decoration: none;
  cursor: pointer;
  transition: border-color .16s, background .16s, border-style .16s;
}
.part-sum:hover {
  border-style: solid;
  border-color: #2E4750;
  background: var(--surface-2);
}
.part-sum__icon {
  flex: 0 0 26px;
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: #122A26;
  border: 1px solid #23514A;
  color: #86D6C4;
}
.part-sum__icon svg { width: 15px; height: 15px; }
.part-sum__body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.part-sum__body b { font-size: 12.5px; font-weight: 780; letter-spacing: -.005em; }
.part-sum__body span {
  font-size: 10px;
  color: var(--ink-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.part-sum__tail { margin-left: auto; display: flex; align-items: center; gap: 7px; flex: 0 0 auto; }
.part-sum__tag {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .1em;
  color: var(--ink-3);
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  padding: 1px 5px;
}
.part-sum__num {
  font-size: 10.5px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: #86D6C4;
  background: rgba(62, 154, 134, .13);
  border: 1px solid rgba(62, 154, 134, .3);
  border-radius: 999px;
  padding: 2px 8px;
  white-space: nowrap;
}
.part-sum[data-tone="reg"] .part-sum__icon {
  background: #2A1620;
  border-color: #5A2C3C;
  color: #F0A0AF;
}
.part-sum[data-tone="reg"] .part-sum__num[data-tone="warn"] {
  color: #F6B4C0;
  background: rgba(220, 92, 116, .14);
  border-color: rgba(220, 92, 116, .32);
}

/* 常规表现两个入口的图标底色 */
.entry[data-accent="hwcheck"] .entry__icon { background: #102A28; border-color: #23514A; color: #7FDCC9; }
.entry[data-accent="discipline"] .entry__icon { background: #2A1620; border-color: #5A2C3C; color: #F0A0AF; }
.entry[data-accent="regstat"] .entry__icon { background: #172635; border-color: #2C3E4E; color: #A6C6DF; }

/* =========================================================
   47. 任务督检 / 课堂纪律 / 常规违纪统计（页面）
   ========================================================= */
.mstat--bad b { color: #F08CA0; }

.banner--reg {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: #182741;
  border-color: #1C2D4A;
  color: var(--brand-ink);
  line-height: 1.6;
}
.banner--reg[data-kind="discipline"] { background: #2A1620; border-color: #4A2431; color: #F6C4CD; }
.banner--reg b { color: #FFFFFF; }
.banner--reg .banner__icon {
  flex: 0 0 20px;
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
  border-radius: 6px;
  background: rgba(255, 255, 255, .12);
  font-size: 12px;
  font-weight: 900;
}
.banner--reg .banner__note {
  margin-left: auto;
  font-size: 10.5px;
  color: var(--ink-3);
  white-space: nowrap;
}

.reg-view { display: flex; flex-direction: column; gap: 12px; }
.reg-body {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(190px, 242px) minmax(0, 1fr);
  gap: 12px;
  align-items: stretch;
}

/* 左：已发布记录的列表（最新在上） */
.reg-side {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  min-width: 0;
}
.reg-side__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 1px 2px 7px;
  border-bottom: 1px solid var(--line);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .1em;
  color: var(--ink-3);
}
.reg-side__add {
  border: none;
  background: transparent;
  color: var(--brand-ink);
  font: inherit;
  font-size: 10.5px;
  font-weight: 750;
  letter-spacing: 0;
  padding: 2px 6px;
  border-radius: 6px;
  cursor: pointer;
}
.reg-side__add:hover { background: var(--brand-soft); }
.reg-side__list { display: flex; flex-direction: column; gap: 6px; max-height: 520px; overflow: auto; }
.reg-item {
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: inherit;
  font-family: inherit;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.reg-item:hover { border-color: var(--line-strong); }
.reg-item.is-active {
  border-color: #2B4573;
  background: linear-gradient(180deg, #182741, #14203A);
  box-shadow: inset 2px 0 0 var(--brand);
}
.reg-item__name {
  font-size: 12px;
  font-weight: 780;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.reg-item__meta { font-size: 10px; color: var(--ink-3); }
.reg-item__meta b { color: #F0A9B6; font-weight: 800; }
.reg-item__meta i { color: #7FD3A9; font-style: normal; font-weight: 700; }
.reg-side__hint {
  font-size: 10px;
  line-height: 1.65;
  color: var(--ink-3);
  padding: 7px 2px 0;
  border-top: 1px dashed var(--line);
}

/* 右：当前记录的座次表 */
.reg-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.reg-taskhead {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.reg-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.reg-meta__name { font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; }
.reg-meta__pill {
  font-size: 10.5px;
  font-weight: 650;
  color: var(--ink-2);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 8px;
}
.reg-meta__hint { font-size: 10.5px; color: var(--ink-3); margin-left: auto; }
.reg-bar { height: 5px; border-radius: 999px; background: #22303F; overflow: hidden; }
.reg-bar i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #35A8A2, #57C08C);
  transition: width .25s cubic-bezier(.22, .8, .3, 1);
}

.stage--reg { padding: 14px 14px 12px; gap: 10px; min-height: 340px; }
.stage--reg .seat-column { grid-auto-rows: minmax(52px, auto); }
.stage--reg .seat-group { min-width: 88px; }

.reg-legend {
  display: flex;
  align-items: center;
  gap: 13px;
  flex-wrap: wrap;
  padding-top: 9px;
  border-top: 1px solid var(--line);
  font-size: 10.5px;
  font-weight: 650;
  color: var(--ink-3);
}
.reg-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  margin-right: 5px;
  vertical-align: -1px;
  border: 1px solid rgba(255, 255, 255, .22);
}
.reg-dot[data-tone="ok"] { background: #26784F; }
.reg-dot[data-tone="miss"] { background: #A5384B; }
.reg-dot[data-tone="d0"] { background: #DCE6F0; }
.reg-dot[data-tone="d1"] { background: #F6C7CE; }
.reg-dot[data-tone="d2"] { background: #EDA0AB; }
.reg-dot[data-tone="d3"] { background: #DD6C7D; }
.reg-dot[data-tone="d4"] { background: #BE4A5D; }
.reg-dot[data-tone="d5"] { background: #96303F; }
.reg-legend__hint { color: var(--ink-3); }
.reg-undo { margin-left: auto; }

.reg-emptybox {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 46px 20px;
  border: 1px dashed var(--line-strong);
  border-radius: 16px;
  background: rgba(255, 255, 255, .015);
}
.reg-emptybox b { font-size: 14px; font-weight: 780; }
.reg-emptybox p { font-size: 11.5px; line-height: 1.7; color: var(--ink-3); max-width: 460px; }
.reg-empty { font-size: 11.5px; line-height: 1.7; color: var(--ink-3); padding: 6px 2px; }
.reg-empty--side { padding: 10px 4px; }

/* 座次表：作业未交（玫红，与「已交=绿」区分） */
.seat--miss {
  background: #A5384B;
  color: #FFEDF0;
  box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .2), 0 8px 18px -12px rgba(3, 7, 13, .7);
}
.seat--miss .seat__status { opacity: .92; }
.seat--miss::after {
  content: '';
  position: absolute;
  top: 5px;
  right: 5px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: .6;
}

/* 座次表：课堂纪律（守纪=浅色，违纪越多越深） */
.seat--disc {
  background: #DCE6F0;
  color: #1B2A38;
  box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .62), 0 6px 14px -12px rgba(3, 7, 13, .85);
}
.seat--disc .seat__status { opacity: .72; letter-spacing: .02em; }
.seat--disc[data-lv="1"] { background: #F6C7CE; color: #4A141F; }
.seat--disc[data-lv="2"] { background: #EDA0AB; color: #3E0F19; }
.seat--disc[data-lv="3"] { background: #DD6C7D; color: #FFF4F6; }
.seat--disc[data-lv="4"] { background: #BE4A5D; color: #FFF4F6; }
.seat--disc[data-lv="5"] { background: #96303F; color: #FFEAEE; }
.seat--disc[data-lv="3"] .seat__status,
.seat--disc[data-lv="4"] .seat__status,
.seat--disc[data-lv="5"] .seat__status { opacity: .84; }
.seat__count {
  position: absolute;
  top: -6px;
  right: -6px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  background: #0E1621;
  border: 1px solid rgba(255, 255, 255, .3);
  color: #FFD9DF;
  font-size: 11px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  box-shadow: 0 4px 10px -4px rgba(3, 7, 13, .9);
}

/* 项目级汇总面板 */
.reg-panel {
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
}
.reg-panel--sum { border-style: solid; }
.reg-panel__head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 9px;
}
.reg-panel__title { font-size: 13px; font-weight: 800; letter-spacing: -.005em; }
.reg-panel__desc { font-size: 10.5px; color: var(--ink-3); }
.reg-panel__count {
  margin-left: auto;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.reg-panel__count b { font-size: 13px; color: #F0A9B6; }
.reg-panel__foot {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed var(--line);
  font-size: 10px;
  color: var(--ink-3);
}
.reg-rows { display: flex; flex-direction: column; gap: 4px; }
.reg-row {
  display: grid;
  grid-template-columns: 24px minmax(54px, 84px) minmax(0, 1fr) 44px;
  align-items: center;
  gap: 10px;
  padding: 6px 9px;
  border-radius: 9px;
  background: var(--surface-2);
  border: 1px solid transparent;
}
.reg-row:hover { border-color: var(--line-strong); }
.reg-row__idx { font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.reg-row__name { font-size: 12.5px; font-weight: 760; }
.reg-row__bar { height: 6px; border-radius: 999px; background: #22303F; overflow: hidden; }
.reg-row__bar i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #F08CA0, #C4485C);
}
.reg-row__n {
  font-size: 11.5px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: #F0A9B6;
  text-align: right;
}
.reg-row__tags {
  grid-column: 2 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 1px;
}
.reg-tag {
  font-style: normal;
  font-size: 9.5px;
  font-weight: 650;
  line-height: 1.5;
  padding: 0 6px;
  border-radius: 5px;
  color: #F0A9B6;
  background: rgba(220, 92, 116, .12);
  border: 1px solid rgba(220, 92, 116, .24);
  white-space: nowrap;
}
.reg-tag[data-kind="hwcheck"] {
  color: #8FDCCB;
  background: rgba(47, 179, 168, .12);
  border-color: rgba(47, 179, 168, .26);
}

/* 常规违纪统计：三张概览卡 + 明细表 */
.reg-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.reg-card {
  --acc: var(--brand);
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 12px 14px 11px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: inherit;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
  transition: border-color .16s, background .16s;
}
.reg-card::before {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: var(--acc);
}
.reg-card[data-kind="hwcheck"] { --acc: #2FB3A8; }
.reg-card[data-kind="discipline"] { --acc: #DC5C74; }
.reg-card--sum { --acc: #C9628A; cursor: default; }
.reg-card:hover { border-color: var(--line-strong); background: var(--surface-2); }
.reg-card__en { font-size: 9px; font-weight: 800; letter-spacing: .2em; color: var(--ink-3); }
.reg-card b { font-size: 15px; font-weight: 800; }
.reg-card__nums { font-size: 11.5px; color: var(--ink-2); }
.reg-card__nums b { font-size: 13.5px; font-variant-numeric: tabular-nums; }
.reg-card__nums em { font-style: normal; font-weight: 800; color: #F0A9B6; }
.reg-card__go { margin-top: 2px; font-size: 10.5px; color: var(--ink-3); }

.reg-tablewrap {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
}
.reg-table { width: 100%; min-width: 760px; border-collapse: collapse; }
.reg-table th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--surface-2);
  white-space: nowrap;
}
.reg-table td { border-bottom: 1px solid var(--line); vertical-align: top; }
.reg-table tr:last-child td { border-bottom: 0; }
.reg-table tr.is-clean { opacity: .62; }
.reg-td-idx { font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; width: 38px; }
.reg-td-name b { font-size: 12.5px; color: var(--ink); }
.reg-td-n { width: 92px; }
.reg-n {
  display: inline-grid;
  place-items: center;
  min-width: 24px;
  padding: 1px 7px;
  border-radius: 7px;
  font-size: 11.5px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.reg-n--hw { color: #8FDCCB; background: rgba(47, 179, 168, .14); border: 1px solid rgba(47, 179, 168, .28); }
.reg-n--disc { color: #F6B4C0; background: rgba(220, 92, 116, .14); border: 1px solid rgba(220, 92, 116, .3); }
.reg-zero { color: var(--ink-3); font-size: 11.5px; }
.reg-td-total { width: 112px; white-space: nowrap; }
.reg-total { display: inline-flex; align-items: center; gap: 6px; width: 84px; }
.reg-total b { flex: 0 0 auto; min-width: 14px; font-size: 13.5px; font-weight: 850; color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; }
.reg-total__bar {
  flex: 1 1 auto;
  height: 5px;
  border-radius: 999px;
  background: #22303F;
  overflow: hidden;
}
.reg-total__bar i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #F08CA0, #C4485C);
}
.reg-total__u { font-size: 10px; color: var(--ink-3); margin-left: 2px; }
.reg-td-detail { min-width: 220px; }
.reg-td-detail .reg-tag { display: inline-block; margin: 1px 3px 1px 0; }

/* 响应式 */
@media (max-width: 1200px) {
  .reg-body { grid-template-columns: minmax(176px, 214px) minmax(0, 1fr); }
  .reg-meta__hint { width: 100%; margin-left: 0; }
}
@media (max-width: 1080px) {
  .reg-body { grid-template-columns: minmax(0, 1fr); }
  .reg-side { order: 2; }
  .reg-main { order: 1; }
  .reg-side__list { flex-direction: row; flex-wrap: wrap; max-height: none; }
  .reg-item { flex: 1 1 44%; min-width: 44%; }
  .reg-side__hint { width: 100%; }
}
@media (max-width: 860px) {
  .reg-cards { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .reg-card { padding: 10px 12px; }
}
@media (max-width: 720px) {
  .part-grid { grid-template-columns: minmax(0, 1fr); }
  .daily__part { padding: 10px 10px 9px; }
  .daily__parttag { display: none; }
  .part-sum__body span { white-space: normal; }
  .seat--disc { border-radius: 12px; }
  .seat__count { min-width: 17px; height: 17px; font-size: 10px; top: -5px; right: -5px; }
}
@media (max-width: 560px) {
  .reg-cards { grid-template-columns: minmax(0, 1fr); }
  .reg-row { grid-template-columns: 20px minmax(48px, 68px) minmax(0, 1fr) 38px; gap: 7px; }
  .reg-panel { padding: 10px 11px; }
  .banner--reg .banner__note { margin-left: 0; white-space: normal; width: 100%; }
  .part-sum__num { font-size: 10px; padding: 2px 6px; }
}

/* =========================================================
   46. 顶部三栏仪表盘 + 视觉精修（v6）
   46.1 骨架与通用面板 / 46.2 待办查询 / 46.3 随机提问
   46.4 公告栏（侧栏版）/ 46.5 全局质感微调 / 46.6 响应式
   —— 三栏等高：查询、抽签、公告同处一排，信息密度与视线路径都更顺
   ========================================================= */

/* ---------- 46.1 骨架与通用面板 ---------- */
.cockpit {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.02fr) minmax(0, 1.14fr);
  gap: clamp(12px, 1.3vw, 18px);
  align-items: stretch;
}

.panel {
  --panel-accent: var(--brass-2);
  --panel-glow: rgba(127, 166, 200, .12);
  --panel-line: rgba(127, 166, 200, .40);
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 14px 15px 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background:
    radial-gradient(125% 85% at 10% -22%, var(--panel-glow), transparent 62%),
    linear-gradient(180deg, #1B2837 0%, #16212E 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 22px 42px -36px rgba(0, 0, 0, .95);
  overflow: hidden;
}
/* 顶部一根极细的彩线：三块面板靠它一眼区分职能 */
.panel::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 4%, var(--panel-line) 32%, var(--panel-line) 68%, transparent 96%);
}
.panel--query  { --panel-accent: #6E9BFA; --panel-glow: rgba(76, 124, 240, .15); --panel-line: rgba(110, 155, 250, .48); }
.panel--pick   { --panel-accent: #F0B45F; --panel-glow: rgba(240, 180, 95, .13); --panel-line: rgba(240, 180, 95, .44); }
.panel--notice { --panel-accent: #5FCBC4; --panel-glow: rgba(53, 168, 162, .12); --panel-line: rgba(95, 203, 196, .40); }

.panel__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 11px;
}
.panel__headmain { min-width: 0; }
.panel__eyebrow {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .24em;
  line-height: 1;
  color: var(--panel-accent);
  white-space: nowrap;
}
.panel__eyebrow::before {
  content: "";
  width: 12px;
  height: 1px;
  background: currentColor;
  opacity: .75;
}
.panel__title {
  margin-top: 5px;
  font-family: var(--serif);
  font-size: 17.5px;
  font-weight: 650;
  letter-spacing: .012em;
  line-height: 1.22;
  color: var(--ink);
}
.panel__chip {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  max-width: 60%;
  padding: 3px 9px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: rgba(7, 12, 19, .42);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .02em;
  line-height: 1.6;
  color: var(--ink-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}
.panel__chip b { font-weight: 850; color: var(--ink); }
.panel__chip.is-warn { color: #F6B4C0; border-color: rgba(220, 92, 116, .34); background: rgba(220, 92, 116, .12); }
.panel__chip.is-warn b { color: #FFC4CF; }
.panel__chip.is-ok { color: #9DE3C2; border-color: rgba(87, 192, 140, .32); background: rgba(87, 192, 140, .12); }
.panel__foot {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--line);
  font-size: 10.5px;
  line-height: 1.6;
  color: var(--ink-3);
}

/* ---------- 46.2 待办查询 ---------- */
.query-tiles {
  flex: 1 1 auto;
  display: grid;
  grid-template-rows: repeat(2, minmax(58px, 1fr));
  gap: 9px;
}
.query-tile {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 13px;
  border: 1px solid transparent;
  border-radius: 12px;
  font: inherit;
  text-align: left;
  color: #F2F7FF;
  cursor: pointer;
  overflow: hidden;
  transition: transform .16s ease, filter .18s ease, box-shadow .22s ease;
}
/* 右上角一层极浅的柔光，让色块不是死板的一片（不要做成硬边三角） */
.query-tile::after {
  content: "";
  position: absolute;
  top: -70%;
  right: -18%;
  width: 150px;
  height: 240%;
  background: radial-gradient(closest-side, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 72%);
  pointer-events: none;
}
.query-tile:hover { transform: translateY(-1px); filter: brightness(1.05); }
.query-tile:active { transform: translateY(0); }
.query-tile--me {
  background: linear-gradient(135deg, #2C519F 0%, #3E6FD8 52%, #5487F4 100%);
  border-color: rgba(150, 182, 255, .42);
  box-shadow: 0 16px 30px -24px rgba(62, 111, 216, .95), inset 0 1px 0 rgba(255, 255, 255, .22);
}
.query-tile--all {
  background: linear-gradient(135deg, #1E6455 0%, #2F8A74 52%, #46AB94 100%);
  border-color: rgba(130, 212, 190, .38);
  box-shadow: 0 16px 30px -24px rgba(47, 138, 116, .95), inset 0 1px 0 rgba(255, 255, 255, .2);
}
.query-tile__ico {
  position: relative;
  z-index: 1;
  flex: 0 0 30px;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: rgba(255, 255, 255, .14);
  border: 1px solid rgba(255, 255, 255, .20);
}
.query-tile__ico svg { width: 16px; height: 16px; }
.query-tile__body {
  position: relative;
  z-index: 1;
  min-width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.query-tile__body b {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: .02em;
  line-height: 1.1;
  white-space: nowrap;
}
.query-tile__body small {
  font-size: 10.5px;
  line-height: 1.35;
  opacity: .76;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.query-tile__go {
  position: relative;
  z-index: 1;
  margin-left: auto;
  font-size: 14px;
  line-height: 1;
  opacity: .55;
  transition: transform .18s ease, opacity .18s ease;
}
.query-tile:hover .query-tile__go { transform: translateX(2px); opacity: .9; }

/* ---------- 46.3 随机提问 ---------- */
.picker__stage {
  position: relative;
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 128px;
  margin-bottom: 10px;
  padding: 14px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  background:
    radial-gradient(85% 120% at 50% 128%, rgba(240, 180, 95, .13), transparent 62%),
    radial-gradient(95% 100% at 50% -35%, rgba(240, 180, 95, .10), transparent 58%),
    #101A25;
  box-shadow: inset 0 0 24px rgba(0, 0, 0, .5);
  overflow: hidden;
  isolation: isolate;
}
/* 抽签筒的上下虚线口 */
.picker__stage::before,
.picker__stage::after {
  content: "";
  position: absolute;
  left: 13px;
  right: 13px;
  height: 1px;
  background: repeating-linear-gradient(90deg, rgba(240, 180, 95, .40) 0 6px, transparent 6px 12px);
}
.picker__stage::before { top: 9px; }
.picker__stage::after { bottom: 9px; }

.picker__ring {
  position: absolute;
  inset: -32%;
  z-index: -1;
  background: conic-gradient(from 0deg, transparent 0 60%, rgba(240, 180, 95, .26) 72%, transparent 85%);
  opacity: 0;
  transition: opacity .3s ease;
  animation: pickSpin 1.1s linear infinite;
}
@keyframes pickSpin { to { transform: rotate(360deg); } }
.picker__stage.is-rolling .picker__ring { opacity: 1; }

.picker__reel {
  position: relative;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.picker__name {
  max-width: 100%;
  font-family: var(--serif);
  font-size: clamp(24px, 2.5vw, 33px);
  font-weight: 700;
  letter-spacing: .10em;
  line-height: 1.16;
  text-align: center;
  color: #FBE6C6;
  text-shadow: 0 0 28px rgba(240, 180, 95, .32), 0 2px 0 rgba(0, 0, 0, .4);
  overflow-wrap: anywhere;
  transform-origin: 50% 62%;
}
.picker__seat {
  font-size: 10.5px;
  letter-spacing: .08em;
  line-height: 1.5;
  text-align: center;
  color: var(--ink-3);
}
/* 一次抽多位时：名字排成 2 列，每个名字下面挂一行座位 */
.picker__names {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: center;
  gap: 4px 12px;
}
.picker__names.is-multi {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: center;
  gap: 8px 8px;
}
.picker__names.is-multi .picker__name {
  font-size: clamp(17px, 1.75vw, 22px);
  letter-spacing: .05em;
  line-height: 1.2;
}
.picker__names.is-quad .picker__name { font-size: clamp(16px, 1.55vw, 20px); }
.picker__slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 0;
  max-width: 100%;
}
.picker__seat--mini {
  font-size: 9.5px;
  letter-spacing: .02em;
  line-height: 1.35;
  white-space: nowrap;
  opacity: .85;
}
.picker__stage.is-rolling .picker__seat--mini { opacity: 0; }
/* 一次抽多人时，「抽中」印章会压到右上角的名字，直接收起来 */
.picker__stage.is-group .picker__stamp { display: none; }

/* 抽取人数：1 / 2 / 3 / 4 人 */
.picker__counts {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.picker__counts__label {
  flex: 0 0 auto;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .16em;
  color: var(--ink-3);
}
.picker__count {
  flex: 1 1 0;
  min-width: 0;
  height: 27px;
  padding: 0 4px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: rgba(255, 255, 255, .03);
  font: inherit;
  font-size: 11px;
  font-weight: 750;
  letter-spacing: .02em;
  color: var(--ink-2);
  white-space: nowrap;
  cursor: pointer;
  transition: color .16s ease, border-color .16s ease, background .16s ease;
}
.picker__count:hover { color: var(--ink); border-color: var(--ink-3); }
.picker__count.is-on {
  color: #2A1B08;
  border-color: rgba(240, 180, 95, .62);
  background: linear-gradient(135deg, #FBD08A 0%, #F0B45F 55%, #E29A45 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45);
}
.picker__stage.is-rolling .picker__name { animation: pickTumble .15s linear infinite; }
@keyframes pickTumble {
  0% { transform: translateY(-5px); opacity: .74; }
  50% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(5px); opacity: .88; }
}
.picker__stage.is-hit .picker__name { animation: pickLand .46s cubic-bezier(.2, 1.45, .4, 1); }
@keyframes pickLand {
  0% { transform: scale(1.24) rotate(-1.4deg); opacity: .35; }
  62% { transform: scale(.975) rotate(.4deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); }
}
.picker__stamp {
  position: absolute;
  top: 8px;
  right: 10px;
  padding: 2px 7px;
  border: 2px solid rgba(240, 180, 95, .66);
  border-radius: 5px;
  font-size: 9.5px;
  font-weight: 900;
  letter-spacing: .20em;
  line-height: 1.5;
  color: #F6C078;
  opacity: 0;
  transform: rotate(-8deg) scale(.5);
  transition: opacity .16s ease, transform .3s cubic-bezier(.2, 1.7, .4, 1);
  pointer-events: none;
}
.picker__stage.is-hit .picker__stamp { opacity: .94; transform: rotate(-8deg) scale(1); }

.picker__acts { display: flex; gap: 8px; }
.picker__btn {
  flex: 1 1 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 42px;
  padding: 0 14px;
  border: 1px solid rgba(255, 214, 150, .55);
  border-radius: 12px;
  font: inherit;
  font-size: 14px;
  font-weight: 850;
  letter-spacing: .06em;
  color: #2A1B08;
  background: linear-gradient(135deg, #FBD08A 0%, #F0B45F 48%, #E29A45 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 14px 26px -18px rgba(240, 180, 95, .95);
  cursor: pointer;
  transition: transform .14s ease, filter .16s ease, box-shadow .2s ease;
}
.picker__btn svg { width: 16px; height: 16px; }
.picker__btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
.picker__btn:active { transform: translateY(0) scale(.995); box-shadow: inset 0 2px 6px rgba(120, 70, 10, .28); }
.picker__btn:disabled {
  cursor: not-allowed;
  filter: grayscale(.55) brightness(.78);
  box-shadow: none;
  transform: none;
}
.picker__mode {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 42px;
  padding: 0 11px;
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  background: rgba(255, 255, 255, .04);
  font: inherit;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .03em;
  color: var(--ink-2);
  white-space: nowrap;
  cursor: pointer;
  transition: color .16s ease, border-color .16s ease, background .16s ease;
}
.picker__mode::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--line-strong);
  transition: background .16s ease, box-shadow .16s ease;
}
.picker__mode:hover { color: var(--ink); border-color: var(--ink-3); }
.picker__mode[aria-pressed="true"] {
  color: #FBE6C6;
  border-color: rgba(240, 180, 95, .5);
  background: rgba(240, 180, 95, .14);
}
.picker__mode[aria-pressed="true"]::before {
  background: #F0B45F;
  box-shadow: 0 0 0 3px rgba(240, 180, 95, .18);
}

.picker__hist {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  margin-top: 9px;
  min-height: 20px;
  font-size: 10.5px;
}
.picker__hist i {
  font-style: normal;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .18em;
  color: var(--ink-3);
}
.picker__hist em { font-style: normal; color: var(--ink-3); }
.picker__hist span {
  padding: 1px 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, .03);
  color: var(--ink-2);
  white-space: nowrap;
}
.picker__hist span:first-of-type {
  color: #FBE6C6;
  border-color: rgba(240, 180, 95, .42);
  background: rgba(240, 180, 95, .12);
}

/* ---------- 46.4 公告栏（侧栏版） ---------- */
.notice--rail { padding: 14px 15px 13px; }
.notice--rail .notice__list {
  flex: 1 1 auto;
  min-height: 0;
  max-height: 212px;
  overflow: auto;
  grid-template-columns: minmax(0, 1fr);
  gap: 7px;
  padding-right: 3px;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
  overscroll-behavior: contain;
}
.notice--rail .notice__list::-webkit-scrollbar { width: 6px; }
.notice--rail .notice__list::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; }
.notice--rail .notice-card { padding: 8px 10px; border-radius: 10px; }
.notice--rail .notice-card__top { gap: 4px 7px; }
.notice--rail .notice-card__title { flex: 1 1 auto; font-size: 13px; line-height: 1.45; }
.notice--rail .notice-card__pin { font-size: 9px; padding: 0 5px; }
.notice--rail .notice-card__date { font-size: 9.5px; padding: 0 5px; }
.notice--rail .notice-card__new { font-size: 8.5px; padding: 1px 7px 1px 5px; letter-spacing: .06em; }
.notice--rail .notice-card__text {
  margin-top: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 11.5px;
  line-height: 1.65;
}
.notice--rail .notice-card__files { margin-top: 6px; gap: 5px; }
.notice--rail .notice-file { padding: 3px 7px 3px 4px; font-size: 10.5px; }
.notice--rail .notice-file__name { max-width: 128px; }
.notice--rail .notice__empty {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 16px 14px;
  text-align: center;
}
.notice--rail .notice__empty-ico {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  border: 1px dashed var(--line-strong);
  color: var(--panel-accent);
  background: rgba(53, 168, 162, .08);
}
.notice--rail .notice__empty-ico svg { width: 18px; height: 18px; }
.notice--rail .notice__empty b { font-size: 12.5px; font-weight: 750; color: var(--ink-2); }
.notice--rail .notice__empty p { font-size: 11px; line-height: 1.7; color: var(--ink-3); max-width: 26em; }
/* 列表底部渐隐：只有真的溢出时才加（由 JS 判断后打 .is-scroll） */
.notice--rail .notice__list.is-scroll {
  mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - 16px), transparent 100%);
  -webkit-mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - 16px), transparent 100%);
}
.notice--rail .notice__foot {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px dashed var(--line);
}
.notice--rail .notice__foot .btn { flex: 0 1 auto; }
.notice--rail .notice__foot .btn + .btn { margin-left: auto; }

/* ---------- 46.5 全局质感微调 ---------- */
/* 报头要点：4 条改 2×2，避免第 4 条单独挤在第三列下方 */
.masthead__points { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
/* 区块标题左侧加一道渐隐竖线，视线有起点 */
.sec-head { position: relative; padding-left: 12px; }
.sec-head::before {
  content: "";
  position: absolute;
  left: 0;
  top: 3px;
  bottom: 10px;
  width: 2px;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--brand-2), rgba(76, 124, 240, 0));
}
/* 入口卡片 hover：图标跟着亮一下，和左侧色块呼应 */
.entry:hover .entry__icon {
  color: var(--brand-ink);
  border-color: rgba(110, 155, 250, .45);
  background: var(--brand-soft);
}
/* 入口卡片底色比纯 surface 略亮一点，网格更有层次 */
.entry { background: linear-gradient(180deg, #1A2634 0%, #17222F 100%); }
/* 每日一题卡：默认拉伸到与左侧报头等高，下半部留白用一枚极淡的「题」字压住，
   像真试卷的留白，而不是空着的方块（窄屏内容会变长，故只在宽屏出现） */
@media (min-width: 1101px) {
  .masthead__quiz .quizcard { overflow: hidden; }
  .masthead__quiz .quizcard::after {
    content: "题";
    position: absolute;
    right: 22px;
    bottom: 48px;
    font-family: var(--serif);
    font-size: 112px;
    font-weight: 700;
    line-height: .78;
    color: rgba(195, 216, 255, .05);
    pointer-events: none;
  }
}

/* ---------- 46.6 响应式 ---------- */
@media (max-width: 1180px) {
  .cockpit { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .cockpit .panel--notice { grid-column: 1 / -1; }
  .cockpit .notice--rail .notice__list {
    max-height: none;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .cockpit .notice--rail .notice-card__text { -webkit-line-clamp: 3; }
}
@media (max-width: 820px) {
  .cockpit { grid-template-columns: minmax(0, 1fr); }
  .cockpit .panel--notice { grid-column: auto; }
  .cockpit .notice--rail .notice__list {
    max-height: 268px;
    grid-template-columns: minmax(0, 1fr);
  }
  .picker__stage { min-height: 120px; }
}
@media (max-width: 560px) {
  .panel { padding: 12px 12px 11px; }
  .panel__title { font-size: 16px; }
  .panel__chip { max-width: 54%; font-size: 9.5px; padding: 2px 7px; }
  .query-tile { padding: 9px 11px; gap: 9px; }
  .query-tile__body b { font-size: 13px; }
  .query-tile__body small { font-size: 10px; }
  .query-tile__ico { flex: 0 0 27px; width: 27px; height: 27px; }
  .picker__name { font-size: 26px; letter-spacing: .08em; }
  .picker__btn { font-size: 13.5px; height: 40px; }
  .picker__mode { height: 40px; font-size: 10.5px; padding: 0 9px; }
  .masthead__points { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .picker__stage.is-rolling .picker__name { animation: none; }
  .picker__ring { animation: none; }
  .picker__stage.is-hit .picker__name { animation: none; }
  .query-tile:hover, .query-tile:hover .query-tile__go { transform: none; }
}

/* ---------- 34. 课前早读条（独立于每日常规） ---------- */
.preclass {
  display: grid;
  grid-template-columns: minmax(0, 1.02fr) minmax(0, 1.32fr);
  align-items: center;
  gap: clamp(14px, 2vw, 28px);
  margin-bottom: var(--gap-row);
  padding: 14px clamp(14px, 1.6vw, 22px);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background:
    radial-gradient(120% 170% at 0% 0%, rgba(53, 168, 162, .13), transparent 62%),
    linear-gradient(180deg, #17232F 0%, #15202C 100%);
  position: relative;
  overflow: hidden;
}
.preclass::before {
  content: "";
  position: absolute;
  left: 0;
  top: 14px;
  bottom: 14px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: linear-gradient(180deg, var(--teal-2), rgba(95, 203, 196, 0));
}
.preclass__intro { min-width: 0; padding-left: 10px; }
.preclass__en {
  display: block;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .22em;
  color: var(--teal-2);
}
.preclass__title {
  margin: 5px 0 0;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: .02em;
  color: var(--ink);
}
.preclass__desc {
  margin: 5px 0 0;
  font-size: 11.5px;
  line-height: 1.72;
  color: var(--ink-3);
}
.preclass__body { min-width: 0; }
.preclass .entries--lesson { gap: 0; }
@media (max-width: 900px) {
  .preclass { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 12px 14px; }
  .preclass__intro { padding-left: 8px; }
}

/* ---------- 35. 编辑会话条（管理员 / 组长登录后显示） ---------- */
.editbar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 0;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface-2);
}
.editbar__ico {
  flex: 0 0 30px;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--surface-3);
  color: var(--ink-3);
  font-size: 15px;
  line-height: 1;
}
.editbar__text { min-width: 0; flex: 1 1 240px; }
.editbar__text b {
  display: block;
  font-size: 12.5px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: .01em;
}
.editbar__text span {
  display: block;
  margin-top: 2px;
  font-size: 11px;
  line-height: 1.65;
  color: var(--ink-3);
}
.editbar__acts {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.editbar__timer {
  font-variant-numeric: tabular-nums;
  font-weight: 850;
  color: #F0B45F;
  letter-spacing: .04em;
}
.editbar[data-state="locked"] { border-style: dashed; border-color: var(--line-strong); }
.editbar[data-state="locked"] .editbar__ico { color: #A9BAD0; }
.editbar[data-state="leader"] {
  border-color: #4A3F26;
  background: linear-gradient(90deg, rgba(240, 180, 95, .12), rgba(240, 180, 95, .02));
}
.editbar[data-state="leader"] .editbar__ico { background: #2C2416; color: #F0B45F; }
.editbar[data-state="admin"] {
  border-color: #2B4265;
  background: linear-gradient(90deg, rgba(110, 155, 250, .14), rgba(110, 155, 250, .02));
}
.editbar[data-state="admin"] .editbar__ico { background: #16243B; color: var(--brand-2); }
@media (max-width: 640px) {
  .editbar { padding: 9px 10px; }
  .editbar__acts { margin-left: 0; width: 100%; }
  .editbar__acts .btn { flex: 1 1 auto; justify-content: center; }
}

/* ---------- 36. 登录身份二选一 ---------- */
.authpick {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin: 4px 0 14px;
  padding: 4px;
  border-radius: 11px;
  background: var(--surface-3);
}
.authpick button {
  height: 38px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-2);
  font: inherit;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: background .16s ease, color .16s ease;
}
.authpick button:hover { color: var(--ink); }
.authpick button.is-on {
  background: var(--brand);
  color: #fff;
  box-shadow: 0 8px 18px -12px rgba(76, 124, 240, .95);
}
.authpick button.is-on[data-mode="leader"] {
  background: linear-gradient(135deg, #C98A2E, #E0A64A);
  color: #1A1305;
  box-shadow: 0 8px 18px -12px rgba(224, 166, 74, .9);
}

/* ---------- 37. 组长密码卡片（录入学员页） ---------- */
.leaderpass {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 10px;
  padding: 9px 11px;
  border: 1px dashed var(--line-strong);
  border-radius: 10px;
  background: var(--surface);
}
.leaderpass__code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .2em;
  color: var(--ink);
}
.leaderpass__code.is-off { color: var(--ink-3); letter-spacing: .14em; font-weight: 600; }
.leaderpass__reveal {
  margin-left: auto;
  border: 0;
  background: transparent;
  color: var(--brand-2);
  font: inherit;
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 6px;
}
.leaderpass__reveal:hover { background: var(--brand-soft); }
.banner--pass {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 0 0 12px;
  padding: 11px 14px;
  border: 1px solid #4A3F26;
  border-radius: var(--radius-md);
  background: linear-gradient(90deg, rgba(240, 180, 95, .13), rgba(240, 180, 95, .02));
  font-size: 12px;
  line-height: 1.7;
  color: var(--ink-2);
}
.banner--pass b { color: var(--ink); }
.banner--pass .btn { margin-left: auto; }


/* =========================================================
   60. 深色收口层（配色还原为 v5 深海石板后的收口）
   仅保留与颜色无关的部分：新版报头排版、四大板块目录、
   模块页布局修正与大屏品牌章；颜色一律走 :root 变量。
   ========================================================= */

/* ---------- 60.1 报头排版 ---------- */
.masthead__kicker { color: var(--ink-3); letter-spacing: .10em; }
.masthead__kicker span { letter-spacing: .24em; color: var(--brand-2); }
.masthead__kicker::after { background: linear-gradient(90deg, var(--line-strong), transparent); }
.masthead__title {
  font-size: clamp(40px, 5vw, 64px);
  font-weight: 700;
  letter-spacing: .03em;
  line-height: 1;
  color: var(--ink);
}
.masthead__title em { font-style: normal; color: var(--brand-2); }
.masthead__title em::after { display: none; }
.masthead__sub {
  display: flex; align-items: center; gap: 9px;
  margin-top: 2px;
  font-size: 10.5px; font-weight: 700;
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-3);
}
.masthead__sub::before { content: ""; width: 22px; height: 1px; background: var(--brass-2); opacity: .55; }
.masthead__lede {
  font-size: clamp(13px, 1vw, 14.5px);
  line-height: 2.0;
  color: var(--ink-2);
  max-width: 40em;
}
.masthead__lede b { color: var(--ink); font-weight: 700; }
.masthead__actions { margin-top: 6px; gap: 9px; }
.masthead__motto { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 13px; }
.masthead__motto-en { color: var(--ink-3); font-style: italic; }
.masthead__motto-cn { color: var(--brass-2); letter-spacing: .2em; }

/* ---------- 60.2 四大板块目录（简介主排版） ---------- */
.brief {
  list-style: none;
  margin: 4px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  border-top: 1px solid var(--line);
  border-left: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface);
}
.brief__item {
  position: relative;
  display: flex;
  gap: 11px;
  padding: 13px 15px 14px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  transition: background .18s ease;
}
.brief__item::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--tone, var(--brand-2));
  opacity: 0;
  transition: opacity .18s ease;
}
.brief__item:hover { background: var(--surface-2); }
.brief__item:hover::before { opacity: 1; }
.brief__no {
  flex: 0 0 auto;
  display: grid; place-items: center;
  width: 24px; height: 22px;
  margin-top: 1px;
  border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--tone, var(--brand-2)) 38%, transparent);
  background: color-mix(in srgb, var(--tone, var(--brand-2)) 18%, var(--surface));
  color: var(--tone, var(--brand-2));
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10.5px; font-weight: 800;
  letter-spacing: -.02em;
  line-height: 1;
}
.brief__body { min-width: 0; }
.brief__title {
  display: flex; align-items: baseline; gap: 7px;
  font-family: var(--serif);
  font-size: 14.5px; font-weight: 700;
  letter-spacing: .04em;
  color: var(--ink);
}
.brief__en {
  font-family: var(--font);
  font-size: 8.5px; font-weight: 800;
  letter-spacing: .18em;
  color: var(--tone, var(--brand-2));
  opacity: .9;
}
.brief__desc {
  margin-top: 5px;
  font-size: 11.8px;
  line-height: 1.76;
  color: var(--ink-3);
}
.brief__item[data-tone="routine"] { --tone: #6E9BFA; }
.brief__item[data-tone="exam"]    { --tone: #A6C6DF; }
.brief__item[data-tone="notice"]  { --tone: #5FCBC4; }
.brief__item[data-tone="share"]   { --tone: #A99CF7; }

/* ---------- 60.2b 新版简介：引言 + 四条「类—联—释」＋结语 ----------
   排版照用户给的格式：类名一行、破折号联语一行、说明一行，每条内部不折行；
   屏幕不够宽时（<1320px）自动放开折行，避免横向溢出。 */
.deck { margin: 2px 0 0; }
.deck__lead {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .035em;
  color: var(--ink);
}
.deck__list {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  border-top: 1px solid var(--line);
}
.deck__item {
  position: relative;
  display: flex;
  gap: 12px;
  padding: 10px 4px 11px 13px;
  border-bottom: 1px solid var(--line);
  transition: background .18s ease;
}
.deck__item:hover { background: rgba(255, 255, 255, .022); }
.deck__item::before {
  content: "";
  position: absolute;
  left: 0; top: 11px; bottom: 11px;
  width: 2px;
  border-radius: 2px;
  background: var(--tone, var(--brand-2));
  opacity: .5;
  transition: opacity .18s ease;
}
.deck__item:hover::before { opacity: 1; }
.deck__no {
  flex: 0 0 auto;
  width: 20px;
  margin-top: 3px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .02em;
  color: var(--tone, var(--brand-2));
  opacity: .85;
}
.deck__body { min-width: 0; }
.deck__title {
  font-family: var(--serif);
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: .09em;
  color: var(--ink);
}
.deck__verse {
  margin-top: 3px;
  font-family: var(--serif);
  font-size: 12.5px;
  letter-spacing: .045em;
  color: var(--brass-2);
  opacity: .95;
}
.deck__desc {
  margin-top: 2px;
  font-size: 13px;
  line-height: 1.72;
  letter-spacing: .008em;
  color: var(--ink-2);
}
.deck__foot {
  margin-top: 9px;
  font-size: 12px;
  line-height: 1.7;
  color: var(--ink-3);
}
.deck__item[data-tone="routine"] { --tone: #6E9BFA; }
.deck__item[data-tone="exam"]    { --tone: #A6C6DF; }
.deck__item[data-tone="notice"]  { --tone: #5FCBC4; }
.deck__item[data-tone="share"]   { --tone: #A99CF7; }
@media (min-width: 1320px) {
  .deck__verse, .deck__desc { white-space: nowrap; }
}

/* ---------- 60.2c 数据保护提示条 ---------- */
.dataguard {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 0 0 14px;
  padding: 12px 16px;
  border: 1px solid rgba(214, 158, 74, .55);
  border-left: 3px solid #D69E4A;
  border-radius: 10px;
  background: linear-gradient(90deg, rgba(214, 158, 74, .16), rgba(214, 158, 74, .04));
}
.dataguard__ico { font-size: 16px; color: #E8B25F; }
.dataguard__text { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.dataguard__text b { font-size: 13.5px; color: var(--ink); letter-spacing: .02em; }
.dataguard__text span { font-size: 12.3px; line-height: 1.6; color: var(--ink-2); }
.dataguard__acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- 60.3 响应式：目录改单列 ---------- */
@media (max-width: 1180px) {
  .brief { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .masthead__title { font-size: 38px; letter-spacing: .08em; }
  .brief { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- 60.4 模块页布局：撑满视口、限制座位行高 ---------- */
.view { display: flex; flex-direction: column; }
.view > * { min-height: 0; }

/* ---------- 61. 左侧目录：长按拖动排序 ---------- */
[data-sortable] {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.sys-tree { overscroll-behavior: contain; }
body.is-sorting,
body.is-sorting [data-sortable] { cursor: grabbing; }
.is-lifting {
  position: relative;
  z-index: 6;
  border-radius: 8px;
  background: var(--surface-3);
  box-shadow: 0 10px 24px -10px rgba(3, 8, 16, .75), inset 0 0 0 1px var(--brand);
}
.is-drop-before, .is-drop-after { position: relative; }
.is-drop-before::before,
.is-drop-after::after {
  content: '';
  position: absolute;
  left: 3px;
  right: 3px;
  height: 2px;
  border-radius: 2px;
  background: var(--brand);
  box-shadow: 0 0 0 1px rgba(76, 124, 240, .25);
  pointer-events: none;

.is-drop-before::before { top: -1px; }
.is-drop-after::after { bottom: -1px; }

.seatbig {
  position: fixed; top: 0; left: 0; right: 0; z-index: 80;
  display: none; align-items: center; gap: 10px;
  height: 44px; padding: 0 14px;
  background: rgba(11, 17, 25, .94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
  color: var(--ink-2);
  font-size: 12px;
}

.seatbig__tag {
  display: inline-flex; align-items: center; gap: 5px;

  font-size: 10.5px; font-weight: 800; letter-spacing: .1em;

.seatbig__hint { color: var(--ink-3); font-size: 11.5px; }
.seatbig__acts { margin-left: auto; display: flex; align-items: center; gap: 8px; }

body.is-seatbig .module-head,
body.is-seatbig .banner,
body.is-seatbig .editbar,

body.is-seatbig .sys-bulk,
body.is-seatbig .reg-panel,
body.is-seatbig .sys-legend,
body.is-seatbig .reg-legend,
body.is-seatbig .enroll-charts-wrap,
body.is-seatbig .enroll-legend { display: none !important; }

body.is-seatbig .view {
  position: fixed; left: 0; right: 0; top: 44px; bottom: 0;
  height: auto; padding: 0; overflow: hidden;
}
body.is-seatbig .module-view { height: 100%; min-height: 0; gap: 0; overflow: hidden; }
body.is-seatbig .module-body,
body.is-seatbig .module-body--enroll,
body.is-seatbig .sys-body,
body.is-seatbig .reg-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 0; height: 100%; min-height: 0; align-items: stretch;

body.is-seatbig .sys-main,
body.is-seatbig .reg-main { height: 100%; min-height: 0; gap: 0; }
body.is-seatbig .stage,
body.is-seatbig .stage--sys,
body.is-seatbig .stage--reg,
body.is-seatbig .stage--enroll {

  border: 0; border-radius: 0; background: transparent;

body.is-seatbig .seat-stage { min-height: 0; }
body.is-seatbig .seat-group__label { font-size: 12.5px; }
body.is-seatbig .podium { height: 30px; font-size: 12px; }

   出现时把整块座次表往上收，避免压住最后一排的姓名 */

body.is-seatbig .sys-savebar {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);

}
.sys-bulk__hint { margin-left: auto; font-size: 11px; color: var(--ink-3); }
.sys-bulk .btn.is-danger-soft { color: var(--danger-2); border-color: rgba(220, 92, 116, .45); }
