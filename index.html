  const CN_NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];

  /* 录入学员页的空白座次表尺寸：固定 12 行 × 12 列，够任何班级按实际座位摆。
     座位表真实范围（layout.rows / layout.groups）在录入时按填到的格子自动扩展。 */
  const ENROLL_SIZE = 12;

  const newTaskId = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  /* 轮次数字 → 中文（1 → 一，12 → 十二），超过 99 直接给阿拉伯数字 */
  function cnNum(n) {
    const num = Math.max(1, Math.floor(Number(n) || 1));
    if (num <= 10) return CN_NUM[num - 1];
    if (num < 20) return '十' + CN_NUM[num - 11];
    if (num < 100) {
      const t = Math.floor(num / 10);
      const u = num % 10;
      return CN_NUM[t - 1] + '十' + (u ? CN_NUM[u - 1] : '');
    }
    return String(num);
  }

  /* 新建一份任务（听写 / 背诵通用）：自动生成全新（全部未通过）的座次表与抄写表。
     v4 起任务挂在目录节点（nodeId）下，名称由目录路径拼接而成；
     抄写分「自动第 1 轮」（copyDone）与「二次 / 多次抄写」（copyRounds）。 */
  const TASK_KINDS = {
    dictation: '听写',
    recite: '背诵'
  };

  const newCatId = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const newRoundId = () => 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const newChartId = () => 'ch' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  /* 座次表范围规范化（录入学员 12 × 12 上限）：组数 / 排数 / 过道 / 讲台 */
  function normChartLayout(l, fb) {
    const o = (l && typeof l === 'object') ? l : {};
    const out = {
      groups: Math.min(12, Math.max(1, Number(o.groups) || (fb && fb.groups) || 6)),
      rows: Math.min(12, Math.max(1, Number(o.rows) || (fb && fb.rows) || 8)),
      podium: null
    };
    out.aisleAfter = Array.isArray(o.aisleAfter)
      ? Array.from(new Set(o.aisleAfter.map(Number).filter((n) => n >= 1 && n < out.groups))).sort((a, b) => a - b)
      : ((fb && Array.isArray(fb.aisleAfter)) ? fb.aisleAfter.slice() : []);
    if (o.podium && Number(o.podium.row) && Number(o.podium.group)) {
      out.podium = {
        row: Math.min(out.rows, Number(o.podium.row)),
        group: Math.min(out.groups, Number(o.podium.group))
      };
    }
    return out;
  }

  /* 一份座次表（录入学员里保存备用的名单）：学生名单 + 教室布局 */
  function normChart(c) {
    const o = (c && typeof c === 'object') ? c : {};
    return {
      id: String(o.id || newChartId()),
      name: String(o.name == null ? '' : o.name).replace(/\s+/g, ' ').trim().slice(0, 30) || '未命名座次表',
      students: (Array.isArray(o.students) ? o.students : [])
        .filter((x) => x && typeof x === 'object')
        .map((x) => ({
          id: String(x.id || ''),
          name: String(x.name == null ? '' : x.name).replace(/\s+/g, ' ').trim().slice(0, 12),
          group: Math.min(12, Math.max(1, Number(x.group) || 1)),
          row: Math.min(12, Math.max(1, Number(x.row) || 1))
        }))
        .filter((x) => x.id && x.name)
        .slice(0, 200),
      layout: normChartLayout(o.layout),
      createdAt: String(o.createdAt || ''),
      updatedAt: String(o.updatedAt || '')
    };
  }

  /* 目录节点（听写 / 背诵各一棵树）：parentId 为空表示一级目录 */
  function newCatNode(name, parentId) {
    return {
      id: newCatId(),
      name: String(name == null ? '' : name).replace(/\s+/g, ' ').trim().slice(0, 30) || '未命名目录',
      parentId: String(parentId || '')
    };
  }

  /* ---------------- 任务层级（必修 / 必修一 / Unit 1 …） ---------------- */
  /* 一个任务可以由多层组成，逐层向下细化。层数不固定：
     最少 1 层（就是一个任务名），最多 5 层，够「教材—册—单元—小节—页码」用。 */
  const TASK_MAX_LEVELS = 5;
  const LEVEL_SEP = ' - ';

  /* 把任意输入整理成层级数组：兼容「字符串按分隔符拆」「数组」「只有一个名字」三种来源 */
  function normLevels(input, fallbackName) {
    let list = [];
    if (Array.isArray(input)) list = input;
    else if (typeof input === 'string') list = input.split(/\s*[-–—>＞/／·|｜]\s*/);
    const out = list
      .map((x) => String(x == null ? '' : x).replace(/\s+/g, ' ').trim().slice(0, 30))
      .filter(Boolean)
      .slice(0, TASK_MAX_LEVELS);
    if (out.length) return out;
    const fb = String(fallbackName == null ? '' : fallbackName).replace(/\s+/g, ' ').trim().slice(0, 40);
    return fb ? [fb] : ['未命名任务'];
  }

  /* 层级 → 单行标题（历史任务名、下拉选项、导出都用它） */
  function levelsToName(levels) {
    const list = Array.isArray(levels) ? levels.filter(Boolean) : [];
    return list.join(LEVEL_SEP).slice(0, 60);
  }

  function newTask(name, by, kind = 'dictation', levels, nodeId) {
    const lv = normLevels(levels && levels.length ? levels : name, name);
    const auto = levelsToName(lv);
    const custom = String(name == null ? '' : name).replace(/\s+/g, ' ').trim().slice(0, 60);
    return {
      id: newTaskId(),
      kind,
      /* nodeId：任务挂在哪个目录节点下；levels / name 是它的投影（便于导出与旧代码） */
      nodeId: String(nodeId || ''),
      levels: lv,
      /* name：可以自己起名；customName=true 表示不是自动取目录路径，改名目录时不会被覆盖 */
      name: custom || auto || `未命名${TASK_KINDS[kind] || '任务'}`,
      customName: !!custom && custom !== auto,
      date: new Date().toISOString().slice(0, 10),
      by: String(by || '主管理员'),
      createdAt: new Date().toISOString(),
      records: {},     // 过关情况：sid -> true（未标记 = 未通过）
      copyDone: {},    // 旧版「自动第 1 轮」完成情况，仅用于数据迁移
      /* 抄写任务（全部靠发布生成，发布即快照）：
         [{ id, no, name, sids:[发布时未过关], pass:{发布时已过关}, done:{已抄完}, createdAt, by }] */
      copyRounds: []
    };
  }

  /* ---------------- 早读任务 ---------------- */
  const pad2t = (n) => String(n).padStart(2, '0');

  /* 时间统一成 HH:MM（容忍 7:5 / 07:05 / 空值） */
  function normTime(value, fallback) {
    const m = String(value || '').trim().match(/^(\d{1,2})[:：](\d{1,2})$/);
    if (!m) return fallback;
    const h = Math.min(23, Math.max(0, Number(m[1])));
    const mi = Math.min(59, Math.max(0, Number(m[2])));
    return `${pad2t(h)}:${pad2t(mi)}`;
  }

  const READ_WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  /* 时间段规范化：接受 [{start,end,content}] 或旧的 {start,end}；
     非法 / 时间重复的丢弃并按时序排列；每段可带独立的早读内容 */
  function normSegments(input, fallback) {
    let list = [];
    if (Array.isArray(input)) list = input;
    else if (input && typeof input === 'object') list = [input];
    const clean = (seg) => {
      if (!seg || typeof seg !== 'object') return null;
      const start = normTime(seg.start, '');
      const end = normTime(seg.end, '');
      if (!start || !end || start >= end) return null;
      return { start, end, content: String(seg.content || '').trim().slice(0, 120) };
    };
    const out = [];
    list.forEach((seg) => {
      const s = clean(seg);
      if (!s) return;
      if (out.some((x) => x.start === s.start && x.end === s.end)) return;
      out.push(s);
    });
    out.sort((a, b) => a.start.localeCompare(b.start));
    const trimmed = out.slice(0, 8);
    if (trimmed.length) return trimmed;
    return Array.isArray(fallback)
      ? fallback.map(clean).filter(Boolean).slice(0, 8)
      : [];
  }

  /* 日期对应的默认任务名，如 2026-10-27（周二）→「周二早读任务」 */
  function defaultReadingName(dateStr) {
    const m = String(dateStr || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    const d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date();
    return `${READ_WEEK[d.getDay()] || ''}早读任务`;
  }

  /* 新建一条早读任务：名称 + 日期 + 多个时间段（每段独立内容）+ 总说明 + 是否发布 */
  function newReadingTask(fields = {}) {
    const today = new Date().toISOString().slice(0, 10);
    const segments = normSegments(
      fields.segments || fields.segs || { start: fields.start, end: fields.end },
      [{
        start: normTime(fields.start, '07:20'),
        end: normTime(fields.end, '07:50'),
        content: ''
      }]
    );
    return {
      id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      kind: 'reading',
      name: String(fields.name || '').trim().slice(0, 30) || defaultReadingName(fields.date || today),
      date: String(fields.date || today).slice(0, 10),
      segments,

        { t: 'ul', x: [

        { t: 'ul', x: [

    {

      blocks: [
        { t: 'p', x: '同一段录音，预读过的人和没预读的人听到的东西完全不同：前者在等「八点一刻」这个数字，后者在等「下一句是什么」。预读不是把选项背下来，而是给自己设三个「待验证点」。' },

        { t: 'ul', x: [

      blocks: [

        { t: 'h', x: '范文（本站原创示例）' },
        { t: 'en', x: `Pre-made dishes are winning tables for one simple reason: time. A packet that turns into dinner in eight minutes fits the rhythm of a city that has no eight minutes to spare.

The convenience is real, and for many families it is a relief rather than a shortcut. Yet convenience has a price we rarely read on the label: more salt, less fibre, and a flavour built to please everyone and surprise no one. What worries me is not the packet itself but the habit — once cooking disappears from a home, the knowledge disappears with it.

My suggestion is modest. Let pre-made dishes cover the busy weekdays, and keep one evening for a real knife, a real pan and a conversation in the kitchen.` },
        { t: 'h', x: '赏析' },
        { t: 'ul', x: [
          '首段用"时间"一词同时给出原因和画面（eight minutes 出现两次），比 With the development of modern society 有信息量。',
          'a relief rather than a shortcut 先把立场放软，第二句 Yet 才转，读者不会觉得被说教。',
          'more salt, less fibre, a flavour built to please everyone and surprise no one —— 三个并列短语把"代价"写具体，最后一句还带一点机锋。',
          '建议给的是"边界"而不是"禁止"：工作日交给预制菜，留一个晚上给真正的刀和锅。'
        ] },
        { t: 'tip', x: '现象评论题不要写成"两面都对"。让步只是为了让判断更站得住 —— 全文必须有一句你自己的结论。' }
      ]

    {
      id: 'wam7', sec: 'app-model', kind: '联考真题', source: '2026 届湖北省云学联盟高三 12 月考试', year: 2026,
      topic: '介绍信 · 非遗文化', title: '介绍中国鱼灯：用材料和动作代替形容词',
      en: 'Fish lanterns of my hometown',
      summary: '文化介绍类最容易写成"历史悠久、寓意美好"的形容词堆。这篇只写三样东西：竹架、摇摆的尾巴、画鳞片的手法。',
      blocks: [
        { t: 'q', x: '原题情境（据答案卷整理）：假定你是李华，英国朋友 Chris 对中国鱼灯（fish lanterns）很感兴趣，请写邮件向他介绍这一传统民间艺术。' },
        { t: 'h', x: '范文（本站原创示例）' },
        { t: 'en', x: `Dear Chris,

You asked about the fish lanterns you saw in a photo of my hometown — they are one of my favourite things about the Lantern Festival.

The frame is bamboo, bent by hand and covered with paper or silk; the tail is jointed so that it swings when the carrier walks. In the parade a dozen of them move together and the whole street seems to swim. The fish stands for surplus, because the word for fish sounds like the word for plenty.

What I like most is that no two are alike: each maker has his own way of painting the scales. If you come in winter, I will take you to watch them being made.

Yours,
Li Hua` },
        { t: 'h', x: '赏析' },
        { t: 'ul', x: [
          '第二段全是"看得见"的东西：竹架、纸或绸、能摆动的尾巴。没有一个词是"精美绝伦"。',
          'the whole street seems to swim 一句把场面写活，比 many people watch them 高明得多。',
          '把"年年有余"的谐音用一句话解释（fish / plenty），既不生硬又完成了文化转译。',
          '结尾给了一个具体邀约（冬天来看制作），介绍信因此有了下一句。'
        ] },
        { t: 'tip', x: '写完介绍类作文，数一数形容词。超过五个就删掉一半，换成"什么材料、什么动作、什么声音"。' }
      ]
    },
    {
      id: 'wam8', sec: 'app-model', kind: '联考真题', source: '2026 届湖北省武汉市高三五月调研（五调）', year: 2026,
      topic: '征文 · 校园建设', title: 'Make Our Campus More Beautiful：从"没人负责"到"有人负责"',
      en: 'Make Our Campus More Beautiful',
      summary: '校园倡议类征文最忌口号。这篇用两个场景、一句"不是破坏，是没人负责"，把倡议推到一个可执行的制度上。',
      blocks: [
        { t: 'q', x: '原题情境（据答案卷整理）：学校英文报开展 Make Our Campus More Beautiful 征文活动，请写一篇短文投稿，谈谈你的看法与建议。' },
        { t: 'h', x: '范文（本站原创示例）' },
        { t: 'en', x: `Our campus is not short of space; it is short of attention.

Walk past the east stairwell at noon and you will find trays left on the windowsill, because the bin is twenty steps away. Walk into the reading room at four and you will find eight empty seats held by eight bags. None of this is vandalism. It is simply nobody's job.

So let us make it somebody's job. Each class could adopt one corner for a term — a corridor, a flower bed, a noticeboard — and look after it the way we look after our own desks. A photograph at the start and at the end of the term would show whether we mean it.

Beauty on a campus is not decoration. It is the visible result of people treating a shared place as their own.` },
        { t: 'h', x: '赏析' },
        { t: 'ul', x: [
          '开头用 not short of space; short of attention 制造一个反常识判断，比 Our campus is very beautiful 有力。',
          '两个场景都带数字（twenty steps, eight seats, eight bags），让"细节"变成证据。',
          'nobody\'s job → somebody\'s job 只改一个词，就把问题转成了方案，是全文最巧的一处。',
          '结尾把"美"重新定义成"把共享空间当成自己的"，主题落地，不喊"let us act now"。'
        ] },
        { t: 'tip', x: '倡议类征文里，"建议"必须具体到"谁在什么时候做什么"。做不到这一点，就只写现象与判断，反而更稳。' }
      ]
    },

    {

      en: 'Stranded in the snow',
      summary: '2026 年读后续写：暴风雪中执意开车去多伦多的 Emily 被困，被一对夫妇救助。两段首句明确，考"承接 + 回收"。',
      blocks: [
        { t: 'q', x: '原文情境（据原卷整理）：25 岁的 Emily 计划圣诞前从密歇根开车去多伦多与男友团聚。天气预报反复提示暴风雪，她仍决定出发。风雪加剧，她被引导下高速，车滑进路边沟里，手机没有信号，只能在车内过夜。第二天清晨，一对当地夫妇 Daniel 和 Rachel 发现了她。' },
        { t: 'h', x: '两段首句（原卷）' },

        ] },
        { t: 'h', x: '续写示范（本站原创）' },
        { t: 'en', x: `Paragraph 1

Daniel and Rachel suggested that Emily continue her journey by train. They said it as if it were the most natural thing in the world, and before she could protest, Rachel had looked up the timetable and Daniel was already scraping ice off his windscreen. At the small station, Rachel pressed a paper bag of sandwiches into her hands and wrote their number on the back of the ticket. Emily wanted to say something enormous, but all that came out was a shaky thank you. As the train pulled away, she saw the two of them still standing on the platform, and realised that she had been rescued twice: once from the ditch, and once from the belief that she had to manage everything alone.

Paragraph 2

Three days later, Emily returned to get her car. The storm had passed and the road looked almost innocent under the sun. Daniel and Rachel were waiting beside a tow truck, and the car came out of the ditch with a groan — streaked with mud, but whole. Emily had brought a box of chocolates and a card she had rewritten four times. Rachel read it aloud, laughed at the part about the sandwiches, and said the only payment they wanted was a message when she got home safely. Driving back, Emily kept glancing at the number written on her ticket, thinking that some kindnesses are too large to return and can only be passed on.` },
        { t: 'h', x: '赏析' },
        { t: 'ul', x: [
          '承接首句：不重复"坐火车"这个决定，直接写决定之后发生的动作（查时刻表、刮冰、塞三明治），把首句当起点而不是内容。',
          '细节承担情感：三明治、写在票背面的电话、rescued twice —— 没有一句 I was moved，却处处在写感动。',
          '第二段回收线索：三明治在感谢卡里再出现一次，形成闭环；结尾不喊口号，只说 passed on。',
          '两段分工清楚：第一段解决"怎么走"，第二段解决"回来之后"，不重复写感谢。'
        ] },
        { t: 'tip', x: '救援类题目的第二段最容易写空。给它一个"必须回现场"的理由（取车、还钱、还伞），情节自然就有了。' }
      ]
    },
    {
      id: 'wcm2', sec: 'cont-model', kind: '高考真题', source: '2025 全国Ⅰ卷（新课标Ⅰ卷）', year: 2025,
      topic: '亲情 · 和解', title: '哥哥与他的狗：让和解发生在一个动作里',
      en: 'My brother, Toby and a rainy evening',
      summary: '因为一条狗，兄弟两个月不说话。这篇续写用一个"舒适的故事崩塌"写自省，用尾巴、球和第二只杯子写和解。',
      blocks: [
        { t: 'q', x: '原文情境（据原卷整理）：作者在家办小型聚会，弟弟带来 50 磅的狗 Toby。怕狗撞倒小孩，作者要求弟弟把狗留在屋外。饭后下雨，众人进屋，弟弟不愿带着湿狗开车回家，提前离开。此后两个月兄弟失和。作者后来才想到：弟弟正面临健康问题，妻子几个月前去世，Toby 是他唯一的陪伴。' },
        { t: 'h', x: '两段首句（原卷）' },
        { t: 'ul', x: [
          'Paragraph 1: I realized it was me who was at fault.',
          'Paragraph 2: With the biscuits my wife had made, I arrived at my brother\u2019s door.'
        ] },
        { t: 'h', x: '续写示范（本站原创）' },
        { t: 'en', x: `Paragraph 1

I realized it was me who was at fault. For two months I had been telling myself a comfortable story in which my brother was simply being stubborn, and the story collapsed the moment I put myself in his shoes: a man with a bad heart, a house too quiet since March, and a dog who was the only one waiting at the door for him. I had asked him to choose between his brother and his companion in front of his whole family. That evening I called and left a message — not an explanation, just an apology and an invitation. He did not pick up, but he called back the next morning, and his voice had already forgiven me.

Paragraph 2

With the biscuits my wife had made, I arrived at my brother\u2019s door. He opened it with Toby pushing past his legs, tail sweeping the hallway like a metronome. Neither of us said much at first; we stood in the kitchen while the kettle worked, and Toby, sensing a truce, dropped his ball at my feet. I said the words I had rehearsed and then, badly, the ones I had not. My brother listened, nodded, and put a second cup on the table. We sat for two hours, and when I left he walked me to the car with Toby on the lead. It had taken a rainy evening and two wasted months to learn that a welcome is not a thing to be rationed.` },
        { t: 'h', x: '赏析' },
        { t: 'ul', x: [
          '用"舒适的故事崩塌"写自省，比 I felt sorry 多一层：先承认自己一直在给自己讲故事，再承认故事是假的。',
          'Toby 的三个动作（尾巴像节拍器、把球放在脚边、被牵着送客）承担了全部"和解"信息，没有一句 we made up。',
          'put a second cup on the table 是全篇最轻也最重的动作：中国人 / 西方人都懂的"留你吃饭"。',
          '结尾 a welcome is not a thing to be rationed 短、具体、不说教，主题自然浮出。'
        ] },
        { t: 'tip', x: '亲情类续写不要写"抱头痛哭"。给一个道具（饼干、球、第二只杯子），让和解发生在动作里，读者自己会流泪。' }
      ]
    },
    {
      id: 'wcm3', sec: 'cont-model', kind: '高考真题', source: '2024 新课标Ⅰ卷', year: 2024,
      topic: '诚信 · 信任', title: '欠司机的那笔车费：把"感动"写成"我也这样对别人"',
      en: 'The fare I owed',
      summary: '暴雨中打车、手机没电、身上没现金，司机说"我信你"。这篇续写把第二段从"我很感动"推到"我开始信任陌生人"。',
      blocks: [
        { t: 'q', x: '原文情境（据原卷整理）：作者在暴雨中拦到一辆出租车，司机绕开积水把他送到家门口。作者发现手机没电、身上没现金，只能记下车牌与电话，承诺第二天转账。司机只说了一句"我信你"。此后作者一直记着这笔钱和这份信任。续写两段：第一段写还钱的过程，第二段写这件事留下的影响。（首句以原卷为准）' },
        { t: 'h', x: '续写示范（本站原创，首句以原卷为准）' },
        { t: 'en', x: `Paragraph 1

The next morning, the first thing I did was find the note with his number on it. It took three calls before a tired voice answered, and when I explained who I was, he laughed — not at me, but at the fact that I had worried all night. I transferred the fare and a little more, and he sent the extra back with a message: just the fare is fine. A week later we met at the same corner so that I could hand him the money in person, and he arrived early, which somehow made me feel worse and better at the same time.

Paragraph 2

That twenty-yuan note has changed the way I read strangers. Since then I have let a boy behind me in the queue pay with my card, and lent an umbrella I never got back. None of it is grand. But each time I hesitate, I remember a man in a wet jacket who decided, in three seconds, that I was worth trusting. Trust, I have learned, is not a reward for good behaviour; it is an offer, and the only way to honour it is to make the same offer to someone else.` },
        { t: 'h', x: '赏析' },
        { t: 'ul', x: [
          '还钱这种小事必须有阻力：三个电话、对方退回多给的钱、他提前到。有阻力才有张力。',
          '第二段不写"感想"写"行为"：让别人先用我的卡、借出不还的伞。三个小动作顶掉一段抒情。',
          '结尾给出判断句（Trust is not a reward ... it is an offer），主题上升但不空，因为它落在"再给出去一次"这个动作上。',
          '语言上刻意用短句与破折号，符合"回忆一件小事"的语气。'
        ] },
        { t: 'tip', x: '凡是"诚信 / 信任"类，第二段不要停在"我很感动"，要写"我因此做了什么"。做了，才叫成长。' }
      ]
    },
    {
      id: 'wcm4', sec: 'cont-model', kind: '高考真题', source: '2023 新课标Ⅰ卷', year: 2023,
      topic: '成长 · 师生情', title: '写作比赛：最动人的是"没得奖"',
      en: 'The story she wanted to read',
      summary: '老师把"我"从门口拦回来，只说了一句"我想读它"。续写把结果写成"没获奖"，却得到了更重要的东西。',
      blocks: [
        { t: 'q', x: '原文情境（据原卷整理）：作者小时候被老师鼓励参加写作比赛，写了一个关于自己的故事，却在交稿前一次次想放弃；老师在教室门口拦下他，只说了一句"我想读它"。最终他交了上去，也第一次发现写作可以被人认真对待。续写两段：第一段写交稿与等待，第二段写结果与影响。（首句以原卷为准）' },
        { t: 'h', x: '续写示范（本站原创，首句以原卷为准）' },
        { t: 'en', x: `Paragraph 1

I handed her the envelope before I could change my mind. She did not open it, did not even look at it, only tapped it twice against her palm and said she would read it on Sunday. The week that followed was the longest of my life. I rewrote the ending in my head every night, decided four times that it was childish, and once actually walked to her office to ask for it back. Each time I stopped at the door, remembering the way she had said I want to read it — not I want to grade it.

Paragraph 2

On Friday she put the story on my desk with a single line in the margin of page two: the part about the dog is true, isn\u2019t it? That one sentence taught me more than any comment on grammar could. I did not win the competition. What I won was the knowledge that a page I had written could make someone ask a question I had not planned to answer. I have been writing ever since — badly at first, then better.` },
        { t: 'h', x: '赏析' },
        { t: 'ul', x: [
          '老师"没拆信封"是反直觉动作，比一段长篇鼓励更能写出她的分寸与信任。',
          '心理靠具体决定推进：四次想放弃、真走到办公室门口、每次停在门口。这些都能拍成镜头。',
          '第二段用一句页边批注代替奖状，把"被认真阅读"变成主题，比"我得了第一名"可信得多。',
          '结尾只写"一直在写"，不写"我成了作家"，克制反而有余味。'
        ] },
        { t: 'tip', x: '成长类续写，最大方的情节是"没有成功"。没得奖但得到了别的东西，比拿冠军更像真的。' }
      ]
    },
    {
      id: 'wcm5', sec: 'cont-model', kind: '高考真题', source: '2022 新课标Ⅰ卷', year: 2022,
      topic: '坚持 · 同伴相助', title: '陪 David 跑完最后一段：让他自己冲线',
      en: 'The last hill',
      summary: '患脑疾的 David 坚持参加越野赛。"我"放慢脚步陪他跑，但没有替他跑 —— 这是这类题目最容易写错的分寸。',
      blocks: [
        { t: 'q', x: '原文情境（据原卷整理）：班里来了一个患脑疾、走路不稳的男孩 David。校越野赛那天他坚持要参加，跑在最后，几次差点摔倒。作者原本是队里最快的，却放慢脚步陪在他身边。续写两段：第一段写赛道上的最后一段路，第二段写冲线与赛后的变化。（首句以原卷为准）' },
        { t: 'h', x: '续写示范（本站原创，首句以原卷为准）' },
        { t: 'en', x: `Paragraph 1

The last hill was where David nearly gave up. His left leg dragged, and twice he put a hand on my shoulder without saying sorry, because he had no breath to spare. Behind us the track was already being taken down; ahead, the finish line looked like a rumour. I stopped trying to measure how far we had to go and started counting instead — ten steps, then ten more — and he followed the count the way a swimmer follows the wall. When we reached the top, he was still holding on.

Paragraph 2

We crossed the line together, last of all, and the strangest thing happened: the few people left began to clap. David let go of my shoulder and stood up straight for the first time that afternoon, and I understood that he had not been running to beat anyone. Afterwards our coach said nothing about my time. He only asked whether I had seen David\u2019s face at the top of the hill. I had. That is the race I remember, and the only one I still talk about.` },
        { t: 'h', x: '赏析' },
        { t: 'ul', x: [
          '"数步子"是可拍成镜头的细节：ten steps, then ten more，比 he was very tired 有效十倍。',
          '第二段用"零星的掌声"而不是"全场欢呼"，克制反而更真。',
          '教练的一句问话代替了说教，把"教育的分寸"交给教练，也把主题交给读者。',
          '结尾落在"我记得的那场比赛"，不写"我懂得了帮助别人"，让故事自己收口。'
        ] },
        { t: 'tip', x: '帮助类情节不要写成"我背着他跑完"。让被帮助的人自己完成最后一步，主题才站得住。' }
      ]
    },
    {
      id: 'wcm6', sec: 'cont-model', kind: '联考真题', source: '2026 届湖北省部分重点中学高三第一次联考', year: 2026,
      topic: '校园 · 合作', title: 'Dirt Diaries：把"团结"写成一个蹲着的男孩',
      en: 'Dirt Diaries',
      summary: '孩子们把种植日记编成一本书。续写把群像拆成一个个动作，最后用"几棵葱和一堆草"消解宏大。',
      blocks: [
        { t: 'q', x: '原文情境（据答案卷整理）：Julia 带学生种菜，孩子们原本对土地毫无兴趣。学期末，一个学生提议把种植日记编成一本书。' },
        { t: 'h', x: '两段首句（原卷）' },
        { t: 'ul', x: [
          'Paragraph 1: Her idea energized the whole class instantly.',
          'Paragraph 2: Holding the first copy of Dirt Diaries, Julia felt a deep sense of achievement.'
        ] },
        { t: 'h', x: '续写示范（本站原创）' },
        { t: 'en', x: `Paragraph 1

Her idea energized the whole class instantly. Carlos volunteered to design the cover, two girls began sorting the journal entries by season, and someone who had never spoken in class offered to write the introduction. The classroom turned into a workshop after school: photographs of seedlings were glued beside hand-drawn maps of root systems, and the quietest boy in the room produced four pages about a tomato that had refused to grow. Julia moved between the tables with a roll of tape, saying very little, afraid that if she organised it too well it would stop being theirs.

Paragraph 2

Holding the first copy of Dirt Diaries, Julia felt a deep sense of achievement. The cover was brown, printed with a photograph of their garden in October, and it smelled faintly of the printer. She took one copy to the library and tucked a note inside: go outside, watch the soil, and it will talk back to you. Walking back across the yard, she passed the beds they had dug in September. Nothing in them was impressive — a few leeks, a lot of weeds — but a boy was kneeling there, checking a leaf. That, she thought, was the harvest.` },
        { t: 'h', x: '赏析' },
        { t: 'ul', x: [
          '首段写"提议之后发生了什么"，把每个人的动作分开写，班级才有群像感，而不是一句 everyone worked hard。',
          'afraid that if she organised it too well it would stop being theirs —— 一句心理把老师的克制写透。',
          '第二段用"几棵葱、一堆草"消解宏大，再用一个蹲着的男孩把主题收回"人与土地的关系"。',
          '结尾只用一句短句 That, she thought, was the harvest，不解释、不总结。'
        ] },
        { t: 'tip', x: '合作类续写，结尾别写"我们明白了团结的力量"。让一个人在做事，主题自然出现。' }
      ]
    },
    {
      id: 'wcm7', sec: 'cont-model', kind: '联考真题', source: '2026 届湖北新八校高三 4 月联考', year: 2026,
      topic: '时间跨度 · 物件串联', title: '漂流瓶的回信：用一个物件串起十二年',
      en: 'The bottle that answered',
      summary: 'Diane 捡到漂流瓶，按信上邮箱联系多年无回音。题目时间跨度大，最稳的做法是让"瓶子"反复出现。',
      blocks: [
        { t: 'q', x: '原文情境（据答案卷整理）：Diane 在海边捡到一个漂流瓶，瓶中有一封信，是一个叫 Erika 的女孩多年前写的。Diane 按信上的邮箱发了一封邮件，很久没有回音。' },
        { t: 'h', x: '首句（原卷）' },
        { t: 'ul', x: ['Paragraph 1: Then one day, an unexpected email arrived.'] },
        { t: 'h', x: '续写示范（本站原创）' },
        { t: 'en', x: `Paragraph 1

Then one day, an unexpected email arrived. Diane was scrolling through her inbox when a name jumped out at her: Erika. Her hand stopped over the mouse. The message was short and slightly unbelievable — the account had been abandoned for years, and Erika had only opened it because she was clearing out old addresses before moving abroad. I never stopped wondering whether anyone would find that bottle, she wrote. Diane read the sentence three times, then went to the shelf and took down the bottle, still dusty, still smelling of salt.

Paragraph 2

They arranged to meet at the same beach in August. Erika turned out to be a small woman with a loud laugh, carrying a canvas bag full of the letters she had written as a girl. They sat on the wall and read them aloud to each other, and the sea did what the sea does. Before she left, Erika asked Diane to write one too. So Diane did: a page about a bottle, a stranger, and a summer that took twelve years to arrive. Then she sealed it and threw it as far as she could.` },
        { t: 'h', x: '赏析' },
        { t: 'ul', x: [
          '邮件不整段引用，只留一句关键引语，其余用叙述带过，节奏才不散。',
          '第二段用"帆布袋里全是少女时代的信"交代人物，比从头到脚的外貌描写经济得多。',
          'the sea did what the sea does 一句留白，代替"我们聊了很久"这类总结。',
          '结尾让主角"再投一个瓶子"，动作闭环，主题不点自明。'
        ] },
        { t: 'tip', x: '时间跨度大的题目，用物件（瓶子、信、照片）串起两个时间点，比反复写"很多年过去了"有效。' }
      ]
    },

    /* ===== 四、读后续写写作积累（按话题） ===== */

      en: 'Family and forgiveness',
      summary: '亲情续写不需要大事件，需要一个"谁先迈出一步"的动作。隔阂越具体，和解越轻，越好。',

    {
      id: 'wca2', sec: 'cont-accum', kind: '写作素材', source: '本站整理 · 按话题', year: 0,
      topic: '友情与师生情', title: '友情 / 师生情：误会要靠一件小事解开',
      en: 'Friendship and teachers',
      summary: '这类题的核心是"我误解了他"，而不是"他对我很好"。误会要站得住，解开要轻。',
      blocks: [
        { t: 'p', x: '常见情境：好友突然疏远；比赛名额之争；老师看似偏心；一句被听错的话。' },
        { t: 'h', x: '情节骨架' },

        { t: 'ul', x: [
          'saved me a seat without a word / walked the long way with me',

  const segToMin = (t) => {
    const m = String(t || '').match(/^(\d{2}):(\d{2})$/);
    return m ? Number(m[1]) * 60 + Number(m[2]) : 0;
  };

  /* 早读状态：未开始 / 进行中 / 时段间歇 / 已结束（nowMin 为当天 0 点起的分钟数）
     多个时间段时按「当前处于哪一段 / 距离下一段还有多久」判断 */
  function readingStatus(task, nowMin, todayStr) {
    if (!task) return { key: 'none', label: '今日未发布' };
    const segs = Array.isArray(task.segments) ? task.segments : [];
    if (!segs.length) return { key: 'none', label: '未设置时间段' };
    const n = Number.isFinite(nowMin) ? nowMin : segToMin(segs[0].start);
    const inToday = !todayStr || !task.date || task.date === todayStr;
    if (!inToday) {
      return { key: 'other', label: '非今日任务', diff: 0, segIndex: -1, seg: segs[0] };
    }
    for (let i = 0; i < segs.length; i += 1) {
      const s = segToMin(segs[i].start);
      const e = segToMin(segs[i].end);
      if (n < s) {
        return i === 0
          ? { key: 'before', label: '未开始', diff: s - n, segIndex: i, seg: segs[i] }
          : { key: 'break', label: '时段间歇', diff: s - n, segIndex: i, seg: segs[i] };
      }
      if (n <= e) return { key: 'doing', label: '进行中', diff: e - n, segIndex: i, seg: segs[i] };
    }
    return { key: 'after', label: '已结束', diff: n - segToMin(segs[segs.length - 1].end), segIndex: -1, seg: segs[segs.length - 1] };
  }

  /* 单个时间段的状态（用于逐段高亮） */
  function segmentStatus(seg, nowMin) {
    const s = segToMin(seg && seg.start);
    const e = segToMin(seg && seg.end);
    const n = Number.isFinite(nowMin) ? nowMin : -1;
    if (n < s) return 'before';
    if (n <= e) return 'doing';
    return 'after';
  }

  /* 一段 / 多段的显示文本：07:20–07:40 / 07:45–08:00 */
  function segmentsText(task) {
    const segs = task && Array.isArray(task.segments) ? task.segments : [];
    return segs.map((s) => `${s.start}–${s.end}`).join(' / ');
  }

  /* 多段合计分钟数 */
  function totalMinutes(task) {
    const segs = task && Array.isArray(task.segments) ? task.segments : [];
    return segs.reduce((sum, s) => sum + Math.max(0, segToMin(s.end) - segToMin(s.start)), 0);
  }

  /* 兼容旧数据 / 补全缺失字段（单个班级的扁平数据，供多班级层与旧数据复用） */
  function normalizeFlat(raw) {
    const d = defaultState();
    if (!raw || typeof raw !== 'object') return d;
    const s = Object.assign({}, d, raw);
    s.meta = Object.assign({}, d.meta, raw.meta);
    /* 组长密码：只留字母与数字（4–12 位），中文输入法常见的全角 / 空格一律清掉，
       否则「看起来一样却登录失败」。空字符串 = 本班还没设置。 */
    s.leaderPass = String(raw.leaderPass == null ? d.leaderPass : raw.leaderPass)
      .replace(/[\s\u3000]+/g, '')
      .replace(/[\uFF01-\uFF5E]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[^0-9A-Za-z]/g, '')
      .slice(0, 12);
    s.layout = Object.assign({}, d.layout, raw.layout);
    s.theme = Object.assign({}, d.theme, raw.theme);
    /* 主题还原：浅色版默认的「浅绿 / 浅灰」状态色在深底上过淡，随主题还原；自己调过色的保持原样。 */
    if (/^#cfebdb$/i.test(String(s.theme.doneColor))) s.theme.doneColor = d.theme.doneColor;
    if (/^#e8edef$/i.test(String(s.theme.undoneColor))) s.theme.undoneColor = d.theme.undoneColor;
    s.tasks = Object.assign({}, d.tasks, raw.tasks);
    s.rules = Object.assign({}, d.rules, raw.rules);
    /* 「学情待办汇总」顶部说明改为「听写规章」：旧版的页面说明文字自动换成新规章（自己改过的保留） */
    if (typeof s.rules.dstat === 'string' && s.rules.dstat.indexOf('本页只读') >= 0) {
      s.rules.dstat = MODULES.dstat.defaultRules.join('\n');
    }
    /* 「常规违纪统计」顶部也换成「常规违纪规章」：旧版页面说明自动替换，自己改过的保留 */
    if (typeof s.rules.regstat === 'string' && s.rules.regstat.indexOf('本页只读') >= 0) {
      s.rules.regstat = MODULES.regstat.defaultRules.join('\n');
    }
    /* 旧版首页规则里描述的是「首页大字 + 鼓励语」，功能改版后自动更正为当前说法 */
    if (typeof s.rules.home === 'string' && s.rules.home.indexOf('首页大字显示，可切换背景与鼓励语') >= 0) {
      s.rules.home = s.rules.home.split('\n').map((line) => (
        line.indexOf('首页大字显示，可切换背景与鼓励语') >= 0
          ? '早读：主管理员发布任务（可自定义名称、多个时间段），进入「早读常规」后整页大字展示。'
          : line
      )).join('\n');
    }
    s.auth = Object.assign({}, d.auth, raw.auth);
    s.settings = Object.assign({}, d.settings, raw.settings);
    if (!Array.isArray(s.auth.deputies)) s.auth.deputies = [];
    if (!Array.isArray(s.students)) s.students = d.students;
    if (!s.records || typeof s.records !== 'object') s.records = {};
    if (!Array.isArray(s.log)) s.log = [];

    /* v4.1 座次表库：录入学员支持保存多份座次表备用（命名 / 编辑 / 删除），
       发布听写 / 背诵任务时手动选取其中一份并固化成任务快照。
       老数据没有座次表库：把当前全班名单整体复制成「默认座次表」，其余行为不变。 */
    s.charts = (Array.isArray(raw.charts) ? raw.charts : [])
      .filter((c) => c && typeof c === 'object')
      .map(normChart)
      .slice(0, 50);
    if (!s.charts.length) {
      s.charts = [normChart({
        name: '默认座次表',
        students: s.students,
        layout: s.layout,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      })];
    }

    /* 任务迁移 / 校验：听写（dTasks）与背诵（rTasks）共用同一套逻辑。
       旧版按日期存 records 的历史数据会自动转成独立任务（含历史记录）。
       v4：每个系统一棵目录树（dCat / rCat，最多三级），任务挂在节点上，
           名称由「一级 - 二级 - 三级」拼接；旧任务的 levels 会自动补建目录。 */
    const TASK_SPECS = [
      ['dTasks', 'dictation', '听写', 'dCat', 'dc1'],
      ['rTasks', 'recite', '背诵', 'rCat', 'rc1']
    ];
    TASK_SPECS.forEach(([key, kind, label, catKey, rootId]) => {
      /* ---- 目录树：清洗 + 断链修复（父节点不存在则升为一级） ---- */
      /* 老数据没有目录树：从空开始，随后按任务层级自动补建，避免凭空多出默认节点 */
      let cats = Array.isArray(raw[catKey]) ? raw[catKey] : [];
      cats = cats.filter((n) => n && typeof n === 'object').map((n) => ({
        id: String(n.id || newCatId()),
        name: String(n.name == null ? '' : n.name).replace(/\s+/g, ' ').trim().slice(0, 30) || '未命名目录',
        parentId: String(n.parentId || '')
      }));
      const ids = new Set(cats.map((n) => n.id));
      cats.forEach((n) => { if (n.parentId && !ids.has(n.parentId)) n.parentId = ''; });
      const byId = new Map(cats.map((n) => [n.id, n]));
      /* 防环：沿 parent 上溯，超过 6 层或回到自己就断开 */
      cats.forEach((n) => {
        let cur = n;
        let hops = 0;
        const seen = new Set([n.id]);
        while (cur.parentId && hops < 6) {
          if (seen.has(cur.parentId) || !byId.has(cur.parentId)) { cur.parentId = ''; break; }
          seen.add(cur.parentId);
          cur = byId.get(cur.parentId);
          hops += 1;
        }
        if (hops >= 6) n.parentId = '';
      });
      const depthOf = (id) => {
        let d = 1;
        let cur = byId.get(id);
        while (cur && cur.parentId && d < 8) { cur = byId.get(cur.parentId); d += 1; }
        return d;
      };
      /* 目录最深三级：超出的节点并到父级名字里，避免出现四级 */
      cats.filter((n) => depthOf(n.id) > 3).forEach((n) => {
        const parent = byId.get(n.parentId);
        if (parent) { parent.name = `${parent.name} ${n.name}`.slice(0, 30); n.parentId = parent.parentId; }
      });
      const pathOf = (id) => {
        const out = [];
        let cur = byId.get(id);
        let hops = 0;
        while (cur && hops < 5) { out.unshift(cur.name); cur = cur.parentId ? byId.get(cur.parentId) : null; hops += 1; }
        return out;
      };
      /* 按路径找节点，没有就逐级补建（导出的旧数据也能落到正确目录） */
      const ensurePath = (names) => {
        let parentId = '';
        let node = null;
        names.slice(0, 3).forEach((nm) => {
          const clean = String(nm || '').replace(/\s+/g, ' ').trim().slice(0, 30);
          if (!clean) return;
          node = cats.find((n) => n.parentId === parentId && n.name === clean);
          if (!node) {
            node = { id: newCatId(), name: clean, parentId };
            cats.push(node);
            byId.set(node.id, node);
          }
          parentId = node.id;
        });
        return node;
      };

      if (!Array.isArray(s[key])) {
        s[key] = [];
        Object.keys(s.records).sort().forEach((date) => {
          const rec = s.records[date] && s.records[date][kind];
          if (rec && Object.keys(rec).length) {
            const t = newTask(`${date} ${label}`, '历史数据迁移', kind);
            t.date = date;
            t.records = Object.assign({}, rec);
            s[key].push(t);
          }
        });
      }
      s[key] = s[key].filter((t) => t && typeof t === 'object');
      if (!s[key].length) s[key] = JSON.parse(JSON.stringify(d[key]));
      s[key].forEach((t) => {
        t.id = String(t.id || newTaskId());
        t.kind = kind;
        /* 层级（投影）：优先用 levels；老数据只有 name 时按「-」拆分 */
        t.levels = normLevels(Array.isArray(t.levels) ? t.levels : (t.level || t.name), t.name);
        /* 目录节点：没有 nodeId 时按路径补建 */
        if (!t.nodeId || !byId.has(String(t.nodeId))) {
          const node = ensurePath(t.levels);
          t.nodeId = node ? node.id : '';
        }
        /* 名称：自己起过名（customName）就一直用；否则跟目录走（改名目录后任务名自动同步） */
        const p = pathOf(t.nodeId);
        if (p.length) t.levels = p;
        t.customName = !!t.customName;
        if (t.customName) {
          t.name = String(t.name || '').replace(/\s+/g, ' ').trim().slice(0, 60) || levelsToName(t.levels);
        } else {
          /* 默认任务名 = 所在目录等级（各级目录名连写，如「必修一 Unit 1」） */
          t.name = (p.length ? p.join(' ') : levelsToName(t.levels)) || String(t.name || `未命名${label}`).slice(0, 60);
        }
        t.date = String(t.date || '').slice(0, 10);
        t.by = String(t.by || '主管理员');
        t.createdAt = String(t.createdAt || `${t.date || new Date().toISOString().slice(0, 10)}T00:00:00.000Z`);
        t.records = (t.records && typeof t.records === 'object' && !Array.isArray(t.records)) ? t.records : {};
        /* 旧字段 copy（罚抄完成）迁移到 copyDone */
        const oldCopy = (t.copy && typeof t.copy === 'object' && !Array.isArray(t.copy)) ? t.copy : null;
        t.copyDone = (t.copyDone && typeof t.copyDone === 'object' && !Array.isArray(t.copyDone)) ? t.copyDone : {};
        if (oldCopy) {
          Object.keys(oldCopy).forEach((sid) => { if (oldCopy[sid]) t.copyDone[sid] = true; });
          delete t.copy;
        }
        /* 抄写任务（发布即快照）：校验 + 只保留任务名单里真实存在的学生。
           任务带 roster（发布时选取并固化的座次表）就按 roster 过滤，否则按全班名单（老数据）。 */
        let rStudents = s.students;
        const rawRoster = (t.roster && typeof t.roster === 'object' && !Array.isArray(t.roster)) ? t.roster : null;
        if (rawRoster && Array.isArray(rawRoster.students) && rawRoster.students.length) {
          const rs = rawRoster.students
            .filter((x) => x && typeof x === 'object' && x.id && String(x.name || '').trim())
            .map((x) => ({
              id: String(x.id),
              name: String(x.name).replace(/\s+/g, ' ').trim().slice(0, 12),
              group: Math.min(12, Math.max(1, Number(x.group) || 1)),
              row: Math.min(12, Math.max(1, Number(x.row) || 1))
            }));
          if (rs.length) {
            t.roster = {
              chartId: String(rawRoster.chartId || ''),
              chartName: String(rawRoster.chartName || '').replace(/\s+/g, ' ').trim().slice(0, 30),
              students: rs,
              layout: normChartLayout(rawRoster.layout)
            };
            rStudents = rs;
          } else {
            delete t.roster;
          }
        } else if (t.roster) {
          delete t.roster;
        }
        const alive = new Set(rStudents.map((x) => x.id));
        const aliveOk = (sid) => !alive.size || alive.has(String(sid));
        const objMap = (v) => ((v && typeof v === 'object' && !Array.isArray(v)) ? v : {});
        const pickAlive = (m) => {
          const out = {};
          Object.keys(objMap(m)).forEach((sid) => { if (objMap(m)[sid] && aliveOk(sid)) out[String(sid)] = true; });
          return out;
        };
        const rounds = (Array.isArray(t.copyRounds) ? t.copyRounds : []).filter((r) => r && typeof r === 'object');
        /* 旧版「自动第 1 轮」（copyDone）升级成一条真实的第 1 轮快照 */
        if (Object.keys(objMap(t.copyDone)).length && !rounds.some((r) => Number(r.no) === 1)) {
          const failed = rStudents
            .filter((x) => x.name && x.name.trim() && !t.records[x.id])
            .map((x) => x.id);
          const copied = Object.keys(objMap(t.copyDone)).filter((sid) => objMap(t.copyDone)[sid]);
          const sids = Array.from(new Set(failed.concat(copied))).filter(aliveOk);
          rounds.unshift({
            id: `${t.id}k1`, no: 1, name: `${t.name}一轮抄写`,
            sids, pass: pickAlive(t.records), done: pickAlive(t.copyDone),
            createdAt: String(t.createdAt || ''), by: '数据迁移'
          });
        }
        t.copyRounds = rounds.map((r, i) => ({
          id: String(r.id || `${t.id}k${i + 1}`),
          no: Math.max(1, Number(r.no) || i + 1),
          name: String(r.name || '').replace(/\s+/g, ' ').trim().slice(0, 60),
          sids: (Array.isArray(r.sids) ? r.sids : []).map(String).filter(aliveOk).slice(0, 200),
          pass: pickAlive(r.pass),
          done: pickAlive(r.done),
          createdAt: String(r.createdAt || ''),
          by: String(r.by || '主管理员')
        }))
          .sort((a, b) => (a.no - b.no) || String(a.createdAt).localeCompare(String(b.createdAt)))
          .slice(0, 30)
          /* 轮次编号统一成 1..n（旧数据出现过两轮都叫 2 的情况），没名字的按「任务名 + 中文轮数 + 轮抄写」补 */
          .map((r, i) => Object.assign(r, {
            no: i + 1,
            name: r.name || `${t.name}${cnNum(i + 1)}轮抄写`
          }));
        t.copyDone = {};   // 统一走 copyRounds，旧字段只做迁移来源
      });
      /* 一个节点都没有（首次使用 / 数据被清空）：补一个一级目录，避免「无处挂任务」 */
      if (!cats.length) cats = [{ id: rootId, name: '必修一', parentId: '' }];
      s[catKey] = cats;
    });

    /* 早读任务校验：支持多个任务、每个任务多个时间段（每段可带内容）、预设/已发布两种状态；
       旧版 start/end / 单一 content 自动迁移。允许「一个任务都没有」（主管理员可全部删除） */
    if (!Array.isArray(s.rdTasks)) s.rdTasks = JSON.parse(JSON.stringify(d.rdTasks));
    s.rdTasks = s.rdTasks.filter((t) => t && typeof t === 'object').map((t) => {
      const date = String(t.date || '').slice(0, 10) || new Date().toISOString().slice(0, 10);
      const segments = normSegments(
        t.segments || { start: t.start, end: t.end },
        [{ start: '07:20', end: '07:50', content: '' }]
      );
      return {
        id: String(t.id || newReadingTask({ date }).id),
        kind: 'reading',
        name: String(t.name || '').trim().slice(0, 30) || defaultReadingName(date),
        date,
        segments,
        content: String(t.content || '').slice(0, 220),
        published: t.published !== false,
        by: String(t.by || '主管理员'),
        createdAt: String(t.createdAt || '')
      };
    }).sort((a, b) => (a.date + a.segments[0].start).localeCompare(b.date + b.segments[0].start)).slice(-120);

    s.reading = Object.assign({}, d.reading, raw.reading);
    const rd = s.reading;
    if (!Array.isArray(rd.slogans) || !rd.slogans.length) {
      rd.slogans = DEFAULT_READING_SLOGANS.slice();
    }
    rd.slogans = rd.slogans.map((x) => String(x || '').trim()).filter(Boolean).slice(0, 40);
    if (!rd.slogans.length) rd.slogans = DEFAULT_READING_SLOGANS.slice();
    if (!READ_BACKGROUNDS.some((b) => b.key === rd.bg)) rd.bg = 'dawn';
    rd.defaultStart = normTime(rd.defaultStart, '07:20');
    rd.defaultEnd = normTime(rd.defaultEnd, '07:50');

    /* 默认时间段模板（控制台可编辑段数与每段内容） */
    const tpl = rd.template && Array.isArray(rd.template.segments) ? rd.template.segments : [];
    rd.template = {
      segments: normSegments(tpl, JSON.parse(JSON.stringify(READING_TEMPLATE_DEFAULT)))
    };

    /* 大屏滚动播放配置 */
    const sc = rd.screen && typeof rd.screen === 'object' ? rd.screen : {};
    rd.screen = Object.assign(defaultScreenCfg(), sc);
    rd.screen.interval = Math.min(120, Math.max(4, Number(rd.screen.interval) || 12));
    ['rotate', 'showTask', 'showQuote', 'showPoster', 'showWork', 'showStar', 'scroll'].forEach((k) => {
      rd.screen[k] = rd.screen[k] !== false;
    });
    rd.screen.rotate = sc.rotate !== false;

    /* 激励海报：内置 6 套，可开关 / 改文案 / 换成图片地址 / 追加 */
    if (!Array.isArray(rd.posters) || !rd.posters.length) {
      rd.posters = JSON.parse(JSON.stringify(MOTIVATION_POSTERS));
    }
    rd.posters = rd.posters.filter((p) => p && typeof p === 'object').map((p, i) => ({
      id: String(p.id || `pt${i + 1}`),
      art: String(p.art || 'sunrise').slice(0, 16),
      on: p.on !== false,
      quote: String(p.quote || '').slice(0, 120),
      cn: String(p.cn || '').slice(0, 100),
      url: String(p.url || '').slice(0, 500)
    })).slice(0, 20);

    /* 优秀作业 / 学习标兵（大屏滚动播放用）
       每条记录可以带一张图片：只接受本站上传路径（/uploads/xxx）、外链或内联图片，
       其它写法一律丢弃，避免把 javascript: / 本地文件路径写进 <img src>。 */
    const normImg = (v) => {
      const s = String(v || '').trim().slice(0, 300);
      if (!s) return '';
      if (/^\/uploads\/[A-Za-z0-9._-]+$/.test(s)) return s;
      if (/^https?:\/\//i.test(s)) return s;
      if (/^data:image\/(png|jpeg|jpg|webp|gif);base64,/i.test(s)) return s;
      return '';
    };
    const normItem = (it, i, keys) => {
      const out = { id: String(it.id || `i${Date.now().toString(36)}${i}`), img: normImg(it.img) };
      keys.forEach((k) => { out[k] = String(it[k] || '').slice(0, k === 'note' ? 160 : 60); });
      return out;
    };
    rd.works = (Array.isArray(rd.works) ? rd.works : []).filter((x) => x && typeof x === 'object')
      .map((x, i) => normItem(x, i, ['name', 'item', 'note', 'date'])).slice(0, 60);
    rd.stars = (Array.isArray(rd.stars) ? rd.stars : []).filter((x) => x && typeof x === 'object')
      .map((x, i) => normItem(x, i, ['name', 'title', 'note', 'date'])).slice(0, 60);

    /* 公告栏（主页展示 + 控制台发布 / 编辑 / 删除）
       每条：{ id, title 公告名称, body 正文, files 附件[{id,name,url,size}], date, pinned, createdAt }。
       公告按班级各存一份（学习任务 / 考试答案 / 成绩都是某个班的），
       所以字段放在 CLASS_KEYS 里，随班级切换一起换。 */
    const safeFileUrl = (v) => {
      const u = String(v || '').trim().slice(0, 300);
      if (!u) return '';
      if (/^\/uploads\/[A-Za-z0-9._-]+$/.test(u)) return u;      // 本站上传
      if (/^https?:\/\//i.test(u)) return u;                     // 外链
      return '';                                                 // 其它（javascript: / 本地路径）一律丢弃
    };

    /* 公告日期：一律归一成 YYYY-MM-DD。
       - 兼容 `2026/11/1`、`2026.11.1`、`2026-11-1` 这类手写格式，月日补零；
       - 没填日期时回退到 createdAt 当天（旧数据也能显示日期）；
       - 都拿不到就留空，主页不显示日期、也不参与「最新」比较。 */
    const normNoticeDate = (v, createdAt) => {
      const pick = (t) => {
        const m = String(t || '').trim().match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
        return m ? `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}` : '';
      };
      return pick(v) || pick(createdAt) || '';
    };
    s.notices = (Array.isArray(s.notices) ? s.notices : [])
      .filter((n) => n && typeof n === 'object')
      .map((n, i) => {
        const body = String(n.body || '').slice(0, 4000);
        const title = String(n.title || '').replace(/\s+/g, ' ').trim().slice(0, 60);
        return {
          id: String(n.id || `nt${Date.now().toString(36)}${i}`),
          title,
          body,
          files: (Array.isArray(n.files) ? n.files : [])
            .filter((f) => f && typeof f === 'object' && safeFileUrl(f.url))
            .map((f, j) => ({
              id: String(f.id || `fl${j}`),
              name: String(f.name || '').replace(/[\r\n]/g, ' ').trim().slice(0, 80) || '附件',
              url: safeFileUrl(f.url),
              size: Math.max(0, Number(f.size) || 0)
            })).slice(0, 12),
          date: normNoticeDate(n.date, n.createdAt),
          pinned: n.pinned === true,
          by: String(n.by || '主管理员').slice(0, 20),
          createdAt: String(n.createdAt || ''),
          updatedAt: String(n.updatedAt || '')
        };
      })
      /* 没有名称也没有正文的空条目直接丢掉（避免列表里出现空气泡）
         注意：这里【不排序】—— 控制台是按数组下标绑定输入框的（notices.0.title），
         服务端一旦重排，下标就会指到别的公告上。排序只在页面渲染时做副本。 */
      .filter((n) => n.title || n.body || n.files.length)
      .slice(0, 60);

    /* 拓展阅读：保存「本班自编」与「对内置材料的修订」两类。
       - 自编：id 为新生成的 ex-xxx，custom = true；
       - 修订：id 与内置材料相同，edited = true，读取时覆盖内置原文（原文仍在代码里，可恢复）。 */
    const builtinIds = new Set(EXTEND_ARTICLES.map((a) => a.id));
    s.extendArticles = (Array.isArray(s.extendArticles) ? s.extendArticles : [])
      .filter((a) => a && typeof a === 'object')
      .map((a, i) => {
        const id = String(a.id || `ex-c${i}`);
        return {
          id,
          cat: normExCat(a.cat),
          title: String(a.title || '未命名材料').slice(0, 60),
          en: String(a.en || '').slice(0, 80),
          summary: String(a.summary || '').slice(0, 200),
          minutes: Math.min(60, Math.max(1, Number(a.minutes) || 5)),
          blocks: (Array.isArray(a.blocks) ? a.blocks : []).filter((b) => b && b.x).map((b) => ({
            t: ['p', 'h', 'ul', 'tip'].indexOf(b.t) >= 0 ? b.t : 'p',
            x: Array.isArray(b.x) ? b.x.map((x) => String(x).slice(0, 400)).slice(0, 12) : String(b.x).slice(0, 1600)
          })).slice(0, 20),
          custom: true,
          /* 是否内置材料的修订版（改过标题 / 正文的内置篇目） */
          edited: builtinIds.has(id) || !!a.edited,
          baseId: builtinIds.has(id) ? id : ''
        };
      })
      .filter((a, i, arr) => arr.findIndex((x) => x.id === a.id) === i)   /* 同一篇只留一条 */
      .slice(0, 80);

    /* 已下架的内置材料：只记录 id，原文仍由代码提供，可一键恢复 */
    s.extendHidden = Array.from(new Set(
      (Array.isArray(s.extendHidden) ? s.extendHidden : [])
        .map((x) => String(x || '').trim())
        .filter((x) => builtinIds.has(x))
    )).slice(0, 80);

    /* 写作素材库：与拓展阅读同一套思路 —— 自编 / 修订存全文，下架只存 id。
       块类型多了两种：q（原题/情境引用）与 en（英文范文），排版需要区分。 */
    const writeBuiltinIds = new Set(WRITE_ITEMS.map((a) => a.id));
    s.writeArticles = (Array.isArray(s.writeArticles) ? s.writeArticles : [])
      .filter((a) => a && typeof a === 'object')
      .map((a, i) => {
        const id = String(a.id || `wr-c${i}`);
        return {
          id,
          sec: normWriteSec(a.sec),
          kind: String(a.kind || '写作素材').slice(0, 12),
          source: String(a.source || '').replace(/\s+/g, ' ').trim().slice(0, 80),
          year: Math.min(2100, Math.max(0, Number(a.year) || 0)),
          topic: String(a.topic || '').slice(0, 40),
          title: String(a.title || '未命名素材').slice(0, 80),
          en: String(a.en || '').slice(0, 100),
          summary: String(a.summary || '').slice(0, 240),
          blocks: (Array.isArray(a.blocks) ? a.blocks : []).filter((b) => b && b.x).map((b) => ({
            t: ['p', 'h', 'ul', 'tip', 'q', 'en'].indexOf(b.t) >= 0 ? b.t : 'p',
            x: Array.isArray(b.x) ? b.x.map((x) => String(x).slice(0, 400)).slice(0, 12) : String(b.x).slice(0, 2400)
          })).slice(0, 24),
          custom: true,
          edited: writeBuiltinIds.has(id) || !!a.edited,
          baseId: writeBuiltinIds.has(id) ? id : ''
        };
      })
      .filter((a, i, arr) => arr.findIndex((x) => x.id === a.id) === i)
      .slice(0, 120);

    s.writeHidden = Array.from(new Set(
      (Array.isArray(s.writeHidden) ? s.writeHidden : [])
        .map((x) => String(x || '').trim())
        .filter((x) => x && x.length <= 40)
    )).slice(0, 120);

    /* 每日一题：保留历史（最新在前），按题型校验答案、选项与发布状态 */
    if (!Array.isArray(s.quizzes) || !s.quizzes.length) {
      s.quizzes = JSON.parse(JSON.stringify(d.quizzes));
    }
    s.quizzes = s.quizzes.filter((q) => q && typeof q === 'object').map((q) => {
      const src = Array.isArray(q.options) ? q.options : [];
      const options = QUIZ_KEYS.map((k, i) => {
        const hit = src.find((o) => o && String(o.k || '').toUpperCase() === k) || src[i] || {};
        return { k, t: String((hit && hit.t) || '').slice(0, 120) };
      });
      const type = normQuizType(q.type);
      const raw = String(q.answer == null ? '' : q.answer).trim();
      const ans = raw.toUpperCase();
      return {
        id: String(q.id || newQuiz({}).id),
        kind: 'quiz',
        type,
        date: String(q.date || '').slice(0, 10) || new Date().toISOString().slice(0, 10),
        point: String(q.point || '').slice(0, 40),
        stem: String(q.stem || '').slice(0, 300),
        options,
        answer: type === 'choice'
          ? (QUIZ_KEYS.indexOf(ans) >= 0 ? ans : 'A')
          : raw.slice(0, 300),
        analysis: String(q.analysis || '').slice(0, 600),
        published: q.published !== false,
        by: String(q.by || '主管理员'),
        createdAt: String(q.createdAt || '')
      };
    }).sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt)).slice(0, 60);

    /* 天气配置 */
    const wx = s.weather && typeof s.weather === 'object' ? s.weather : {};
    s.weather = {
      city: String(wx.city || d.weather.city).slice(0, 20) || d.weather.city,
      lat: Math.min(90, Math.max(-90, Number(wx.lat) || d.weather.lat)),
      lon: Math.min(180, Math.max(-180, Number(wx.lon) || d.weather.lon)),
      on: wx.on !== false
    };

    /* ---------- 常规表现：任务督检 / 课堂纪律 ----------
       每一次「发布」都是一份独立的记录，发布瞬间把该班座次表固化成快照
       （roster），此后名单改动、座次表重命名都不会影响已经发出的表。 */
    const normRoster = (r) => {
      const src = (r && typeof r === 'object') ? r : {};
      const list = (Array.isArray(src.students) ? src.students : [])
        .filter((x) => x && String(x.name || '').trim())
        .map((x, i) => ({
          id: String(x.id || `g${i + 1}`),
          name: String(x.name).replace(/\s+/g, ' ').trim().slice(0, 12),
          group: Math.min(12, Math.max(1, Number(x.group) || 1)),
          row: Math.min(12, Math.max(1, Number(x.row) || 1))
        }));
      const lay = (src.layout && typeof src.layout === 'object') ? src.layout : {};
      return {
        chartId: String(src.chartId || ''),
        chartName: String(src.chartName || '').slice(0, 20),
        students: list,
        layout: {
          groups: Math.min(12, Math.max(1, Number(lay.groups) || (list.reduce((m, x) => Math.max(m, x.group), 0) || 6))),
          rows: Math.min(12, Math.max(1, Number(lay.rows) || (list.reduce((m, x) => Math.max(m, x.row), 0) || 8))),
          aisleAfter: (Array.isArray(lay.aisleAfter) ? lay.aisleAfter : []).map(Number).filter((n) => n >= 1),
          podium: (lay.podium && Number(lay.podium.row) && Number(lay.podium.group))
            ? { row: Number(lay.podium.row), group: Number(lay.podium.group) } : null
        }
      };
    };

    s.hwChecks = (Array.isArray(raw.hwChecks) ? raw.hwChecks : [])
      .filter((t) => t && typeof t === 'object')
      .map((t, i) => {
        const roster = normRoster(t.roster);
        const ids = new Set(roster.students.map((x) => x.id));
        const rec = {};
        /* 默认全部「已交」：records 里记 true 的即已交，缺省视为未交。
           老数据 / 手改数据里如果没有 records，就按「全交」补齐。 */
        const srcRec = (t.records && typeof t.records === 'object') ? t.records : null;
        roster.students.forEach((x) => {
          if (!srcRec) { rec[x.id] = true; return; }
          if (srcRec[x.id]) rec[x.id] = true;
        });
        return {
          id: String(t.id || `hw${i + 1}`),
          kind: 'hwcheck',
          name: String(t.name || `任务督检 ${i + 1}`).replace(/\s+/g, ' ').trim().slice(0, 30),
          date: String(t.date || '').slice(0, 10) || new Date().toISOString().slice(0, 10),
          roster,
          records: rec,
          by: String(t.by || '主管理员'),
          createdAt: String(t.createdAt || ''),
          /* 目录节点：老数据没有 nodeId，下面统一挂到一级目录 */
          nodeId: String(t.nodeId || '')
        };
      })
      .slice(0, 80);

    s.discTasks = (Array.isArray(raw.discTasks) ? raw.discTasks : [])
      .filter((t) => t && typeof t === 'object')
      .map((t, i) => {
        const roster = normRoster(t.roster);
        const counts = {};
        const srcC = (t.counts && typeof t.counts === 'object') ? t.counts : {};
        roster.students.forEach((x) => {
          const n = Math.max(0, Math.min(99, Math.floor(Number(srcC[x.id]) || 0)));
          if (n) counts[x.id] = n;
        });
        return {
          id: String(t.id || `dc${i + 1}`),
          kind: 'discipline',
          name: String(t.name || `第${i + 1}周纪律监管`).replace(/\s+/g, ' ').trim().slice(0, 30),
          date: String(t.date || '').slice(0, 10) || new Date().toISOString().slice(0, 10),
          roster,
          counts,
          by: String(t.by || '主管理员'),
          createdAt: String(t.createdAt || '')
        };
      })
      .slice(0, 80);

    /* 任务督检的左侧目录树：与听写 / 背诵的目录树同一套结构（id / name / parentId，最多三级）。
       老数据没有这棵树时，建一个一级目录「全部任务」，把已有的督检任务都挂进去。 */
    let hwCats = (Array.isArray(raw.hwCat) ? raw.hwCat : [])
      .filter((n) => n && typeof n === 'object')
      .map((n) => ({
        id: String(n.id || newCatId()),
        name: String(n.name == null ? '' : n.name).replace(/\s+/g, ' ').trim().slice(0, 30) || '未命名目录',
        parentId: String(n.parentId || '')
      }));
    const hwIds = new Set(hwCats.map((n) => n.id));
    hwCats.forEach((n) => { if (n.parentId && !hwIds.has(n.parentId)) n.parentId = ''; });
    if (!hwCats.length) hwCats = [{ id: 'hwc1', name: '全部任务', parentId: '' }];
    if (!hwCats.some((n) => !n.parentId)) hwCats[0].parentId = '';
    const hwRoot = hwCats.find((n) => !n.parentId) || hwCats[0];
    if (!(raw.hwCat && raw.hwCat.length)) {
      s.hwChecks.forEach((t) => { t.nodeId = hwRoot.id; });
    }
    s.hwChecks.forEach((t) => {
      if (!t.nodeId || !hwIds.has(t.nodeId)) t.nodeId = hwRoot.id;
    });
    s.hwCat = hwCats;


    /* 组数上限放到 12：录入页是 12 × 12 的空白座次表，最后一列也要能落库 */
    s.layout.groups = Math.min(12, Math.max(1, Number(s.layout.groups) || 6));
    s.layout.rows = Math.min(12, Math.max(1, Number(s.layout.rows) || 8));
    if (!Array.isArray(s.layout.aisleAfter)) s.layout.aisleAfter = [];
    s.layout.aisleAfter = Array.from(new Set(
      s.layout.aisleAfter.map(Number).filter((n) => n >= 1 && n < s.layout.groups)
    )).sort((a, b) => a - b);
    if (!s.layout.podium || typeof s.layout.podium !== 'object'
      || !Number(s.layout.podium.row) || !Number(s.layout.podium.group)) s.layout.podium = null;
    return s;
  }

  /* =========================================================
   * 多班级：两个互相独立的班级，各有一套完整的「每日常规」
   * ---------------------------------------------------------
   * 文档结构：
   *   { ...全局配置, activeClass, classes:[{ id, name, <CLASS_KEYS 里的字段> }] }
   * · 班级字段（名单 / 座次表 / 听写 / 背诵 / 早读 / 每日一题 / 拓展阅读）按班级各存一份；
   *   主题、规则文字、账号密码、天气等属于全站配置，两个班级共用。
   * · 为兼容所有按顶层字段读写的页面与旧备份，activeClass 那一份会「镜像」到文档顶层。
   * ========================================================= */
  const CLASS_KEYS = [
    'students', 'layout', 'records', 'charts', 'tasks',
    'dCat', 'dTasks', 'rCat', 'rTasks', 'rdTasks', 'reading', 'quizzes',
    'extendArticles', 'extendHidden', 'notices', 'writeArticles', 'writeHidden',
    'hwChecks', 'discTasks', 'hwCat',
    /* 组长密码：跟着班级走 —— 每个班的座次表对应一个独立密码，
       切换班级后组长身份也要重新登录（前端 switchClass 里会清掉旧身份）。 */
    'leaderPass'
  ];
  const MAX_CLASSES = 4;          // 需求是两个；留出余量，避免将来扩展又要改结构
  const DEFAULT_CLASS_NAME = '班级';

  function cleanClassName(v) {
    return String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, 20) || DEFAULT_CLASS_NAME;
  }

  /* 初始组长密码：由班级 id 算出的 6 位数字（FNV-1a）。
     同一份数据每次算出来都一样，所以「首次铺底」不用写库也不会变来变去；
     管理员可在「录入学员」页随时改掉。 */
  function seedLeaderPass(classId) {
    const src = String(classId || 'cls1');
    let h = 2166136261;
    for (let i = 0; i < src.length; i += 1) {
      h ^= src.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return String(100000 + (Math.abs(h) % 900000));
  }

  function pickClassKeys(src) {
    const out = {};
    CLASS_KEYS.forEach((k) => { if (src && src[k] !== undefined) out[k] = src[k]; });
    return out;
  }

  /* 把顶层（正在编辑的班级）写回 classes[activeClass]：提交前调用，保证两边一致 */
  function syncClassFromTop(doc) {
    if (!doc || !Array.isArray(doc.classes) || !doc.classes.length) return doc;
    const cls = doc.classes.find((c) => c.id === doc.activeClass) || doc.classes[0];
    if (!cls) return doc;
    CLASS_KEYS.forEach((k) => { if (doc[k] !== undefined) cls[k] = doc[k]; });
    cls.name = cleanClassName(cls.name);
    doc.activeClass = cls.id;
    return doc;
  }

  /* 切换班级：把该班数据镜像到顶层（就地修改并返回同一个文档对象） */
  function mirrorClass(doc, classId) {
    if (!doc || !Array.isArray(doc.classes) || !doc.classes.length) return doc;
    const cls = doc.classes.find((c) => c.id === String(classId || '')) || doc.classes[0];
    CLASS_KEYS.forEach((k) => { if (cls[k] !== undefined) doc[k] = cls[k]; });
    doc.activeClass = cls.id;
    return doc;
  }

  /* 空白班级：与现有班级同一套项目与逻辑，只是没有任何学生 / 任务记录。
     默认带一张名为「班级」的空白座次表，名称可随时重命名。 */
  function blankClassData(name) {
    const flat = normalizeFlat({});
    flat.students = [];
    flat.records = {};
    flat.layout = { groups: 9, rows: 8, aisleAfter: [3, 6], podium: null };
    flat.charts = [normChart({
      name: cleanClassName(name),
      students: [],
      layout: flat.layout,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    })];
    return flat;
  }

  /* 文档层校验：补齐 classes、至少两个班级、把当前班级镜像到顶层。
     - 旧数据（没有 classes）：整份数据原样作为第一个班级，第二个班级空白；
     - 已有 classes：以 classes 为准，顶层班级字段会被镜像覆盖。 */
  function normalize(raw) {
    const src = (raw && typeof raw === 'object') ? raw : {};
    const rawList = Array.isArray(src.classes)
      ? src.classes.filter((c) => c && typeof c === 'object')
      : [];
    const list = rawList.length ? rawList.slice(0, MAX_CLASSES) : [null];

    const classes = list.map((c, i) => {
      const cls = c || {};
      const merged = Object.assign({}, src, pickClassKeys(cls));
      delete merged.classes;
      const flat = normalizeFlat(merged);
      const fallbackName = i === 0 ? ((src.meta && src.meta.className) || '') : '';
      return Object.assign({
        id: String(cls.id || `cls${i + 1}`),
        name: cleanClassName(cls.name || fallbackName)
      }, pickClassKeys(flat));
    });

    /* 需求：两个独立班级 → 数据只有一个班级时，自动补一个空白班级 */
    while (classes.length < 2) {
      const data = blankClassData(DEFAULT_CLASS_NAME);
      classes.push(Object.assign(
        { id: `cls${classes.length + 1}`, name: DEFAULT_CLASS_NAME },
        pickClassKeys(data)
      ));
    }

    /* id 去重（导入 / 手改数据时可能出现重复） */
    const seen = new Set();
    classes.forEach((c, i) => {
      if (seen.has(c.id)) c.id = `cls${i + 1}`;
      seen.add(c.id);
    });

    /* 组长密码首次铺底：老数据里两个班级都没有这个字段，按班级 id 生成一个
       稳定的初始密码（每次算出来都一样，不会因为刷新而变），只做一次。
       之后新建的班级保持空白 —— 由「录入学员」页在完成录入时提醒设置。 */
    if (!(src.meta && src.meta.leaderSeeded)) {
      classes.forEach((c) => {
        if (!String(c.leaderPass || '')) c.leaderPass = seedLeaderPass(c.id);
      });
    }

    /* 名单自愈：新建班级时如果只「复制了座次表」而没有生成名单，
       首页与每日常规都会显示 0 人。这里在「完全没有名单、也没有任何记录」时
       用主座次表补一份；已经有记录或被管理员清空过的班级不再自动补。 */
    classes.forEach((c) => {
      const named = (Array.isArray(c.students) ? c.students : [])
        .filter((s) => s && String(s.name || '').trim());
      if (named.length) return;
      if (c.records && Object.keys(c.records).length) return;
      const ch = primaryChart(c);
      const list = ch ? (Array.isArray(ch.students) ? ch.students : []) : [];
      const used = new Set();
      c.students = list
        .filter((s) => s && String(s.name || '').trim())
        .map((s, i) => {
          let id = String(s.id || `s${i + 1}`);
          while (used.has(id)) id = `${id}_${i}`;
          used.add(id);
          return {
            id,
            name: String(s.name).replace(/\s+/g, ' ').trim().slice(0, 12),
            group: Math.min(12, Math.max(1, Number(s.group) || 1)),
            row: Math.min(12, Math.max(1, Number(s.row) || 1))
          };
        });
      if (c.students.length) c.layout = JSON.parse(JSON.stringify(ch.layout || c.layout || {}));
    });

    const base = normalizeFlat(src);
    const activeId = classes.some((c) => c.id === String(src.activeClass || ''))
      ? String(src.activeClass)
      : classes[0].id;
    const doc = Object.assign({}, base, {
      version: 3,
      classes,
      activeClass: activeId,
      /* 铺底只做一次：标记写进 meta 随数据一起保存，之后新建的班级不再自动发密码 */
      meta: Object.assign({}, base.meta, { leaderSeeded: true })
    });
    return mirrorClass(doc, activeId);
  }

  /* 班级的「主座次表」：优先与班级同名的那一份，否则取人数最多的一份。
     名单兜底、复制座次表、录入页默认选中都按这个顺序挑。 */
  function primaryChart(cls) {
    const charts = (cls && Array.isArray(cls.charts))
      ? cls.charts.filter((c) => c && typeof c === 'object')
      : [];
    if (!charts.length) return null;
    const countOf = (c) => (Array.isArray(c.students) ? c.students : [])
      .filter((s) => s && String(s.name || '').trim()).length;
    const filled = charts.filter((c) => countOf(c) > 0);
    if (!filled.length) return charts[0];
    const same = filled.find((c) => cleanClassName(c.name) === cleanClassName(cls.name));
    if (same) return same;
    return filled.slice().sort((a, b) => countOf(b) - countOf(a))[0];
  }

  /* 班级名单（全站显示「班级人数」的唯一口径）：
     以「主座次表」的成员为准 —— 它就是学员录入界面里与班级同名、打开即编辑的那份座次表。
     cls.students 只是某次手动「设为当前名单」的快照，之后在录入界面改姓名它不会跟着变，
     曾导致班级切换按钮上的人数和学员录入里看到的对不上，所以只作兜底。 */
  function classRoster(cls) {
    const ch = primaryChart(cls);
    const fromChart = ch ? (Array.isArray(ch.students) ? ch.students : [])
      .filter((s) => s && String(s.name || '').trim()) : [];
    if (fromChart.length) return fromChart;
    return ((cls && Array.isArray(cls.students)) ? cls.students : [])
      .filter((s) => s && String(s.name || '').trim());
  }

  /* 取某个班级的学生人数（首页 / 切换按钮上显示） */
  function classSize(cls) {
    return classRoster(cls).length;
  }

  return {
    MODULES, DEFAULT_HOME_RULES, ROSTER, CN_NUM, ENROLL_SIZE,
    READ_BACKGROUNDS, DEFAULT_READING_SLOGANS, MOTIVATION_POSTERS,
    READING_TEMPLATE_DEFAULT, defaultScreenCfg, EXTEND_ARTICLES, EX_CATS, CAT_ALIAS, normExCat, EX_CAT_META,
    WRITE_SECTIONS, WRITE_ITEMS, WRITE_SEC_KEYS, normWriteSec,
    QUIZ_KEYS, defaultQuiz, newQuiz,
    QUIZ_TYPES, QUIZ_TYPE_KEYS, normQuizType, quizTypeMeta, hasQuizBlank,
    defaultState, normalize, normalizeFlat, newTask, newTaskId, cnNum,
    CLASS_KEYS, MAX_CLASSES, DEFAULT_CLASS_NAME, cleanClassName, classSize, classRoster, primaryChart,
    pickClassKeys, syncClassFromTop, mirrorClass, blankClassData,
    newCatNode, newCatId, newRoundId, newChartId, normChart, normChartLayout,
    TASK_MAX_LEVELS, LEVEL_SEP, normLevels, levelsToName,
    newReadingTask, readingStatus, normTime, normSegments, segmentStatus,
    segmentsText, totalMinutes, defaultReadingName
  };
});

</script>
  <script>
/* =========================================================
 * 英语作业常规看板 · 前端逻辑（实时同步网站版）
 * 数据统一保存在服务端：打开页面即从服务器拉取快照并实时接收更新，
 * 所有修改乐观更新本地后提交服务端，由服务端广播给其他设备。
 * 结构：首页 → 听写常规 / 作业常规 → 座位表点选录入
 * 权限：管理员（最高） / 访客（自由浏览，
 *       录入 / 修改时才要求登录）
 * ========================================================= */
'use strict';

/* 构建标识：与 <meta name="app-build"> 保持一致。
   教室一体机出问题时的第一件事就是核对版本 —— 页脚与 console 都会打印它，
   版本对不上说明一体机打开的仍是旧的 HTML 副本。 */
const APP_BUILD = '2026-11-04.2';
try { console.info(`[日课] 版本 ${APP_BUILD} · ${location.href}`); } catch (err) { /* ignore */ }

/* ---------------- 1. 常量与共享数据 ---------------- */
const {
  MODULES, DEFAULT_HOME_RULES, ROSTER, CN_NUM, ENROLL_SIZE,
  defaultState, normalize, newTask, newTaskId,
  READ_BACKGROUNDS, MOTIVATION_POSTERS, DEFAULT_READING_SLOGANS, READING_TEMPLATE_DEFAULT,
  EXTEND_ARTICLES, EX_CATS, EX_CAT_META, QUIZ_KEYS, defaultQuiz, newQuiz,
  QUIZ_TYPES, QUIZ_TYPE_KEYS, normQuizType, quizTypeMeta, hasQuizBlank,
  WRITE_SECTIONS, WRITE_ITEMS, normWriteSec,
  newReadingTask, readingStatus, normTime, normSegments,
  segmentStatus, segmentsText, totalMinutes, defaultReadingName,
  TASK_MAX_LEVELS, normLevels, levelsToName, LEVEL_SEP, newCatId, newRoundId, cnNum, newChartId,
  CLASS_KEYS, cleanClassName, classSize, classRoster, primaryChart, syncClassFromTop, mirrorClass
} = window.ERCore;

const SESSION_KEY = 'english-routine-board/session';
const DATE_KEY = 'english-routine-board/date';
const CLASS_KEY = 'english-routine-board/class';   // 本机正在查看哪个班级（各设备互不影响）

/* ---------------- 2. 工具函数 ---------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const esc = (str = '') => String(str).replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

const pad2 = (n) => String(n).padStart(2, '0');

/* 以服务端时间为准的“现在”：页面打开时用 /api/health 的 Date 响应头校正本机时钟，
   早读页显示的日期 / 时间 / 倒计时都基于它，并每秒刷新（不依赖任何历史存储日期）。 */
let clockSkew = 0;
function nowDate() { return new Date(Date.now() + clockSkew); }

function todayStr(d = nowDate()) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function dateLabel(str) {
  const d = new Date(`${str}T00:00:00`);
  if (Number.isNaN(d.getTime())) return str;
  const week = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][d.getDay()];
  return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 · ${week}`;
}

function shiftDate(str, days) {
  const d = new Date(`${str}T00:00:00`);
  d.setDate(d.getDate() + days);
  return todayStr(d);
}

/* ---------- 顶栏日期块（月份 / 日 / 星期 叠排）+ 天气 ---------- */
const MON_EN = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const WDAY_EN = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const WDAY_CN = ['日', '一', '二', '三', '四', '五', '六'];
const WX_CACHE_KEY = 'english-routine-board/weather';
const WX_TTL = 30 * 60 * 1000;

function weekOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 1);
  const days = Math.floor((d - start) / 86400000);
  return Math.ceil((days + start.getDay() + 1) / 7);
}

/* WMO 天气代码 → 中文 + 图标形态 */
function wxKind(code, isDay) {
  if (code === 0) return isDay === 0 ? 'clear-night' : 'clear';
  if (code === 1 || code === 2) return isDay === 0 ? 'cloud-night' : 'partly';
  if (code === 3) return 'cloud';
  if (code === 45 || code === 48) return 'fog';
  if (code >= 51 && code <= 57) return 'drizzle';
  if (code >= 61 && code <= 67) return 'rain';
  if (code >= 71 && code <= 77) return 'snow';
  if (code >= 80 && code <= 82) return 'shower';
  if (code >= 85 && code <= 86) return 'snow';
  if (code >= 95) return 'storm';
  return 'cloud';
}

const WX_LABEL = {
  clear: '晴', 'clear-night': '晴', partly: '晴间多云', 'cloud-night': '多云',
  cloud: '阴', fog: '雾', drizzle: '小雨', rain: '雨', shower: '阵雨', snow: '雪', storm: '雷雨'
};

function wxIconHTML(kind) {
  const wrap = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  if (kind === 'clear' || kind === 'clear-night') {
    return wrap(kind === 'clear'
      ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"/>'
      : '<path d="M20.5 15.2A8.4 8.4 0 0 1 9.6 4.3 7.6 7.6 0 1 0 20.5 15.2z"/>');
  }
  if (kind === 'partly' || kind === 'cloud-night') {
    return wrap('<circle cx="8.6" cy="9.4" r="3.1"/><path d="M8.6 3.4v1.4M3.6 9.4H2.2M4.9 5.7 3.9 4.7"/><path d="M9.4 18.6h8.4a2.9 2.9 0 0 0 .2-5.8 4.4 4.4 0 0 0-8.5-.7 3.3 3.3 0 0 0-.1 6.5z"/>');
  }
  if (kind === 'fog') {
    return wrap('<path d="M4 10.4h11.2a2.9 2.9 0 0 0 0-5.8 4.2 4.2 0 0 0-8-.9A3 3 0 0 0 4 10.4z"/><path d="M4 14.4h16M6 17.8h12M8 21h8"/>');
  }
  if (kind === 'drizzle' || kind === 'rain' || kind === 'shower') {
    return wrap('<path d="M8.6 15.4h8.2a3 3 0 0 0 .1-6 4.3 4.3 0 0 0-8.2-.7 3.3 3.3 0 0 0-.1 6.7z"/><path d="M8.6 18.4 7.6 21M12.4 18.4 11.4 21M16.2 18.4 15.2 21"/>');
  }
  if (kind === 'snow') {
    return wrap('<path d="M8.6 14.4h8.2a3 3 0 0 0 .1-6 4.3 4.3 0 0 0-8.2-.7 3.3 3.3 0 0 0-.1 6.7z"/><path d="M9 18.4h.01M12.4 19.8h.01M15.8 18.4h.01M12.4 17h.01"/>');
  }
  if (kind === 'storm') {
    return wrap('<path d="M8.6 14h8.2a3 3 0 0 0 .1-6 4.3 4.3 0 0 0-8.2-.7 3.3 3.3 0 0 0-.1 6.7z"/><path d="m12.6 16-2.4 3.6h3.2L11.4 23"/>');
  }
  return wrap('<path d="M7.4 17.6h9a3.6 3.6 0 0 0 .2-7.2 5 5 0 0 0-9.5-.8 3.6 3.6 0 0 0 .3 8z"/>');
}

function renderTodayBlock() {
  const d = nowDate();
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('todayMonth', MON_EN[d.getMonth()]);
  set('todayDay', pad2(d.getDate()));
  set('todayWday', WDAY_EN[d.getDay()]);
  const isToday = viewDate === todayStr(d);
  set('todayLine', `${d.getFullYear()} · 第 ${weekOfYear(d)} 周 · 周${WDAY_CN[d.getDay()]}${isToday ? '' : ` · 录入 ${viewDate.slice(5).replace('-', '/')}`}`);
  const block = document.getElementById('todayBlock');
  if (block) block.classList.toggle('is-other-day', !isToday);
}

let wxData = null;

function applyWeather(data) {
  wxData = data;
  const icon = document.getElementById('wxIcon');
  const temp = document.getElementById('wxTemp');
  const text = document.getElementById('wxText');
  if (!icon || !temp || !text) return;
  const kind = wxKind(Number(data.code), data.day);
  icon.innerHTML = wxIconHTML(kind);
  temp.textContent = `${data.temp}°`;
  text.textContent = WX_LABEL[kind] || '天气';
  const box = document.getElementById('weather');
  if (box) {
    box.classList.add('is-on');
    box.classList.remove('is-off');
    box.title = `${state.weather.city} · ${WX_LABEL[kind] || ''} ${data.temp}°C（${data.min}~${data.max}°C）`;
  }
}

function markWeatherOff() {
  const temp = document.getElementById('wxTemp');
  const text = document.getElementById('wxText');
  const icon = document.getElementById('wxIcon');
  const box = document.getElementById('weather');
  if (temp) temp.textContent = '--°';
  if (text) text.textContent = '天气';
  if (icon) icon.innerHTML = wxIconHTML('cloud');
  if (box) { box.classList.add('is-off'); box.classList.remove('is-on'); box.title = '天气未取到（教室网络可能无法访问外网）'; }
}

function readWxCache() {
  try {
    const raw = localStorage.getItem(WX_CACHE_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || !o.at || !o.data) return null;
    if (Date.now() - o.at > WX_TTL) return null;
    /* 城市改过（例如换成本班所在地）就不能再用旧缓存，否则会显示上一个城市的天气 */
    if (String(o.city || '') !== String((state.weather || {}).city || '')) return null;
    return o.data;
  } catch (err) { return null; }
}

async function loadWeather(force) {
  const cfg = state.weather || {};
  const box = document.getElementById('weather');
  if (box) box.hidden = cfg.on === false;
  const city = document.getElementById('wxCity');
  if (city) city.textContent = cfg.city || '';
  if (cfg.on === false) return;

  if (!force) {
    const cached = readWxCache();
    if (cached) { applyWeather(cached); return; }
  }
  if (typeof fetch !== 'function') { markWeatherOff(); return; }

  const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), 6000) : null;
  try {
    const url = 'https://api.open-meteo.com/v1/forecast'
      + `?latitude=${encodeURIComponent(cfg.lat)}&longitude=${encodeURIComponent(cfg.lon)}`
      + '&current=temperature_2m,weather_code,is_day'
      + '&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1';
    const res = await fetch(url, { signal: ctrl ? ctrl.signal : undefined, cache: 'no-store' });
    if (timer) clearTimeout(timer);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const j = await res.json();
    const cur = (j && j.current) || {};
    const daily = (j && j.daily) || {};
    const data = {
      temp: Math.round(Number(cur.temperature_2m)),
      code: Number(cur.weather_code),
      day: Number(cur.is_day),
      max: Math.round(Number((daily.temperature_2m_max || [])[0])),
      min: Math.round(Number((daily.temperature_2m_min || [])[0]))
    };
    if (!Number.isFinite(data.temp)) throw new Error('bad payload');
    try { localStorage.setItem(WX_CACHE_KEY, JSON.stringify({ at: Date.now(), city: cfg.city || '', data })); } catch (err) { /* ignore */ }
    applyWeather(data);
  } catch (err) {
    if (timer) clearTimeout(timer);
    markWeatherOff();
  }
}

/* 「日期」按钮：把录入日期切换器收进下拉，顶栏只留一行大字日期 */
